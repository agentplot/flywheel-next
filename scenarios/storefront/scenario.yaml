scenario: storefront
title: a team building a shop; noise arrives from four places, curation makes one subject of it, and the intent is understood before anything is planned
profiles: [all]
satisfies: [12, 19, 20, 21, 24, 25, 26, 27, 34, 38, 39, 42, 58, 60, 68, 70, 107, 109, 110, 111, 112, 113, 115, 116, 118, 187, 215]
given:
  # The instance is a week old: one intent is already open about the catalogue
  # on mobile, which is what gives curation somewhere to route a signal that
  # belongs to work already under way (107).
  objects:
    - id: intent/storefront-mobile-speed
      machine: intent
      state: {life: open, line: current, open.material: settled, open.close: not-offered}
      record: {title: the catalogue is slow on mobile, repository: storefront}
    - id: curation/storefront
      machine: curation
      state: {run: idle}
      record: {threshold: 12, cadence: "0 6 * * 1-5"}
  # The one laptop, running four sessions at once: what a work item's slot is
  # read against (31, 32). With no host declared the runner's bound is nought
  # and no item ever leaves `ready`.
  hosts: [{name: local, bound: 4}]
when:
  - tick: {}
actions:
  # ---- 1. something arrives, from four places
  - capture: {adapter: "flywheel capture meeting 2026-09-02-storefront-weekly.vtt", by: dana}
  - session:
      object: capture/meeting-2026-09-02-storefront-weekly
      exit: done
      deliver:
        signals/1.rec: flywheel-blueprints/flywheel/signals/meeting/2026-09-02/storefront-weekly/1.rec
        signals/2.rec: flywheel-blueprints/flywheel/signals/meeting/2026-09-02/storefront-weekly/2.rec
        signals/3.rec: flywheel-blueprints/flywheel/signals/meeting/2026-09-02/storefront-weekly/3.rec
        signals/4.rec: flywheel-blueprints/flywheel/signals/meeting/2026-09-02/storefront-weekly/4.rec
        signals/5.rec: flywheel-blueprints/flywheel/signals/meeting/2026-09-02/storefront-weekly/5.rec
        signals/6.rec: flywheel-blueprints/flywheel/signals/meeting/2026-09-02/storefront-weekly/6.rec
        signals/7.rec: flywheel-blueprints/flywheel/signals/meeting/2026-09-02/storefront-weekly/7.rec
        signals/8.rec: flywheel-blueprints/flywheel/signals/meeting/2026-09-02/storefront-weekly/8.rec
        signals/9.rec: flywheel-blueprints/flywheel/signals/meeting/2026-09-02/storefront-weekly/9.rec
  - capture:
      text: "checkout retries the card once and then gives up"
      source: page
      key: page/2026-09-03/retry-once
      by: chuck
  - capture:
      text: "customer says their amex worked on Friday and not today"
      source: forwarded-message
      key: chat/2026-09-03/1421
      by: dana
  - capture:
      text: "declined-payment rate crossed 4 per cent on payments"
      source: service
      key: payments/2026-09-04/declines
      by: payments
  # ---- 2. the noise becomes a subject
  - session:
      object: curation/storefront
      exit: done
      deliver:
        moves/meeting-2026-09-02-storefront-weekly.rec: flywheel-blueprints/flywheel/signals/moves/meeting-2026-09-02-storefront-weekly.rec
        moves/meeting-2026-09-02-storefront-weekly-2.rec: flywheel-blueprints/flywheel/signals/moves/meeting-2026-09-02-storefront-weekly-2.rec
        moves/meeting-2026-09-02-storefront-weekly-3.rec: flywheel-blueprints/flywheel/signals/moves/meeting-2026-09-02-storefront-weekly-3.rec
        moves/meeting-2026-09-02-storefront-weekly-6.rec: flywheel-blueprints/flywheel/signals/moves/meeting-2026-09-02-storefront-weekly-6.rec
        moves/meeting-2026-09-02-storefront-weekly-7.rec: flywheel-blueprints/flywheel/signals/moves/meeting-2026-09-02-storefront-weekly-7.rec
        moves/meeting-2026-09-02-storefront-weekly-9.rec: flywheel-blueprints/flywheel/signals/moves/meeting-2026-09-02-storefront-weekly-9.rec
        moves/page-2026-09-03-retry-once.rec: flywheel-blueprints/flywheel/signals/moves/page-2026-09-03-retry-once.rec
        moves/payments-2026-09-04-declines.rec: flywheel-blueprints/flywheel/signals/moves/payments-2026-09-04-declines.rec
  # ---- 3. understanding before building
  - response: {decision: intent/storefront-declines/intent-proposed, answer: "yes", id: page/1}
  - response: {decision: elaboration/storefront-declines/proposed-1/elaboration-proposed, answer: "type self-closing", id: page/2}
  - response: {decision: elaboration/storefront-declines/proposed-1/elaboration-proposed, answer: "yes", id: page/3}
  - session:
      object: elaboration/storefront-declines/proposed-1
      exit: done
      deliver:
        research/declines.md: flywheel-blueprints/openspec/changes/storefront-declines/research/declines.md
        research/retry-schedule.md: flywheel-blueprints/openspec/changes/storefront-declines/findings/retry-schedule.md
      offers:
        - {kind: finding, document: openspec/changes/storefront-declines/findings/retry-schedule.md}
  - response: {decision: elaboration/storefront-declines/finding-1/elaboration-proposed, answer: "type standing", id: page/4}
  - response: {decision: elaboration/storefront-declines/finding-1/elaboration-proposed, answer: "yes", id: page/5}
  - session:
      object: elaboration/storefront-declines/finding-1
      exit: blocked
      question: "the replay needs a sandbox account on the card processor and there is none. Ask for one, or replay against a simulator we write ourselves?"
  - response:
      decision: elaboration/storefront-declines/finding-1/question
      answer: "use the processor's sandbox — the account is under payments-sandbox and the key is where the others are"
      id: page/6
  - session:
      object: elaboration/storefront-declines/finding-1
      exit: done
      deliver:
        prototype/retry-report.html: flywheel-blueprints/openspec/changes/storefront-declines/prototype/retry-report.html
  # ---- 5. construction, the thinnest way in: a capture becomes a chore on a
  # bolt by the operator's own dictation (34, 12), a session works it in a
  # real place, and the bolt lands on the shop's shared line.
  - capture:
      text: "the order confirmation email says undefined where the total should be"
      source: page
      key: page/2026-09-05/order-total
      by: chuck
  - response:
      object: capture/page-2026-09-05-order-total
      answer: propose-unit
      args: {bolt: bolt/storefront/order-total, capture: capture/page-2026-09-05-order-total, type: chore}
      id: page/7
      by: chuck
  - session:
      object: work-item/storefront/order-total/wi-1
      exit: done
      deliver:
        build/confirmation.rs: storefront/src/mail/confirmation.rs
  - response: {decision: bolt/storefront/order-total/bolt-close, answer: "yes", id: page/8, by: chuck}
tour:
  - "A transcript of yesterday's weekly lands. Nobody wrote a ticket; the meeting already happened."
  - "A reader goes through it and comes back with nine signals — several of them about the same thing."
  - "Someone types one sentence into the box on the page. No ceremony, no form."
  - "A message from a customer is forwarded out of chat. It is already its own excerpt, so it is already a signal."
  - "The payments service says the declined-payment rate crossed four per cent. No human was involved."
  - "Twelve unmoved signals charges a curation. It joins the decline signals and the service's into one subject, routes the mobile one to the intent already open, drops the two duplicates, and leaves the rest alone. The first numbered decision is standing."
  - "The operator answers the first decision: yes, this is a subject. The intent opens and the machinery proposes how to understand it."
  - "The proposal arrives without a type, so the operator says what kind of work this is: research that closes itself when it has written what it found."
  - "Approved. A line is taken, a place is prepared, and a session starts in it."
  - "The research comes back. It is a file at a path in the blueprints, not a picture of one — and it comes back with a finding attached: the question it could not settle wants a prototype."
  - "The finding is on the rail as its own proposal. A prototype is a standing thing: it keeps running and the operator decides when it is finished."
  - "Approved. A second place, a second session."
  - "This one comes back with a question rather than an answer. It stopped itself — nothing else stopped — and the question is a numbered decision like any other."
  - "The operator answers it in a sentence. The answer goes to the session and it carries on from where it stopped."
  - "The prototype delivers a report: a page at its own address, with the numbers the research could not get. Two attempts, an hour and a day apart, on soft declines only."
  - "Something small and certain: a customer's confirmation email says `undefined` where the total belongs. One sentence in the box, as before."
  - "This one needs no research. The operator names a bolt on the capture itself — order-total — and that is the approval: a chore unit on a new bolt, one item, one session, and the place it works in is a real branch of the shop."
  - "The session comes back with its work: a commit in its place. The stage passes, the place merges into the bolt's line, and the bolt asks to close."
  - "Yes. The line takes the shared line one last time, the acceptance file goes on it, and the bolt lands: the shop's main now carries the fix, and the board shows it landed."
then:
  transitions:
    # 1 and 2: the transcript is read and comes back as nine signals.
    - {object: capture/meeting-2026-09-02-storefront-weekly, from: captured, to: reading}
    - {object: capture/meeting-2026-09-02-storefront-weekly, from: reading, to: read}
    # 6: twelve unmoved signals charge the curation, which applies its moves.
    - {object: curation/storefront, from: idle, to: running}
    - {object: curation/storefront, from: running, to: applying}
    # 7: the operator's yes opens the intent curation proposed.
    - {object: intent/storefront-declines, from: proposed, to: open}
    # 9 and 10: the research elaboration is approved, placed, worked and done.
    - {object: elaboration/storefront-declines/proposed-1, from: proposed, to: approved}
    - {object: elaboration/storefront-declines/proposed-1, from: working, to: writing-back}
    - {object: elaboration/storefront-declines/proposed-1, from: writing-back, to: finishing}
    - {object: elaboration/storefront-declines/proposed-1, from: finishing, to: done}
    # 13 and 14: the prototype blocks on its question and the answer sends it
    # back to working, which is the whole of 68 and 70 in two transitions.
    - {object: elaboration/storefront-declines/finding-1, from: working, to: blocked}
    - {object: elaboration/storefront-declines/finding-1, from: blocked, to: working}
    # 17 to 19: the dictation approved the unit; its item ran the chore's one
    # stage in a real place, merged, and the bolt landed (34, 60, 38, 39).
    - {object: unit/storefront/order-total, from: approved, to: in-flight}
    - {object: work-item/storefront/order-total/wi-1, from: merging, to: merged}
    - {object: bolt/storefront/order-total, from: landing, to: landed}
  states:
    capture/meeting-2026-09-02-storefront-weekly: {reading: read}
    intent/storefront-declines: {life: open}
    # The research closed itself; the prototype is standing and goes on
    # standing, because only the operator finishes one (25, 26).
    elaboration/storefront-declines/proposed-1: {life: done}
    elaboration/storefront-declines/finding-1: {life: working}
    bolt/storefront/order-total: {life: landed}
    unit/storefront/order-total: {life: landed}
  effects:
    # The finding the research offered is one record, made once (58, 62).
    - {do: record_offers, count: 1}
    # The answer reached the session, and it took no second session to do it
    # (68, 70).
    - {do: deliver_answer, count: 1}
    # One landing, of the one bolt (39).
    - {do: land_line, count: 1}
  decisions:
    # What is left standing is the elaboration curation proposed on the
    # catalogue intent, which nobody has answered: not everything that arrives
    # is worked, and the rail says so by still holding it.
    - {present: [elaboration-proposed], count: 1}
    - {absent: [question, intent-proposed]}
