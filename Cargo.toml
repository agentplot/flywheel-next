[workspace]
resolver = "2"
members = [
  "crates/flywheel-engine",
  "crates/flywheel-atoms",
  "crates/flywheel-domain",
  "crates/flywheel-scenario",
  "crates/flywheel-surface",
  "crates/flywheel",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
