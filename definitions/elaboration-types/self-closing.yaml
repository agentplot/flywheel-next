# Research, writing, a throwaway prototype whose answer is a note. The session
# ends itself when its deliverable is written; the machinery finishes the
# elaboration (25).
machine: self-closing
version: 2
kind: template
satisfies: [24, 25, 54, 190]
params:
  place: the elaboration's place
  agent: the agent for the session
  deliverables: "entries {name, producer, schema, surface}; the defaults below name the shipped set, and the elaboration's proposal may narrow them; `default` resolves through the deliverables binding in force (190)"
regions:
  work:
    initial: session
    states:
      session:
        machine: session
        params: {agent: $agent, place: $place, work_order: rendered, keep_alive: false, deliverables: [{name: book-chapter, producer: default, schema: default, surface: default}, {name: claim, producer: default, schema: default, surface: default}, {name: context-map, producer: default, schema: default, surface: default}, {name: conceptual-diagram, producer: default, schema: default, surface: default}, {name: logical-diagram, producer: default, schema: default, surface: default}]}
        transitions:
          - when: {all: [{final: exited}, {ev: session.exit, is: done}]}
            to: done
          - when: {all: [{final: exited}, {ev: session.exit, in: [stalled, invalid]}]}
            to: stalled
          - when: {final: lost}
            to: stalled
          - when: {all: [{region: {name: activity, in: [idle]}}, {ev: session.idle_since, older: 2h}]}
            to: stalled
            note: idle with no exit written is a stall for a self-closing type
      stalled:
        decision: {kind: stalled, group: decide, answers: [retry, drop], satisfies: [25]}
        transitions:
          - when: {response: retry}
            to: session
          - when: {response: drop}
            to: done
      done:
        final: true
