# The deliverables binding: the shipped set of deliverables and, for each,
# the skill that produces it, the schema it must satisfy (88) and the surface
# that reviews it (17). Versioned as one thing: `version` below moves when any
# entry moves, and a session's work order header names it beside the blueprints
# commit, so a session started before a change and one after can be told
# apart (123). An elaboration type or a stage names its deliverables as
# entries {name, producer, schema, surface}; `default` in an entry resolves
# here, and `by-type` means the stage's own type skill and schema instruction
# with no review surface. A stage's entry may add `step:` — ff, apply or
# verify, the OpenSpec step that produces it — and a by-type producer then
# resolves to the type skill for that step; the archive is no deliverable,
# since `archive_change` runs it at the item's merge. An instance replaces or adds a producer per
# deliverable in the manifest — `flywheel.yaml` deliverables.<name>.producer,
# .schema or .surface — without touching the engine (119); the engine reads
# only the resolved names and paths, never the text. Changing a producer, here
# or in the manifest, is a chore on the blueprints (123). Not a profile on its
# own; every profile inherits it, since it binds no evidence and no effect.
# (190)
format: flywheel-profile/1
name: deliverables
complete: false
version: 2
stores:
  doc: "every entry names the store the machinery carries it into and the session types that are fed it (227); the carrying is an effect with a proof, the feeding is the session type's row in context.yaml and nothing else (89)"
  book:            "the book `src/` on the intent's line, then the shared line at the archive — merge_place (54), archive_intent (49)"
  specifications:  "the intent's requirement delta, `openspec/changes/<intent>/specs/<capability>/spec.md` on the intent's line, archived into `openspec/specs/` on the shared line at the landing — merge_place (54), archive_intent (49); written in the same commit as the chapter that includes it (97, 120)"
  target-map:      "`context-map/target.yaml` (or current.yaml in a landing writeback), rendered into `flywheel/map/*.json` — map_edit, attach_claim, set_home (211)"
  change-records:  "the intent's change directory, one per covered intent — merge_place, record_per_intent (187, 188)"
  state-document:  "the state store beside the proposal record — record_proposal (187)"
  ledger:          "`flywheel/ledger/<repository>.rec` — record_verdict (100)"
  bolt-line:       "the bolt's line, one squash commit per item — merge_place (179); at landing `openspec/acceptance.yaml` — write_acceptance (192)"
  signals:         "`flywheel/signals/` — record_offers for a signal, record_moves for a move (107, 113)"
  intents:         "the state store: an intent in proposed — propose_intents (109)"
shipped:
  book-chapter:       {producer: flywheel/skills/producers/book-chapter/SKILL.md,       schema: flywheel/schemas/book-chapter.md,       surface: review-view,  store: book,           feeds: [self-closing, standing, with-operator, explore-or-gathered, default, fast, chore, persona-test, planning], doc: "a chapter of the book in destination voice; the review view of 122 shows what changed"}
  claim:              {producer: flywheel/skills/producers/claim/SKILL.md,              schema: flywheel/schemas/claim.md,              surface: review-view,  store: specifications, feeds: [curation, planning, capture-reader, default, fast, chore, persona-test, explore-or-gathered], doc: "an OpenSpec requirement block with its scenarios, in the intent's delta; the chapter that explains it includes it by anchor and its version is the hash of the block (8.1, 97); written in the same commit as the chapter (120)"}
  context-map:        {producer: flywheel/skills/producers/context-map/SKILL.md,        schema: flywheel/schemas/context-map.md,        surface: review-view,  store: target-map,     feeds: [planning, default, fast, persona-test], doc: "the system context map, moved whenever a claim is written or amended (120, 121)"}
  conceptual-diagram: {producer: flywheel/skills/producers/conceptual-diagram/SKILL.md, schema: flywheel/schemas/diagram-conceptual.md, surface: review-view,  store: book,           feeds: [default, fast, persona-test], doc: "a conceptual diagram in the house style the schema fixes: palette, shapes, labelling"}
  logical-diagram:    {producer: flywheel/skills/producers/logical-diagram/SKILL.md,    schema: flywheel/schemas/diagram-logical.md,    surface: review-view,  store: book,           feeds: [default, fast, persona-test], doc: "a logical diagram in the same house style"}
  proposal-document:  {producer: flywheel/skills/producers/proposal-document/SKILL.md,  schema: flywheel/schemas/proposal.md,           surface: plannotator,  store: state-document, feeds: [default, fast, chore, persona-test], doc: "planning's one document per run, each unit with its size estimate in slot-days (172); reviewed as one document and an annotation is the response (17); fed to the unit's stages as the unit document"}
  verdict:            {producer: flywheel/skills/producers/verdict/SKILL.md,            schema: flywheel/schemas/verdict.md,            surface: ledger,       store: ledger,         feeds: [planning], doc: "one judgment that a repository satisfies a claim, with its inputs (100); reaches the operator through the ledger and the status view, never as a decision; expected only of a session whose unit names a claim (64, context.yaml ruling 8)"}
  surface-specification: {producer: flywheel/skills/producers/surface-specification/SKILL.md, schema: flywheel/schemas/surface-specification.md, surface: plannotator, store: book, feeds: [default, fast, persona-test], doc: "the surfaces a design settles: what each shows and never shows, the flows between them as numbered steps, the form of each kind of object, the keys and modes, and the rulings with their reasons, written so a construction session builds from it without repeating the exploration; a chapter of the book, citing the mockups it was drawn from as records in the intent's change directory (187); a claim about a surface cites its statements; carried in the work order of every construction session whose work touches a surface (89, 212)"}
  move:               {producer: flywheel/skills/producers/move/SKILL.md,               schema: flywheel/schemas/move.md,               surface: none,         store: signals,        feeds: [curation, planning], doc: "curation's one standing move per signal with its reason (107, 116); record_moves carries it"}
  intent-proposal:    {producer: flywheel/skills/producers/intent-proposal/SKILL.md,    schema: flywheel/schemas/intent-proposal.md,    surface: none,         store: intents,        feeds: [self-closing, standing, with-operator], doc: "a proposed intent from a join cluster with its signals, their weight and its proposed elaborations, or a gathering (109, 188); propose_intents and gather_elaborations carry it; the elaboration's document"}
  signal:             {producer: flywheel/skills/producers/signal/SKILL.md,             schema: flywheel/schemas/signal.md,             surface: none,         store: signals,        feeds: [curation], doc: "one signal read from a capture: kind, who asserted it, subject tags, the assertion, the verbatim excerpt with position, the claims it argues with (113); record_offers carries it, immutable once written"}
override:
  manifest: "`flywheel.yaml` deliverables.<name>: {producer, schema, surface, store, feeds}, any subset for a shipped name; an unknown <name> adds a deliverable a type may then ask for, and its entry must name store and feeds — one of the stores above, or a path under the prefix the manifest declares — or the type file naming it is refused at load and the refusal reported (227, context.yaml ruling 21); the resolved set is what prepare_place writes into the work order"
  resolution: "for each entry a type names: an explicit path is taken as written; `default` reads the manifest override for the name, else the shipped entry; `by-type` reads the stage's type skill and the type's schema instruction, its store the bolt line and its feeds the later stages of the same item; a name neither the manifest nor the shipped set knows, with `default`, is refused when the type file is loaded, and the refusal is reported (79). An entry that judges a claim (verdict) is dropped from expected for a unit whose claims are empty (64). An elaboration's proposal narrows the type's list and never widens it (190)"
