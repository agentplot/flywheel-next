# The context binding (226): for every session type the machinery may charge,
# one enumeration of what its work order carries and what it must never
# receive. `prepare_place` renders the work order from these rows and from
# nothing else (89); `flywheel render-order <scenario>` renders it for a
# session type, an instruction version and a scenario with no session (90,
# 124); a test asserts the rendered order carries exactly the row and that
# the `never` column is absent. A session type without a row here is not one
# the machinery may charge. Not a profile on its own; every profile inherits
# it, since it binds no evidence and no effect. Each row resolves the
# unstated points of machines-and-context.md section 5; the ruling is named
# in `rulings:` at the end so a response on this file can reverse it.
#
# Two facts shape every row. A design session's place is a worktree of the
# blueprints at the intent's line: the book, the standing specifications the
# claims live in, both maps, the
# vocabulary, the instructions and the intent's change directory are on its
# disk. A construction, planning or chore session's place is a worktree of a
# built repository: nothing of the blueprints is on its disk, so what it needs from
# the blueprints is copied into `.flywheel/blueprints/` at the blueprints commit the header
# names (ruling 1). The header of every work order names the blueprints commit,
# the deliverables binding's version (123, 190), the type version in force
# for a unit's session (ruling 16) and the session's identity token (197).
format: flywheel-profile/1
name: context
complete: false
version: 1
common:
  header: "blueprints commit; deliverables binding version; the extensible machine's name@version when the owner is a unit or an elaboration (57); the session identity token (197); the multiplexer session and pane name (174, 196)"
  exit_contract: "`flywheel exit done --deliverables <list>` | `blocked --question` | `stalled --note`; `flywheel offer finding|chore|signal <document> --about`; `flywheel note`; the exit schema in force (65, 67)"
  never: "`git branch|merge|push|worktree`, `wt`, `herdr` (43, 7.8); another session's thread (197); the state store as a file; an agent program's own messaging (173); the operator's global instructions where the place's settings can deny them (89, gaps.md)"
  skills: "the agent definition is `flywheel/agents/<agent>.md` and its skill `flywheel/skills/<agent>/SKILL.md`, keyed by the agent name the machine or the stage names; an elaboration type's `agent: by-type` names the type, so its agent is `flywheel/agents/<type>.md` (ruling 3)"
sessions:
  curation:
    charged_by: curation.running (110, 171)
    schema_instruction: "the exit schema; `flywheel/schemas/move.md`, `flywheel/schemas/intent-proposal.md` through the deliverables binding (deliverables.yaml move, intent-proposal)"
    type_skill: "`flywheel/skills/curator/SKILL.md`"
    work_order: "the unmoved signals (each with excerpt, kind, subject tags, argues_with); the standing claims, read from the blueprints' `openspec/specs/`; the open intents with their subjects and attached signals; the elaboration type names in the registry, for a gathering (188); the manifest's repository list, for a route offer (116, 182) (ruling 4)"
    change_artifacts: "none; the place is off the blueprints' shared line and commits nothing (inputs: work-order, keep: false)"
    chapters_and_claims: "the standing claims in the order; the chapters are on disk and the order names, for each claim a signal argues with, its chapter path, so the curator reads the chapter behind the claim (ruling 4)"
    map: "on disk; not in the order — subject tags are not matched against map elements (ruling 4)"
    surface_specification: "no"
    deliverables: "move, intent-proposal (deliverables.yaml); recorded as expected and compared with the exit (80)"
    identity: "the token; `flywheel exit`, `flywheel offer chore|signal` (116), `flywheel note`; the read-only query tools (193, 197; ruling 24)"
    never: "the raw material behind a signal (111; the pointer is not followed, ruling 7); a tool that opens an intent (110) or writes a move (record_moves does); a line operation (43)"
  planning:
    charged_by: planning.running (28, 171)
    schema_instruction: "the exit schema; `flywheel/schemas/proposal.md` and `flywheel/schemas/verdict.md` through the binding"
    type_skill: "`flywheel/skills/planner/SKILL.md`; the producers `proposal-document` and `verdict`"
    work_order: "the backlog — every cell in scope not satisfied or not-applicable, with claim version and freshness (102); the as-built statements; every open bolt of the repository with its units, states, cited claim versions and citation choices (29, 103, 172); the challenge signals each stale cell rests on, which the proposal must cite (101); unconsumed asks naming the repository; redo notes; the unit type names in the registry it may name (37); the repository's derived kinds and capabilities (199); the actuals by unit type from every acceptance file of this repository, for calibrating the size estimates (172) (ruling 5)"
    change_artifacts: "the built repository at its shared line: the code, `openspec/specs` (the as-built), `flywheel/services.yaml`, `openspec/acceptance.yaml` of landed bolts; no line of its own"
    chapters_and_claims: "the standing claims in scope at their versions with scenarios, as the requirement blocks they are, and the chapters that include them, copied into `.flywheel/blueprints/` at the header's commit (97, 100; ruling 1)"
    map: "the map section for the repository: every element and context homed there with kind and effective home, and the claims attached to each with versions, from `flywheel/map/target.json` (199, 211; ruling 5)"
    surface_specification: "no"
    deliverables: "proposal-document, verdict (planning.yaml session params; ruling 6)"
    identity: "the token; `flywheel exit done` carrying the verdicts and the proposal; the query tools (197)"
    never: "a tool that creates a bolt or a unit (5; propose_units does, from the exit); the ledger as a writable file (record_verdict writes it); the operator's places; another repository's backlog"
  capture-reader:
    charged_by: capture.reading (115)
    schema_instruction: "the exit schema; `flywheel/schemas/signal.md` (113, 114), the versioned signal record format (ruling 7)"
    type_skill: "`flywheel/skills/capture-reader/SKILL.md`"
    work_order: "the capture record: source, event key, event time, who captured it, the pointer to the raw material (111); the standing claims from `openspec/specs/`, so a signal names the ones it argues with (113); the subject-tag vocabulary `flywheel/signal-tags.yaml` (ruling 7)"
    change_artifacts: "none; the place is off the blueprints' shared line and is removed on exit"
    chapters_and_claims: "the standing claims in the order; the chapters on disk"
    map: "no; the map view's one-gesture capture arrives as a forwarded message and needs no reader (201)"
    surface_specification: "no"
    deliverables: "signal (deliverables.yaml; capture.yaml session params)"
    identity: "the token; `flywheel exit`, `flywheel offer signal`"
    never: "the raw material inside the place: the reader follows the pointer itself and the machinery copies nothing into `.flywheel/` (111; ruling 7); a move (107); other captures"
  conflict-fix:
    charged_by: "a chore unit in approved on the line (seed_take_conflict, 52) or on the bolt (seed_request_finding, 176); the item's fix stage, agent chore-fixer"
    schema_instruction: "the chore type's own (by-type)"
    type_skill: "`flywheel/skills/chore-fixer/SKILL.md`"
    work_order: "the job: the line, the parent head the take tried, the approval (the cadence or the response, I1); the units whose commits conflict with the take, with the items and the claims they serve, so the fix keeps both sides' intent (ruling 8); for a request-review chore, the review's or check's text copied into the order beside its URL and id, since the session cannot reach the git host (176; ruling 9)"
    change_artifacts: "the place off the line with `git merge <parent>` left conflicted in it; for a review chore a clean place off the bolt's line; no change directory (60)"
    chapters_and_claims: "for a conflict chore, the requirements the conflicting units cite, copied in (ruling 8); for a review chore, none unless the chore names a claim (64; ruling 19)"
    map: "no"
    surface_specification: "no"
    deliverables: "commits; verdict only when the chore names a claim — an entry that judges a claim is dropped from expected for a unit whose claims are empty (deliverables.yaml resolution; ruling 8)"
    identity: "the token; a place-scoped installation token for reads (207; ruling 17)"
    never: "the take itself (the machinery retries it when the chore merges, 52); a push to the request (the line follows the merge, 176); a line operation"
  rebase-conflict:
    charged_by: "no new session: the place machine seeds the job onto the place's own session's thread and sends it when the session is idle (52, 71)"
    work_order: "the session's existing order plus the job entry: the heads and the conflicted paths"
    never: "a rebase command (rebase_place retries on its done)"
  findings-routing:
    charged_by: "nobody: record_offers routes every offer by rule and the operator's answer on the resulting proposal is the routing (171, gaps.md); no machine charges a findings-routing session and no row is needed (ruling 10)"
  self-closing:
    charged_by: elaboration.working (25)
    schema_instruction: "the schemas of its deliverables (`flywheel/schemas/book-chapter.md`, `claim.md`, `context-map.md`, `diagram-conceptual.md`, `diagram-logical.md`); `flywheel/instructions/design-conclusion.md` and `flywheel/instructions/claim-granularity.md`, the defaults every design type carries (120; ruling 25); the exit schema"
    type_skill: "`flywheel/agents/self-closing.md` and `flywheel/skills/self-closing/SKILL.md` (ruling 3)"
    work_order: "the job from the elaboration's document and sources; the intent's subject, its attached signals and challenges (116); covers (188); the deliverables table, the defaults narrowed by the proposal when it did (190)"
    change_artifacts: "the intent's change directory `openspec/changes/<intent>/` on the intent's line; earlier elaborations' records on disk (187)"
    chapters_and_claims: "the whole book on disk; the order names the cited chapters: those the proposal document cites, and the chapters of every claim the intent's signals argue with (ruling 11)"
    map: "both maps and the vocabulary on disk; a map edit only inside a writeback that also writes the chapter, through `flywheel map edit --ref` (211); a commit of `context-map/*.yaml` in the place without the tool's trailer is refused by the pre-commit hook (blueprints.yaml; ruling 12)"
    surface_specification: "not among its defaults; a proposal narrows the list and never widens it — a design that needs a surface specification is proposed as a standing elaboration (190, 212; ruling 13)"
    deliverables: "book-chapter, claim, context-map, conceptual-diagram, logical-diagram (self-closing@2)"
    identity: "the token; `flywheel exit done --deliverables`, `flywheel offer finding|chore|signal`, `flywheel note`; the map tools inside the writeback; the query tools (197)"
    never: "a line operation (43); the state store; another session's thread (197); a built repository; a decision about itself (25)"
  standing:
    charged_by: elaboration.working (25)
    as: self-closing
    work_order: "as self-closing; the session is told it stands — idle is offered as finish or keep, only the operator ends it (25, 26); its process is brought back if lost, in the kept place"
    deliverables: "the six: self-closing's five plus surface-specification (standing@2, 212)"
    change_artifacts: "as self-closing; the interactive page, the running prototype and the exploration's notes are records in the change directory (187), and a surface specification cites them (212)"
    never: "an end on idle (26); a rebase while working or while the operator types (I16)"
  with-operator:
    charged_by: elaboration.working (25)
    as: self-closing
    work_order: "as self-closing; presence is a keystroke within the binding's window and gates only a rebase (25)"
    deliverables: "book-chapter, claim, context-map (with-operator@3)"
    never: "a decision about itself (25); an end other than the dictation `end`"
  fundamentals:
    charged_by: elaboration.working (25, 318)
    as: self-closing
    schema_instruction: "`flywheel/schemas/fundamentals-part.md`, which is the style of `design/requirements-style.md` — every clause an invariant, numbered in one sequence, naming no mechanism — and validating against it is what lets the session declare done (25, 226; ruling 26); `flywheel/schemas/claim.md` and `context-map.md`; `flywheel/instructions/fundamentals.md` and `flywheel/instructions/claim-granularity.md` beside `design-conclusion.md` (120); the exit schema"
    type_skill: "`flywheel/agents/fundamentals.md` and `flywheel/skills/fundamentals/SKILL.md` (ruling 3)"
    work_order: "as self-closing, plus the fundamentals part as it stands with its clause numbers, so a new clause takes the next free number and none is renumbered; the claims already included under a clause, with the clause each names in its prose; the style-guide schema in full (226; ruling 26)"
    chapters_and_claims: "the whole book on disk, the part among it; the order names the standing claims attached to what the part's clauses concern, so a clause that yields a claim is included by anchor immediately after it (97, 318)"
    deliverables: "fundamentals-part, claim, context-map (fundamentals@1); a clause that names no behaviour a repository could be judged against yields no claim, and the exit says so rather than inventing one (80, 318)"
    never: "as self-closing; a mechanism named in a clause; a renumbering of an existing clause; a claim proposed for a clause that constrains only how a model is built (318)"
  operator-session:
    charged_by: operator-session.open (69)
    schema_instruction: "none"
    type_skill: "`flywheel/agents/operator-console.md`, `flywheel/skills/operator-console/SKILL.md`"
    work_order: "the tool catalogue and the query tools (surfaces.yaml tools:, 193); the instance's objects in one summary — every intent, bolt and host with its state — as the status view lists them; the dictation grammar; nothing else (ruling 14)"
    change_artifacts: "none; a place off the blueprints' or a named repository's shared line, kept until `end` unless held"
    chapters_and_claims: "on disk when off the blueprints"
    map: "on disk"
    surface_specification: "no"
    deliverables: "none: no exit is expected and nothing is compared (80)"
    identity: "the session's token identifies the pane; every tool call from it is recorded given_by the operator and proposed_by the session, so the response is the operator's and the pane is known (153, 197; ruling 14)"
    never: "a thread, an intent, a decision (69)"
  explore-or-gathered:
    charged_by: "explore {intents, type} in approved (189, 193), or curation's gathering in proposed (188); one session, one place off the parent intent's line"
    as: "the type (standing or with-operator)"
    work_order: "as the type, plus covers with the parent first; the covered intents' chapters, claims and the records of their earlier elaborations (189)"
    change_artifacts: "the parent's change directory on disk; every other covered intent's `openspec/changes/<id>/` and the chapters on that intent's unlanded line are copied read-only into `.flywheel/covers/<id>/` at the header's commit; the session writes new records for each under `openspec/changes/<that intent>/` in its place and record_per_intent carries them out (188; ruling 15)"
    never: "as the type; a change to the earlier elaborations' records (189)"
  default:
    charged_by: "work-item.in-type under default@5: spec (spec-writer), build (builder), verify (verifier)"
    schema_instruction: "by-type: the type's schema instruction `flywheel/schemas/units/default/<step>.md` per step ff, apply, verify; `flywheel/instructions/construction.md` (120); `flywheel/schemas/verdict.md` for the verify stage's verdict"
    type_skill: "keyed by the agent name: `flywheel/skills/spec-writer/SKILL.md`, `builder`, `verifier`; the verify stage also the producer `verdict` (ruling 3)"
    work_order: "the unit document copied into `.flywheel/`; the unit's claims (name@version), depends_on, the target bolt; the item's ordinal and task; the type version in force in the header (57; ruling 16); after a rebase a `moved` entry (51); for a fresh session after a block, the answer at the top (70); for the verify stage what the verdict must judge: the named claims at their versions and their scenarios (99, 100) — not the send-back bound, which is the machinery's (41; ruling 16)"
    change_artifacts: "the built repository at the item's place off the bolt's line; the change directory the spec stage writes (`openspec/changes/<unit>/`); each later stage sees the earlier stage's commits on disk"
    chapters_and_claims: "the cited chapters and the requirements they include, at the header's blueprints commit, copied into `.flywheel/blueprints/` (97; ruling 1)"
    map: "the map section prepare_place writes from `flywheel/map/target.json`: the elements the unit builds — the ids its claims attach to, and those homed in the repository that the chapters name — each with context, kind and effective home, and the claims attached to each with versions (211)"
    surface_specification: "the chapter in force at the header's commit when a claim the unit cites is about a surface — attached to an element of a surface kind, or stated in a surface-specification chapter (212; gaps.md 212; ruling 2)"
    deliverables: "spec: change-directory, spec; build: commits, as-built-statements-naming-claims; verify: verify-report, verdict (default@5)"
    identity: "the token; the place-scoped installation token in `.flywheel/token`, for reads only (207; ruling 17); `flywheel exit|offer|note`, `flywheel service start|stop` (48); the multiplexer session `flywheel-<instance>-bolts` (174), the construction role's kind and model (173)"
    never: "the blueprints as a tree; the state store; the bolt's operator place (44); sibling items' places; another session's thread (197); a push of any branch — the session commits and the machinery merges, the `pre-push` hook refusing every push (43; ruling 17); the query tools — its inputs are closed and the map section carries what 211 requires (89; ruling 24)"
  fast:
    charged_by: "work-item.in-type under fast@3: ff-apply (builder)"
    as: default
    work_order: "as default's build; the one session writes the change directory itself, since the stage names change-directory among its deliverables (ruling 18)"
    deliverables: "change-directory, spec, commits, as-built-statements-naming-claims (fast@3); no verdict — a fast unit produces no ledger verdict, and its claim's cell is judged by planning's next run (100; ruling 18)"
  chore:
    charged_by: "work-item.in-type under chore@2: fix (chore-fixer)"
    schema_instruction: "by-type; no change directory (60)"
    type_skill: "`flywheel/skills/chore-fixer/SKILL.md`"
    work_order: "the chore document (62), about, scope (bolt-line, intent-line, shared-line), the approval; every accepted chore of the same bolt gathered into the one session (63) with each document; a document that lives in another repository's change directory is copied into `.flywheel/chore/<offer id>.md` (ruling 19); when the chore names a claim (64), the requirement block and its scenarios as a construction stage gets them (ruling 19)"
    change_artifacts: "the place off the line the fix belongs on: a bolt's line, an intent's line (a blueprints worktree) or a repository's shared line"
    chapters_and_claims: "none unless the chore names a claim (ruling 19)"
    map: "no"
    surface_specification: "no"
    deliverables: "commits; verdict only when the chore names a claim (deliverables.yaml resolution; ruling 8)"
    identity: "as default"
    never: "as default; a bolt of its own (60, I8); a change directory"
  persona-test:
    charged_by: "work-item.in-type under persona-test@3: build (builder), test (one session per personas/*.md), review (reviewer)"
    as: default
    work_order: "as default; for the test stage the persona file's text is a section of the order — the agent started is the stage's `tester` definition and the persona is data handed to it, so no agent definition is generated from the repository (56; ruling 20); the session set found by the rule is recorded on the item (56)"
    deliverables: "build: commits, as-built-statements-naming-claims; test: test-report, findings; review: review-verdict, verdict (persona-test@3)"
  dispatch-triage:
    charged_by: "the dispatcher's tick or the host declaring the source (217e); the capture-reader row applies, the runner from the sessions binding (217c)"
    as: capture-reader
  host-agent:
    charged_by: "one message on a surface (194, 217b); the runner is inproc (217c)"
    schema_instruction: "the tool catalogue's schemas (193)"
    work_order: "the message and, when it is a reply, the messages it replies to as the chat holds them; the live objects through list and read; the query tools; the catalogue"
    deliverables: "none: its writes are proposed tool calls the operator confirms, one card each (194); the confirmed call is the record"
    identity: "dispatch's or the page's identity, never a person's account (217d)"
    never: "a write without the operator's confirmation (194); context from a previous message (217a)"
rulings:
  doc: "machines-and-context.md section 5, each point resolved with the recommended default or the most conservative reading; a response on this file reverses one"
  1: "chapters and the claims their specifications hold reach a built-repository place by copy: prepare_place writes them under `.flywheel/blueprints/` at the header's blueprints commit, for planning, construction and chore sessions (host.yaml prepare_place)"
  2: "a claim is about a surface when it attaches to an element of a surface kind or is stated in a surface-specification chapter; no field on the claim (gaps.md 212)"
  3: "skills and agent definitions are keyed by the agent name a machine or stage names; an elaboration type's by-type agent is the type name"
  4: "curation's order carries the type catalogue's names and the manifest's repository list, and the chapter paths behind the claims its signals argue with; not the map"
  5: "planning's order carries the challenge signals, the unit type names, the derived kinds and capabilities, a map section for the repository, and the actuals for calibration"
  6: "planning names proposal-document and verdict, curation names move and intent-proposal, capture reading names signal, as deliverables; the binding gains those entries"
  7: "`flywheel/schemas/signal.md` and `flywheel/signal-tags.yaml`; the reader follows the pointer itself and nothing raw is copied into the place"
  8: "a conflict chore is told the conflicting units, their items and their claims; a verdict is expected only of a chore that names a claim"
  9: "a request-review chore receives the review's text in its order, beside the URL and the id"
  10: "no findings-routing session is charged; record_offers and the operator's answer are the routing (gaps.md 171)"
  11: "an elaboration's cited chapters are the proposal document's citations plus the chapters of the claims the intent's signals argue with"
  12: "the blueprints' pre-commit hook refuses a commit touching `context-map/*.yaml` that lacks the `flywheel-map-edit:` trailer the tool writes (blueprints.yaml)"
  13: "a proposal narrows an elaboration's deliverables and never widens them; a surface specification needs a standing elaboration"
  14: "the operator's session is told the catalogue, the query tools and one summary of the instance's objects; its calls are recorded given_by the operator and proposed_by the session"
  15: "other covered intents' change directories and unlanded chapters are copied read-only into `.flywheel/covers/<id>/`; new records are written under `openspec/changes/<id>/` in the place"
  16: "the type version in force is in every unit session's header; a verify or review session is not told the send-back bound"
  17: "a session commits only and never pushes; the place token serves reads; the pre-push hook refuses every push (host.yaml app.place_token)"
  18: "the fast type's one session writes its change directory (fast@3 names it); a fast unit produces no ledger verdict"
  19: "a chore's document is copied into a place of another repository; a chore naming a claim is told the block and its scenarios"
  20: "a persona file is data in the test session's order; the agent is the stage's own definition"
  21: "a user-defined deliverable's manifest entry must name store and feeds (227), else the type file is refused at load (deliverables.yaml override)"
  22: "the engine machines' windows are read from `flywheel.yaml` engine: {stale, gone, expiry, register_retention} at load, the literals in the files being the defaults (record-derived.yaml engine_windows)"
  23: "the review stage's verdict deliverable is named `verdict`; model.md 8.2 says so"
  24: "the read-only query tools are granted to the sessions the machinery charges and to the operator's own session; a construction session's inputs are closed and it gets none"
  25: "`flywheel/instructions/claim-granularity.md` is a default every design type carries beside `design-conclusion.md`: a claim survives a rewrite of the code, has an observer who would want to know if it stopped holding, and is judgeable from the repository alone, and a statement naming a file, a colour, a setting, a plugin or a step of a pipeline is not one (120, 100). `flywheel/instructions/construction.md` carries the other half: cite the standing claim in scope the work serves, cite none when none fits, and never propose a claim for the work (34a)"
  26: "the fundamentals type's order carries the style-guide schema in full and the part as it stands with its clause numbers; the session declares done only when the part validates against that schema, which is what makes the type self-closing (25, 318)"
