# The stand-in profile (92). Every piece of state is a value in one process's
# memory, serialized to a single JSON file between runs; there is no central
# service of any kind, no network, and no repository. It exists so that
# conformance can admit the stand-in the way it admits any other profile:
# `conformance/contract/binding.yaml` runs on every profile and asks each for
# the eight operations of 125 and the five guarantees of B.2, and without this
# file the stand-in path had nothing for that scenario to read (168, 169, 170).
#
# No host runs on it. 92 asks that every machine be testable on its own
# against a stand-in state store with no live service, and that is the whole
# of its purpose: it is a test binding, not a deployment. A manifest naming it
# is refused. What it proves is that the machines, the engine, the register
# and the rail need nothing but the eight operations, so a profile that
# provides them is a profile (138, 140).
#
# Not `sessions-stand-in.yaml`, which is a different stand-in for a different
# half: that one replaces the session binding alone, so a scenario's scripted
# exits stand in for agents while the state store, the git effects and the
# rail run for real (93). This one replaces the state store. They are
# orthogonal and a conformance run uses both: `flywheel scenario run` with no
# `--profile` binds the store here and the sessions there, which is the
# no-live-service run of 92 and S16. `--profile git-only` swaps this file out
# and keeps the other.
#
# Tools: none. The engine's own crate holds the store (`flywheel-scenario`,
# model.md 13), an in-memory map behind the same `StateStore` trait the real
# profiles implement, so the engine cannot tell which is under it. The
# surfaces are surfaces.yaml's, rendered into the trace rather than posted:
# nothing reaches Discord, a browser or a multiplexer on this profile.
format: flywheel-profile/1
name: stand-in
complete: true
inherits: [host, sessions, blueprints, record-derived, surfaces, identity]

layout:
  store:     "one process's memory, serialized whole to a single JSON file between runs (`--root <file>`); there is no directory layout, no repository and no service. Loading it is reading the file; a run that writes nothing leaves it byte-identical"
  objects:   "`objects: {object id -> object}` — one map entry per object, holding the state per region, `entered_at`, `seq`, the record fields and `applied_responses`; the envelope of model.md 3.4 as a value rather than a file"
  threads:   "`threads: {object id -> [entry]}` — the entries in order: question, answer, note, exit, offer, refusal, moved, op-response. A session's `flywheel exit|offer|note|refuse` appends here through the same command path a real session uses (67), so the entry a scenario asserts is the entry a session would have written"
  rail:      "the `rail` object's own record, like every other object: `next_number` and the register of {decision id, number, since, answered_by, answered_at} (15, 235). It is not a second store"
  responses: "`responses: [response]` in arrival order, each with its delivery id, and `unapplicable` for one whose decision was gone, which stands until a tick has reported it once (6, 129)"
  leases:    "`leases: {object id -> lease record}` — holder, taken_at, renewed_at. A map, so `two holders` is not representable: the take either finds the key free or does not"
  hosts:     "`heartbeats: {host id -> host record}`, one entry per host name a scenario declares; a `host` step's `lose` drops the entry, `return` puts it back"
  effects:   "`effects_written: [{effect id, object, do, at}]` — every effect ever written, by its identity, so a repeat finds itself (127)"
  sequence:  "`writes` — a counter incremented once per write, and `moved: [(sequence, object id)]`. The sequence is the point a read is as of (126) and the pair is what a notice names (130)"
  trace:     "the run's record: every tick, the guards evaluated, the transitions taken, the effects performed and the decisions created and retracted, written to `target/flywheel-trace/stand-in/<scenario>.trace.json` and rendered beside it (95, conformance/README.md). On this profile the trace is the durable record; see `guarantees.durable`"

records:
  get:    "`objects[id]`, cloned; absent when the key is not there"
  put:    "replace `objects[id]` whole with the new value and increment `writes`; there is no partial write to see (135)"
  append: "push onto `threads[id]`; entries are never rewritten or removed"
  list:   "the map's keys filtered by the scope, in the map's own sorted order, so two lists with nothing changed are equal (78, 126)"
  responses: "`responses` whose object, or whose number through the rail's register, names the object"
  leases: "`leases` and `heartbeats` read directly"

contract:
  read:     "`objects[id]` and the evidence the predicates ask for, as of the current `writes` sequence, which the read states. Reading twice with nothing changed returns the same value and increments nothing (126)"
  write_effect: "append to `effects_written` under the effect's identity, then apply. A repeat is found by scanning `effects_written` for the identity before applying: it changes nothing, is not an error, and is not counted a second time (127). The scan is linear and the suite is small; a real profile indexes"
  lease:    "take = insert into `leases` only when the key is absent or its holder expired; renew = write `renewed_at` when the holder is the caller; release = remove the key when the holder is the caller. Because the map is one value in one process, the check and the insert are one step and cannot interleave (128, I15). Expiry: `renewed_at` older than 24h of the scenario clock, or the holder's host decision answered takeover. A host takes a lease only for an object its declaration covers (149)"
  present:  "the delivery is rendered into the trace rather than posted: `deliver_rail` writes the lines a chat would carry, the page would draw and a bell would ring, and advances the sink's mark, so a scenario asserts the same numbers and forms it would assert on a real surface (surfaces.yaml, 18). A document under review is named in the trace with the decision it belongs to; no plannotator or lavish process starts"
  receive:  "a scenario's `response` step is the delivery: it names the decision by id, resolved through the register at the moment the step runs, or by the number the register gave (15, conformance/README.md), and becomes a response in `responses` with that delivery id. A response naming a decision that is gone becomes `unapplicable` and comes back once under attention, never dropped (129)"
  notify:   "an in-process call: the write increments `writes` and appends to `moved`, and the runner hands the tick the objects that moved since the sequence it last read. Bound: zero — the notice is the same call stack as the write, so there is no window to state. A run that ignores it still converges by listing, which is the property 130 asks for and this profile proves by construction"
  list:     "as records.list"
  status:   "`render_status` builds the status view from `list` and `get` alone, as on every profile, and the trace holds it with the sequence it is as of (132, 145). There is no host to serve it and no file to read afterwards: on this profile the status view is read from the trace"

guarantees:
  durable:  "for the process's life, and afterwards only in the trace. A write survives a restart of the machinery inside a run — the map is the store, and `restart` drops what a host remembers and not what the store holds (75, I7) — and it survives between runs when the JSON file is kept. It does not survive the loss of the machine, and nothing here is replicated. This is stated rather than provided: 133 asks that a write survive the loss of every host at once, and `contract/durable.yaml` exercises that shape against the map, but on this profile the record that outlives the run is the trace (92, 93, 95). A profile that cannot provide a guarantee is rejected as a profile (170); the stand-in is admitted for what 92 asks of it, testability with no live service, and for nothing else. No instance's state is ever kept here"
  single_writer: "the store's own sequence check: a write carries the `writes` value it read at, and a write whose value is stale is refused and the loser reads again (134). One process holds the map, so the check and the write are one step; two hosts of a scenario are two callers into that one map, which is why `contract/single-writer.yaml` can force the race at all, and it needs the `bypass_lease` hook to do it (conformance/schema.json)"
  atomic:   "the object is replaced whole. A reader holds either the value before or the value after, never a mixture, because there is no moment at which half of it is written (135)"
  derivable: "the rail is rebuilt from `objects` and the register on every tick and stored nowhere (7, 15, 136). The status view, the tail and the instrument are the same read. Nothing in the store decides behaviour privately: `given` evidence and the world facts are inputs a scenario states, and the trace shows every guard that read them"
  response_once: "`applied_responses` on the object, written in the same `put` as the state change it caused, and the response's own delivery id in `responses`: a second arrival of the same id finds it and applies nothing (137, I2). A restart mid-scenario re-reads both from the store"
  disconnected: "not applicable and not simulated. There is no service to lose: a scenario that needs a disconnected host uses the git-only profile, which is why S18 and S19 name it (C.2). A `host` step's `disconnect` on this profile stops that host ticking and nothing more"
