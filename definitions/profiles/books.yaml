# The part of every profile's binding that reads and writes the books
# repository: claims, the ledger, captures, signals and moves, the manifest,
# the type catalogue. The same in every profile; not a profile on its own.
#
# Tools: the books repository is a git repository holding an mdBook; recutils
# files (`recsel`, `recins`, `recset` through the `recutils` binary, or the
# crate's own parser) for the ledger and the signal records; OpenSpec change
# directories for intents; `flywheel claims check` as the books' pre-commit
# hook verifying every fenced claim block's lock hash.
#
# An intent is an OpenSpec change (`openspec/changes/<intent id>/`): its
# elaborations' records — research notes, session records, prototype notes,
# an interactive page — live in that change directory, and what they conclude
# is written to the book's chapters and claims. A bolt has no change
# directory in the books; a proposal's document sits beside its record in the
# state store (187).
format: flywheel-profile/1
name: books
complete: false
manifest:
  doc: |
    `flywheel.yaml` at the books' root lists the repositories the flywheel
    tracks with their git details only (199, 203); a repository's kinds and
    capabilities are derived from the map elements and contexts that name it as
    home, and the entry's name is what a node's `home` names:

      repositories:
        <name>:                                    # elements and contexts with home: <name> give it its kinds and capabilities (199)
          repo: <org>/<name>
          landing: pull-request | direct           # 175
          take_cadence: "0 6 * * *"                # 50
          item_merge: squash | merge               # 179
          personas: "personas/*.md"                # 56

    `flywheel map check` (the books' pre-commit hook, with `flywheel claims
    check`) fails a commit in which a node's home names no manifest entry or
    a manifest entry is the home of no node (199). A repository's commit
    types are its own declaration, `flywheel/commit-types.yaml` in the built
    repository (185, 203).
context_map:
  doc: |
    The system context map is the scope surface (198), bound to the
    first-principles model in `models/context-map/` (model.md, schema.yaml):
    the bounded contexts the books describe, in the terms of domain-driven
    design. Format `flywheel-context-map/2`; two complete YAML maps under the
    book's own layout, `context-map/current.yaml` (what is built) and
    `context-map/target.yaml` (what the books say), each declaring
    `schema: flywheel-map/N` and the same id naming the same thing in both.
    Four element types, each with the common fields id, name, ref
    (book/chapter, 120), status (settled | candidate | open, open paired with
    a question), tags:
      - context: home (optional default for its elements), external,
        big_ball_of_mud, language
      - element: context, kind (from the vocabulary), home (optional; the
        context's applies)
      - relationship: pattern — partnership | shared-kernel |
        customer-supplier | conformist | separate-ways, fixed and never
        extended — with contexts or upstream/downstream, upstream_offers
        (open-host-service, published-language), downstream_guards
        (anticorruption-layer), kernel
      - link: kind (from the vocabulary), from, to; a link across contexts
        must cross a relationship that is not separate-ways
    Lanes, tiers, runtimes and stores are tags or organization kinds, never
    structure; there is no seam layer, no lane, no runtime on an edge, no
    seamRow, no configurations companion and no verifiedFiles (model.md 2.5).

    Vocabulary and versioning (208): the flywheel ships the schema, the
    default vocabulary (element kinds aggregate, domain-event, contract with
    capability true, service; link kinds uses, implements, emits, handles; no
    facets) and the derivation table as one thing, `schema: flywheel-map/N`,
    with the release. The organization extends it in
    `flywheel/map-vocabulary.yaml` (`extends: flywheel-map/N`): element kinds
    that may extend a shipped kind (`store extends service`), link kinds with
    end constraints, facets with closed or open values, capability flags; a
    file that redeclares a shipped kind fails. `flywheel map check` validates
    both maps against the union on every commit (the books' pre-commit hook,
    121) and fails a map or vocabulary whose N the installed flywheel does
    not read; upgrading N is a chore (123).

    Attachments live with the claim (97, 200): the claim's fenced block in
    its chapter carries `attaches: [<ids>]`, outside the lock hash, and the
    map carries no claims; `flywheel/claims.json` (rendered) joins claim to
    map by id. Scope is computed from the target map through homes by the
    schema's scope table — a context: its home ∪ its elements' effective
    homes; an element: its effective home; a relationship: both contexts'
    scope ∪ the kernel's homes; a link: both elements' scope; nothing: empty,
    not planned against (98). Scope reads home, context and attachment only.

    Derivation (199): a repository's kinds are the set of kinds, with what
    each extends, of the elements it homes; its capabilities the ids of the
    homed elements whose kind has capability true — in the shipped
    vocabulary the contracts; its contexts the contexts of what it homes. The
    table reads kind and effective home only, never tags, facets or links,
    and its outputs are shown on the repository page and read by skills when
    they choose a template or deliverable (190); scope never reads them.
    Changing the table or either vocabulary re-derives kinds and
    capabilities only.

    The ledger invariant (model.md 4.8): a verdict is keyed by claim, claim
    version and repository; the verdicts a repository is due for are the
    claims attached to what it homes. Only a home moved, an element added to
    or removed from a home, a re-attachment, or a claim version moves a
    verdict; a tag, a kind, a facet, a derivation row or a vocabulary change
    moves none. The check enforces the shape: derivation may not read tags,
    scope may not read derivation.

    Difference (121, 122, 201): one engine keyed on id over two maps —
    added, removed, changed with the fields listed, moved when the only
    differing field is home — used twice: current → target, the design
    difference; and target at the operator's last review (the plan's
    reviewed_at revision, the since-review map rebuilt from git history
    between the mark and head) → target now. Never stored.

    Home checks (199): a home naming no manifest entry fails; a manifest
    entry no element or context homes, in target or current, fails; an
    element with no effective home in a non-external context fails; an
    element with a home in an external context fails. The manifest entry
    carries git details only.

    Rendered by the machinery under its prefix (203): `flywheel/map/target.json`
    and `flywheel/map/current.json`, the evaluated maps with every effective
    home resolved, each repository's derived kinds, capabilities and
    contexts, and each claim's computed scope — what every host and the page
    read. Joining (202): a repository joins the fleet when the target map
    first homes something in it; its ledger is empty and its first planning's
    baseline is the claims attached to what it homes. A repository homed only
    in current is retiring; its verdicts stand until current drops it.

    Moving the map (211): only through the tools — attach and detach, set a
    home, add or amend an entry (refused without a ref), set a status with
    its question, capture a question, mark reviewed, add a repository. A
    session moves the map only in a writeback that also writes the chapter
    (120); the landing construction session's writeback moves the current
    map for what it built; no session changes an attachment or a home for
    work it is doing itself.
layout:
  doc: |
    The books repository is the organization's (203). People and sessions
    write the book (`src/`), the claim blocks in it, the context map
    (`context-map/current.yaml`, `context-map/target.yaml`) and the
    organization's map vocabulary (`flywheel/map-vocabulary.yaml`), the manifest (`flywheel.yaml`), the OpenSpec changes
    for intents (`openspec/changes/<intent id>/`) and the elaboration records
    inside them, under the book's own layout. The machinery writes only
    under `flywheel/` — `flywheel/signals/` (captures, signals, moves),
    `flywheel/ledger/`, `flywheel/map/` (the rendered maps),
    `flywheel/claims.json` (the rendered claims index) — and the OpenSpec
    change directory it creates when an intent opens (open_intent), plus the
    archive move at landing. The shipped instructions, schemas, skills and
    type files live under `flywheel/` too, written by people (chores) and
    read by the machinery.
evidence:
  capture.signals_present: {read: "at least one `flywheel/signals/<capture key>/*.rec` exists on the books' shared line (203)"}
  signal.move:             {read: "`flywheel/signals/moves/<signal id>.rec` target's first word (attach | challenge | join | answered | route | drop); none when the file is absent; a route target is `route <offer entry id>`"}
  cell.challenged:         {read: "some `flywheel/signals/moves/*.rec` whose target is `challenge <this cell's claim>` has a date newer than the cell's judged_at"}
  cell.verdict:            {read: "`flywheel/ledger/<repository>.rec` record with this claim: the verdict field; none when absent"}
  cell.verdict_claim_version: {read: "the same record's claim_version"}
  cell.verdict_recorded:   {read: "a record with this claim, claim_version, revision and judged_at exists"}
  curation.unmoved_count:  {read: "count of signal records with no move record, by event date"}
  curation.threshold:      {read: "`flywheel.yaml` curation.threshold (default 12)"}
  curation.cadence_due:    {read: "`flywheel.yaml` curation.cadence (cron, default `0 6 * * 1-5`) has fired since the curation record's last run"}
  curation.moves_recorded: {read: "every move the session delivered exists as a move record"}
  planning.fingerprint:    {read: "sha256 over: the elements and contexts homed in the repository from `flywheel/map/target.json` with their ids, kinds and effective homes, and the derived kinds and capabilities (199); the attachments whose computed scope reaches the repository (200); standing claims in scope for the repository with versions; every ledger cell of the repository with its freshness; the ids of signals whose standing move challenges a claim in scope (101); open bolts of the repository with their units' cited claim versions and citation choices; unconsumed asks naming the repository; pending redo notes"}
  planning.ledger_empty:   {read: "`flywheel/ledger/<repository>.rec` is absent or holds no record; a repository joins when a node names it as home (202)"}
  intent.signals_dropped:  {read: "every signal the intent cites has a move record whose target is `drop <intent id>`"}
effects:
  record_verdict:  {do: "recset/recins on `flywheel/ledger/<repository>.rec` (203): replace the record for the claim with verdict, claim_version, revision, evidence, judged_at, judged_by; one commit on the books' shared line whose message carries the effect id; pushed with expected-old, rebased and retried on rejection (the cell's lease makes a content conflict impossible)"}
  record_moves:    {do: "one `flywheel/signals/moves/<signal id>.rec` per delivered move (203), target `attach <intent>` | `challenge <claim>` | `join <intent>` | `answered <claim or record>` | `route <offer entry id>` | `drop <reason>`; one commit on the books' shared line"}
  drop_signals:    {do: "for each signal the intent cites, write a move record `drop <intent id>` with the reason; one commit"}
  ensure_signal:   {do: "for a capture whose source is forwarded-message: write one signal record whose excerpt is the message and whose kind is the operator's response (default ask); one commit"}
