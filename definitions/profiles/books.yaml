# The part of every profile's binding that reads and writes the books
# repository: claims, the ledger, captures, signals and moves, the manifest,
# the type catalogue. The same in every profile; not a profile on its own.
#
# Tools: the books repository is a git repository holding an mdBook; recutils
# files (`recsel`, `recins`, `recset` through the `recutils` binary, or the
# crate's own parser) for the ledger and the signal records; OpenSpec change
# directories for intents; `flywheel claims check` as the books' pre-commit
# hook verifying every fenced claim block's lock hash.
#
# An intent is an OpenSpec change (`openspec/changes/<intent id>/`): its
# elaborations' records — research notes, session records, prototype notes,
# an interactive page — live in that change directory, and what they conclude
# is written to the book's chapters and claims. A bolt has no change
# directory in the books; a proposal's document sits beside its record in the
# state store (187).
format: flywheel-profile/1
name: books
complete: false
manifest:
  doc: |
    `flywheel.yaml` at the books' root. Beside each repository it states the
    kinds the repository is and the capabilities it declares, which is what a
    claim's scope resolves against (105, 195):

      repositories:
        <name>:
          repo: <org>/<name>
          kinds: [service, data-product]         # a claim scoped `kinds:` matches any of them
          capabilities: [provider-client]         # a claim scoped `capabilities:` matches any of them
          landing: pull-request | direct           # 175
          take_cadence: "0 6 * * *"                # 50
          item_merge: squash | merge               # 179
          commit_types: {default: feat, fast: fix, chore: chore}   # 185
          personas: "personas/*.md"                # 56

    Adding a kind or a capability is a commit on the books' shared line; every
    host reads it at its next fetch, the cells of the claims now in scope
    appear unjudged, and the repository's fingerprint moves (195). Removing
    one takes the cells out of scope, where their verdicts read as
    not-applicable (101).
evidence:
  capture.signals_present: {read: "at least one `signals/<capture key>/*.rec` exists on the books' shared line"}
  signal.move:             {read: "`signals/moves/<signal id>.rec` target's first word (attach | challenge | join | answered | route | drop); none when the file is absent; a route target is `route <offer entry id>`"}
  cell.challenged:         {read: "some `signals/moves/*.rec` whose target is `challenge <this cell's claim>` has a date newer than the cell's judged_at"}
  cell.verdict:            {read: "`ledger/<repository>.rec` record with this claim: the verdict field; none when absent"}
  cell.verdict_claim_version: {read: "the same record's claim_version"}
  cell.verdict_recorded:   {read: "a record with this claim, claim_version, revision and judged_at exists"}
  curation.unmoved_count:  {read: "count of signal records with no move record, by event date"}
  curation.threshold:      {read: "`flywheel.yaml` curation.threshold (default 12)"}
  curation.cadence_due:    {read: "`flywheel.yaml` curation.cadence (cron, default `0 6 * * 1-5`) has fired since the curation record's last run"}
  curation.moves_recorded: {read: "every move the session delivered exists as a move record"}
  planning.fingerprint:    {read: "sha256 over: the repository's kinds and capabilities from `flywheel.yaml` (195); standing claims in scope for the repository with versions; every ledger cell of the repository with its freshness; the ids of signals whose standing move challenges a claim in scope (101); open bolts of the repository with their units' cited claim versions and citation choices; unconsumed asks naming the repository; pending redo notes"}
  planning.ledger_empty:   {read: "`ledger/<repository>.rec` is absent or holds no record"}
  intent.signals_dropped:  {read: "every signal the intent cites has a move record whose target is `drop <intent id>`"}
effects:
  record_verdict:  {do: "recset/recins on `ledger/<repository>.rec`: replace the record for the claim with verdict, claim_version, revision, evidence, judged_at, judged_by; one commit on the books' shared line whose message carries the effect id; pushed with expected-old, rebased and retried on rejection (the cell's lease makes a content conflict impossible)"}
  record_moves:    {do: "one `signals/moves/<signal id>.rec` per delivered move, target `attach <intent>` | `challenge <claim>` | `join <intent>` | `answered <claim or record>` | `route <offer entry id>` | `drop <reason>`; one commit on the books' shared line"}
  drop_signals:    {do: "for each signal the intent cites, write a move record `drop <intent id>` with the reason; one commit"}
  ensure_signal:   {do: "for a capture whose source is forwarded-message: write one signal record whose excerpt is the message and whose kind is the operator's response (default ask); one commit"}
