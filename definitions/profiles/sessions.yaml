# The session binding: agent panes in the multiplexer, and the command the
# machinery provides for a session to report its exit, offers and refusals
# (67). The same in every profile. It is the one binding a stand-in replaces
# (sessions-stand-in.yaml, 93); everything else stays real when a scenario
# runs. Not a profile on its own.
#
# Tools: herdr `herdr agent` (start, status, send, stop) as the multiplexer
# with an agent-aware API; the agent runtime by kind — Claude Code, codex or
# opencode — under `kinds:` below, every kind started through the same
# `herdr agent start` (173), in the multiplexer session `multiplexer_sessions`
# gives it (174); the `flywheel` binary's session commands, run inside the place:
#   flywheel exit done --deliverables <list>       flywheel exit blocked --question <text>
#   flywheel exit stalled --note <text>            flywheel offer finding|chore|signal <document> --about <object> [--scope bolt-line|<repository>]
#   flywheel note <text>                           flywheel refuse <what>   (run by the hooks)
#   flywheel service start|stop <name>             (the bolt's declared service, 47)
#   flywheel ask <repository> <text>               (the curation session's ask, 116)
# Each writes one entry on the session's thread through the state store and
# nothing else; the machinery decides what the entry means (66). The service
# and ask commands are the two exceptions: each is a catalogue tool called as
# the session, writing the very record the operator's dictation produces —
# an op-response, an ask record — and no thread entry (67, 193; below).
format: flywheel-profile/1
name: sessions
complete: false
agents:
  doc: "the agent definition a session starts as is `flywheel/agents/<agent>.md` in the blueprints and its skill `flywheel/skills/<agent>/SKILL.md`, keyed by the agent name the machine or the stage names — curator, planner, capture-reader, chore-fixer, operator-console, spec-writer, builder, verifier, reviewer, tester; an elaboration type's `agent: by-type` names the type, so its agent is `flywheel/agents/<type>.md` (context.yaml ruling 3). A persona-test stage's sessions all start as the stage's `tester` definition; the persona file is a section of each session's work order, data and not an agent (56, ruling 20)"
runners:
  doc: "which process starts a session (217c): `pane` — `herdr agent start` as below; `inproc` — a bounded agent loop inside the host's own binary, the model through the SDK, the tools in-process, for the host's agent everywhere and for triage on a host without a multiplexer; `managed` — a session on an agent platform reaching the tool server over remote MCP with the session's identity, across the private network only; `operator` — no agent at all: the machinery prepares the place, renders the work order and records the session, the rail and the status view show it as the operator's to run, and the operator reports through the same `flywheel exit|offer|note|refuse` path a session reports through, and files curation's asks through the same `flywheel ask` (93b, 67). `flywheel.yaml` hosts.<host>.runners: {triage: pane | inproc | managed | operator, agent: inproc}. Every runner starts the session with the same work order, instruction data and exits, and the engine cannot tell them apart"
  operator: "under the `operator` runner start_session writes the session record with its place and work order path and nothing else; session.pane reads present while the record stands and the operator has not reported, session.activity reads working, and every exit, offer and refusal is the operator's own command (93b). A session so charged is with-operator for every rule that turns on the type (25), and the machinery's own sessions — curation, planning, capture reading (171) — are the operator's under the same rule, as 110 already says of curation"
kinds:
  doc: "the command each kind of agent is started with, the agent name and the work order path substituted (173); a stage names a kind per agent entry, default claude; the operator adds a kind by adding a line here, or as a runner package (228)"
  claude:   "claude --agent <agent> --model <model> -- <work order path>"
  environment: "every kind is started inside the place's activated environment (238): the command runs through the provider's shell (`devenv shell -- <cmd>`, `nix develop -c <cmd>`, the devcontainer's exec, or plainly on an image host), so the tools the repository declares are on the session's path at their versions"
  codex:    "codex --profile <agent> --model <model> <work order path>"
  opencode: "opencode --agent <agent> --model <model> --prompt <work order path>"
models:
  doc: "kind and model by role, the defaults a stage, unit type or elaboration type may override with its own `kind:` and `model:` (173); declared in `flywheel.yaml` roles.<role>: {kind, model}; nothing here is read from any agent program's own configuration (183)"
  elaboration: {kind: claude, model: claude-fable-5-1}
  construction: {kind: claude, model: claude-opus-5}
  machinery:    {kind: claude, model: claude-fable-5-1}
  example_override: "a code-review stage may declare {kind: codex, model: gpt-5-codex}"
multiplexer_sessions:
  doc: "the herdr session a pane is started in (174); defaults by who charged the session, overridable per host in `flywheel.yaml` hosts.<host>.multiplexer_sessions by kind (`codex: flywheel-<instance>-codex`) or by repository (`atlas: flywheel-atlas`), the most specific winning: repository over kind over default. The machinery creates the session when herdr does not list it"
  intents:   "flywheel-<instance>-intents — elaboration sessions and the operator's own session"
  bolts:     "flywheel-<instance>-bolts — stage sessions of units the operator approved"
  machinery: "flywheel-<instance>-machinery — curation, planning, capture reading, and the fix of a take conflict (171)"
  shared_computer: "when `flywheel.yaml` hosts.<host>.shared_computer is true — several hosts on one computer (232) — the defaults become `flywheel-<instance>-<host>-intents|bolts|machinery`, so two hosts never open a pane in one another's session"
layout:
  doc: |
    The multiplexer layout (196), a binding with this shipped default. Every
    pane and agent is named by the object it works — the session id — so
    `herdr agent list` is a status view of its own (B.4). Inside the
    multiplexer session the role gives (174): one workspace per bolt and per
    intent, labelled by the object id; one tab per unit and per elaboration;
    one pane per session, so the sessions of one unit's stage running side by
    side (56) are split panes of one tab. Curation, planning and capture
    reading are one workspace each in the machinery session, one tab per run.
    The operator's own session (69) is a workspace of its own in the intents
    session. The machinery creates a workspace, tab or pane when absent and
    removes it when its object leaves every view (186); a pane is removed by
    end_session, a tab or workspace by the host's layout reconciliation.
  workspace: "`herdr workspace create --session <multiplexer session> --label <bolt or intent id>` when `herdr workspace list --session <s>` lacks the label; `herdr workspace close --label <id>` when the object has left every view"
  tab:       "`herdr tab create --workspace <label> --label <unit or elaboration id>` when absent; `herdr tab close --label <id>` when the object has left every view"
  pane:      "the first session of a tab takes its pane; a further session of the same tab is `herdr pane split --tab <label>`; the pane's id is handed to `herdr agent start --pane <id>`"
  override:  "`flywheel.yaml` hosts.<host>.layout may set `workspace_per: bolt|intent|repository` and `tab_per: unit|elaboration|item`; the defaults above hold otherwise"
identity:
  doc: |
    A session speaks to the machinery only through the tools (193, 197).
    start_session issues the session an identity — a token bound to the
    session id and the pane — and writes it into the work order's header;
    every `flywheel` command and every tool call from the pane carries it.
    The tool server checks the token against the pane the call came from
    (`herdr agent status` gives the pane's session name) and refuses a
    mismatch with a refusal entry on the calling session's thread, so a
    session can act only in its own job (43, 89). The machinery speaks to a
    session only through its thread, delivered by `herdr agent send`
    (deliver_answer, tell_moved); no session is sent anything else, and
    `herdr agent send` is not exposed to any session. Messaging built into
    an agent program and the multiplexer's own messaging are not used by
    any session: the work order says so and the place's settings deny them
    (173).
evidence:
  session.pane:        {read: "`herdr agent status <session-id>`; present when the multiplexer lists the pane by that name"}
  session.activity:    {read: "`herdr agent status`: the agent-aware state (working | idle); none when absent. While the holding host is away (150a) the value the host last wrote on the session record stands"}
  session.idle_since:  {read: "`herdr agent status` last-activity time. While the holding host is away (150a) the clock pauses: on the host's return the recorded idle_since is advanced by the time it was away before any `older` guard reads it, so a stall bound never counts absence"}
  session.operator_present: {read: "`herdr agent status` last human keystroke within the presence window: 30 minutes, a setting of this binding (25)"}
  session.pane_absent: {read: "`herdr agent status` reports no pane by that name"}
  session.exit:        {read: "the newest `exit` entry on the session's thread, written by `flywheel exit` (kind done | blocked | stalled with deliverables, question, note); none when there is no entry; invalid when the entry fails the exit schema in force"}
  session.offers_pending: {read: "`offer` entries on the session's thread (kind, document path in the change directory, about, scope, the place's revision at the offer) that no unit, elaboration or signal record cites by entry id; a refused offer, and one a later entry's `refuses: <entry>` takes back, is not pending"}
  session.refusals_pending: {read: "`refusal` entries on the session's thread, written by the hooks through `flywheel refuse`, not yet carried to the report"}
  session.delivered:   {read: "the deliverables field of the newest exit entry"}
  session.identity:    {read: "the token the session record carries, issued by start_session and written into the work order's header (197)"}
  host.layout_current: {read: "`herdr workspace list` and `herdr tab list` in each of the host's multiplexer sessions name only objects still in a view (186); every live session's pane is in its object's tab"}
commands:
  offer: {do: "`flywheel offer finding|chore|signal <document> --about <object> [--scope bolt-line|<repository>]` run inside a session's place: one `offer` entry on the session's thread with the kind, the document's path, what it is about, its scope and the place's revision at the offer — its head, which must hold the document, else the command refuses on the thread naming the path and exits 1 — and nothing else (58, 62, 67); the command pushes nothing, a place's `pre-push` hook refusing every push (43): `record_offers` pins the revision on the git host when it records the entry (record-derived.yaml); `about` is recorded and read by nothing yet: the card's subtitle is the session and a chore's landing is the scope's. Every session's work order gives this command under how to report, `FLYWHEEL_SESSION`, `FLYWHEEL_STATE`, `FLYWHEEL_MANIFEST` and `FLYWHEEL_PAGE` filled in, beside its exits (67, 89); the command has the session's id alone and finds the object it runs under as the longest prefix of that id on record (session.yaml id). The scope is where a chore's fix belongs (60): `bolt-line` — the line of the bolt above the session, implied when a bolt stands above it and the flag is left off — or the manifest name of a repository, meaning that repository's shared line even when a bolt stands above the session, `blueprints` among the names as the operator's `propose-chore` and the `ask` tool take them (surfaces.yaml tools). A chore offered under no bolt must name a repository: an offer naming none, or one the instance does not track, is refused on the thread with the tracked names and `blueprints`, exits 1 and is never pending, exactly as `commands.ask` refuses an untracked repository; the tracked names come from the manifest through `--manifest` or `FLYWHEEL_MANIFEST` as the ask's do. A finding's scope is not read, nor a signal's. `record_offers` makes the chore a proposed chore unit under the repository the scope names — under the `instance` with `repository: blueprints` for the blueprints — folded by that name (62, model 1). A `signal` is what a session offers when what it saw is about neither its intent nor its bolt (58): `record_offers` records it exactly as a finding with no thread above the session — the next signal of the capture the session was reading, or the one signal of a capture of its own, source `offer`, keyed `offer/<session>/<entry>` — wherever the session stands, a bolt above it or none, and never as a proposal on its thread (62, S231); a `finding` is about the session's own thread and is a proposal there when one stands above it"}
  service: {do: "`flywheel service start|stop <name>` run inside a session's place: the machinery resolves the place's line to its bolt and writes an op-response through the state profile's `receive` — object = service/<bolt>/<name>, answer = start | stop, by = session/<session id>, id = the thread entry id — exactly the record the operator's dictation `start <bolt>/<name>` produces; the service machine's `{response: start}` and `{response: stop}` guards see one record whichever wrote it (48). A name the bolt's place does not declare is refused with the declared names, and the refusal is a thread entry. Anything a session starts without the command is its own process under the place's rule (45): tethered to the session's own place, never shown, gone with it"}
  ask: {do: "`flywheel ask <repository> <text>` run inside a session's place: the `ask` tool of the catalogue (surfaces.yaml tools.ask) called with the session's identity, so its effect writes the ask record (`asks/<id>`: repository, text, by = session/<session id>, at, consumed_by empty) through the commit path every effect takes — exactly the record the operator's `ask` dictation produces — and prints `ask/<id>` alone on stdout, which the session's `route` move names, then wakes the page; a filed ask puts nothing on the session's thread (116, 28, model 5.7). The state is read through `FLYWHEEL_STATE` as `flywheel exit` reads it, and the tracked repositories from the manifest through `--manifest` or `FLYWHEEL_MANIFEST`; the work order of a session granted the ask carries the exact command, both variables filled in, under how to report. A repository the instance does not track is refused with the tracked names, and the refusal is a thread entry naming the repository. Granted to the curation session and to the operator's own session (69), read from the session id's first segment; any other session's call is refused like a line operation, on its own thread, naming `ask` as the operation (43, 197). A refusal exits 1. Under the `operator` runner the operator runs it for curation like every other report (93b)"}
effects:
  start_session:   {do: "the multiplexer session created first when absent (174), then the object's workspace and the unit's or elaboration's tab when absent and the pane split when the tab already has one (layout: above, 196); `herdr agent start --session <multiplexer session> --pane <pane id> --name <session-id> --cwd <place> -- <the kind's command from kinds:>`; the identity token is issued and written into the work order's header before the start (197); the work order path is the first message; a name already present is refused by herdr, which is the proof (173)"}
  remove_stale_layout: {do: "`herdr tab close` and `herdr workspace close` for every label naming an object that has left every view (186, 196); recorded like any removal"}
  end_session:     {do: "`herdr agent stop <session-id>`"}
  deliver_answer:  {do: "`herdr agent send <session-id> <answer>` when the pane is present; else start_session with the answer prepended to the work order; the thread's answer entry is marked delivered"}
  tell_moved:      {do: "append(session thread) a `moved` entry listing the commits that moved under the place, then `herdr agent send` its text; the entry is marked delivered"}
