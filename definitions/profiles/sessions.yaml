# The session binding: agent panes in the multiplexer, and the command the
# machinery provides for a session to report its exit, offers and refusals
# (64). The same in every profile. It is the one binding a stand-in replaces
# (sessions-stand-in.yaml, 89); everything else stays real when a scenario
# runs. Not a profile on its own.
#
# Tools: herdr `herdr agent` (start, status, send, stop) as the multiplexer
# with an agent-aware API; Claude Code `claude --agent <name>` as the agent
# runtime; the `flywheel` binary's session commands, run inside the place:
#   flywheel exit done --deliverables <list>       flywheel exit blocked --question <text>
#   flywheel exit stalled --note <text>            flywheel offer finding|chore|signal <document> --about <object> [--scope ..]
#   flywheel note <text>                           flywheel refuse <what>   (run by the hooks)
# Each writes one entry on the session's thread through the control plane and
# nothing else; the machinery decides what the entry means (63).
format: flywheel-profile/1
name: sessions
complete: false
evidence:
  session.pane:        {read: "`herdr agent status <session-id>`; present when the multiplexer lists the pane by that name"}
  session.activity:    {read: "`herdr agent status`: the agent-aware state (working | idle); none when absent"}
  session.idle_since:  {read: "`herdr agent status` last-activity time"}
  session.operator_present: {read: "`herdr agent status` last human keystroke within the presence window: 30 minutes, a setting of this binding (24)"}
  session.pane_absent: {read: "`herdr agent status` reports no pane by that name"}
  session.exit:        {read: "the newest `exit` entry on the session's thread, written by `flywheel exit` (kind done | blocked | stalled with deliverables, question, note); none when there is no entry; invalid when the entry fails the exit schema in force"}
  session.offers_pending: {read: "`offer` entries on the session's thread (kind, document path in the change directory, about, scope) that no unit, elaboration or signal record cites by entry id"}
  session.refusals_pending: {read: "`refusal` entries on the session's thread, written by the hooks through `flywheel refuse`, not yet carried to the report"}
  session.delivered:   {read: "the deliverables field of the newest exit entry"}
effects:
  start_session:   {do: "`herdr agent start --name <session-id> --cwd <place> -- claude --agent <agent>`; the work order path is the first message; a name already present is refused by herdr, which is the proof"}
  end_session:     {do: "`herdr agent stop <session-id>`"}
  deliver_answer:  {do: "`herdr agent send <session-id> <answer>` when the pane is present; else start_session with the answer prepended to the work order; the thread's answer entry is marked delivered"}
  tell_moved:      {do: "append(session thread) a `moved` entry listing the commits that moved under the place, then `herdr agent send` its text; the entry is marked delivered"}
