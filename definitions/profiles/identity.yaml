# The identity binding (A.32, 243–255; the plans of A.35, 279–284): a host
# binding with two kinds. `github` for self-managed hosts: GitHub's device
# flow, the GitHub username the identity, the manifest's authored operators
# list the membership, every listed operator holding every permission, flags
# at their defaults. `frontegg` for the hosted tiers: Frontegg through its
# SDK, one Application, membership as the Application's assignment on the
# organization's account, roles and permissions from the token, feature flags
# per account. GitHub stays the git host and the App that reaches the
# repositories in both (207, 207a). The definitions below ship in the binary
# with the set version (208, 224, 252) and are synced to the Frontegg
# environment by the hosted service's release alone. The `plans:` block below
# is the commercial ladder over the tiers: a plan is a named set of the
# `fw.ff.*` features plus a few stated limits, held by the provider and read
# only from the token and the SDK; it hides and it meters and it never
# authorizes, and a `github` host has no plan at all. Not a profile on its
# own; every profile inherits it, since it binds no evidence and no effect.
format: flywheel-profile/1
name: identity
complete: false
version: 2
kinds:
  doc: "`flywheel.yaml` hosts.<host>.identity: {kind: github} or {kind: frontegg, environment, client_id}; one kind per host, the same for every organization it serves (233, 243); the tool server checks every call by the host's kind (surfaces.yaml tools.identity)"
  github:
    doc: |
      Self-managed hosts (243, 253). The page signs in with GitHub's device
      flow: it shows the code and the address to enter it at and waits
      until GitHub confirms; the page serves on a localhost port, any
      port, no proxy and no name required (245); several hosts on one
      computer are several ports (232). The identity is the GitHub
      username (246). Membership is the manifest's authored `operators:`
      list with each member's addresses (247, 236a, blueprints.yaml
      manifest); the tool server checks membership before any op-response
      is written and refuses and records a call from any other identity
      (249). Every listed operator holds every permission (248); flags
      stand at their definition defaults (250); there is no provider to
      lose, so GitHub unreachable blocks a new sign-in and nothing else
      (254); the operators list on the settings form is the
      administration (255). The organization's creating user is the first
      entry, so a fresh organization is never locked out (253).
    advice: "portless or a local proxy may be advised for a stable local name and is never required; the flywheel serves no name and registers none"
    upgrade: "moving the organization to a hosted tier (247a): the service creates its account, invites the same GitHub usernames, carries every address over, and the list is derived from then on"
  frontegg:
    doc: |
      The hosted tiers (243). Everything below applies to a host of this
      kind and to no other.
provider:
  doc: |
    Frontegg, on hosted hosts (243). One Application for the whole
    flywheel, with the page and the tool server as its surfaces, assigned
    to each organization's account. Sign-in is Frontegg's hosted login
    (244): the SDK builds `redirect_uri` from the origin the page is
    served on, so a host's served name is the only per-host fact,
    registered once on the environment's redirect list and never per
    organization; the hosted service's hosts name the service's
    environment (252). That served name is where the page and the tool
    server are served, by the same function on request under the caller's
    token (291): the page a static bundle, the tool server the binary's
    own tool catalogue (193) reached over HTTP with the token by the page
    and over stdio or in-process, in the shape of the model context
    protocol, by sessions and by the interpreter. On a hosted host the
    token is the boundary the private network is on a self-managed one
    (46, 191, 217c), and a request is a read and never a tick (270).
  identity: "the Frontegg user (246); GitHub is one social connection on it, and the GitHub username the connection carries is what authorship uses — commit trailers, pull requests, the git host's view of who did the work; a user with no GitHub connection may respond and may not be an author, and the page asks for the connection at first sign-in"
  agents: "no session, host process or dispatch agent holds a Frontegg user credential (251): a session acts with the identity token the machinery issued (surfaces.yaml tools.identity) and reaches the git host with the App's installation token (207)"
accounts:
  doc: |
    The organization is a Frontegg account (247): a top-level account for
    an organization a self-managed operator creates, except that the
    hosted service creates its tenants as sub-accounts of the service's
    own account, so a role assigned on the service's account applies down
    the branch (248). Membership is the assignment of the Application to
    the account, and assignment is the whole of "may respond in it" (233).
    An organization created on a self-managed host is created as an
    account whose creating user holds `owner`, so a fresh organization is
    never locked out (253).
  operators: "derived, never authored on a hosted tier: the account's assigned users, read at every fetch and rendered read-only on the settings form; adding or removing a member is an act on the account through the identity tools (255), never a commit. What stays authored is each member's chat addresses (236a) on their `operators:` entry, keyed by identity (blueprints.yaml manifest)"
  roles: "held per account and carried in the JWT (248); the manifest's `roles:` is derived from the definitions below, not authored; a decision's owner names a member or a role (237)"
permissions:
  doc: |
    Read from the token by the tool server (249): before any op-response is
    written the server checks the caller's token for the permission the
    tool declares, on the organization's account; a call without it is
    refused, no response is recorded, and the refusal is written to the
    run record with the identity, the tool and the object (79, 153), shown
    under attention on the next delivery. Membership admits the identity
    to the organization; the permission authorizes the tool. A tool whose
    permission the host's environment lacks — a binary newer than the
    environment's definitions — is refused with that reason (252). On a
    github host the check is membership in the operators list, every
    listed operator holding every permission below (248, 249).
  by_tool:
    fw.read:             [status view, book, map, the query tools, artifact views, the instrument]
    fw.plan.answer:      [answer, yes all, drop, later, hold, release, finish, end, close, send-back, retire, takeover, revive, take, start, stop, filter]
    fw.plan.assign:      [assign]
    fw.capture.write:    [capture, mark-intent, ask, propose-unit, propose-chore, explore, open-session]
    fw.proposal.edit:    [the per-unit answers on a proposal before its yes]
    fw.map.edit:         [map-edit, set-home, set-status, attach, detach, add-repository, create-repository, adopt-repository]
    fw.review.mark:      [mark-reviewed]
    fw.packages.manage:  [add-package, configure-package, enable-package, disable-package, remove-package]
    fw.secrets.place:    [placing a secret on a host; the value never travels through the page]
    fw.hosts.manage:     [add-host, repair, retry, reissue, takeover on a host, join-host]
    fw.org.configure:    [configure-organization, switch-organization]
    fw.org.remove:       [remove-organization]
    fw.identity.admin:   [invite-member, assign-application, revoke-application, set-role, target-flag]
flags:
  doc: "on hosted hosts, entitlement features, one flag per feature, keyed `fw.ff.*`, evaluated in the page and on the tool server, targeted per account only (250); a flag hides a surface and never authorizes — the tool behind a hidden surface is still guarded by its permission; on a github host every flag stands at its definition default"
degraded:
  doc: "a hosted host degrades rather than fails when the provider is unreachable (254): a token already issued is honoured until it expires; past that the page is read-only — the status view, the book and the map render, the rail shows its decisions with every writing control absent — with one attention line saying identity is unreachable and since when; unbounded for the page, and irrelevant to work: hosts cover work with the App token, not with an identity, so the loops keep running and nothing that needs a response is answered; flags fall back to their last-seen values, then to the definitions' defaults; a github host has no provider to lose — GitHub unreachable blocks a new sign-in and nothing else"
sync:
  doc: "the definitions below ship in the binary and are synced to the environment by the hosted service's release alone (252): the sync reads the environment's current definitions and writes only the difference, respecting the provider's write ceiling on features, plans and flags, deletes nothing not named in `retire:`, and never writes a hostname; a github host has no environment and never syncs; a hosted host whose binary names a permission the environment lacks refuses that tool with the reason"
admin:
  doc: "on hosted hosts identity administration is a surface of the flywheel (255): the account item lists the organization's members with their roles and their chat addresses, invites a user to the account, grants and revokes the Application, sets a role and targets a flag on the account; each is a tool under `fw.identity.admin`, recorded like any response (153); on a github host the operators list on the settings form is the administration"
definitions:
  provider: frontegg
  application:
    surfaces: [page, tool-server]        # one Application for the whole flywheel (243)
  permissions:
    - fw.read                            # status view, book, map, the query tools
    - fw.plan.answer                     # respond to a decision, including yes-all
    - fw.plan.assign                     # set a decision's owner (237)
    - fw.capture.write                   # the capture box (19)
    - fw.proposal.edit                   # edit a proposal before answering it
    - fw.map.edit                        # map-edit, set-home, set-status, attach, detach, add-repository
    - fw.review.mark                     # mark reviewed (122)
    - fw.packages.manage                 # add, configure, enable, disable, remove a package (228, 229)
    - fw.secrets.place                   # place a secret on a host (207)
    - fw.hosts.manage                    # add a host, enrol, repair, takeover (222, 230)
    - fw.org.configure                   # the manifest as a form (233)
    - fw.org.remove                      # retire an organization (221)
    - fw.identity.admin                  # invite, assign the Application, roles, flag targeting (255)
  roles:
    viewer:   [fw.read]
    reviewer: [fw.read, fw.capture.write, fw.review.mark, fw.proposal.edit]
    operator: [fw.read, fw.capture.write, fw.review.mark, fw.proposal.edit,
               fw.plan.answer, fw.plan.assign, fw.map.edit,
               fw.packages.manage, fw.hosts.manage, fw.org.configure]
    identity-admin: [fw.read, fw.identity.admin]
    owner:    [fw.read, fw.capture.write, fw.review.mark, fw.proposal.edit,
               fw.plan.answer, fw.plan.assign, fw.map.edit,
               fw.packages.manage, fw.hosts.manage, fw.org.configure,
               fw.secrets.place, fw.org.remove, fw.identity.admin]
  features:
    - key: fw.ff.cloud-agent
      flag: {default: off, on: []}       # a host of tier 1 may be added (268, 269); Hobby and up
    - key: fw.ff.pools
      flag: {default: off, on: []}       # a pool may be declared (240–242, 275); Pro and up
    - key: fw.ff.store
      flag: {default: off, on: []}       # the package store (228); Pro and up
    - key: fw.ff.book-view
      flag: {default: on,  on: []}       # the board's book view; every plan
    - key: fw.ff.explore
      flag: {default: on,  on: []}       # explore over intents; every plan
    - key: fw.ff.management-console
      flag: {default: off, on: []}       # the hosts and setup surfaces beyond one host; Team and up
    - key: fw.ff.members
      flag: {default: off, on: []}       # roles, invite, assignment, ownership (237, 248, 255); Team and up
    - key: fw.ff.federation
      flag: {default: off, on: []}       # tier 3, both shapes (268): the organization's key and stores in its own account (267, 276), and the binary provisioned into that account behind the control plane (276a); Enterprise
    - key: fw.ff.dedicated-compute
      flag: {default: off, on: []}       # under tier 3's second shape, the console's dedicated compute options created in the organization's account by the deployer — the dispatcher invoked or long-lived, pools on microVMs, container tasks or instances (276a); Enterprise
    - key: fw.ff.sso
      flag: {default: off, on: []}       # enterprise sign-in and provisioning through the organization's directory; Enterprise
    - key: fw.ff.dedicated-dispatcher
      flag: {default: off, on: []}       # a dispatcher function of its own in the service account (269, 281); Enterprise
    - key: fw.ff.scenario-packs
      flag: {default: off, on: []}       # scenario packs, development-time only and never in the production index (286)
  plans:
    doc: |
      A plan is a named set of the features above plus a few stated limits,
      held by the provider and billed through the payment provider; the
      flywheel reads it from the identity token and the SDK alone and keeps
      no plan of its own (279). A plan hides and meters and never authorizes
      (280): permissions come from roles and are checked on every tool call
      (248, 249), a surface a flag hides is still guarded by its permission,
      and exceeding a limit is one attention line and a refused add with the
      reason, never a stopped loop. A `github` host has no plan: every flag
      stands at its definition default there (250). Five rungs over the four
      tiers (268, 281); what each unlocks is the requirement, the price is
      not. Model cost is a plan fact of the same kind (294): the
      organization's own model key is welcome on every plan and required on
      none, each plan includes a budget on the small model class for the
      jobs the dispatcher runs inside a tick, overage is metered through the
      payment provider, and a budget spent is one attention line and a
      slower cadence, never a stopped loop (280).
    ladder:
      free:       {tier: 0, unlocks: [], doc: "the binary, its sign-in, the organization's own App and bot, every package and every surface, nothing on the service side"}
      hobby:      {tier: 1, unlocks: [fw.ff.cloud-agent], doc: "cheap to run and needing no model key of the operator's (281, 294): the service's App and bot, chat structured so no model call is spent on it — a decision answered by button, free text a slash command with its arguments (`/fw yes 412`, `/fw capture <text>`), the plan delivered at no model cost (277) — free text interpreted in the page by the browser model instead (216a), a chat interaction or a webhook captured at once with no model, and a self-contained capture triaged in one daily batch at the sweep on the small model class inside the included budget (217e, 273). Immediate triage and free text in chat are unlocked by placing a model key of the operator's own (207). The plan in the organization's chat and the page and the tool server at a served name (291); raw-material triage, elaboration and construction wait for the operator's own machine or a pool host"}
      pro:        {tier: 2, unlocks: [fw.ff.cloud-agent, fw.ff.pools, fw.ff.store], doc: "pools with an included allowance and metered overage, the package store, the book view and the presets; the immediate triage of self-contained captures and the interpretation of free text in chat, both in the tick on the small model class inside the included budget (269, 294)"}
      team:       {tier: 2, unlocks: [fw.ff.cloud-agent, fw.ff.pools, fw.ff.store, fw.ff.members, fw.ff.management-console], doc: "members with roles, ownership and assignment (237), identity administration (255), the management console, a higher ceiling on a pool host, and a job's model class raisable above the small one per unit type, per elaboration type and per stage (285, 294)"}
      enterprise: {tier: 3, unlocks: [fw.ff.cloud-agent, fw.ff.pools, fw.ff.store, fw.ff.members, fw.ff.management-console, fw.ff.federation, fw.ff.sso, fw.ff.dedicated-dispatcher, fw.ff.dedicated-compute], doc: "tier 3 in both shapes (268): stores only, the key, queue, cache and pool image in the organization's account with the service's compute assuming the granted role (276); or stores and compute, the binary provisioned into that account through the same role with only the control plane — registry, deployer, identity — left on the service side, and the console's dedicated compute options created there by the deployer (276a). Enterprise sign-in and provisioning through the organization's own directory, a dispatcher of its own — in the service account under the first shape, in the organization's own under the second — audit export, a private pool image, and a job's model class raisable per type and stage (294)"}
    limits:
      doc: "plan metadata, never flags (282); the tool server reads them beside the flags and refuses the add that would exceed one, with the reason"
      organizations:      "how many organizations the account may hold"
      members:            "how many users the Application may be assigned to on the account"
      pool_hours_included: "pool host-hours the plan includes before metered overage (242 cost:)"
      pool_memory_max:    "the largest pool host the plan admits (275)"
      captures_included:  "self-contained captures the plan's model budget triages in a month (294); past it the add is not refused — the capture is written and waits for the next month's budget, for a key the operator places, or for the daily batch (281)"
      model_class:        "the model class the in-tick jobs run at (285, 294): small on Hobby and Pro, and on Team and Enterprise raisable per unit type, per elaboration type and per stage, so the plan states a ceiling and the type states the choice"
      model_usage:        "the model usage the plan includes on a hosted tier for the jobs the dispatcher runs inside a tick — reading a capture and answering a message (217b, 269) — carried by the tier role as the service's access (host.yaml tier.model) and metered through the payment provider past the budget (279, 294); an organization that places its own model key is metered on none of it (207), and the key is welcome on every plan and required on none"
  retire: []
