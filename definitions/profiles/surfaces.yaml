# The operator's surfaces, the same in every profile: the sinks decisions and
# the tail are delivered to (the chat, the page, the multiplexer's bell on a
# named surface), and the review surfaces a decision's document is presented
# on. Not a profile on its own. The response comes back through the state
# profile's `receive` (tracker.yaml, git-only.yaml), which is where the two
# profiles differ.
#
# Tools: the Discord bot through `serenity`; the plan page through `axum` over
# Tailscale, on the operator's private network, phone-sized; the bell through
# `herdr` on the surface the manifest names; plannotator for a document under
# review (`plannotator review <path> --decision <n>`), lavish for a rich page
# (`npx -y lavish-axi`); both are bindings of the review surface, not parts of
# the machinery. Which host (or the dispatcher) presents a sink is the sink's
# lease, or the manifest's `presenters:` pin (145).
format: flywheel-profile/1
name: surfaces
complete: false
tools:
  doc: |
    The tool surface (193): every operation the operator may invoke is one
    tool with a schema naming its arguments by object id, served by the
    control plane (the `flywheel` binary's MCP server and its HTTP twin the
    page calls). The page's controls, the Discord bot, the dispatch agent and
    the machinery's own commands (`flywheel exit|offer|service`) call these
    and nothing else; no caller has an operation the others lack. Each call
    is recorded once as an op-response with `tool` and `proposed_by` (153).
  catalogue:
    answer:        {args: [decision, answer, text], doc: "answer a numbered decision; the deterministic path, `yes 412` or `421: <text>` in chat is this tool (194)"}
    capture:       {args: [text, source], doc: "a capture with one signal of kind ask (19); the map view's one-gesture capture of an open element's question sends this with the question's text and the element as source (201)"}
    mark-intent:   {args: [capture], doc: "the operator's judgment that a capture is an intent: an intent in open with its first elaboration in approved (12, 19)"}
    propose-unit:  {args: [bolt, text], doc: "a unit in approved on the bolt (34)"}
    propose-chore: {args: [repository, text], doc: "a chore unit in approved on the repository's shared line (60)"}
    ask:           {args: [repository, text], doc: "an ask record for planning (28)"}
    explore:       {args: [intents, type], doc: "an elaboration in approved covering the selected intents, type with-operator or standing (189)"}
    open-session:  {args: [repository, text], doc: "the operator's own session (69)"}
    init:          {args: [organization, profile, books, state], doc: "`flywheel init`: writes the organization record in absent and the machine does the rest, repeatably (204)"}
    join-host:     {args: [host], doc: "`flywheel host join`: writes the host record in joining; the clones and the layout check follow (205)"}
    create-repository: {args: [name, nodes, document], doc: "a repository proposal with its map nodes and homes, for the operator's yes (206); an elaboration proposes the same through its offer"}
    adopt-repository:  {args: [name, repo, nodes, document], doc: "the same proposal for a repository that already exists on the git host; the yes registers it without creating it (206)"}
    drop:          {args: [object], doc: "undo work (4)"}
    later:         {args: [decision], doc: "defer a proposal a week (172)"}
    hold:          {args: [object], doc: "hold a place or a bolt's close (55)"}
    release:       {args: [object]}
    rename:        {args: [bolt, name], doc: "a bolt's name is never its identity (29)"}
    start:         {args: [service]}
    stop:          {args: [service], doc: "start and stop are the pair 47 grants beyond undo-or-defer"}
    finish:        {args: [elaboration], doc: "a standing session, without waiting for the idle decision (26)"}
    end:           {args: [session], doc: "a with-operator session (25)"}
    close:         {args: [object], doc: "a bolt or an intent whose close is offered (22, 39)"}
    send-back:     {args: [item], doc: "to the stage the type names (41)"}
    retire:        {args: [object], doc: "an item, planning, curation or capture session (4)"}
    takeover:      {args: [host], doc: "a stale host before the 30m bound (150)"}
    revive:        {args: [signal], doc: "clears the move (107)"}
    take:          {args: [line], doc: "order a take now (50)"}
    attach:        {args: [claim, id], doc: "attach a claim to a map id — a context, an element, a relationship or a link; the attachment lives with the claim in its chapter block (97) and scope is computed from the homes of what it attaches to, never chosen (200); the map view sends this from a gesture on an element; for a claim about every element of a kind the tool offers 'all elements of kind K' and sends one attach per element (211)"}
    detach:        {args: [claim, id], doc: "remove one attachment; cells leaving scope read as not-applicable (101, 200, 211)"}
    set-home:      {args: [id, repository], doc: "set an element's or a context's home in the target map; refused when the repository has no manifest entry (199, 211)"}
    map-edit:      {args: [type, id, ref, fields], doc: "add or amend a context, element, relationship or link in the target map; refused without a chapter ref (120) and when the map check fails; a session reaches it only inside a writeback that also writes the chapter (198, 211)"}
    set-status:    {args: [id, status, question], doc: "settled, candidate or open with its question; refused for settled or candidate without a ref (198, 201, 211)"}
    mark-reviewed: {args: [], doc: "record the operator's review mark at the current books revision; the since-last-review overlay diffs from it (122, 211)"}
    add-repository: {args: [name, repo, elements], doc: "the create-repository or adopt-repository proposal by another name: a repository joins when the target map first homes something in it (202, 206, 211)"}
  queries:
    doc: "read-only tools over the rendered maps and the claims index; they write nothing and need no confirmation (193)"
    in-scope-for:  {args: [repository], doc: "the claims whose computed scope reaches the repository, with each one's attachments and the repository's verdict (200)"}
    changed-since: {args: [revision], doc: "the id-keyed difference of the target map from the revision (or the operator's last review mark) to now: added, removed, changed with fields, moved (121, 122)"}
    attachments-of: {args: [id], doc: "the claims attached to a map id, and for a repository the elements and contexts it homes (200)"}
    unhomed:       {args: [], doc: "elements with no effective home in a non-external context, and manifest entries nothing homes (199)"}
    map-check:     {args: [map], doc: "run the schema and vocabulary check on current or target at the books head and report every failure (121, 198)"}
  guard: "a tool that would assert work was done (done, pass, yes on nothing) does not exist; the response machine reports one that arrives anyway as unapplicable (4)"
  identity: "a call from a session's pane carries the identity token start_session issued to that session (sessions.yaml identity:); the tool server matches it against the pane the call came from and refuses a mismatch with a refusal entry on the calling session's thread, so a session can act only in its own job and never on another session (43, 89, 197); a call from the page, the chat or dispatch carries the operator's or dispatch's identity instead"
interpreter:
  doc: |
    Free text is never parsed by the machinery (194). An interpreter resolves
    the names in it against the live objects (list and read through the
    control plane) and proposes exactly one tool call, shown to the operator
    as what will be sent; the operator's confirmation is the response, and
    only the confirmed call is recorded (153). A name that resolves to
    nothing, or to more than one object, is asked about, never guessed.
  chat: "the organization's dispatch agent (tracker.yaml): it reads the message, proposes one call as a reply with a confirm control, and calls the tool on the operator's confirmation; a bare number reply (`yes 412`) needs no interpreter and is the answer tool at once"
  page: "a model running in the page's browser (the page ships it as a script under the same private network; no text leaves the operator's network); a control on the page is a tool call with no interpreter at all, and the capture box sends its text to the capture tool unparsed"
  none: "a control — a button, a board move, a checklist tick, a plannotator annotation — is already one tool call; nothing is interpreted"
evidence:
  sink.due:        {read: "the sink record's routes name the kind or group of a decision whose register entry is newer than the sink's mark; or the sink's cadence (`flywheel.yaml` sinks.<name>.cadence) fired since the mark; or the operator asked (`plan` in chat, a page reload with refresh); a bell sink is due only for the kinds it routes"}
  sink.delivered:  {read: "the sink's mark is newer than every register entry of a decision routed to it, and the sink's last delivery id (a chat message id, the page's build id, the bell's event id) is recorded on the sink"}
effects:
  deliver_plan:    {do: "chat: post one message — one line per numbered decision routed here (`#n kind · object · answers`), the tail since the mark, a link to the page — then put(sink): delivered_at = now, delivery = the message id. page: rebuild the plan page from the register and the objects; every decision shows its number and its answers as controls — the decision card is the one answerable form, and every other kind keeps the form the status view gives it (209): a proposal a document with its unit proposals hanging off it, an intent a thread opening each elaboration's own surface (210), a bolt a ledger, a landed bolt a record, a signal a quote, phase shown by placement; a decision with a document shows the plannotator link that opens it for review, and a rich page opens in lavish; put(sink) the same way. chat keeps the same forms in one line each (18): a decision line is answerable, any other line is not. bell: `herdr surface bell <surface> <text>` with the numbers, then put(sink). No rendering is stored anywhere (15): the page and the chat read the register and the objects"}
