# The operator's surfaces, the same in every profile: the sinks decisions and
# the tail are delivered to (the chat, the page, the multiplexer's bell on a
# named surface), and the review surfaces a decision's document is presented
# on. Not a profile on its own. The response comes back through the state
# profile's `receive` (tracker.yaml, git-only.yaml), which is where the two
# profiles differ.
#
# Tools: the Discord bot through `serenity`; the page through `axum` over
# Tailscale, on the operator's private network, phone-sized; the bell through
# `herdr` on the surface the manifest names; plannotator for a document under
# review (`plannotator review <path> --decision <n>`), lavish for a rich page
# (`npx -y lavish-axi`); both are bindings of the review surface, not parts of
# the machinery. Which host (or the dispatcher) presents a sink is the sink's
# lease, or the manifest's `presenters:` pin (148).
format: flywheel-profile/1
name: surfaces
complete: false
tools:
  doc: |
    The tool surface (193): every operation the operator may invoke is one
    tool with a schema naming its arguments by object id, served by the
    state store (the `flywheel` binary's MCP server and its HTTP twin the
    page calls). The page's controls, the Discord bot, the dispatch agent and
    the machinery's own commands (`flywheel exit|offer|service|ask`) call these
    and nothing else; no caller has an operation the others lack. Each call
    is recorded once as an op-response with `tool` and `proposed_by` (153).
  catalogue:
    answer:        {args: [decision, answer, text], doc: "answer a numbered decision; the deterministic path, `yes 412` or `421: <text>` in chat is this tool (194). `decision` is what the operator names: a decision's number, or a fold's number with a row's letter as one word, `415b`, for one row of a chores fold — the row is that chore's own decision and the letter says which, so no fourth argument carries it (S232, 11); a letter the fold does not hold is refused naming the rows it has"}
    capture:       {args: [text, source], doc: "a capture with one signal of kind ask (19); the map view's one-gesture capture of an open element's question sends this with the question's text and the element as source (201)"}
    propose-unit:  {args: [bolt, text, type, capture], doc: "a unit in approved on the bolt, with the call as its approval (34, 12); a bolt the name gives that does not exist is made first, on the repository the instance tracks; the type defaults to chore; the capture it came from is the unit's document and its text the job (19). The capture's `build now` control is this call naming no bolt — the bolt is made and named from the capture's first words (S217) — and its `add to bolt…` control is this call naming an open bolt the operator picked from the list, the unit named from the same words; either way the capture's signals move `route <unit>` (19a, 116, S224a)"}
    open-intent:   {args: [capture], doc: "an intent in open at once, named from the capture's first words, with the capture's signal attached to it — the operator's gesture is the approval and the dictation skips proposed (12, 19a); the intent's material proposes its first elaboration from the signal (21). The capture's `make an intent` control"}
    attach-signal: {args: [signal, intent], doc: "the signal's move is attach to the open intent the operator picked, and the intent proposes from it (19a, 116). The capture's `attach to…` control, listing the open intents by subject"}
    drop-signal:   {args: [signal], doc: "the signal's move is drop, the call as its reason (19a, 116); `revive` clears it (107). The capture's `drop` control"}
    curate:        {args: [], doc: "run curation now: the curation machine's idle takes it to running and the curator session is charged at once, with the automatic trigger untouched; the signals tray's control and the chat's `/curate` are this one tool (110, 12)"}
    propose-chore: {args: [repository, text], doc: "a chore unit in approved on the repository's shared line (60)"}
    ask:           {args: [repository, text], doc: "an ask record for planning (28), by the operator or by curation routing a signal that argues with no claim (116); a dictation and not a document, so the record holds its words. The id is `<repository>-<n>`, counted per repository and never reused; the call is recorded once as a response whose object is the ask, and the answer names it `ask/<id>` beside the id and the acknowledgement, the name a route move gives it (153). Refused, with nothing written, when the repository is one the instance does not track — naming the tracked ones — or the words are empty. A curation session reaches it as `flywheel ask <repository> <text>` run in its place, the session's command carrying its identity, the one path a session has to any tool (67, 197; sessions.yaml commands.ask); the operator reaches it as the palette's `/ask <repository> <words>` (S228) and, running curation (93b), through the curator's surface, which files a route's ask before the route names it (S229)"}
    explore:       {args: [intents, type], doc: "an elaboration in approved covering the selected intents; the type is any elaboration type the registry holds — with-operator, standing, or a shipped or added type named as a subcommand of the palette's `/elaborate`, `fundamentals` among them (189, 190, 318)"}
    claim-needed:  {args: [unit, answer, intent], doc: "the review view's one answer for a unit that landed citing no claim (317, 34a): `captured` with an intent, open or proposed, attaches the unit's change there as material and the claim is written by the normal path; `declined` stores that nothing there was worth one. Either answer is stored once against the unit, as a not-applicable verdict is stored once against a claim (101), and the unit is never listed again; the unit is not reopened and nothing waits on the answer. Under `fw.capture.write`; calls `record_claim_answer`"}
    open-session:  {args: [repository, text], doc: "the operator's own session (69)"}
    init:          {args: [instance, profile, blueprints, state], doc: "`flywheel init`: writes the instance record in absent and the machine does the rest, repeatably (204)"}
    join-host:     {args: [host], doc: "`flywheel host join`: writes the host record in joining; the clones and the layout check follow (205)"}
    create-repository: {args: [name, nodes, document], doc: "a repository proposal with its map nodes and homes, for the operator's yes (206); an elaboration proposes the same through its offer"}
    adopt-repository:  {args: [name, repo, nodes, document], doc: "the same proposal for a repository that already exists on the git host; the yes registers it without creating it (206)"}
    drop:          {args: [object], doc: "undo work (4)"}
    later:         {args: [decision], doc: "defer a proposal a week (172)"}
    hold:          {args: [object], doc: "hold a place or a bolt's close (55)"}
    release:       {args: [object]}
    rename:        {args: [bolt, name], doc: "a bolt's name is never its identity (29)"}
    start:         {args: [service]}
    stop:          {args: [service], doc: "start and stop are the pair 47 grants beyond undo-or-defer"}
    finish:        {args: [elaboration], doc: "a standing session, without waiting for the idle decision (26)"}
    end:           {args: [session], doc: "a with-operator session (25)"}
    close:         {args: [object], doc: "a bolt or an intent whose close is offered (22, 39)"}
    send-back:     {args: [item], doc: "to the stage the type names (41)"}
    retire:        {args: [object], doc: "an item, planning, curation or capture session (4)"}
    takeover:      {args: [host], doc: "a stale host before the 30m bound (150)"}
    revive:        {args: [signal], doc: "clears the move (107)"}
    take:          {args: [line], doc: "order a take now (50)"}
    attach:        {args: [claim, id], doc: "attach a claim to a map id — a context, an element, a relationship or a link; the attachment lives with the claim in its chapter block (97) and scope is computed from the homes of what it attaches to, never chosen (200); the map view sends this from a gesture on an element; for a claim about every element of a kind the tool offers 'all elements of kind K' and sends one attach per element (211)"}
    detach:        {args: [claim, id], doc: "remove one attachment; cells leaving scope read as not-applicable (101, 200, 211)"}
    set-home:      {args: [id, repository], doc: "set an element's or a context's home in the target map; refused when the repository has no manifest entry (199, 211)"}
    map-edit:      {args: [type, id, ref, fields], doc: "add or amend a context, element, relationship or link in the target map; refused without a chapter ref (120) and when the map check fails; a session reaches it only inside a writeback that also writes the chapter (198, 211)"}
    set-status:    {args: [id, status, question], doc: "settled, candidate or open with its question; refused for settled or candidate without a ref (198, 201, 211)"}
    mark-reviewed: {args: [], doc: "record the operator's review mark at the current blueprints revision; the since-last-review overlay diffs from it (122, 211)"}
    add-repository: {args: [name, repo, elements], doc: "the create-repository or adopt-repository proposal by another name: a repository joins when the target map first homes something in it (202, 206, 211)"}
    switch-instance: {args: [instance], doc: "the page shows one instance at a time; this picks which, among those the host has a root for, listed by the account that holds them (218, 219, 233); nothing is written. Rendered \"Switch flywheel\": the operator's word for an instance is flywheel on every visible surface (S206)"}
    configure-instance: {args: [instance, fields], doc: "the manifest as a form: one response per save, validated as `flywheel.yaml` is, one commit on the blueprints' shared line (233). Rendered \"Configure flywheel\" (S206)"}
    sign-out:      {args: [], doc: "ends the page's session with the identity provider (233)"}
    invite-member: {args: [instance, email], doc: "invite a user to the account (255); under fw.identity.admin; hosted tiers only — on a self-managed host the operators list on the settings form is the administration"}
    assign-application: {args: [instance, user], doc: "grant the flywheel Application to a user on the account — membership (247, 255)"}
    revoke-application: {args: [instance, user], doc: "revoke it; the member's sinks go with the assignment (236a, 255)"}
    set-role:      {args: [instance, user, role], doc: "set a user's role on the account, from the shipped roles (248, 255)"}
    target-flag:   {args: [instance, flag, on], doc: "target a feature flag on the account, per account only (250, 255)"}
    assign:        {args: [decision, owner], doc: "set a decision's owner to one member of the instance, or to nobody; a role is never an owner. The rail machine applies it and nothing about the decision changes but who it is filtered to (237)"}
    filter:        {args: [sink, filter], doc: "own | all: whether the member's own sink delivers only the decisions they own (237); nothing is written but the sink record"}
    remove-instance: {args: [instance], doc: "the instance's removal by response (221): sessions ended, places removed, state archived, git repositories left on disk. Rendered \"Remove flywheel\" (S206)"}
    add-package:   {args: [package, scope, host, config, secrets], doc: "the setup surface's add flow: the index entry, the configuration collected against the package's schema, the names of its secrets, all in one call; writes the package in added, whose install decision is the one thing that enters the count (228, 229)"}
    configure-package: {args: [package, fields], doc: "change an installed package's configuration; one response (229)"}
    disable-package: {args: [package], doc: "stop what the package runs and keep its files (229)"}
    enable-package: {args: [package], doc: "start it again; the install effect finds the files (229)"}
    remove-package: {args: [package], doc: "end what the package runs and remove its files; records stay (229)"}
    add-host:      {args: [name, platform, parts, adopt], doc: "provision a host on the platform with the operator's own platform credentials carried in this call and stored nowhere, or adopt one already running the binary; writes the host record in enrolment proposed, whose yes places the parts' secrets and issues the one-time token (230). What the flow offers as a platform depends on the host serving it (295, host.yaml tier.add_offers): a self-managed host offers only hosts the operator controls and one line to move to the hosted service (247a), a hosted host offers the managed platforms beside them, each gated by the plan — the cloud agent from Hobby, a pool from Pro, dedicated compute on Enterprise (279–282)"}
    repair:        {args: [host], doc: "run the repair the host's disk decision showed (222)"}
  queries:
    doc: "read-only tools over the rendered maps, the standing specifications and the objects; they write nothing, record nothing and need no confirmation (193). Listed beside the catalogue's tools in every enumeration — in-process, the HTTP twin and the protocol's listing — after them. The host's agent answers with these on its own (194). Granted to the sessions the machinery charges, to the operator's own session and to the host's agent; a construction session's inputs are closed and it gets none (89, context.yaml ruling 24). The first four are the page's own views, each named for the view it returns, the tools whose result is a view (322, S230, member_client.views)"
    rail:          {args: [], doc: "the decisions standing now, each with its number and the answers it takes; `answer` answers one (15, 311, 322). Draws the page's rail"}
    board:         {args: [], doc: "the board: every object in its phase, grouped by what it is waiting on (209, 322, S10). Draws the board's header and its four lanes"}
    status:        {args: [], doc: "the status view: every host and whether it is heard from, and every object grouped by state with its holder, its runner and their liveness, as of the last commit (141, 143, 322). Draws the hosts strip with the board's header and lanes"}
    object:        {args: [object], doc: "one object's detail: what it is doing, the decision standing on it and its answers (209, 308, 322). Draws that object's dock surface, opened; refused, as the view is, when the instance holds no object by that id"}
    in-scope-for:  {args: [repository], doc: "the claims whose computed scope reaches the repository, with each one's attachments and the repository's verdict (200)"}
    changed-since: {args: [revision], doc: "the id-keyed difference of the target map from the revision (or the operator's last review mark) to now: added, removed, changed with fields, moved (121, 122)"}
    attachments-of: {args: [id], doc: "the claims attached to a map id, and for a repository the elements and contexts it homes (200)"}
    unhomed:       {args: [], doc: "elements with no effective home in a non-external context, and manifest entries nothing homes (199)"}
    map-check:     {args: [map], doc: "run the schema and vocabulary check on current or target at the blueprints head and report every failure (121, 198)"}
  guard: "a tool that would assert work was done (done, pass, yes on nothing) does not exist; the response machine reports one that arrives anyway as unapplicable (4)"
  identity: "a call from a session's pane carries the identity token start_session issued to that session (sessions.yaml identity:); the tool server matches it against the pane the call came from and refuses a mismatch with a refusal entry on the calling session's thread, so a session can act only in its own job and never on another session (43, 89, 197); a call from the page, the chat or dispatch carries the operator's or dispatch's identity instead; a call from the operator's own session (69) carries that session's token and is recorded given_by the operator, proposed_by the session (context.yaml ruling 14). Authorization (233, 249), by the host's identity kind (identity.yaml kinds): on a github host the tool server checks the signed-in GitHub username against the instance's manifest `operators:`, every listed operator holding every permission; on a frontegg host it verifies the caller's token and checks it for the permission the tool declares (identity.yaml permissions.by_tool) on the account, refusing a user not assigned the Application there (247) and a tool whose permission the host's environment lacks (252). Either way a refused call writes no response and is recorded in the run record with the identity, the tool and the object (79), shown under attention on the next delivery; the query tools are answered to any member (github) or any token carrying fw.read (frontegg). The tool server at the host's address is a remote server of the model context protocol (193, 293): its clients are the page, the chat application, the interpreter, the sessions the machinery starts over stdio or in-process, and a member's own client such as a coding agent on their machine. Every client is checked by the two rules above, membership admitting the identity and the tool's declared permission authorizing the call (248, 249); the authority a client signs in against is the host's identity kind, a Frontegg token on a hosted host and what the device flow issued on a self-managed one, so a member adds a self-managed host at its localhost address (245) as readily as a hosted one at its served name (291). The catalogue a client is shown is this list filtered by that caller's permissions, so a tool the caller may not invoke is not offered, and a call from any client is a response recorded with who gave it and when (153)"
host_agent:
  doc: |
    Free text is never parsed by the machinery (194). The host's agent
    serves the operator's free text on a surface: it reads and answers with
    the query tools on its own, and every write it makes is a proposed tool
    call the operator confirms. Its interpreter — the function that turns
    text into a proposed call — resolves the names against the live objects
    (list and read through the state store) and proposes the call, shown
    to the operator as what will be sent; the operator's confirmation is
    the response, and only the confirmed call is recorded (153). A message
    that asks for several things yields several proposed calls, one card
    each, each confirmed and recorded on its own. A name that resolves to
    nothing, or to more than one object, is asked about, never guessed. The
    agent is a session of A.7 charged per message, run inproc (217c). It
    holds nothing between messages and remembers by reading: its closed
    input carries a bounded window of the sink's own thread — the messages
    since the operator's last answered decision, or a stated count,
    whichever is smaller — so a follow-up is understood, two hosts answer
    alike, and a restart loses nothing (217a, 217b, 217n). A name the
    window does not resolve is asked about, never guessed (194).
  capabilities: "a sink declares what its platform can do — buttons, menus, threads, reactions, edits, notifications — and the rendering is written against the declaration, never against a platform's name (155a); what is not declared is not used and the numbered grammar carries the rest. Where threads are declared an object is a thread: the decision is its first message with its controls, discussion about that object goes in the thread and needs no number, and a reply there is free text like any other — answered from the thread, and written only as a proposed call the operator confirms (155b, 144, 194)"
  chat: "the instance's dispatch agent (tracker.yaml, 216): it reads the message, answers a question from the query tools in a reply, proposes each write as a card with a confirm control, and calls the tool on the operator's confirmation; a bare number reply (`yes 412`) needs no interpreter and is the answer tool at once"
  page: "none. No model runs in the page (216a): a control and a command are tool calls with no interpreter at all, plain text is a capture sent verbatim, and the page answers no question — a question is asked on a surface that holds a conversation, which renders the same views (194a, 293a). Formerly a model in the browser; retired 2026-09-10. A control on the page is a tool call with no interpreter at all, and the palette sends plain text to the capture tool unparsed (19, 193a)"
  none: "a control — a button, a board move, a checklist tick, a plannotator annotation — is already one tool call; nothing is interpreted"
palette:
  doc: |
    The page's one typed input, over the catalogue above filtered by the
    caller's permissions, which is itself an operator surface a client may
    render as a list (193a, 293): one field, one grammar, and no command
    the catalogue lacks. It is the grammar the chat carries and not a
    second one, and no other field on the page parses a word (19, 194).
  grammar: "plain text is a capture sent unparsed and never read by a model (19, 216a); a capture becomes work by the `propose-unit` control on the capture itself, an intent by `open-intent`, evidence on an intent by `attach-signal`, never by a word in the text and never by a decision on the rail (34, 12, 19a); a leading `/` names a command of the catalogue and resolves to that one tool call with its arguments named by object id (193); a bare number is the reply grammar, which is the answer tool and needs no interpreter (194): `412` lists that card's answers with the line each control carries, `412 yes` presses the card's own control, `412: <text>` sends the text as the answer, an answer that takes words fills in `412: redo: ` for the operator to finish, and a number naming nothing on the rail says so and offers `/capture` to keep it as a note (S228)"
  opened_by: "⌘K, Ctrl+K or `/` from anywhere on the page, and a capture control on both tabs of the phone raising it as a bottom sheet with the platform's own keyboard (112, 311, S30, S38); Esc closes it ahead of everything else"
  at_rest: "the field with its preview line saying what will be sent, and under it the last things sent, read from the sent log the header carries and never from client state (310)"
  commands: "the catalogue filtered by the caller's permissions, fuzzy-matched, each row naming the command, what it does in the operator's words and the object it will act on; a tool the caller may not invoke is not offered and a feature a plan hides takes its command with it, named by the plan's own name and never by a rung (293, 249, 250, 280); the commands offered are answer, capture, drop, later, hold, release, rename, close, finish, end, retire, revive, take, takeover and ask, each the catalogue tool of its own name, its typed words its argument sent as typed, and a command that acts on an object taking the one in hand — the object the dock has open, else the decision the rail holds — or an id typed after it; `ask` takes the repository as its first word and the rest as the words, the repository typed first because nothing in hand names one (28); curate, propose-unit, open-session, start, stop and remove-instance are reached by their own controls, since the palette cannot seed them as one call (S228)"
  accelerator: "the palette carries no operation that no control also carries: the rail's buttons and every dock control are unchanged, and the palette reaches them rather than replacing them (311, 306)"
  writes: "capture, propose-unit, open-intent, attach-signal, drop-signal and curate are under `fw.capture.write`, so a caller without it sees the field read-only with its send refused and the command list filtered (249, S30); every send is one call recorded once with who gave it and when (153)"
budget:
  doc: |
    The page's budget (310a, S235): what a load ships, what an update
    carries, and the numbers a test holds. The page renders the first view
    and nothing more; every dock page and every list past its first page
    is a fetch of its own; an update is the changed regions since a
    generation; every response is compressed. What the page costs grows
    with what is on screen, never with the instance.
  first_paint: "1.0 s to first contentful paint and 1.5 s until the rail's first card takes a press, on a mid-range phone (a 4× CPU slowdown in the headless browser) over an ordinary mobile connection (5 Mbps down, 1 Mbps up, 150 ms round trip), measured from the request to `/<instance>/` with an empty cache"
  load_bytes: "200 KB on the wire for a load with nothing cached and 60 KB with the bundle's fonts, style and script cached — the sum of every response the first view needs, as the browser received them, compressed; the first view's HTML — the document the host renders for the load, the bundle's style and script fetched beside it and not in it — at most 100 KB before compression"
  bundle: "the style, the script and the two fonts are the bundle's, the same bytes for every load and every instance: each is served at the host's own address under a name carrying the binary's version, cached for a year, and nothing is fetched from anywhere but the host (310, 291); the page's document names them and carries neither. The copy a member's client renders (tools.views, S230) carries the same style and script inline, since its frame fetches nothing and reaches the host through the client alone (293a), and a test holds the inline text to the served files' bytes. The style and the script are the mockup's taken whole (D16, S235): a rule the page does not write yet is a surface still to build, neither is trimmed by hand or by a pass over what the page writes, a rule the design has no surface for leaves the mockup first, and their size is bound by first_paint and load_bytes alone"
  update_bytes: "8 KB on the wire for the update one move, one answer or one capture causes: the page's fetch of what changed since its generation, never a second load of the page"
  growth: "measured twice, on a scratch instance seeded with the round's counts (signals, intents, captures, facts) and at ten times each; first paint and load bytes at the larger size are within a tenth of the smaller, and an update's bytes are the same"
  paging: "a list shows 50 rows, the count and a `more` that fetches the next 50 (S235); a dock page is fetched when opened; the rail is never paged"
  compression: "every response is served compressed with the best encoding the request accepts (br, then gzip), the fonts excepted since woff2 is already; the fonts, the style and the script are cached for a year under a name carrying the binary's version (291)"
  busy: "the page is answered whatever the host is doing (310a, S235): while the host's pass holds the store, a page read, a dock page's fetch, an update and a query — a member's client's view among them (member_client.views) — are answered from the instance as it was last read, within first_paint's press bound; a session's deliverable is opened from its repository's shared line as the line stands, the page reading the file for itself with no turn at the store or the host's world (190, 213), the file found among what the last read says was delivered; and a call that writes is kept beside the state checkout, outside what it tracks, answered at once as sent with `kept: true` and the delivery it will be recorded as, and made first on the host's next pass under that delivery, so a pass that makes it twice records it once (137, 153); the page's control says 'sent · it shows here once the host is free' and stays spent until the update that follows draws it again; the read that follows a pass is made once its moves settle and every open page hears of it as one update (S221). Held by a test that holds a pass on a curator's delivery and asserts the page, a member's client's view, a session's deliverable and a capture's post answer within the bound, the capture recorded once when the pass ends"
  how_measured: "a headless browser (the Chromium the conformance tests already drive) with the throttling above records first contentful paint, the time to the first press taken, and every response's size from the resource timing of the page; the test seeds the two instance sizes with the scenario tool (95), loads `/<instance>/`, opens one dock page and the tray, answers one decision, and fails on any number over budget; it runs in the build's tests beside the client-view test"
viewer:
  doc: |
    The instance's book, served beside the page as a standalone read-only
    server and never a view of the board (315). It renders the blueprints'
    shared line as mdBook: the chapter tree, one chapter at a time with
    previous and next, headings with anchors, and each claim rendered
    where its chapter includes it by anchor from the standing
    specifications, with its name, version, scenarios, attachments,
    derived scope and one verdict dot per repository in scope (97, 100,
    200).
  in_flight: "what is in flight — an intent's proposed claims, a chapter an elaboration has not landed — is not in it, so the viewer is always the standing destination and the page is where changes to it are answered (315, 98, 187)"
  links_out: "every dock page's 'read in book' per cited chapter or claim, and the map's scope box, open the viewer at that anchor in a place of its own; the dock stays as it was and no chapter is embedded (315, S94)"
  links_back: "every chapter and every rendered claim links to the object on the page, at the host's address with the instance in the path — the chapter's intent, the claim's decisions and evidence — and a link to a host that is away says so rather than failing silently (315, 205a, 308, 150a, away)"
  readers: "the host's: on a self-managed host the private network is the boundary and the sign-in is the device flow of 253 with 253a's exception, nothing reaching beyond that network unless the operator says so (316, 155, 191, 46); on a hosted tier it is served at the tier's name under the caller's token like every other request and reads to members of that instance alone (316, 247, 249, 291)"
  public_opt_in: "serving a book to readers who are not members is a separate, explicit act: one opt-in per book, stated on the settings form as what it is — 'anyone with the link can read this book' — revocable there, and a stated fact of the tier (316, 261, account.settings)"
  flag: "`fw.ff.book-view` gates the viewer and the links to it, on by default; with the flag off no dock page carries 'read in book' (250, identity.yaml flags)"
  fundamentals_part: "the book's first part renders like any other: the clauses as the numbered prose they are, and where a clause is followed by a claim included by anchor, that claim rendered in place from the standing specifications with its version, scenarios, attachments, scope and verdict dots, exactly as a chapter's claim is (318, 97, S92). Most clauses carry none, and the viewer shows the clause alone rather than an empty block; a claim's prose may say which clause it serves, which is text for the reader and is never read by the machinery"
review:
  doc: |
    The book and the context map are the operator's review surface (122).
    The review view is what changed in both since the `reviewed` mark: the
    map's overlay on the page, the book's changed chapters and claims in
    the viewer, one mark and one "mark reviewed" for both.
  unclaimed_units: "beneath them, the units that landed since the mark citing no claim (34a), as one list under one question: is anything here worth a claim. The list is derived like everything else on this surface — landed units whose claims are empty and whose claim_answer is none — and is never stored. Per unit, the answer is one `claim-needed` call: yes names an intent, open or proposed, and attaches the unit's change there as material, where a claim is written by the normal path (23, 97); no is stored against the unit and it is never listed again (101, 317). Every unit in the list has already landed, so nothing waits on the answer and the mark moves whether or not any was given. It is here and not on the rail on purpose: a decision per landed chore would teach the operator to answer no without reading, which is how a claim that mattered gets lost"
instances:
  doc: "the page serves one instance at a time and switches with `switch-instance` (218); each instance has its own sinks and presenters, its own register and its own state; nothing on a surface names two"
phone:
  doc: |
    The phone is a requirement and not a variant (306-314). Every decision
    is answerable there and every control and every form the page carries
    is available there; nothing the page offers is reachable only on a
    desktop and nothing the phone answers is missing on the desktop (306,
    2, 155, S39). It is the same served bundle under 760px and never a
    second application: two tabs, Decisions and Board, with the dock full
    screen and a back control, the desktop's metaphor at a smaller size
    (307, S38, S60). One bundle is built and its version is the binary's
    (291).
  links: "every chat rendering, every notification and every rail line carries a link to the object on the page at the host's address with the instance in the path (308, 205a); the link opens that object in the dock with its answer controls in reach, and works whether the page is served on a localhost port of the operator's own computer, over their private network, or at a hosted served name (245, 291); a link to a host that is away says so rather than failing silently (150a, away)"
  notification: "a decision raised reaches the operator's phone through the chat sink's own notification, with the answer controls the platform provides and the link above (309, 155); the page pushes nothing of its own on any tier, and the short reply grammar always works beside the controls (194)"
  one_request: "the status view renders from one request, which on a hosted tier is the page projection and its one decrypt (310, 291); the page holds no client state a reload loses, so a reload after an answer shows the answer recorded with who gave it and when (153, 154); the bundle carries no dependency the phone must fetch from anywhere else"
  touch: "every answer is one tap or one short reply; nothing is reachable only by hover or by a keyboard, and anything a hover reveals on the desktop is reachable by tap (311, S61); a long-form answer, a proposal edit for one unit among several, is given on the phone with the platform's own keyboard. On the phone every control that gives a decision's answer is at least 44px on a side, shown, on screen and behind no hover; at the desktop's viewport a mouse is the input and the controls keep the mockup's size, so the pass of 314 asks the 44px at 390px alone (S237)"
  header: "under 760px the header is one row that nothing runs past at 390px, keeping the instance with its as-of time (145), `yes all` as the word alone while an approve decision waits (S2), the sent count that opens the log and the account chip (S152); it drops the title, the key hints, the `yes all` numbers, the count of decisions (the Decisions tab's badge carries it) and the capture box (the tabs' capture control raises the palette sheet, S38, S211); the theme control moves into the account menu, last before sign-out, so every desktop header control is reached on the phone (306, S236). The dock's head and the tray's rows run past no edge at 390px either, text cut at its end (S215, 314)"
  console: "the management console renders on a phone with its tables as cards, and the managed add-host journeys complete there, the cloud agent with its presets among them (312, 283, 295, hosts_surface.add_offers), which is what Hobby promises an operator with no computer of their own to run (281); a journey that needs a computer of the operator's says so on its card rather than failing part way through"
  clients: "the tool server's clients include the Claude mobile app and voice through it, under the same membership and permission checks as every other client (313, 248, 249, 293, tools.identity)"
member_client:
  doc: |
    A member works the flywheel from the client they already talk to: any
    client of the model context protocol added at a host's address with the
    instance in the path, holding the whole catalogue that caller may invoke
    (A.40, 319, 193, 205a, 293). The flywheel ships no client and no
    conversation of its own (194a).
  address: "the protocol is answered at the address the page is served at, with the instance in the path — one message a request, posted to `/<instance>` at the host's address, with no session to hold (205a, 291, 319); the host opens no stream to a client and pushes it nothing, and a client that asks for a stream alone is told the host offers none, so what a client knows it asked for (310, 325); a message naming another instance is refused with the one this host serves (205a); the host answers in the protocol version the client asks for among those it speaks, and in its newest otherwise, the client deciding for itself whether to go on"
  added_by: "one address and one sign-in, and no secret of the flywheel's: the host states the address and the authority to sign in against — its own address under the device flow on a self-managed host, its served name under the account's token on a hosted tier (320, 243, 244, 247, 253); the statement is printed at start beside the page's address, once per address the host listens on, as `client at <address> · <authority>`. In phase 1 the authority is 253a's exception: while the operators list holds one entry the host says so, names the entry and that every call is given by it, and serves the client with no sign-in; with more than one entry it says no client is served until the device flow is built (253). No credential of a member's client is written to the state store, the manifest, a record or the page (204, 207)"
  calls: "a response like any other: admitted by membership, authorized by the permission the tool declares, recorded once with who gave it and when, and a refusal written to the run record with the identity, the tool and the object (321, 79, 137, 153, 248, 249). The delivery on the record is `client`; a call may name its own delivery under the protocol's `_meta` (`flywheel/delivery`: letters, digits, `.`, `_` and `-`, at most 64, never a bare number), and the response is recorded under that name, so the same call delivered twice is one response (137, 323; git-only.yaml responses); a call naming none is counted. A refusal is one run-record entry of kind `refusal` naming the identity, the operation, the object the call named — a decision by its number, `none named` when nothing was — and delivery `client`, whether the catalogue refused the call, the view was refused (no such object) or the door refused the caller, whose identity is then `unsigned-in` (79, 253a); a refusal answers the call as the tool's own error with its reason and the version, never as a fault of the wire, and records no response"
  views: "the page's own — the rail, the board, the status view, one object's detail — each the result of the read-only tool of its name (tools.queries `rail`, `board`, `status`, `object`) and each a user-interface resource of the tool server carrying the same bundle the host serves, versioned with the binary (322, 326, 293a, 307). A view's result is the regions it draws, keyed by the id each element has on the page — the rail; the board's header and four lanes; for status the hosts strip with them (141); for object that object's dock surface, opened — with the version it was rendered under, the view's name and, for object, the object's id; and the same view in words beside them, the decisions with their numbers and answers, so a client that renders none of the views reads it and still holds every tool, every decision answerable as a call (311)"
  wire: "the user-interface extension of the model context protocol (S230): a tool whose result is a view names the view's resource on its declaration (`_meta.ui.resourceUri`), never on its result; the address is `ui://flywheel/<version>/<rail|board|status|object>`, read under the caller's token as the bundle with media type `text/html;profile=mcp-app`, all four addresses the one bundle, the region and its state what the tool returned; an address under any other version is refused naming the addresses served; every result carries the version it was rendered under, a newer binary names newer addresses, and a view of another version than its result empties every region and shows that it is out of date and nothing of the state (326); no external origin declared and no sandbox permission asked (307, 310, 204); the four views listed among the server's resources. The bundle a client reads is the page's template with nothing of the state drawn, marked as served as a view rather than as the page, and the page the host serves is the same template filled (293a): inside a client only the view's own regions show — the header, tabs, log and palette do not — at the frame's width, and the view tells the client the height it needs each time it changes; a tap is a `tools/call` through the client on the tool and object the page's form would post (323, 137)"
  taps: "what the operator taps inside a rendered view is a tool call through their own client, checked by the same rules and taking effect once however often it is delivered (323, 137): the control goes busy at once and is sent as the call its form names — a tool's own route names the tool, the curator's surface is `curate`, and `yes all` is one `answer` per number it names, in order, never a batch (193, S7) — each tap one delivery named once (calls); when the calls are made the view asks the client for itself again and redraws from what the flywheel holds, and a refusal shows as a toast on the view with the reason (S30). A link to an object inside a view opens that object's view through the client, the `object` tool on that id, in the frame the view has (308); a link out of the flywheel — the book, a pull request — is handed to the client to open as its own (315, S94). A control the page has that no tool carries says so and points to the flywheel at its address"
  conversation: "the client's own: the flywheel keeps no transcript of it and derives no state from it, and only the calls it is asked to make are its own (324, 136, 194a); which model provider the client uses is the member's arrangement (261)"
  not_a_host: "it presents no sink, takes no lease, runs no tick and carries no work; it is a caller, and losing it loses nothing (325, 148, 149, 231, 217f)"
  conformance: "every scenario of the requirements' section 11 that carries an operator's response runs at a 390px viewport as well as at the desktop's, and the mockups render at 390px (314)"
account:
  doc: |
    The page carries one account item (233): who the operator is and how
    they signed in; the instance shown, with a switch to any other the
    host has a root for (218); and from it the instance's settings —
    its manifest as a form, one response per save (`configure-instance`),
    the operators list among its fields (authored whole on a self-managed
    host; identities read-only and addresses authored on a hosted tier)
    — its hosts with their parts (229), the instance's package store apart
    from any host's (228, the setup surface's instance column), on a
    hosted tier the members with their roles and the identity tools
    (255), and sign-out. Authentication is the host's identity kind and
    authorization the instance's: the identity — the GitHub username
    on a github host, the Frontegg user on a frontegg host — does not
    change when the instance is switched; whether it may respond is
    the operators list, or the Application's assignment and the token's
    permission on a hosted tier (247, 249).
  local: "a page served on the operator's own computer, on a localhost port of the host's choosing with no proxy and no name (245), signs in through the host's kind like any other — on a self-managed host GitHub's device flow, showing the code and the address to enter it at and waiting until GitHub confirms (253); the instance's creating user is the first operators entry, so a fresh instance is not locked out; there is no local-user case and no unauthenticated page. One exception: while the operators list holds a single entry, a self-managed host on the operator's private network may serve the page with no sign-in, that entry being the identity every response records as given_by (153, 236a) and the network the boundary (155); the host refuses to serve unsigned-in as soon as a second operator is listed or the page is reached at any address but that network's, and the exception closes when the account item exists (253a, 233)"
  served: "the identity block names the identity the host's kind vouched for — the GitHub username on a github host; on a frontegg host the Frontegg user with the GitHub connection's username used for authorship (246) — the host serving the page and its kind, the same for every instance the host serves; every response the page records carries it as given_by (153); sign-out ends the page's session with the kind and records nothing"
  switcher: "lists every instance the host has a root for, each at the host's one address under `/<instance>/` (205a); one the signed-in identity is not a member of — not in its operators list, or on a hosted tier not assigned the Application on its account — is shown as not a member, its name and nothing else, and switching to it shows the status view read-only with every control absent"
  settings_form: "the manifest as a form, the keys 233 assigns to the instance (205a): instance name, profile, blueprints and state repositories, repositories with their git details, pools with bound, cost and retire time (240), sinks, curation, `operators:` with each member's addresses (236a) — authored whole on a self-managed host, identities read-only and addresses authored on a hosted tier, where the roles show read-only with the identity tools beside them (247, 248); the host's keys — root, bound, declaration, provider, identity kind, router — shown read-only with a link to the host's own screen; one save is one `configure-instance` response, validated as `flywheel.yaml` is; a save that would remove the saving identity from an authored list is refused"
  degraded: "on a hosted host, when the provider is unreachable (254): an issued token is honoured until it expires, then the page is read-only — status view, book, map, the rail's decisions — with every writing control absent and one attention line saying identity is unreachable and since when; unbounded; the loops run on. A self-managed host has no provider to lose"
members:
  doc: |
    One board per instance (235): every member reads the one rail from
    the one register — the same numbers, the same count. A decision
    answered by one member is applied once (7); the register keeps the
    retracted entry with the response's given_by and given_at, so every
    other member's page and chat show it as answered, by whom and when
    (153), and the tool server refuses a second response to that number as
    already answered before any response is written. Sinks are per member
    (236): the page sink exists once per member in `operators:`, keyed by
    the signed-in identity, and a chat sink once per member per chat
    address the entry carries (236a: `discord: <user id>`, `slack:
    <member id>`), a direct message from that kind's bot, presented by
    whichever host runs the kind's package and holds the sink's lease —
    each with its own mark, so the tail since the last look, the attention
    acknowledgements and the notifications are that member's; a member
    with no address has a page sink only; a shared channel is a sink of
    its own with one mark, listed in `flywheel.yaml` sinks: with no member.
    A member is an entry in the operators list on a self-managed host, or
    a user assigned the Application on the account on a
    hosted tier (247); the page sink follows the membership and a chat
    sink each address on the member's entry, created and removed in the
    same write; the numbers and the count are never per member.
  owner: |
    A decision may carry an owner (237): the object's record `owner`, a
    member or, on a hosted tier, a role the token carries (248). Planning's proposal names it per unit
    when it can, a unit or elaboration type may name a role for its
    decisions, and `assign <owner>` on the decision's number sets it (the
    rail machine's transition). An unowned decision is everyone's. A
    member's page rail and chat filter to their own with `filter own`,
    the count staying the instance's; ownership changes nothing about
    what a decision is, whether it counts, or who may answer it.
away:
  doc: "an intermittent host past its stale window shows as away with since-when on the status view and the hosts surface (150a) — no attention line, its leases standing, its sessions shown as they were last reported with their clocks paused; the takeover decision appears only when a decision or approved work waits on it, or at the long bound, and its next heartbeat clears everything"
hosts_surface:
  add_offers: "the `+ host` flow's platform choices are the host's identity kind and the plan together (295, host.yaml tier.add_offers): a `github` host offers another computer of the operator's, a virtual machine on their own network, a container on a platform of their own, and adopt-existing, with one line to move the instance to the hosted service in place of the managed options; a `frontegg` host offers those and the managed ones beside them, each shown only where its flag is on (250, 280)"
  doc: "the hosts surface (229, 230) also shows each pool — its platform, bound, live hosts and image, and whether the image is behind the declarations (239) — with pool hosts listed under it (240); a host's environment provider and the host-environment decision when it cannot satisfy a repository (238); adding a pool host is never the operator's, retiring never asked"
  stores: "the instance's package store (its packages under the blueprints' prefix) and a host's package store (its per-host packages) are separate surfaces, reached from the account item and from the host respectively; neither lists the other's"
artifact_views:
  doc: |
    Every object opens the OpenSpec artifacts behind it, in a view fit to
    the artifact (213). Each view is read from the repositories at the
    shared line — the blueprints for an intent or a claim, the built repository
    for a unit, a bolt or a work item — at the as-of point the status view
    names, and is never stored; an edit goes through the review surface
    (17), never through the view.
  intent: "`openspec/changes/<intent>/`: the proposal, the records each elaboration left (187), the spec deltas, the design, and whether the change is archived (`openspec/changes/archive/<date>-<intent>/`)"
  unit: "`openspec/changes/<unit>/` in the built repository: the steps ff · apply · verify · archive set against the type's stages (the archive being the item's merge-time effect), the requirement blocks of its spec, and its tasks each with the item and the commit that did it (185)"
  claim: "the requirement block in the blueprints' standing specifications (`openspec/specs/<capability>/spec.md`) with its scenarios, its name and its version, the chapter that includes it by anchor, every version from history (`git log` over the spec file), its attachments — the capability directory and the requirement's `Attaches:` line (105, 200) — and for each verdict of it in the ledger the evidence cited (97, 100)"
  bolt: "`openspec/acceptance.yaml` at the line's head (192): the claims with scenarios and each unit's estimate and actual (172)"
  work_item: "its commits on the place's branch or, after the merge, the squash commit naming it (185); its deliverables, expected beside delivered (80); its report"
instrument:
  doc: |
    The flywheel instrument (214), a projection render_status writes from
    the same read as the status view and the page shows compact at rest,
    whole when opened. It sets no target; the unattended streak is the
    only thing the operator plays for. Every number below is derived from
    list and read at the as-of point and nothing is stored.
  runway: "days = the sum of estimates (172) over units approved, waiting or in flight, less the slot-days their sessions have already occupied, divided by the drain"
  drain: "slot-days per day = the sum of alive hosts' bounds (host.bound over hosts alive, pool hosts included), multiplied by the calibration — the ratio of actual to estimate over the landed units of the repository and type, from the acceptance files, 1 when none has landed yet; no constant. A pool host added or retired (242) moves it, and the instrument shows the change as drain changing, with the pool's live count beside it"
  feed: "what would add runway and waits on the operator: proposals in proposed, elaborations in proposed, intents in proposed, with their numbers"
  pressure: "the units approved and waiting for a slot against the sum of alive hosts' bounds; the construction backpressure stage"
  stages: "inception — the feed, what waits on the operator; construction — the queue against the bound; shown as two stages, one number each"
  streak: "how long approved work has run with no op-response from the operator: from the newest response's given_at to now while any unit is in flight; at risk — the first thing that would stop it, the item nearest its retry bound, the block awaiting an answer, the queue running dry within the runway; ended the last — the response that ended the previous streak, with its decision"
  reading: "one sentence from the counts, in this order: `drain is the limit` when pressure is at or over the bound; `you are the limit` when the feed is not empty and runway is under one day; `feed it` when the feed is empty and runway is under one day; `primed` otherwise"
  velocity: "history: slot-days landed per week from the acceptance files, and the streaks with what ended each"
  at_rest: "on the status view: runway in days, the reading sentence, the streak; opened: everything above"
evidence:
  sink.due:        {read: "the sink record's routes name the kind or group of a decision whose register entry is newer than the sink's mark; or the sink's cadence (`flywheel.yaml` sinks.<name>.cadence) fired since the mark; or the operator asked (`rail` in chat, a page reload with refresh); a bell sink is due only for the kinds it routes"}
  sink.delivered:  {read: "the sink's mark is newer than every register entry of a decision routed to it, and the sink's last delivery id (a chat message id, the page's build id, the bell's event id) is recorded on the sink"}
effects:
  deliver_rail:    {do: "chat: post one message — one line per numbered decision routed here (`#n kind · object · answers`), the tail since the mark, a link to the page — then put(sink): delivered_at = now, delivery = the message id. page: rebuild the page from the register and the objects; every decision shows its number and its answers as controls — the decision card is the one answerable form, and every other kind keeps the form the status view gives it (209): a proposal a document with its unit proposals hanging off it, an intent a thread opening each elaboration's own surface (210), a bolt a ledger, a landed bolt a record, a signal a quote, phase shown by placement; a decision with a document shows the plannotator link that opens it for review, and a rich page opens in lavish; put(sink) the same way. chat keeps the same forms in one line each (18): a decision line is answerable, any other line is not. bell: `herdr surface bell <surface> <text>` with the numbers, then put(sink). No rendering is stored anywhere (15): the page and the chat read the register and the objects. On a hosted tier the page sink's delivery writes one small page projection per instance — the status view and the rail as data, with each member's page sink and its mark — to an object under the instance's key, which is what a page request decrypts and returns; no request opens the warm cache (291, host.yaml tier.projection)"}
