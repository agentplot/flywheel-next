# The part of every profile's binding that is the same everywhere: the world
# the machinery acts on — git repositories, worktrees, the blueprints' claim blocks,
# the manifest. Both profiles inherit it. Not a profile on its own
# (complete: false). The session binding is a partial of its own
# (sessions.yaml) because it is the one a stand-in replaces (90).
#
# Tools: git (libgit2 through the `gix` crate for reads, the `git` binary for
# merges, rebases and pushes so hooks and credentials behave as the operator's
# do); worktrunk `wt` for places (`wt worktree add/remove`, `wt tether` for
# the processes bound to a worktree, portless for ports and, under the local
# router, endpoints; the `router:` section below binds the other routers);
# mdBook books; OpenSpec change directories;
# `gh` is not used anywhere in this binding. Nothing a session leaves on the
# place's disk is read as state (64): the place holds the session's work and
# the inputs handed in; every report from a session goes through the
# `flywheel` command, which writes to the control plane.
# Every command below is run with explicit arguments and, for tools that read
# a configuration file (wt, herdr), a file the machinery writes from
# flywheel.yaml and passes on the command line; the host's own tool
# configuration is never read (183).
format: flywheel-profile/1
name: host
complete: false
disk:
  doc: |
    The layout on disk is this binding's, the same on every host (205). The
    manifest names one root (`flywheel.yaml` hosts.<host>.root, default
    `~/flywheel`); a host joins by `flywheel host join <org>` and never by
    hand, and a root that holds anything else is refused with what differs
    (host.disk_layout = differs, the host machine's refused state).
  root: "`<root>/<org>/` — one directory per organization the host runs; nothing under one names another (218). `<root>` is per host: `flywheel.yaml` hosts.<host>.root, default `~/flywheel/<host>`, so two hosts on one computer have two roots and share no file (232)"
  bare: "`<root>/<org>/<repo>.git` — a bare clone of the state, the blueprints and every tracked built repository; the one remote every worktree shares"
  shared_line: "`<root>/<org>/<repo>/main` — one checkout of each repository's shared line, the machinery's own working tree for takes, landings and the blueprints' commits; no session ever runs here"
  bolt_place: "`<root>/<org>/<repo>/bolts/<bolt id>` — the operator's place per open bolt (44), a worktree off the bolt's line"
  places: "`<root>/<org>/<repo>/places/<owner id>` — a session's place (43), a worktree off its line, made by prepare_place with `wt` and removed by remove_place; nothing else is ever a worktree"
  untracked: "`.flywheel/` inside any worktree, excluded through `.git/info/exclude` (203): the work order, the handoff, the installation token"
  check: "`flywheel host doctor` lists every path under the root against this layout; join runs it first and refuses on any difference, naming the path and what was expected (205); every tick runs it again (222): a bare repository or a shared-line checkout missing, moved or changed by hand is host.disk_layout = differs, the host-refused decision shows the difference and the repair, and nothing but a place's worktree is repaired without the response"
  repair: "the doctor's proposed repair per difference: a missing or moved bare clone — `git clone --bare` from the manifest's remote again; a missing checkout — `git worktree add` from the bare clone; a hand-changed checkout — moved aside to `<path>.aside-<date>` and checked out again; unreadable state (an object file that does not parse) — reported, never rewritten or guessed at (222)"
  places_repair: "a place's worktree found missing is re-made by prepare_place from its line, since the line is the truth and the worktree only work in progress (49, 222); a place with uncommitted work is never removed by the doctor"
launcher:
  doc: |
    A host is one long-lived process, `flywheel host`, that the platform's
    own launcher starts and restarts: launchd on a Mac, systemd on Linux, the
    container's entrypoint on a platform (231). `flywheel host join` installs
    that one entry and nothing else; there is no cron, no timer and no second
    process. Every timed behaviour — heartbeats, cadences, adapters, leases —
    is a guard on the host's tick, and a tick missed while the host was
    down is caught up by the next one: an adapter's enumeration writes under
    the source event's key, so twice is once (111).
  tick: "every 60s, and on every notify (130); the tick reads, evaluates every guard, runs the effects whose proofs are absent, and heartbeats"
  several_on_one_computer: "several hosts run on one computer as separate processes, `flywheel host --name <id>` each, told apart by id alone (232): each has its own root (disk: above), its own multiplexer sessions (`flywheel-<org>-<host>-<role>` when the manifest marks the computer shared, sessions.yaml), its own port range (router: port_range), its own heartbeat branch or record and its own leases; they share nothing but the git host. The launcher holds one entry per host id"
  adapters: "the sources the host declares in `flywheel.yaml` hosts.<host>.sources — chat-forward, meeting, webhook, pull-request, issue-tracker, folder, page-capture (215, blueprints.yaml adapters:) — each with a cadence or a watch; host.adapters_due reads them and run_adapters runs the due ones"
environment:
  doc: |
    Every tracked repository declares the environment its sessions need
    (238): `flywheel/environment.yaml` under its prefix — tools with their
    versions — or a pointer to the repository's own definition
    (`devcontainer: .devcontainer/devcontainer.json`, `devenv: devenv.nix`).
    The host binds it to a provider, `flywheel.yaml` hosts.<host>.provider:
    devenv | devcontainer | nix | image. prepare_place activates the
    environment in the place before start_session — `devenv shell` or a
    `.envrc` the place's hooks source, the devcontainer's features
    resolved into the place, a nix shell, or nothing when the host runs
    from an image that already satisfies it — and records the declaration's
    hash and the provider on the place as place.environment. A host whose
    provider cannot satisfy a declaration (a tool or version it cannot
    produce, no image with it) reads host.environment_satisfied false: the
    host-environment decision says which repository and tool, and
    lease.coverable excludes that repository's objects on this host (149).
  declaration: "`format: flywheel-environment/1`; `tools: [{name, version}]`, or `devcontainer:` / `devenv:` naming the repository's own file; read at the place's line head"
image:
  doc: |
    A platform host is created from an image that satisfies the
    environments of every repository it will cover (239). build_image
    renders the declarations into the provider's image — a container
    image with the tools at their versions, or a nix closure — tags it with
    the declarations' hash, and registers it with the platform; the same
    declarations yield the same image, so a repeat builds nothing. The
    hosts surface shows an image whose hash is behind the current
    declarations; rebuilding it is a chore (123). add-host on a platform
    picks the pool's or the organization's image.
pool:
  doc: |
    A pool (240): `flywheel.yaml` pools.<name>: {platform, image, bound,
    cost, retire_after, covers: {kinds, repositories, unit_types}}. The
    machinery asks the platform for a host from the image when approved
    work the pool covers waits behind the bound of every alive host
    covering it and the instrument reads drain is the limit, within bound
    and cost (242); each host joins by an enrolment token as an added host
    does (230), with the pool's declaration as its own, and retires after
    retire_after idle with nothing held. A pool host is ephemeral: its root
    dies with it, and a place it held is re-made from its line on another
    host by prepare_place (52). A pool serves one organization (241): a
    service run for many organizations gives each its pool, on the same
    platform and nothing else in common. The hosts surface shows the pool,
    its bound, its live hosts and its image; a pool host is listed under
    the pool and never needs the operator's eye.
  cost: "`cost: {per_host_hour, ceiling_per_day}`: pool.cost_allows is false when one more host-hour would pass the day's ceiling at the platform's price"
packages:
  doc: |
    A package (228) is a git repository at a tag, listed in an index that is
    a file: the shipped index ships with the binary and `flywheel.yaml`
    packages.index may add files by URL. A package declares, in
    `flywheel-package.yaml` at its root: name, kind, scope (organization |
    host), the set version it needs (208), its configuration schema, the
    names of its secrets, and what it runs. An organization package is
    installed as files under `flywheel/packages/<name>/` in the blueprints, one
    commit on the shared line, and read by every host at the shared line; a
    per-host package under `<root>/packages/<name>/` on the named host.
    Installation registers the content hash in `flywheel/registry.json`
    beside the types (224). Secrets are placed by the operator where the
    host keeps them — the keychain or a sealed file under the root on a
    machine, the platform's secret store on a platform (207) — under the
    names the package declares; a name with no value is package.secrets_placed
    false, the package-secret decision under attention.
  index: "`flywheel-index/1`: one entry per package — name, kind, scope, repository URL, tag, set version, a one-line doc"
  identity: "one provider, Frontegg, bound in profiles/identity.yaml (243): a host declares the environment it serves the page under — `flywheel.yaml` hosts.<host>.identity: {environment, client_id}; a self-managed host names the flywheel's Production environment and never syncs definitions (252), the hosted service's hosts name the service's — not a sign-in kind; there is no sign-in package. The host's served name is its one per-host fact, registered once on the environment's redirect list (244); on the operator's own computer the name is `https://<host>.flywheel.localhost`, served by the flywheel's own proxy (router.local, 245). The identity is the same for every organization the host serves, so switching never changes it; every op-response the page writes carries it as given_by (153); the tool server checks the token's permission per tool (249, surfaces.yaml tools.identity). Sign-in kinds tailnet, oauth and oidc are gone: an organization that needs its directory connects it to its Frontegg account, never to a host"
  address: "one address per host, the organization in the path (205a): `https://<served name>/<org>/...` for every organization the host has a root for; a link names the organization it opens; the host's own screen is `/host/` and the settings form links to it for the host's keys"
  add_host: "`add-host` provisions with the operator's own platform credentials carried in the call and held only for its duration — a container on the platform, a VM, or nothing when adopting — installs the launcher entry with the binary, and writes the host record in enrolment proposed with platform and parts; place_secrets hands the chosen parts' secrets to the platform's secret store on the yes; issue_enrolment_token mints a token valid 24h, shown once on the setup surface; `flywheel host join --token <t>` on the host presents it, the record's first heartbeat is the proof, and the token is spent (230)"
app:
  doc: |
    One GitHub App is the connection (207). A self-managed organization
    uses its own App: the manifest names its id (`flywheel.yaml` app.id)
    and the private key is the operator's secret, placed on each host
    outside every repository (`<root>/<org>/app.pem`, mode 600) and never
    by an agent (207a). The hosted tiers use the service's App: its key
    never leaves the service, and a pool host (240) or any host the service
    runs asks the service for its installation tokens instead of minting
    them, scoped as 207 scopes them. The installation on the organization
    must cover every repository the manifest lists; `extend_installation`
    adds a new repository where the App's permissions allow, and where they
    do not the repository's `uncovered` decision under attention asks the
    operator. No host or session uses a personal token, and no host or
    session holds an identity-provider user credential (251).
  host_token: "self-managed: the host mints an installation token from the key for its own git-host calls (pushes, the tracker's items, request reads), refreshed before expiry, held in memory only; hosted: the host presents its enrolment identity to the service's token endpoint and receives an installation token scoped to the organization's repositories, refreshed the same way, the key never on the host (207a)"
  place_token: "prepare_place mints a short-lived installation token scoped to the place's repository alone and writes it to `.flywheel/token` in the place (untracked, mode 600) with a git credential helper that reads it; it serves reads — fetching the organization's repositories, reading the item's context at the git host — and never a push: a session commits in its place and the machinery merges, and the `pre-push` hook refuses every push (43, context.yaml ruling 17); the token is written nowhere else and expires with the hour (207)"
templates:
  doc: |
    The blueprints template, the built-repository template, the map schema and
    the derivation table (198, 199), and the shipped skills and deliverables
    (190) are one versioned set released with the flywheel binary (208):
    `flywheel templates version` prints it. create_blueprints and
    create_repository stamp the version they used into the organization's
    and the repository's records and into `flywheel/template.yaml` in the
    repository; upgrading a repository to a newer set is a chore the
    operator accepts (123), never a side effect of a new binary.
  blueprints: "`flywheel/` (instructions, schemas, skills, type files, the map schema's copy for editors), `context-map/` (empty current and target maps), `src/SUMMARY.md`, `book.toml` with the claims preprocessor, `flywheel.yaml` skeleton, the pre-commit hooks"
  built: "`flywheel/services.yaml` (empty), `flywheel/commit-types.yaml` (defaults), `flywheel/template.yaml` (the set version), `openspec/` with the as-built spec layout, the asbuilt check gate"
declarations:
  services: |
    A built repository declares its services as data in `flywheel/services.yaml`,
    tracked, its owners' declaration to the flywheel (47, 203),
    at its root (46). Read at the head of the bolt's place; one record per service.
    `$PORT`, `$BIND` and `$PLACE` are set by the machinery from the place and
    the host's router (44, 191): the port derived from the place, the address
    the router requires the process to bind, the place's path. One record:

      format: flywheel-services/1
      services:
        - name: web                                        # the service id within the bolt: service/<bolt>/web
          command: "uv run fastapi dev app/main.py --host $BIND --port $PORT"
          serves: "http://$BIND:$PORT/"                    # what it serves; the page shows the routed endpoint (45)
          ready: "curl -sf http://$BIND:$PORT/health"      # optional; serving when it exits 0, else when the endpoint answers

    The same declaration serves under every router (191). Adding or changing
    a record is a chore on the repository (47); a session's edit of the file
    in its own place reaches the bolt's services only when it merges into the
    bolt's line and the place is refreshed to that head.
router:
  doc: |
    How a place's services are reached is this binding's, never the machinery's
    (191). The machinery gives each service `$PORT`, derived from the place so
    two places on one host never collide (45), and `$BIND`, the address the
    router in force requires; it then asks the router for the URL it records
    as `service.endpoint` and lists as `place.endpoints_served` (46). The
    manifest names the router per host — `flywheel.yaml` hosts.<host>.router:
    {kind: portless | tailnet | platform, ...} — and nothing beyond the
    operator's private network is published unless the operator says so
    there. A reverse proxy owned by the flywheel binary is not required by
    any of the three (gaps.md).
  local:
    where: the operator's own computer; the flywheel's own per-computer proxy, one process shared by every host on the computer (232), the default there (245)
    bind: "127.0.0.1"
    port: "hashed from the place's path within the host's port_range"
    endpoint: "`https://<place>-<service>.flywheel.localhost` for a service, and `https://<host>.flywheel.localhost` for each host's page and tool server (244, 245); the proxy holds a locally trusted certificate for `*.flywheel.localhost` and answers `*.localhost` on 443, so one wildcard redirect entry admits every host on every operator's machine; the flywheel needs no outside tool for it"
    served: "the proxy's route table for the host's port range"
  port_range: "`flywheel.yaml` hosts.<host>.port_range: [lo, hi], default a 1000-port block chosen from the host id's hash; the place-path hash is folded into the host's range, so two hosts on one computer never derive the same port (191, 232)"
  portless:
    where: the operator's own machine, when the operator prefers portless to the flywheel's own proxy (router.local); portless cannot serve the host's page name, so a host under portless still runs the local proxy for `<host>.flywheel.localhost` (245)
    bind: "127.0.0.1"
    port: "`portless port <name>` for the worktree, hashed from the place's path"
    endpoint: "`https://<place>.localhost` as `portless list` names it for the service in this worktree; `<place>` is the worktree name portless derives, so `https://atlas-plan-rows-web.localhost` for service `web` of bolt `plan-rows` of repository `atlas`"
    served: "`portless list` filtered to the worktree's hash"
  tailnet:
    where: a host on the operator's private network, named by its tailnet hostname; each service gets a name on that host
    bind: "127.0.0.1"
    port: "hashed from the place's path by the machinery, the same derivation portless uses, so a place moved between routers keeps its port"
    endpoint: "`https://<host>.<tailnet>.ts.net/<place>/<service>/` when `serve: tailscale` — the machinery runs `tailscale serve --bg --set-path /<place>/<service> 127.0.0.1:$PORT` on start and `tailscale serve --set-path /<place>/<service> off` on stop, and the URL is what `tailscale serve status --json` reports for that path; or `https://<place>-<service>.<host>.<tailnet>.ts.net` when `serve: caddy` — the machinery drives the host's caddy through its admin API (`POST /config/apps/http/servers/flywheel/routes` with a host matcher for `<place>-<service>.<host>.<tailnet>.ts.net` and a reverse_proxy upstream of 127.0.0.1:$PORT, `DELETE` by route id on stop), caddy holding the tailnet certificate; the manifest names which of the two and the proxy's admin endpoint"
    served: "the routes the serve feature or the proxy reports whose upstream port belongs to the place"
  platform:
    where: a managed platform runs the host and exposes it; the platform hands the machinery the hostname or the URL
    bind: "0.0.0.0"
    port: "hashed from the place's path by the machinery; the platform's ingress reaches it on every interface"
    endpoint: "the URL the platform's ingress publishes for the host and port, read from what the platform hands the host — an environment variable or a metadata endpoint the manifest names (`router: {kind: platform, url_from: env:FLYWHEEL_INGRESS_URL}` or `url_from: http://169.254.169.254/...`) — with the port or a path per service as the platform's scheme requires; published within the operator's private network by the platform's own access control, never wider by the machinery"
    served: "the ingress routes the platform reports for the host whose port belongs to the place, or, when it reports none, the URL template applied to every port the place's tethers listen on"
evidence:
  now:                 {read: the host clock, synchronized by the operating system's time service; every duration guard tolerates 60s of skew}
  session.host_alive:  {read: the host record's heartbeat, as the state profile binds host.last_seen}
  session.expected:    {read: "the work order's deliverables table — name, producer, schema, surface, each with its version — rendered by the engine and kept on the session record (190)"}
  place.exists:        {read: "`wt worktree list` names the worktree at the derived path"}
  place.contains_line: {read: "`git merge-base --is-ancestor <line head> <place head>`"}
  place.ahead_of_line: {read: "`git rev-list --count <line head>..<place head>` > 0"}
  place.conflicted:    {read: "`git status --porcelain` in the place shows unmerged paths"}
  place.merge_slot:    {read: no sibling place of the same line with a lower ordinal is in state merging, from the state profile's list}
  place.merged:        {read: "`git merge-base --is-ancestor <place head> <line head>`"}
  place.job_seeded:    {read: "the place's tree holds the conflicted rebase and the session's thread holds the job entry with that rebase's heads"}
  place.line_moved_told: {read: "the session's thread holds a `moved` entry naming the line's current head with delivered = true"}
  place.ready:         {read: "exists, contains its line, the work order file and the hooks are present"}
  place.absent:        {read: "`wt worktree list` does not name it and the directory is gone"}
  place.endpoints_served: {read: "the router in force's `served` read for this place (router: above): every service the tethered processes of this worktree serve, as URLs on the operator's private network (191)"}
  service.process:     {read: "`wt tether status service/<name>` in the bolt's place: present while the tethered process runs, exited when the tether records its exit status, absent when no tether by that name exists"}
  service.serving:     {read: "the declaration's `ready` command exits 0 in the place; without one, a GET on service.endpoint answers within 5s with any status"}
  service.endpoint:    {read: "the router in force's `endpoint` read for this service's port in this place (router: above): under portless the `portless list` entry for `<name>` in this worktree, under tailnet the serve or proxy route, under platform the ingress URL; always on the operator's private network (191)"}
  service.failure:     {read: "the tether's exit status and the last 20 lines of its log (`wt tether log service/<name> --tail 20`)"}
  service.place_present: {read: "as place.exists for the bolt's place"}
  service.declared:    {read: "`flywheel/services.yaml` at the bolt's place's head holds a record with this name (203)"}
  service.process_absent: {read: "`wt tether status service/<name>` reports no tether by that name"}
  bolt.services_declared: {read: "for every record in `flywheel/services.yaml` at the bolt's place's head, a service object with parent = the bolt and that name exists in a state other than gone, from the state profile's list"}
  host.disk_layout:    {read: "`flywheel host doctor` against disk: above (205): absent when the root has no `<org>/`, current when every path matches, differs otherwise"}
  host.layout_difference: {read: "the doctor's first differing path and what was expected"}
  host.repositories_cloned: {read: "for the state, the blueprints and every manifest repository: `<root>/<org>/<repo>.git` is a bare clone of the manifest's remote and `<root>/<org>/<repo>/main` is a checkout of its shared line"}
  org.blueprints_ready:     {read: "the blueprints repository exists on the git host and holds every path the blueprints template of the recorded version requires"}
  org.state_ready:     {read: "the state repository exists with the profile's layout: for git-only, `main` with `objects/`, `responses/`, `asks/`, `runs/`; for the tracker, the `flywheel-state` repository with its board and the milestone scheme"}
  org.app_recorded:    {read: "`flywheel.yaml` app.id is set and the organization record says installation required"}
  org.app_installed:   {read: "the git host reports an installation of the App on the organization, reached with the key at `<root>/<org>/app.pem`"}
  org.app_id:          {read: "`flywheel.yaml` app.id"}
  org.host_registered: {read: "some host record exists and `flywheel.yaml` hosts lists it"}
  repository.nodes:    {read: "get(id).nodes"}
  repository.repo:     {read: "get(id).repo"}
  repository.exists:   {read: "the git host reports the repository under the organization, or the record is adopted"}
  repository.registered: {read: "`flywheel.yaml` repositories.<name> exists; the repository's head holds `flywheel/services.yaml`, `flywheel/commit-types.yaml` and `flywheel/template.yaml`; every node in get(id).nodes is in the target map with home = name; a planning record for the repository exists"}
  repository.covered_by_app: {read: "the App installation's repository list on the git host names the repository"}
  host.stray_places:   {read: "`wt worktree list` under the places root names a worktree whose derived owner id is no listed object in a live state, or is a listed object whose place region is removed, and whose owner record is not held"}
  host.layout_repair:  {read: "the doctor's proposed repair for the first differing path (disk: repair above)"}
  host.layout_repaired: {read: "the doctor reports current after repair_layout ran"}
  host.adapters_due:   {read: "for a source in `flywheel.yaml` hosts.<host>.sources: its cadence (cron) fired since the run record's last enumeration of it, or a file appeared under its folder, or a webhook delivery is queued in the host's inbox that no capture key names yet (215, 231)"}
  host.adapters_run:   {read: "every due source has a run-record entry newer than its cadence's last firing, and every waiting file or delivery has a capture under its key"}
  host.platform:       {read: "get(host).platform and get(host).parts"}
  host.environment_satisfied: {read: "for every repository the host's declaration covers: the provider in force can activate `flywheel/environment.yaml` (or the named devcontainer or devenv file) at the repository's shared head — `devenv` or `nix` evaluate it, `devcontainer` resolves its features, `image` holds the declarations' hash — checked at every fetch that moved a declaration (238)"}
  host.environment_difference: {read: "the first repository and tool the provider cannot produce, with the version asked"}
  host.pool:           {read: "get(host).pool"}
  host.idle_since:     {read: "the newest of: the host's last session exit, its last lease release; now when it runs a session or holds a lease that could fire"}
  place.environment:   {read: "the place's record: the declaration's hash and the provider prepare_place activated"}
  pool.image_current:  {read: "the platform lists an image tagged with the hash of the current environment declarations of every repository the pool covers"}
  pool.demand:         {read: "some unit or item the pool's covers reaches is approved or ready and unplaced, every alive host covering it reads host.running >= host.bound, and the instrument's reading is `drain is the limit` (214, 242)"}
  pool.live:           {read: "count of hosts with pool = this pool alive or stale"}
  pool.bound:          {read: "`flywheel.yaml` pools.<name>.bound"}
  pool.cost_allows:    {read: "cost: above"}
  pool.idle_host:      {read: "a host with pool = this pool whose host.idle_since is older than retire_after, holding no lease and running no session"}
  pool.host_added:     {read: "a host record with pool = this pool and the effect id as its provisioning exists in enrolment awaiting-join, enrolled or later"}
  pool.host_retired:   {read: "the platform no longer lists the host the effect named and its record reads gone"}
  plan.owner_recorded: {read: "get(the decision's object).owner equals the response's argument"}
  host.token_issued:   {read: "an enrolment token for the host exists in the state, unexpired (24h) and unspent"}
  host.secrets_placed: {read: "for every part chosen, every secret name the package declares has a value in the platform's secret store for the host, read through the platform's API with the operator's credentials during add-host and afterwards through the host's own"}
  org.retired:         {read: "no session record of the organization is alive, no place under `<root>/<org>/*/places` or `bolts` exists, the state repository's shared line carries the archive commit and the archive under `<root>/<org>/archive/` exists; the bare repositories still exist"}
  package.kind:        {read: "get(package).kind"}
  package.scope:       {read: "get(package).scope"}
  package.secrets_placed: {read: "every name in get(package).secrets has a value where the host keeps secrets (packages: above)"}
  package.installed:   {read: "organization scope: `flywheel/packages/<name>/` at the blueprints' shared head holds the tag's content and `flywheel/registry.json` holds its hash; host scope: `<root>/packages/<name>/` on the named host holds it and the host's registry entry matches; and what the package runs is present under its tether or launcher name"}
  package.configured:  {read: "the package's config file equals the response's fields, validated against its schema"}
  package.stopped:     {read: "nothing runs under the package's name; its files exist"}
  package.absent:      {read: "no files under the package's path and nothing runs under its name"}
  host.no_stray_places: {read: the same list finds none}
  line.exists:         {read: "`git ls-remote <repo> refs/heads/<line>` returns the ref"}
  line.contains_parent: {read: "`git merge-base --is-ancestor <parent head> <line head>` after `git fetch`"}
  line.take_due:       {read: "the line has no place yet and one is about to be made; or the line is landing; or the manifest's `take_cadence` for the repository (a cron expression) has fired since `last_take`; or a dictation `take <line>` stands unapplied"}
  line.take_conflicts: {read: "`git merge-tree --write-tree <line head> <parent head>` reports conflicts (no worktree touched)"}
  line.landed:         {read: "`git merge-base --is-ancestor <line head> <parent head>`"}
  line.landing:        {read: "policy direct: none until the push, then passed or failed by the push's result; policy pull-request: none while no request exists, then the request's check state through the git host's API (pending | passed | failed)"}
  line.policy:         {read: "`flywheel.yaml` repositories[<repo>].landing (direct | pull-request), default direct; the blueprints repository is always direct, since the archive is its landing (175)"}
  line.request:        {read: "the pull request whose head is this line at the git host (GitHub REST `pulls?head=<org>:<line>`, state all): none when there is none, open, merged, or closed without merging (175)"}
  line.request_review_pending: {read: "a review on the request with state CHANGES_REQUESTED, or a check run whose conclusion is failure, whose id no finding record on the bolt cites (176)"}
  line.request_links:  {read: "the request's URL, its check runs' details URLs, its deployment and environment URLs (`deployments` and `statuses` on the head), and any link an integration posted as a check output — read by the adapter, never made (177)"}
  line.request_opened: {read: "as line.request, not none"}
  line.request_review_recorded: {read: "every CHANGES_REQUESTED review and failed check run on the request is cited by a finding record on the bolt"}
  line.retries:        {read: the owner's record counter}
  line.conflict_job_done: {read: "the chore unit recorded for this line and this take (record field `conflict_chore`) is in state merged"}
  line.conflict_job_seeded: {read: "a unit record of type chore exists with `line` = this line, `take` = the parent head the take tried, state approved or later"}
  line.absent:         {read: "`git ls-remote` returns nothing for the ref"}
  claim.on_shared_line: {read: "the blueprints repository's shared line holds a fenced claim block with this name (in `src/**/*.md`)"}
  claim.on_intent_line: {read: "the intent's line holds the block and the shared line does not"}
  claim.version:       {read: "the block's `version:` line; the lock hash beside it must match the block's text, checked by `flywheel claims check` in the blueprints' pre-commit hook"}
  claim.scope_repos:   {read: "the claim's attachments (its block's `attaches:` list, in `flywheel/claims.json`) resolved against `flywheel/map/target.json` at the blueprints' shared head by the schema's scope table: a context → its home ∪ its elements' effective homes; an element → its effective home; a relationship → both contexts' scope ∪ the kernel's homes; a link → both elements' scope; empty when the claim attaches to nothing; never reads tags, kinds or derivation (105, 198, 200)"}
  cell.in_scope:       {read: "the cell's repository is in claim.scope_repos for the cell's claim (195, 200)"}
  claim.attached:      {read: "the claim block's `attaches:` list in its chapter holds the id the response named and `flywheel/map/target.json` has that id"}
  claim.detached:      {read: "the claim block's `attaches:` list no longer holds the id"}
  map.home_set:        {read: "`context-map/target.yaml` gives the id the home the response named"}
  map.edited:          {read: "`context-map/target.yaml` holds the entry as the response gave it and `flywheel map check` passes at that head"}
  map.status_set:      {read: "the entry's status and question match the response"}
  plan.review_marked:  {read: "the plan record's reviewed_at revision equals the blueprints head the response was given at"}
  cell.evidence_present: {read: "every path or spec id the verdict cites exists at the repository's shared head"}
  cell.claim_version:  {read: as claim.version}
  stage.agents:        {read: "a fixed list from the type; or the rule's pattern globbed in the place (`personas/*.md`), each match one agent"}
  capture.source:      {read: the capture record's source field}
  item.change_archived: {read: "the item's place holds `openspec/changes/archive/<date>-<change>/` for the item's change and no open change of that id in a commit on the place's branch; true without reading when the type's record says needs_change_directory false"}
  intent.archived:     {read: "the intent's line holds the OpenSpec archive of its change (`openspec/changes/archive/<date>-<id>/`) and no open change of that id"}
  intent.change_open:  {read: "`openspec/changes/<intent-id>/` exists on the intent's line"}
  line.acceptance_written: {read: "for a bolt's line: `openspec/acceptance.yaml` at the line's head lists exactly the claims the bolt's units cite (claims field, name@version) with the scenarios the book's claim blocks carry at those versions; for an intent's line: true (192)"}
  elaboration.records_fanned_out: {read: "for every intent in covers beyond the parent, the place holds nothing under `openspec/changes/<that intent id>/` and that intent's line holds the commit naming this elaboration, or the session left nothing for it"}
  lease.coverable:     {read: "some host whose disk region is ready (205) in `flywheel.yaml` hosts declares this object's kind, its repository (for a bolt, unit or item) and its unit type (for a unit or item); a sink is coverable when some host or the dispatcher declares it in `presents`"}
effects:
  create_line:     {do: "`git push <repo> <parent head>:refs/heads/<line>` with expected-old = zero; the ref exists afterwards"}
  take_parent:     {do: "in the owner's place (a bolt's operator place, an intent's own place): `git merge --no-ff <parent>`, never a rebase (179); on conflict `git merge --abort`; then push the line with expected-old = the head read"}
  seed_take_conflict: {do: "put(new unit): type chore, parent = the line's owner, line = this line, take = the parent head, scope = bolt-line or intent-line, approval = `cadence <cron>` when the cadence fired the take or `response <id>` when a dictation ordered it, state approved; its item's place is prepared off the line with `git merge <parent>` left conflicted in that place only, and its work order names the conflict as the job"}
  land_line:       {do: "policy direct: in the shared line's own checkout `git merge --no-ff <line head>` with a message naming the bolt, then `git push <repo> <parent>` with expected-old = the parent head read; one merge commit, no rewrite (175, 179). Never run under pull-request"}
  write_acceptance: {do: "in the bolt's operator place at the line's head: write `openspec/acceptance.yaml` (`format: flywheel-acceptance/1`, the bolt id and name, one entry per claim the bolt's units cite — name, version, the chapter path, and the scenarios copied from the claim block at that version in the blueprints' shared line — and the units and items that served each); one commit on the bolt's line, message `chore(<bolt>): acceptance` in the Conventional Commits form (185); pushed with expected-old; nothing on an intent's line; a delivery system reads the file from the shared line after the landing and the machinery never runs anything from it (181, 192)"}
  open_request:    {do: "policy pull-request: open the pull request from the line onto the parent, titled by the bolt's name and bodied with its units and the claims they serve, or reuse the open one with that head; the repository's own merge setting (merge, squash or rebase at the git host) is what lands it, and the machinery sets none (175, 179). Enable the host's auto-merge when the repository allows it"}
  seed_request_finding: {do: "for each uncited CHANGES_REQUESTED review or failed check on the request: put(new unit, proposed, type = chore, parent = the bolt, batch = bolt id, scope = bolt-line, document = the review's or check's URL, source = the review id); accepted, its session works a place off the bolt line and merge_place updates the request (176)"}
  remove_line:     {do: "`git push <repo> :refs/heads/<line>`; recorded as an effect with the head it removed"}
  prepare_place:   {do: "`wt worktree add <path> <line>` (ports hashed from the path, portless routes); `.git/info/exclude` gets `.flywheel/`, the untracked per-place prefix for the work order and handoff, the one place the machinery writes in a built repository's tree outside an OpenSpec change and the acceptance file (203); hooks `pre-push`, `reference-transaction`, `pre-merge-commit` that refuse and run `flywheel refuse <what>` (S15) — the git hooks are what refuse, for every kind of agent; the agent program's own deny list (Claude Code settings, codex or opencode config) is written too when the kind has one, and nothing depends on it (173); `.flywheel/work-order.md` rendered from the closed inputs, its deliverables table resolved through `profiles/deliverables.yaml` and `flywheel.yaml` deliverables.<name> overrides at the blueprints commit in the header (190), and for a construction session a map section read from `flywheel/map/target.json`: the elements the item's unit builds (the ids the unit's claims attach to, and those homed in the repository that the chapters name), each with its context, kind and effective home, and the claims attached to each with their versions (211); and, when a claim the unit cites is about a surface, the surface specification chapter in force at the blueprints commit in the header (212) — handed in, never read back as state"}
  rebase_place:    {do: "`git rebase <line head>` in the place; on conflict `git rebase --abort`"}
  seed_conflict_job: {do: "`git rebase <line head>` left conflicted in the place; append(session thread) the job entry naming the heads and the paths; the session is told through the session binding"}
  archive_change:  {do: "in the item's place, for a type whose record says needs_change_directory true: `openspec archive <change>` — the change directory the spec stage (or the fast type's one stage) wrote, moved into the standing set under `openspec/specs/` — then one commit `chore(<bolt>): archive <change>` on the place's branch; the merge that follows squashes it into the item's commit unless item_merge is `merge`, and the bolt's landing carries the standing specifications onto the shared line (section 9 givens); nothing, and the proof holds, when the type needs no change directory; refused and reported when the place holds no open change of that id"}
  merge_place:     {do: "from the item's place: `wt merge <bolt line> --config <the wt config the machinery wrote from flywheel.yaml> --no-remove --format json` — squash to one commit, rebase onto the line head, fast-forward the line; the written config names the commit as `<unit>/<item>: <title>` (its commit generation, when enabled there, supplies the title and the generated text is recorded with the effect); `--no-squash --no-ff` when `flywheel.yaml` repositories[<repo>].item_merge is `merge`; push with expected-old = the line head read; the place is removed by the place machine, not by the merge; the bolt's operator place is then reset to the new head (179, 183, 185); the message is Conventional Commits: `<type>(<bolt>): <item title>` with type from the repository's `flywheel/commit-types.yaml` (its own declaration, 203), else the manifest's unit_types.<type>.commit_type and a body naming unit, item and claims"}
  remove_place:    {do: "`wt worktree remove <path>`; tethered processes end with it (`wt tether`); refused and reported while the owner record is held; recorded with the path and the head it had"}
  record_endpoints: {do: "put(owner): endpoints = place.endpoints_served; the page renders them as links beside the bolt"}
  declare_services: {do: "read `flywheel/services.yaml` at the bolt's place's head (203); for each record with no service object in a live state: put(new service, stopped, parent = the bolt, id = service/<bolt>/<name>, name, command, serves from the record); one put per record, each recorded as its own effect"}
  start_service:   {do: "in the bolt's place: `wt tether start --name service/<name> -- sh -c '<command>'` with PORT from the router in force's `port` (under portless `portless port <name>` for this worktree), BIND from its `bind` (127.0.0.1 under portless and tailnet, 0.0.0.0 under platform) and PLACE = the path; then the router's registration for the port where it needs one (`tailscale serve`, the proxy's admin API), and none under portless or platform (191); the tether binds the process to the worktree so `wt worktree remove` ends it (44, 54); put(service): moved_by = the response id; a tether already present by that name is refused by wt, which is the proof"}
  stop_service:    {do: "`wt tether stop service/<name>` in the bolt's place, then the router's deregistration where it registered one (191); put(service): moved_by = the response id; nothing when no tether by that name exists"}
  clone_repositories: {do: "for the state, the blueprints and every manifest repository missing under the root: `git clone --bare <remote> <root>/<org>/<repo>.git` and `git worktree add <root>/<org>/<repo>/main <shared line>`; a repeat clones only what is missing; then `flywheel host doctor` (205)"}
  create_blueprints:    {do: "`gh`-free: through the App's installation token, create `<org>/<blueprints>` on the git host when absent, then commit the blueprints template at the set's version — adding only missing paths to an adopted repository — with `flywheel/template.yaml` carrying the version; put(organization): template_version (204, 208)"}
  create_state:    {do: "create `<org>/flywheel-state` on the git host when absent and commit the profile's layout (git-only: the directories and `status.html`; tracker: the repository, the board and the milestone scheme) (204, C.2)"}
  register_app:    {do: "write app.id into `flywheel.yaml` and `installation_required: true` into the organization record; nothing is installed here (207)"}
  register_host:   {do: "put(host, joining) for the host running init and add it to `flywheel.yaml` hosts; the host's own join then clones and checks (204, 205)"}
  create_repository: {do: "through the App's installation token: create `<org>/<name>` on the git host under the organization, push the built-repository template at the set's version with `flywheel/template.yaml`; put(repository): template_version; nothing when adopted (206, 208)"}
  register_repository: {do: "one commit on the blueprints' shared line: `flywheel.yaml` repositories.<name> with repo, landing and cadence from the proposal or the defaults; the proposal's nodes appended to `context-map/maps/target.js` with home = name and status candidate where the proposal said no more; then, on the built repository, `flywheel/services.yaml` and `flywheel/commit-types.yaml` from the template when absent; then put(planning for the repository, current) so its fingerprint differs and the baseline run is due (104, 199, 202, 203, 206)"}
  extend_installation: {do: "PUT the repository onto the App's installation through the git host's API where the App holds the permission; a 403 writes nothing and leaves the repository's `covering` state to time out into the decision (207)"}
  remove_stray_places: {do: "for each stray worktree under the places root: `wt worktree remove <path>`; one effect per removal, each recorded with the path and why it was stray"}
  repair_layout:   {do: "the repair the decision showed (disk: repair above) for the differing path, one effect per path, each recorded with what it found and what it did; then `flywheel host doctor` again (222)"}
  run_adapters:    {do: "for each due source: `flywheel capture <source>` with the manifest's arguments — the enumerator reads the source, writes one `flywheel/signals/captures/<key>.rec` per source event with the pointer to the raw material in the raw store the manifest names for the source (217h), and pushes to the blueprints' shared line with expected-old; a key that exists writes nothing; the run record notes the source and the time (111, 215, 231)"}
  place_secrets:   {do: "for each chosen part, each secret name it declares: the value the operator gave in the add-host call goes to the platform's secret store for the host through the platform's API under the operator's credentials, then the credentials are dropped from memory; recorded as placed, never with the value (207, 230)"}
  issue_enrolment_token: {do: "put(host): a random token, its expiry 24h out, unspent; shown once on the setup surface; `flywheel host join --token` compares and spends it (230)"}
  build_image:     {do: "image: above — render every covered repository's `flywheel/environment.yaml` into a Dockerfile (or a nix expression) with the tools at their versions and the flywheel binary, build, tag with the declarations' hash, push to the platform's registry; a tag already present builds nothing (239)"}
  provision_pool_host: {do: "pool: above — put(host, enrolment awaiting-join, pool = name, declares = the pool's covers, platform, provider = image) with a fresh enrolment token, then the platform's create call with the image and the token as the launcher's argument; the host joins by `flywheel host join --token` on first start (230, 240)"}
  retire_pool_host: {do: "for the idle host: release its leases, remove its places (each re-made elsewhere by the owner's place machine), the platform's delete call, put(host): gone; the record stays for the status view (240)"}
  assign_owner:    {do: "put(the object the decision's register entry names): owner = the member or role; refused when the argument is neither in the organization's `operators:` nor a role `flywheel.yaml` roles: names (237)"}
  retire_organization: {do: "`herdr agent stop` every session of the organization, `wt worktree remove` every place and bolt place, commit an archive marker with the decision counter on the state's shared line and copy the state's checkout to `<root>/<org>/archive/<date>/`, remove the organization's sinks from every presenter; the bare repositories and `<root>/<org>/` stay (221)"}
  install_package: {do: "`git clone --depth 1 --branch <tag> <url>` into a temporary directory; read `flywheel-package.yaml`; refuse and report when its set version is not the installed set's (208, 224) or its hash differs from the index's when the index gives one; organization scope: copy into `flywheel/packages/<name>/` in the blueprints' shared-line checkout, add the hash to `flywheel/registry.json`, one commit `chore(packages): install <name>@<tag>` pushed with expected-old; host scope: copy under `<root>/packages/<name>/` and record the hash in the host's registry; then start what it runs under a tether or launcher entry named by the package; a repeat finds the files and only starts what is not running (229)"}
  configure_package: {do: "validate the fields against the package's schema, write its config file (under the blueprints' prefix for organization scope, one commit; under the host's root otherwise), restart what it runs"}
  disable_package: {do: "stop the tether or launcher entry named by the package; files untouched"}
  remove_package:  {do: "disable_package, then remove the files — one commit `chore(packages): remove <name>` for organization scope — leaving the registry's history and the package record"}
  archive_intent:  {do: "`openspec archive <intent-id>` in the intent's place, committed on the intent's line"}
  open_intent:     {do: "`openspec new <intent-id>` from the schema instruction in force, committed on the intent's line"}
  attach_claim:    {do: "`flywheel map attach <claim> <id>` on the blueprints' shared line: add the id to the claim block's `attaches:` list in its chapter (outside the lock hash, 97), re-render `flywheel/claims.json` and the block's scope line, leave the text and the version, one commit `chore(claims): attach <claim>` pushed with expected-old; refused when the id is not in the target map; the pre-commit hook validates the block (105, 200, 211)"}
  detach_claim:    {do: "`flywheel map detach <claim> <id>`: the same path removing the id; one commit `chore(claims): detach <claim>` (200, 211)"}
  set_home:        {do: "`flywheel map home <id> <repository>` on the blueprints' shared line: set `home:` on the element or context in `context-map/target.yaml`, run `flywheel map check` (a home naming no manifest entry is refused), re-render `flywheel/map/target.json`, one commit `chore(map): home <id>` (199, 211)"}
  map_edit:        {do: "`flywheel map edit <type> <id> --ref <book/chapter> [fields]` on the blueprints' shared line: add or amend the entry in `context-map/target.yaml` (or `current.yaml` when the caller is the landing construction session's writeback), refused without `--ref` and refused when `flywheel map check` fails — unknown kind or facet, a second relationship on a pair, a conformist with a guard, a link crossing separate ways, an open entry without a question — re-render, one commit `chore(map): <type> <id>` (120, 198, 211)"}
  set_map_status:  {do: "`flywheel map status <id> settled|candidate|open [--question <text>]`: set status and question in `context-map/target.yaml`, refused for settled or candidate without a ref and for open without a question, one commit (198, 201, 211)"}
  mark_reviewed:   {do: "put(plan): reviewed_at = the blueprints' shared head revision now; the since-last-review overlay diffs `context-map/target.yaml` at that revision against head (122, 211)"}
  record_per_intent: {do: "for each intent in covers beyond the parent: the files the session left under `openspec/changes/<that intent id>/` in its place are committed onto that intent's line, into that intent's change directory, one commit naming the elaboration, and removed from the place in a commit of its own, so the place's merge carries only the parent's records and the book; absent files are nothing to do"}
