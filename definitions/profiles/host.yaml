# The part of every profile's binding that is the same everywhere: the world
# the machinery acts on — git repositories, worktrees, the books' claim blocks,
# the manifest. Both profiles inherit it. Not a profile on its own
# (complete: false). The session binding is a partial of its own
# (sessions.yaml) because it is the one a stand-in replaces (90).
#
# Tools: git (libgit2 through the `gix` crate for reads, the `git` binary for
# merges, rebases and pushes so hooks and credentials behave as the operator's
# do); worktrunk `wt` for places (`wt worktree add/remove`, `wt tether` for
# the processes bound to a worktree, portless for ports and, under the local
# router, endpoints; the `router:` section below binds the other routers);
# mdBook books; OpenSpec change directories;
# `gh` is not used anywhere in this binding. Nothing a session leaves on the
# place's disk is read as state (64): the place holds the session's work and
# the inputs handed in; every report from a session goes through the
# `flywheel` command, which writes to the control plane.
# Every command below is run with explicit arguments and, for tools that read
# a configuration file (wt, herdr), a file the machinery writes from
# flywheel.yaml and passes on the command line; the host's own tool
# configuration is never read (183).
format: flywheel-profile/1
name: host
complete: false
declarations:
  services: |
    A built repository declares its services as data in `flywheel/services.yaml`,
    tracked, its owners' declaration to the flywheel (47, 203),
    at its root (46). Read at the head of the bolt's place; one record per service.
    `$PORT`, `$BIND` and `$PLACE` are set by the machinery from the place and
    the host's router (44, 191): the port derived from the place, the address
    the router requires the process to bind, the place's path. One record:

      format: flywheel-services/1
      services:
        - name: web                                        # the service id within the bolt: service/<bolt>/web
          command: "uv run fastapi dev app/main.py --host $BIND --port $PORT"
          serves: "http://$BIND:$PORT/"                    # what it serves; the page shows the routed endpoint (45)
          ready: "curl -sf http://$BIND:$PORT/health"      # optional; serving when it exits 0, else when the endpoint answers

    The same declaration serves under every router (191). Adding or changing
    a record is a chore on the repository (47); a session's edit of the file
    in its own place reaches the bolt's services only when it merges into the
    bolt's line and the place is refreshed to that head.
router:
  doc: |
    How a place's services are reached is this binding's, never the machinery's
    (191). The machinery gives each service `$PORT`, derived from the place so
    two places on one host never collide (45), and `$BIND`, the address the
    router in force requires; it then asks the router for the URL it records
    as `service.endpoint` and lists as `place.endpoints_served` (46). The
    manifest names the router per host — `flywheel.yaml` hosts.<host>.router:
    {kind: portless | tailnet | platform, ...} — and nothing beyond the
    operator's private network is published unless the operator says so
    there. A reverse proxy owned by the flywheel binary is not required by
    any of the three (gaps.md).
  portless:
    where: the operator's own machine; the place is named, the host is implicit
    bind: "127.0.0.1"
    port: "`portless port <name>` for the worktree, hashed from the place's path"
    endpoint: "`https://<place>.localhost` as `portless list` names it for the service in this worktree; `<place>` is the worktree name portless derives, so `https://atlas-plan-rows-web.localhost` for service `web` of bolt `plan-rows` of repository `atlas`"
    served: "`portless list` filtered to the worktree's hash"
  tailnet:
    where: a host on the operator's private network, named by its tailnet hostname; each service gets a name on that host
    bind: "127.0.0.1"
    port: "hashed from the place's path by the machinery, the same derivation portless uses, so a place moved between routers keeps its port"
    endpoint: "`https://<host>.<tailnet>.ts.net/<place>/<service>/` when `serve: tailscale` — the machinery runs `tailscale serve --bg --set-path /<place>/<service> 127.0.0.1:$PORT` on start and `tailscale serve --set-path /<place>/<service> off` on stop, and the URL is what `tailscale serve status --json` reports for that path; or `https://<place>-<service>.<host>.<tailnet>.ts.net` when `serve: caddy` — the machinery drives the host's caddy through its admin API (`POST /config/apps/http/servers/flywheel/routes` with a host matcher for `<place>-<service>.<host>.<tailnet>.ts.net` and a reverse_proxy upstream of 127.0.0.1:$PORT, `DELETE` by route id on stop), caddy holding the tailnet certificate; the manifest names which of the two and the proxy's admin endpoint"
    served: "the routes the serve feature or the proxy reports whose upstream port belongs to the place"
  platform:
    where: a managed platform runs the host and exposes it; the platform hands the machinery the hostname or the URL
    bind: "0.0.0.0"
    port: "hashed from the place's path by the machinery; the platform's ingress reaches it on every interface"
    endpoint: "the URL the platform's ingress publishes for the host and port, read from what the platform hands the host — an environment variable or a metadata endpoint the manifest names (`router: {kind: platform, url_from: env:FLYWHEEL_INGRESS_URL}` or `url_from: http://169.254.169.254/...`) — with the port or a path per service as the platform's scheme requires; published within the operator's private network by the platform's own access control, never wider by the machinery"
    served: "the ingress routes the platform reports for the host whose port belongs to the place, or, when it reports none, the URL template applied to every port the place's tethers listen on"
evidence:
  now:                 {read: the host clock, synchronized by the operating system's time service; every duration guard tolerates 60s of skew}
  session.host_alive:  {read: the host record's heartbeat, as the state profile binds host.last_seen}
  session.expected:    {read: "the work order's deliverables table — name, producer, schema, surface, each with its version — rendered by the engine and kept on the session record (190)"}
  place.exists:        {read: "`wt worktree list` names the worktree at the derived path"}
  place.contains_line: {read: "`git merge-base --is-ancestor <line head> <place head>`"}
  place.ahead_of_line: {read: "`git rev-list --count <line head>..<place head>` > 0"}
  place.conflicted:    {read: "`git status --porcelain` in the place shows unmerged paths"}
  place.merge_slot:    {read: no sibling place of the same line with a lower ordinal is in state merging, from the state profile's list}
  place.merged:        {read: "`git merge-base --is-ancestor <place head> <line head>`"}
  place.job_seeded:    {read: "the place's tree holds the conflicted rebase and the session's thread holds the job entry with that rebase's heads"}
  place.line_moved_told: {read: "the session's thread holds a `moved` entry naming the line's current head with delivered = true"}
  place.ready:         {read: "exists, contains its line, the work order file and the hooks are present"}
  place.absent:        {read: "`wt worktree list` does not name it and the directory is gone"}
  place.endpoints_served: {read: "the router in force's `served` read for this place (router: above): every service the tethered processes of this worktree serve, as URLs on the operator's private network (191)"}
  service.process:     {read: "`wt tether status service/<name>` in the bolt's place: present while the tethered process runs, exited when the tether records its exit status, absent when no tether by that name exists"}
  service.serving:     {read: "the declaration's `ready` command exits 0 in the place; without one, a GET on service.endpoint answers within 5s with any status"}
  service.endpoint:    {read: "the router in force's `endpoint` read for this service's port in this place (router: above): under portless the `portless list` entry for `<name>` in this worktree, under tailnet the serve or proxy route, under platform the ingress URL; always on the operator's private network (191)"}
  service.failure:     {read: "the tether's exit status and the last 20 lines of its log (`wt tether log service/<name> --tail 20`)"}
  service.place_present: {read: "as place.exists for the bolt's place"}
  service.declared:    {read: "`flywheel/services.yaml` at the bolt's place's head holds a record with this name (203)"}
  service.process_absent: {read: "`wt tether status service/<name>` reports no tether by that name"}
  bolt.services_declared: {read: "for every record in `flywheel/services.yaml` at the bolt's place's head, a service object with parent = the bolt and that name exists in a state other than gone, from the state profile's list"}
  host.stray_places:   {read: "`wt worktree list` under the places root names a worktree whose derived owner id is no listed object in a live state, or is a listed object whose place region is removed, and whose owner record is not held"}
  host.no_stray_places: {read: the same list finds none}
  line.exists:         {read: "`git ls-remote <repo> refs/heads/<line>` returns the ref"}
  line.contains_parent: {read: "`git merge-base --is-ancestor <parent head> <line head>` after `git fetch`"}
  line.take_due:       {read: "the line has no place yet and one is about to be made; or the line is landing; or the manifest's `take_cadence` for the repository (a cron expression) has fired since `last_take`; or a dictation `take <line>` stands unapplied"}
  line.take_conflicts: {read: "`git merge-tree --write-tree <line head> <parent head>` reports conflicts (no worktree touched)"}
  line.landed:         {read: "`git merge-base --is-ancestor <line head> <parent head>`"}
  line.landing:        {read: "policy direct: none until the push, then passed or failed by the push's result; policy pull-request: none while no request exists, then the request's check state through the git host's API (pending | passed | failed)"}
  line.policy:         {read: "`flywheel.yaml` repositories[<repo>].landing (direct | pull-request), default direct; the books repository is always direct, since the archive is its landing (175)"}
  line.request:        {read: "the pull request whose head is this line at the git host (GitHub REST `pulls?head=<org>:<line>`, state all): none when there is none, open, merged, or closed without merging (175)"}
  line.request_review_pending: {read: "a review on the request with state CHANGES_REQUESTED, or a check run whose conclusion is failure, whose id no finding record on the bolt cites (176)"}
  line.request_links:  {read: "the request's URL, its check runs' details URLs, its deployment and environment URLs (`deployments` and `statuses` on the head), and any link an integration posted as a check output — read by the adapter, never made (177)"}
  line.request_opened: {read: "as line.request, not none"}
  line.request_review_recorded: {read: "every CHANGES_REQUESTED review and failed check run on the request is cited by a finding record on the bolt"}
  line.retries:        {read: the owner's record counter}
  line.conflict_job_done: {read: "the chore unit recorded for this line and this take (record field `conflict_chore`) is in state merged"}
  line.conflict_job_seeded: {read: "a unit record of type chore exists with `line` = this line, `take` = the parent head the take tried, state approved or later"}
  line.absent:         {read: "`git ls-remote` returns nothing for the ref"}
  claim.on_shared_line: {read: "the books repository's shared line holds a fenced claim block with this name (in `src/**/*.md`)"}
  claim.on_intent_line: {read: "the intent's line holds the block and the shared line does not"}
  claim.version:       {read: "the block's `version:` line; the lock hash beside it must match the block's text, checked by `flywheel claims check` in the books' pre-commit hook"}
  claim.scope_repos:   {read: "from `flywheel/map/target.json` at the books' shared head: the homes of the nodes the claim's attachments name, of every node in an attached context, and of both ends of an attached relation; empty when the claim attaches to nothing (105, 198, 200)"}
  cell.in_scope:       {read: "the cell's repository is in claim.scope_repos for the cell's claim, read through the rendered map at the books' shared head (195, 200)"}
  claim.attached:      {read: "the target map's attachments hold {claim, to: <the element the response named>} and the block's rendered scope line agrees"}
  cell.evidence_present: {read: "every path or spec id the verdict cites exists at the repository's shared head"}
  cell.claim_version:  {read: as claim.version}
  stage.agents:        {read: "a fixed list from the type; or the rule's pattern globbed in the place (`personas/*.md`), each match one agent"}
  capture.source:      {read: the capture record's source field}
  intent.archived:     {read: "the intent's line holds the OpenSpec archive of its change (`openspec/changes/archive/<date>-<id>/`) and no open change of that id"}
  intent.change_open:  {read: "`openspec/changes/<intent-id>/` exists on the intent's line"}
  line.acceptance_written: {read: "for a bolt's line: `openspec/acceptance.yaml` at the line's head lists exactly the claims the bolt's units cite (claims field, name@version) with the scenarios the book's claim blocks carry at those versions; for an intent's line: true (192)"}
  elaboration.records_fanned_out: {read: "for every intent in covers beyond the parent, the place holds nothing under `openspec/changes/<that intent id>/` and that intent's line holds the commit naming this elaboration, or the session left nothing for it"}
  lease.coverable:     {read: "some host in `flywheel.yaml` hosts declares this object's kind, its repository (for a bolt, unit or item) and its unit type (for a unit or item); a sink is coverable when some host or the dispatcher declares it in `presents`"}
effects:
  create_line:     {do: "`git push <repo> <parent head>:refs/heads/<line>` with expected-old = zero; the ref exists afterwards"}
  take_parent:     {do: "in the owner's place (a bolt's operator place, an intent's own place): `git merge --no-ff <parent>`, never a rebase (179); on conflict `git merge --abort`; then push the line with expected-old = the head read"}
  seed_take_conflict: {do: "put(new unit): type chore, parent = the line's owner, line = this line, take = the parent head, scope = bolt-line or intent-line, approval = `cadence <cron>` when the cadence fired the take or `response <id>` when a dictation ordered it, state approved; its item's place is prepared off the line with `git merge <parent>` left conflicted in that place only, and its work order names the conflict as the job"}
  land_line:       {do: "policy direct: in the shared line's own checkout `git merge --no-ff <line head>` with a message naming the bolt, then `git push <repo> <parent>` with expected-old = the parent head read; one merge commit, no rewrite (175, 179). Never run under pull-request"}
  write_acceptance: {do: "in the bolt's operator place at the line's head: write `openspec/acceptance.yaml` (`format: flywheel-acceptance/1`, the bolt id and name, one entry per claim the bolt's units cite — name, version, the chapter path, and the scenarios copied from the claim block at that version in the books' shared line — and the units and items that served each); one commit on the bolt's line, message `chore(<bolt>): acceptance` in the Conventional Commits form (185); pushed with expected-old; nothing on an intent's line; a delivery system reads the file from the shared line after the landing and the machinery never runs anything from it (181, 192)"}
  open_request:    {do: "policy pull-request: open the pull request from the line onto the parent, titled by the bolt's name and bodied with its units and the claims they serve, or reuse the open one with that head; the repository's own merge setting (merge, squash or rebase at the git host) is what lands it, and the machinery sets none (175, 179). Enable the host's auto-merge when the repository allows it"}
  seed_request_finding: {do: "for each uncited CHANGES_REQUESTED review or failed check on the request: put(new unit, proposed, type = chore, parent = the bolt, batch = bolt id, scope = bolt-line, document = the review's or check's URL, source = the review id); accepted, its session works a place off the bolt line and merge_place updates the request (176)"}
  remove_line:     {do: "`git push <repo> :refs/heads/<line>`; recorded as an effect with the head it removed"}
  prepare_place:   {do: "`wt worktree add <path> <line>` (ports hashed from the path, portless routes); `.git/info/exclude` gets `.flywheel/`, the untracked per-place prefix for the work order and handoff, the one place the machinery writes in a built repository's tree outside an OpenSpec change and the acceptance file (203); hooks `pre-push`, `reference-transaction`, `pre-merge-commit` that refuse and run `flywheel refuse <what>` (S15) — the git hooks are what refuse, for every kind of agent; the agent program's own deny list (Claude Code settings, codex or opencode config) is written too when the kind has one, and nothing depends on it (173); `.flywheel/work-order.md` rendered from the closed inputs, its deliverables table resolved through `profiles/deliverables.yaml` and `flywheel.yaml` deliverables.<name> overrides at the books commit in the header (190) — handed in, never read back as state"}
  rebase_place:    {do: "`git rebase <line head>` in the place; on conflict `git rebase --abort`"}
  seed_conflict_job: {do: "`git rebase <line head>` left conflicted in the place; append(session thread) the job entry naming the heads and the paths; the session is told through the session binding"}
  merge_place:     {do: "from the item's place: `wt merge <bolt line> --config <the wt config the machinery wrote from flywheel.yaml> --no-remove --format json` — squash to one commit, rebase onto the line head, fast-forward the line; the written config names the commit as `<unit>/<item>: <title>` (its commit generation, when enabled there, supplies the title and the generated text is recorded with the effect); `--no-squash --no-ff` when `flywheel.yaml` repositories[<repo>].item_merge is `merge`; push with expected-old = the line head read; the place is removed by the place machine, not by the merge; the bolt's operator place is then reset to the new head (179, 183, 185); the message is Conventional Commits: `<type>(<bolt>): <item title>` with type from the repository's `flywheel/commit-types.yaml` (its own declaration, 203), else the manifest's unit_types.<type>.commit_type and a body naming unit, item and claims"}
  remove_place:    {do: "`wt worktree remove <path>`; tethered processes end with it (`wt tether`); refused and reported while the owner record is held; recorded with the path and the head it had"}
  record_endpoints: {do: "put(owner): endpoints = place.endpoints_served; the page renders them as links beside the bolt"}
  declare_services: {do: "read `flywheel/services.yaml` at the bolt's place's head (203); for each record with no service object in a live state: put(new service, stopped, parent = the bolt, id = service/<bolt>/<name>, name, command, serves from the record); one put per record, each recorded as its own effect"}
  start_service:   {do: "in the bolt's place: `wt tether start --name service/<name> -- sh -c '<command>'` with PORT from the router in force's `port` (under portless `portless port <name>` for this worktree), BIND from its `bind` (127.0.0.1 under portless and tailnet, 0.0.0.0 under platform) and PLACE = the path; then the router's registration for the port where it needs one (`tailscale serve`, the proxy's admin API), and none under portless or platform (191); the tether binds the process to the worktree so `wt worktree remove` ends it (44, 54); put(service): moved_by = the response id; a tether already present by that name is refused by wt, which is the proof"}
  stop_service:    {do: "`wt tether stop service/<name>` in the bolt's place, then the router's deregistration where it registered one (191); put(service): moved_by = the response id; nothing when no tether by that name exists"}
  remove_stray_places: {do: "for each stray worktree under the places root: `wt worktree remove <path>`; one effect per removal, each recorded with the path and why it was stray"}
  archive_intent:  {do: "`openspec archive <intent-id>` in the intent's place, committed on the intent's line"}
  open_intent:     {do: "`openspec new <intent-id>` from the schema instruction in force, committed on the intent's line"}
  attach_claim:    {do: "`flywheel map attach <claim> <element>` on the books' shared line: write the attachment {claim, to: element} in `context-map/maps/target.js` (the operator's re-attachment replaces the claim's attachments with the elements named), re-render `flywheel/map/target.json` and the block's scope line (outside the lock), leave the text and the version, one commit `chore(map): attach <claim>` pushed with expected-old; the pre-commit hook validates the map against the shipped schema and the block line against the map (105, 195, 200)"}
  record_per_intent: {do: "for each intent in covers beyond the parent: the files the session left under `openspec/changes/<that intent id>/` in its place are committed onto that intent's line, into that intent's change directory, one commit naming the elaboration, and removed from the place in a commit of its own, so the place's merge carries only the parent's records and the book; absent files are nothing to do"}
