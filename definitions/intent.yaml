# One thread of design work about one subject (A.3). Proposed by curation or by
# the operator's dictation; closed only by the operator (21). Its line is off
# the books' shared line, a region of its own; archiving is the landing of that
# line (46, 51).
machine: intent
version: 2
kind: object
object: intent
parent: null
owns: [elaboration, unit]   # units only as chores resolving the line's take conflicts (49)
satisfies: [19, 20, 21, 22, 46, 51, 106, 114]
record:
  subject: string
  signals: list          # cited signal ids; weight is derived from them by event date
  challenges: list       # standing claims its signals argue with
  close_declined_at: time
regions:
  life:
    initial: proposed
    states:
      proposed:
        doc: a decision with its proposed elaborations folded in (10); dictation skips this state
        decision: {kind: intent-proposed, group: approve, answers: ["yes", drop, split], shows: [signals, challenges], satisfies: [10, 106]}
        transitions:
          - when: {response: "yes"}
            to: open
            effects: [{do: open_intent}]
          - when: {response: drop}
            to: dropped
            effects: [{do: drop_signals, args: {reason: intent dropped}, note: each signal keeps a move naming the drop (114)}]
          - when: {response: split}
            to: dropped
            effects: [{do: split_intent, args: {partition: $response}, note: two proposed intents replace this one; signals re-moved to each}]
      open:
        doc: elaborations run here; the line region keeps the intent's line current
        regions:
          material:
            initial: settled
            states:
              settled:
                transitions:
                  - when: {ev: intent.material_pending, is: true}
                    to: settled
                    effects: [{do: propose_elaboration, args: {material: pending, type: from-material}, note: new material joins the one proposal awaiting approval (20)}]
          close:
            initial: not-offered
            states:
              not-offered:
                transitions:
                  - when: {all: [{children: {kind: elaboration, none: [proposed, approved, placing, working, finishing]}},
                                 {children: {kind: elaboration, any: [done]}},
                                 {not: {ev: intent.close_declined_since_last_final, is: true}}]}
                    to: offered
              offered:
                decision: {kind: intent-close, group: decide, answers: [close, keep open], satisfies: [10, 21]}
                transitions:
                  - when: {response: "keep open"}
                    to: declined
                  - when: {children: {kind: elaboration, any: [proposed, approved, placing, working, finishing]}}
                    to: not-offered
                    note: new work arrived; the decision can no longer be made as posed
              declined:
                doc: re-offered only when another elaboration reaches done
                transitions:
                  - when: {not: {ev: intent.close_declined_since_last_final, is: true}}
                    to: not-offered
        transitions:
          - when: {all: [{region: {name: close, in: [offered]}}, {response: close}]}
            to: archiving
            enter: {line: landing}
      archiving:
        doc: the archive lands the intent's line on the books' shared line; proposed claims become standing (46, S34)
        transitions:
          - when: {all: [{ev: intent.archived, is: true}, {final: line.removed}]}
            to: closed
          - when: {final: line.land-failed}
            to: archive-failed
          - when: {not: {ev: intent.archived, is: true}}
            to: archiving
            effects: [{do: archive_intent, note: "the archive commit on the intent's line, before its landing"}]
      archive-failed:
        decision: {kind: land-failed, group: decide, answers: [retry, hold], satisfies: [39]}
        transitions:
          - when: {response: retry}
            to: archiving
            enter: {line: landing}
      closed:
        tail: closed
        final: true
      dropped:
        tail: dropped
        final: true
  line:
    initial: line
    states:
      line:
        machine: line
        params: {parent: books-shared-line, landing_policy: direct}
