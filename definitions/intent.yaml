# One thread of design work about one subject (A.3). Proposed by curation or by
# the operator's dictation; closed only by the operator (22). Its line is off
# the books' shared line, a region of its own; archiving is the landing of that
# line (49, 54). The intent is a change in the books: its change directory
# holds its elaborations' records, and the book holds what they conclude
# (187). An intent named in another elaboration's `covers` is covered by it:
# while that elaboration is proposed or working it counts as this intent's
# one elaboration, so no other is proposed here meanwhile (21, 189), and its
# finish counts toward this intent's close (188).
machine: intent
version: 3
kind: object
object: intent
parent: null
owns: [elaboration, unit]   # units only as chores resolving the line's take conflicts (52)
satisfies: [20, 21, 22, 23, 49, 54, 109, 117, 187, 189]
record:
  subject: string
  signals: list          # cited signal ids; weight is derived from them by event date
  challenges: list       # standing claims its signals argue with
  close_declined_at: time
regions:
  life:
    initial: proposed
    states:
      proposed:
        doc: a decision with its proposed elaborations folded in (10); dictation skips this state
        decision: {kind: intent-proposed, group: approve, answers: ["yes", drop, split], shows: [signals, challenges], satisfies: [10, 109]}
        transitions:
          - when: {response: "yes"}
            to: open
            effects: [{do: open_intent}]
          - when: {response: drop}
            to: dropped
            effects: [{do: drop_signals, args: {reason: intent dropped}, note: each signal keeps a move naming the drop (117)}]
          - when: {response: split}
            to: dropped
            effects: [{do: split_intent, args: {partition: $response}, note: two proposed intents replace this one; signals re-moved to each}]
      open:
        doc: elaborations run here; the line region keeps the intent's line current
        regions:
          material:
            initial: settled
            states:
              settled:
                transitions:
                  - when: {all: [{ev: intent.material_pending, is: true}, {not: {ev: intent.covered_by, in: [proposed, active]}}]}
                    to: settled
                    effects: [{do: propose_elaboration, args: {material: pending, type: from-material}, note: "new material joins the one proposal awaiting approval (21); while another intent's elaboration covers this one, the material waits and is proposed when the cover ends (189)"}]
          close:
            initial: not-offered
            states:
              not-offered:
                transitions:
                  - when: {all: [{children: {kind: elaboration, none: [proposed, approved, placing, working, writing-back, finishing]}},
                                 {not: {ev: intent.covered_by, in: [proposed, active]}},
                                 {any: [{children: {kind: elaboration, any: [done]}}, {ev: intent.covered_by, is: done}]},
                                 {not: {ev: intent.close_declined_since_last_final, is: true}}]}
                    to: offered
                    note: an elaboration covering this intent from another is this intent's work too; its finish is a done here (188)
              offered:
                decision: {kind: intent-close, group: decide, answers: [close, keep open], satisfies: [10, 22]}
                transitions:
                  - when: {response: "keep open"}
                    to: declined
                  - when: {any: [{children: {kind: elaboration, any: [proposed, approved, placing, working, writing-back, finishing]}},
                                 {ev: intent.covered_by, in: [proposed, active]}]}
                    to: not-offered
                    note: new work arrived, here or as a gathering covering this intent; the decision can no longer be made as posed
              declined:
                doc: re-offered only when another elaboration reaches done
                transitions:
                  - when: {not: {ev: intent.close_declined_since_last_final, is: true}}
                    to: not-offered
        transitions:
          - when: {all: [{region: {name: close, in: [offered]}}, {response: close}]}
            to: archiving
            enter: {line: landing}
      archiving:
        doc: the archive lands the intent's line on the books' shared line; proposed claims become standing (49, S34)
        transitions:
          - when: {all: [{ev: intent.archived, is: true}, {final: line.removed}]}
            to: closed
          - when: {final: line.land-failed}
            to: archive-failed
          - when: {not: {ev: intent.archived, is: true}}
            to: archiving
            effects: [{do: archive_intent, note: "the archive commit on the intent's line, before its landing"}]
      archive-failed:
        decision: {kind: land-failed, group: decide, answers: [retry, hold], satisfies: [40]}
        transitions:
          - when: {response: retry}
            to: archiving
            enter: {line: landing}
      closed:
        tail: closed
        final: true
      dropped:
        tail: dropped
        final: true
  line:
    initial: line
    states:
      line:
        machine: line
        params: {parent: books-shared-line, landing_policy: direct}
