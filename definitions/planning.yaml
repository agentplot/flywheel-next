# Planning: one machine per built repository (section 10). Due when the
# repository's backlog fingerprint differs from the one last planned against:
# a claim in scope became standing, a verdict was recorded or fell stale, an
# ask named the repository, a challenge move staled a verdict of a claim in
# scope (101, 116), or a unit came back with notes (28). It sees
# every open bolt of the repository because the fingerprint and the work order
# both include them. A run delivers one proposal: the bolts it proposes and
# the units in each, one decision on the plan (172); the session is charged by
# the machinery and has the fixed exits like any other (171).
machine: planning
version: 2
kind: object
satisfies: [4, 28, 29, 60, 64, 98, 101, 102, 104, 171, 172, 182]
object: planning
singleton: repository
owns: [proposal]
record:
  repository: string
  planned_fingerprint: hash
  redo_notes: list
regions:
  run:
    initial: current
    states:
      current:
        transitions:
          - when: {any: [{ev: planning.fingerprint, ne_ev: planning.planned_fingerprint}, {ev: planning.redo_pending, is: true}]}
            to: due
      due:
        transitions:
          - when: {always: true}
            to: running
      running:
        doc: one session reads the backlog, the as-built and the open bolts and delivers one proposal, the units in it each with a target bolt (172), or a chore on the shared line when no bolt is open (60, 182); a unit answering a verdict a challenge staled cites the signal (101)
        regions:
          place:
            initial: place
            states:
              place:
                machine: place
                params: {line: built-shared-line, inputs: work-order, keep: false}
          session:
            initial: session
            states:
              session:
                machine: session
                params: {agent: planner, place: own-place, work_order: rendered, keep_alive: false}
        transitions:
          - when: {all: [{final: exited}, {ev: session.exit, is: done}]}
            to: applying
          - when: {all: [{final: exited}, {ev: session.exit, in: [stalled, invalid]}]}
            to: failed
          - when: {final: lost}
            to: failed
          - when: {response: retire}
            to: failed
            enter: {session: ended, place: removing}
            note: dictation retires the session (4); the run is due again on the next tick
      applying:
        doc: verdicts to the ledger, the proposal and its units to the plan, the fingerprint recorded, all in one write
        entry:
          - {do: record_verdict, args: {verdict: each, claim_version: each, revision: each, evidence: each}, note: "every verdict the session delivered, including not-applicable"}
          - {do: propose_units, args: {units: delivered}, note: "each unit in in-proposal, naming the proposal; a first planning's proposal is the baseline"}
          - {do: record_proposal, args: {document: delivered, units: delivered}, note: "one proposal in proposed; the previous one of this repository still open is superseded by it, silently (35, 172)"}
          - {do: record_fingerprint}
        transitions:
          - when: {always: true}
            to: current
      failed:
        entry: [{do: report, args: {text: planning session did not deliver}}]
        transitions:
          - when: {always: true}
            to: current
            note: the fingerprint still differs, so planning is due again on the next tick; a repeated failure is visible in the run record, never filed as work
