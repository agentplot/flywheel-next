# One agent process working one job in one place (A.7). Template: run inside
# an elaboration type, a stage, curation, planning, capture reading and the
# operator's own session. Event-driven life is read as evidence each tick; the
# machinery never pushes anything into a working session (I5). Its exits are
# the fixed set — done, blocked, stalled — reported through the command the
# machinery provides, which writes to the state store (67); offers of a
# finding, a chore or a signal go the same way. Nothing on the place's disk is
# state. This is the one binding a stand-in replaces (93).
# The pane and the agent are named by the session id, in the workspace of the
# object's bolt or intent and the tab of its unit or elaboration (196). A
# session speaks to the machinery only through the tools, each call carrying
# the identity issued at its start; the machinery speaks to it only through
# its thread; sessions never message each other (197). While the host that
# holds the session's owner is away (150a), the pane, activity, idle time and
# exit read as the host last reported them and the idle clock pauses, so the
# session is neither lost nor stalled by the host's absence.
# A prompt the program puts to its own pane — a trust dialog, a permission it
# asks a person for before a command — is never the session's exit and reads
# as neither idle nor blocked; the binding answers it from what the pane
# shows, yes to the order's own commands and no to any other, the no a
# refusal on the thread (72, sessions.yaml prompts); the place admits the
# session's own work in its tree outright, so the no never falls on a
# deliverable (67, host.yaml prepare_place).
# A session its type does not keep alive is ended on the pass that records
# its exit — done, stalled or invalid alike — after its deliverables are read,
# so its pane closes then; blocked is not an exit and keeps the pane for the
# answer; a kept session (standing, with-operator) keeps its pane until its
# owner ends it; a pane gone without an exit is lost and there is nothing to
# end (74). The host's reconciliation ends any pane still open for a session
# already exited or retired (engine/host.yaml end_exited_sessions).
machine: session
version: 6
kind: template
tier: core
satisfies: [4, 24, 65, 66, 67, 70, 71, 72, 73, 80, 93, 150, 171, 173, 174, 183, 190, 196, 197, 226, 251]
params:
  agent: the agent definition to start
  kind: the agent program that runs it — claude, codex or opencode; default claude; started through the one command whatever the kind (173)
  model: "the model it runs, resolved by the owner when the session is requested — the stage's or type's own, else the manifest's default for the role that charged it (173, sessions.yaml models); never the program's own configuration (183)"
  place: the place prepared for it
  work_order: the closed set of inputs, rendered by the engine from the context enumeration for the session's type (profiles/context.yaml, 226) and handed into the place
  deliverables: "the entries {name, producer, schema, surface} the owner names; the producers, schemas and surfaces in force are resolved when the session starts and written into the work order with their versions, and the names are recorded as expected (88, 89, 190)"
  keep_alive: "whether idle keeps the process (standing, with-operator, the operator's own) or the exit ends it: a session with keep_alive false is ended on the pass that records its exit, done, stalled or invalid alike (74)"
record:
  id: session-id           # deterministic: <owner id>/<stage or type>/<attempt>; also the pane's and the agent's name (196)
  identity: string         # the token issued at start and written into the work order; every tool call from the pane carries it (197)
  keep_alive: bool         # the owner's keep_alive, written at start so the exit can read it (74)
  agent: string            # the agent definition it was started as (params.agent)
  kind: string             # the program it runs as — claude, codex or opencode — written at start (173)
  model: string            # the model it was started with, written at start so the chip names it (173, S53)
  host: host-id
  started_at: time
  exit: enum
  expected: list
  delivered: list
  blocks: int
regions:
  life:
    initial: requested
    states:
      requested:
        doc: the parent decided a session should exist here
        transitions:
          - when: {always: true}
            to: starting
            effects: [{do: start_session, args: {agent: $agent, kind: $kind, model: $model, place: $place, work_order: $work_order}, note: "in the multiplexer session the manifest gives it — by default intents, bolts or machinery, by who charged it (174) — in its object's workspace and tab, the pane named by the session id (196), with its identity issued first (197)"}]
      starting:
        doc: slow is slow, not failed (72); the proof is the pane, never the start command's return
        transitions:
          - when: {ev: session.pane, is: present}
            to: alive
          - when: {always: true}
            to: starting
            effects: [{do: start_session, args: {agent: $agent, kind: $kind, model: $model, place: $place, work_order: $work_order}, note: retry by the same name; refused if it already exists}]
      alive:
        doc: the process exists; its inner state is what the multiplexer and the command's records report
        regions:
          activity:
            initial: working
            states:
              working:
                transitions:
                  - when: {ev: session.offers_pending, is: true}
                    to: working
                    effects: [{do: record_offers, note: "findings, chores and signals are recorded the moment they are offered, as records pointing at their documents; the session is not interrupted (58, 62)"}]
                  - when: {ev: session.refusals_pending, is: true}
                    to: working
                    effects: [{do: record_refusals}, {do: report, args: {text: a session attempted a line operation and was refused}}]
                  - when: {ev: session.exit, is: blocked}
                    to: blocked
                    bump: blocks
                    effects: [{do: record_exit}]
                  - when: {ev: session.exit, in: [done, stalled, invalid]}
                    to: exited
                    effects: [{do: record_exit, note: "expected and delivered recorded together (80); an invalid report is recorded as stalled with the raw text, and the command says so the same way for an exit and an offer: the refusal is recorded on the session, with the raw report"}]
                  - when: {ev: session.activity, is: idle}
                    to: idle
              idle:
                doc: no exit reported and no activity; the type decides what idle means
                transitions:
                  - when: {ev: session.activity, is: working}
                    to: working
                  - when: {ev: session.offers_pending, is: true}
                    to: idle
                    effects: [{do: record_offers}]
                  - when: {ev: session.exit, is: blocked}
                    to: blocked
                    bump: blocks
                    effects: [{do: record_exit}]
                  - when: {ev: session.exit, in: [done, stalled, invalid]}
                    to: exited
                    effects: [{do: record_exit}]
              blocked:
                doc: the session stopped only itself; its question is a decision answerable on the page or in chat, never in the pane (68, 70)
                decision: {kind: question, group: answer, answers: ["<text>"], page_only: false, satisfies: [10, 68, 70, 82]}
                transitions:
                  - when: {response: "<text>"}
                    to: working
                    effects: [{do: deliver_answer, args: {text: $response}, note: "to the same session if it lives, else a fresh one that starts with it"}]
              exited:
                doc: an exit was reported and recorded; the owner reads session.exit. Blocked never comes here (70)
                final: true
          presence:
            initial: unknown
            states:
              unknown:
                transitions:
                  - when: {ev: session.pane, is: absent}
                    to: gone
              gone:
                doc: the pane vanished without an exit report; the owner decides whether to start again
                final: true
        transitions:
          - when: {all: [{region: {name: activity, in: [exited]}}, {ev: session.keep_alive, is: false}]}
            to: exited
            effects: [{do: end_session, note: "the type does not keep the session: the pane closes on the pass that recorded the exit, after the deliverables were read (record_exit ran first); done, stalled and invalid alike, since what went wrong is the exit's report on the thread and the work in the place, and the pane's scrollback was never state (67, 68, 74)"}]
          - when: {region: {name: activity, in: [exited]}}
            to: exited
            note: a kept session (standing, with-operator) stands after its exit until its owner ends it (25, 26)
          - when: {all: [{region: {name: presence, in: [gone]}}, {not: {ev: session.exit, in: [done, blocked, stalled, invalid]}}]}
            to: lost
      exited:
        doc: exit recorded; the owner reads session.exit and decides what it means (66). A session its type does not keep has no pane here (74); a kept one has, until its owner ends it
        final: true
      lost:
        doc: process gone without an exit — including a pane the operator killed by hand, which is never read as a response (4); standing owners restart it, stages start a fresh attempt. Nothing to end; the pane is already absent (73)
        final: true
      ended:
        doc: reached only by the owner's explicit end (a type's rule, the operator's response, or retirement of the work, I6, 74); a pane already gone is not an error, the end is what was wanted (73)
        entry: [{do: end_session}]
        final: true
