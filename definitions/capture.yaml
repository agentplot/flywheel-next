# One source event as recorded (111). Captured by an adapter unattended — one
# kind of adapter, an enumerator run by the tick of the host that declares the
# source (215, 231, host.yaml run_adapters) — and read into signals by a
# session's judgment (115), except a forwarded single message, which is its
# own excerpt and needs no judgment (S21). The reader is charged by the tick
# of the host that declares the capture's source (217e); the capture endpoint
# for callers that cannot reach any host's binary is dispatch's (216).
# On the hosted tiers the endpoint is a managed queue per organization with no
# compute in the acknowledgement path: the queue is the caller's retry buffer
# and not state, and its bodies are encrypted under the organization's key
# (271). Raw material a capture points at is never read on a host serving more
# than one organization (263): triage that must follow a pointer into the raw
# store runs on the operator's own machine or on a pool host, while a capture
# whose whole content is in hand carries no pointer and may be triaged in the
# tick that took it. The binary's own instrumentation writes captures
# about its operation — stalls, refusals, runway readings — to the agentplot
# organization's flywheel, carrying no organization content (288).
machine: capture
version: 2
kind: object
tier: core
satisfies: [4, 19, 106, 111, 112, 114, 115, 178, 181, 215, 216, 263, 271, 288]
object: capture
parent: null
owns: [signal]
record:
  source: string
  event_key: string      # the identity: capturing the same event twice yields one capture (S22)
  event_at: time
  captured_by: string
  raw: ref               # pointer to the raw material, outside version control
regions:
  reading:
    initial: captured
    states:
      captured:
        transitions:
          - when: {ev: capture.signals_present, is: true}
            to: read
          - when: {ev: capture.source, is: forwarded-message}
            to: captured
            effects: [{do: ensure_signal, note: "one message, one signal, the kind the operator's response gave or ask"}]
          - when: {always: true}
            to: reading
      reading:
        regions:
          place:
            initial: place
            states:
              place:
                machine: place
                params: {line: blueprints-shared-line, inputs: work-order, keep: false}
          session:
            initial: session
            states:
              session:
                machine: session
                params: {agent: capture-reader, place: own-place, work_order: rendered, keep_alive: false, deliverables: [{name: signal, producer: default, schema: default, surface: default}]}
        transitions:
          - when: {all: [{final: exited}, {ev: session.exit, is: done}]}
            to: read
            effects: [{do: record_offers, note: "the signals the session read are written once, immutable"}]
          - when: {any: [{final: lost}, {all: [{final: exited}, {ev: session.exit, in: [stalled, invalid]}]}]}
            to: captured
            effects: [{do: report, args: {text: capture reader did not deliver}}]
          - when: {response: retire}
            to: captured
            enter: {session: ended, place: removing}
            note: dictation retires the reader (4)
      read:
        final: true
