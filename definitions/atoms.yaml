# The domain's atoms: one evidence name per question asked of the world, one
# effect name per act on it (87). Machine definitions may use only these
# names; a profile binds every one of them (B.3). Names are abstract: nothing
# here is a label, column, path, service or interface (I13, 138).
#
# Every effect names its proof: the evidence that shows it has already been
# done. The engine performs an effect only when its proof is absent, so a
# repeat of a completed effect changes nothing (73, 127). Every effect states
# the requirements it satisfies by number; check.py fails when a number does
# not exist or a requirement is cited nowhere.
# 223–225 are properties of the registry as a whole — the tier every file
# carries, the versions and the content hashes check.py keeps, the
# statecharts render.py draws from the same files — and are cited here
# because this is the one file every machine depends on; 252 and 301 likewise
# — the identity definitions (profiles/identity.yaml) ship with the same set,
# they are the one place any of them is defined, and each control plane's own
# release syncs them into its own environment and nothing else does.
format: flywheel-atoms/1
satisfies: [87, 138, 139, 223, 224, 225, 252, 301]

evidence:
  # ---- engine-provided for every object (read through the profile's `read`)
  state:            {of: any, type: state, doc: the object's current state path per region}
  entered_at:       {of: any, type: time, doc: when the current state was entered}
  seq:              {of: any, type: int, doc: the object's write sequence; the compare-and-swap base}
  applied_responses: {of: any, type: list, doc: ids of the responses this object has applied}
  now:              {of: any, type: time, doc: the point the read is as of}
  # ---- host and lease (engine machines)
  host.last_seen:   {of: host, type: time}
  host.bound:       {of: host, type: int, doc: sessions this host may run at once}
  host.running:     {of: host, type: int, doc: sessions this host runs now}
  host.stray_places: {of: host, type: bool, doc: a place exists on this host that belongs to no live object and is not held (55)}
  host.disk_layout:  {of: host, type: enum, values: [absent, current, differs], doc: the root the manifest names holds the profile's layout — bare clones, one shared-line checkout each, places as worktrees — or nothing yet, or something hand-made (205)}
  host.layout_difference: {of: host, type: string, doc: what differs from the profile's layout, for the refusal (205)}
  host.layout_repair: {of: host, type: string, doc: the repair the doctor proposes for the first difference — re-clone the bare repository, re-check the shared line out, move a hand-changed checkout aside; shown with the difference and never run without the response (222)}
  host.adapters_due:  {of: host, type: bool, doc: a source this host declares has a cadence that fired since its last enumeration, or a folder drop or a webhook delivery is waiting; every timed behaviour of a host is a guard on its tick (215, 231)}
  host.platform:      {of: host, type: string, doc: the platform the operator picked when adding the host, with the parts chosen (230)}
  host.environment_satisfied: {of: host, type: bool, doc: the host's environment provider can activate the environment every repository it declares needs, at the declared versions (238); false is the host-environment decision and the host covers none of that work (149)}
  host.environment_difference: {of: host, type: string, doc: the first repository and tool the host cannot satisfy, for the decision (238)}
  host.pool:          {of: host, type: string, doc: the pool that provisioned this host, or none for a host the operator added (240)}
  host.intermittent:  {of: host, type: bool, doc: declared intermittent — a laptop by default, a cloud or pool host not (150a); past its stale window it is away, not gone}
  host.work_waiting:  {of: host, type: bool, doc: a numbered decision stands on an object this host holds, or approved work waits that only this host covers or whose lease it holds (150a); what turns an away host into the takeover decision}
  host.idle_since:    {of: host, type: time, doc: when the host last ran a session or held a lease that could fire; for a pool host's retirement (240)}
  place.environment:  {of: place, type: string, doc: the environment version activated in the place by prepare_place — the declaration's hash and the provider — recorded with the place (238)}
  # ---- pools (240–242)
  pool.image_current: {of: pool, type: bool, proof_of: build_image, doc: the pool's image was built from the current environment declarations of every repository the pool covers; false is an image behind the declarations, shown on the hosts surface (239)}
  pool.demand:        {of: pool, type: bool, doc: approved work the pool covers waits behind the bound of every alive host covering it and the instrument reads drain is the limit (214, 242)}
  pool.live:          {of: pool, type: int, doc: hosts of this pool alive now}
  pool.bound:         {of: pool, type: int, doc: the most hosts the pool may run at once (240)}
  pool.cost_allows:   {of: pool, type: bool, doc: one more host stays within the cost setting the manifest names for the pool (242)}
  pool.idle_host:     {of: pool, type: bool, doc: a host of the pool has been idle longer than the pool's retire time and holds nothing (240)}
  # ---- instance and repository (bootstrapping, 204–208)
  instance.blueprints_ready:   {of: instance, type: bool, proof_of: create_blueprints, doc: the blueprints repository exists on the git host with everything the blueprints template requires at the recorded set version (204, 208)}
  instance.state_ready:   {of: instance, type: bool, proof_of: create_state, doc: the state repository exists with the profile's layout (204, C.2)}
  instance.app_recorded:  {of: instance, type: bool, proof_of: register_app, doc: the manifest names the App and the state records that its installation is required (204, 207)}
  instance.app_installed: {of: instance, type: bool, doc: the App's installation on the instance is seen through the git host with the secret the operator placed (207)}
  instance.app_id:        {of: instance, type: string}
  instance.host_registered: {of: instance, type: bool, proof_of: register_host, doc: the first host's record exists and the manifest lists it (204, 205)}
  # ---- packages (228, 229)
  package.kind:       {of: package, type: string, doc: adapter, chat-sink, runner, router, sign-in, unit-type, elaboration-type, deliverable-producer, map-vocabulary, template or scenario-pack (228)}
  package.scope:      {of: package, type: enum, values: [instance, host], doc: an instance package installs into the blueprints under the prefix and is read by every host at the shared line; a per-host package installs on the named host (228)}
  package.secrets_placed: {of: package, type: bool, doc: every secret the package declares is placed where the host or the platform keeps secrets; placed by the operator, never by an agent (207, 229)}
  repository.nodes:  {of: repository, type: list, doc: the map nodes the proposal places, each homed here (199, 206)}
  repository.repo:   {of: repository, type: string}
  repository.exists: {of: repository, type: bool, proof_of: create_repository, doc: the repository exists on the git host under the instance; true at once when adopted (206)}
  repository.registered: {of: repository, type: bool, proof_of: register_repository, doc: the manifest entry, the flywheel/ declarations, the map nodes with their homes and the planning record all exist (199, 203, 206)}
  repository.covered_by_app: {of: repository, type: bool, proof_of: extend_installation, doc: the App's installation lists the repository (207)}
  lease.holder:     {of: any, type: host-id, doc: the host recorded as holding the object, or none}
  lease.renewed_at: {of: any, type: time}
  lease.holder_is_me: {of: any, type: bool}
  lease.coverable:  {of: any, type: bool, doc: some host's manifest declaration covers this object's kind, repository and unit type (149)}
  # ---- response, rail and sinks
  response.decision_present: {of: response, type: bool, doc: the decision this response answers still stands; a dictation is always present}
  response.applied: {of: response, type: bool, doc: the object it concerns lists the response as applied}
  response.reported: {of: response, type: bool, doc: a delivery after the failure carried the attention line}
  response.answer:  {of: response, type: string}
  rail.unnumbered:  {of: rail, type: bool, doc: a standing decision has no number in the rail's register}
  sink.due:         {of: sink, type: bool, doc: a decision of a kind routed to this sink was created since the sink's mark, the sink's cadence fired, or the operator asked (82)}
  # ---- session (bound to the multiplexer and the exit command; the one binding a stand-in replaces, 93)
  session.pane:       {of: session, type: enum, values: [absent, present]}
  session.activity:   {of: session, type: enum, values: [working, idle, none]}
  session.idle_since: {of: session, type: time}
  session.exit:       {of: session, type: enum, values: [none, done, blocked, stalled, invalid], doc: the exit the session reported through the machinery's command (67); invalid when the report fails the schema}
  session.exit_recorded: {of: session, type: bool, doc: the session record carries the exit, with expected and delivered compared (80)}
  session.offers_pending: {of: session, type: bool, doc: findings, chores or signals the session offered through the command and no proposal or signal record yet points at (62)}
  session.refusals_pending: {of: session, type: bool, doc: refusals the place's hooks reported and no thread entry yet holds}
  session.answer_delivered: {of: session, type: bool}
  session.message_delivered: {of: session, type: bool, doc: the last message the machinery queued for the session reached it}
  session.operator_present: {of: session, type: bool, doc: a person typed in the pane within the window the profile states (25)}
  session.host_alive: {of: session, type: bool}
  session.identity:   {of: session, type: string, doc: the token issued when the machinery started the session and written into its work order; every tool call from the pane carries it, and the tool server refuses a mismatch (197)}
  host.layout_current: {of: host, type: bool, proof_of: remove_stale_layout, doc: the multiplexer's workspaces and tabs on this host name only objects still in a view (186, 196)}
  session.expected:   {of: session, type: list, doc: the deliverable names the work order asked for, each with the producer, schema and surface in force when the session started (190)}
  session.delivered:  {of: session, type: list}
  # ---- place and line (bound to git and the worktree tool, the same in every profile)
  place.exists:        {of: place, type: bool}
  place.contains_line: {of: place, type: bool, doc: the line's head is an ancestor of the place's head}
  place.ahead_of_line: {of: place, type: bool, doc: the place has commits the line lacks}
  place.conflicted:    {of: place, type: bool}
  place.merge_slot:    {of: place, type: bool, doc: no sibling place earlier in the fixed order is merging}
  place.merged:        {of: place, type: bool, doc: the line's head contains the place's head}
  place.job_seeded:    {of: place, type: bool, doc: the conflict job is in the place and on the session's thread}
  place.conflict_retries: {of: place, type: int, doc: the owner record counter}
  place.line_moved_told: {of: place, type: bool}
  place.held:          {of: place, type: bool, doc: the operator holds this place by dictation; it is not removed while held (55)}
  place.endpoints_served: {of: place, type: list, doc: the endpoints the processes tethered to the place serve now, as URLs the host's router in force names (46, 191)}
  # ---- service (a declared process in a bolt's place; bound to the tether and the port router, the same in every profile)
  service.process:       {of: service, type: enum, values: [absent, present, exited], doc: the process by the service's tether name in the bolt's place — none, running, or ended with its exit recorded (47)}
  service.serving:       {of: service, type: bool, doc: the endpoint answers, or the declaration's readiness command passes}
  service.endpoint:      {of: service, type: string, doc: the URL the host's router names for this service's port in this place — local, private-network or platform, per the manifest — so two places on one host never collide and nothing beyond the private network is published (45, 46, 191)}
  service.failure:       {of: service, type: string, doc: the exit status and the last lines of the process's log}
  service.place_present: {of: service, type: bool, doc: the bolt's place the service belongs to exists on the host}
  service.declared:      {of: service, type: bool, doc: the repository's service data at the place's head still names this service (47)}
  line.exists:           {of: line, type: bool}
  line.contains_parent:  {of: line, type: bool, doc: the parent line's head is an ancestor of this line's head}
  line.take_due:         {of: line, type: bool, doc: first place, pre-landing, or the repository's cadence says take now}
  line.take_conflicts:   {of: line, type: bool, doc: a dry take of the parent reports conflicts}
  line.landed:           {of: line, type: bool, doc: the parent line's head contains this line's head}
  line.landing:          {of: line, type: enum, values: [none, pending, passed, failed], doc: the repository's own gates on the landing}
  line.retries:          {of: line, type: int}
  line.conflict_job_done: {of: line, type: bool, doc: the conflict chore unit on this line is merged}
  line.policy:           {of: line, type: enum, values: [direct, pull-request], doc: the repository's landing policy from the manifest (175); the blueprints' lines land direct}
  line.request:          {of: line, type: enum, values: [none, open, merged, closed], doc: the pull request opened from this line, as the git host reports it (175)}
  line.request_review_pending: {of: line, type: bool, doc: a review on the request asks for a change and no finding record yet points at it (176)}
  line.request_links:    {of: line, type: list, doc: links the git host or an integration publishes for the request — check runs, deployments, ephemeral environments — read by an adapter, never made by the machinery (177)}
  # ---- design side
  intent.material_pending: {of: intent, type: bool, doc: attached signals or findings no proposal yet holds}
  intent.close_declined_since_last_final: {of: intent, type: bool}
  intent.archived:   {of: intent, type: bool, doc: the change directory is archived and its claims are on the shared line}
  elaboration.type:  {of: elaboration, type: string}
  elaboration.type_version: {of: elaboration, type: int}
  elaboration.shown_with_parent: {of: elaboration, type: bool, doc: the parent intent is itself proposed; the decision folds into the intent's}
  elaboration.kept_since: {of: elaboration, type: time}
  intent.covered_by: {of: intent, type: enum, values: [none, proposed, active, done], doc: the state of the newest elaboration owned by another intent whose covers name this one — none when there is none, proposed while it awaits approval, active from approved to finishing, done once it finished (188, 189)}
  # ---- claims and ledger (bound to the blueprints repository and the ledger store)
  claim.on_shared_line: {of: claim, type: bool}
  claim.on_intent_line: {of: claim, type: bool}
  claim.attached:       {of: claim, type: bool, proof_of: attach_claim, doc: the claim's block in its chapter lists the map id the response named among its attachments, and the id exists in the target map (97, 200)}
  claim.detached:       {of: claim, type: bool, proof_of: detach_claim, doc: the claim's block no longer lists the id the response named}
  map.home_set:         {of: any, type: bool, proof_of: set_home, doc: the element or context in the target map carries the home the response named (199)}
  map.edited:           {of: any, type: bool, proof_of: map_edit, doc: the target map holds the context, element, relationship or link as the response gave it, with its ref, and the check passes (120, 198)}
  map.status_set:       {of: any, type: bool, proof_of: set_map_status, doc: the id carries the status the response named, with its question when open and none otherwise (198)}
  rail.review_marked:   {of: rail, type: bool, proof_of: mark_reviewed, doc: the operator's review mark names the blueprints revision the response was given at (122)}
  claim.version:        {of: claim, type: int}
  claim.scope_repos:    {of: claim, type: list, doc: the repositories the claim is in scope for, computed from the target map through homes — a context gives its home and every home of its elements, an element its effective home, a relationship both contexts' scope and the kernel's homes, a link both elements' — derived and never chosen; empty when it attaches to nothing (105, 198, 200)}
  cell.verdict:         {of: ledger-cell, type: enum, values: [none, satisfied, partial, not-satisfied, not-applicable]}
  cell.verdict_claim_version: {of: ledger-cell, type: int}
  cell.claim_version:   {of: ledger-cell, type: int}
  cell.evidence_present: {of: ledger-cell, type: bool, doc: the evidence the verdict cites still exists at the repository's shared head}
  cell.in_scope:        {of: ledger-cell, type: bool, doc: the cell's repository is in claim.scope_repos — it homes something the claim attaches to on the target map; tags, kinds and derivation are never read here (105, 195, 200)}
  cell.challenged:      {of: ledger-cell, type: bool, doc: a signal with a standing challenge move against this cell's claim was recorded after the verdict's judged_at, so the verdict is stale in every repository that has one (101, 116)}
  # ---- planning and curation
  planning.fingerprint:  {of: planning, type: hash, doc: hash of the repository's backlog inputs — the elements and contexts homed in the repository with their ids, kinds and effective homes and the kinds and capabilities derived from them (199), the attachments whose scope reaches it (200), standing claims in scope with versions, the ledger's cells with their freshness, the challenge moves standing against claims in scope (101), the open bolts and their citations, the asks naming it}
  planning.planned_fingerprint: {of: planning, type: hash}
  planning.redo_pending: {of: planning, type: bool, doc: a unit was sent back with notes}
  planning.ledger_empty: {of: planning, type: bool}
  curation.unmoved_count: {of: curation, type: int}
  curation.threshold:     {of: curation, type: int}
  curation.cadence_due:   {of: curation, type: bool}
  capture.signals_present: {of: capture, type: bool}
  signal.move: {of: signal, type: enum, values: [none, attach, challenge, join, answered, route, drop], doc: the standing move's target word (107); route names the chore or ask curation offered (116)}
  # ---- construction side
  bolt.chores_outstanding: {of: bolt, type: bool, doc: accepted chore units not yet merged}
  bolt.citations_moved:    {of: bolt, type: bool, doc: a started unit of this bolt cites a claim whose standing version is newer, and no citation choice is recorded (103)}
  bolt.moved_claim:        {of: bolt, type: string}
  bolt.hold_since_last_merge: {of: bolt, type: bool}
  unit.claim_moved:        {of: unit, type: bool, doc: this unit cites a claim whose standing version is newer than the one cited, and no choice is recorded for it (35)}
  unit.claim_answer:       {of: unit, type: enum, values: [none, captured, declined], doc: "the operator's answer on the review surface for a unit that landed citing no claim: none until asked, captured when its change was attached to an intent where a claim is written, declined when nothing there was worth one. Stored on the unit and never on the ledger, since a unit naming no claim has no cell (317, 34a); asked once and stored once, as a not-applicable verdict is (101)"}
  unit.target_is_new_bolt: {of: unit, type: bool}
  unit.deps_merged:        {of: unit, type: bool}
  unit.type:               {of: unit, type: string}
  unit.type_version:       {of: unit, type: int}
  unit.batch:              {of: unit, type: string, doc: baseline id or none; equal values fold into one decision}
  unit.proposal:           {of: unit, type: enum, values: [none, proposed, approved, withdrawn, deferred, superseded], doc: the state of the proposal that names this unit; none when no proposal does (172)}
  proposal.replaced:       {of: proposal, type: bool, doc: planning's next run recorded a newer proposal for the repository (35, 172)}
  item.deps_merged:        {of: work-item, type: bool}
  item.slot_free:          {of: work-item, type: bool, doc: this host has a free slot and no earlier ready item is waiting for it}
  item.send_backs:         {of: work-item, type: int}
  item.retry_max:          {of: work-item, type: int, doc: from the type, for the current stage}
  item.stage_is_last:      {of: work-item, type: bool}
  item.change_archived:    {of: work-item, type: bool, doc: the item's OpenSpec change is archived in its place — its specifications moved into the standing set — or the type needs no change directory, which holds vacuously}
  stage.agents:            {of: stage, type: list, doc: the session set the type's rule resolves against the repository worked}
  stage.join_met:          {of: stage, type: bool}
  stage.verdict:           {of: stage, type: enum, values: [pending, pass, not-done, blocked, stalled]}
  chore.scope:             {of: unit, type: enum, values: [bolt-line, intent-line, shared-line]}

  # ---- proofs: the evidence each effect leaves behind (read like any other evidence)
  session.pane_absent:      {of: session, type: bool, proof_of: end_session}
  session.offers_recorded:  {of: session, type: bool, proof_of: record_offers, doc: every offer the session made has a proposal or signal record pointing at its document}
  session.refusals_recorded: {of: session, type: bool, proof_of: record_refusals}
  line.conflict_job_seeded: {of: line, type: bool, proof_of: seed_take_conflict, doc: a chore unit in approved exists for this line and this take}
  line.absent:              {of: line, type: bool, proof_of: remove_line}
  line.request_opened:      {of: line, type: bool, proof_of: open_request, doc: a request from this line exists at the git host, open, merged or closed}
  line.acceptance_written:  {of: line, type: bool, proof_of: write_acceptance, doc: the acceptance file at the line's head names every claim the owning bolt's units named, at the versions they cite, with each claim's scenarios; true at once on a line whose owner is not a bolt (192)}
  line.request_review_recorded: {of: line, type: bool, proof_of: seed_request_finding, doc: every review on the request that asks for a change has a finding record pointing at it}
  place.ready:              {of: place, type: bool, proof_of: prepare_place, doc: exists, contains its line, holds the closed inputs — the schema instruction, the type skill, the producers in force for each deliverable, the work order, the change's artifacts — and the refusing hooks (89, 190)}
  place.absent:             {of: place, type: bool, proof_of: remove_place}
  place.endpoints_recorded: {of: place, type: bool, proof_of: record_endpoints, doc: the owner record's endpoints equal the endpoints served}
  service.process_absent:   {of: service, type: bool, proof_of: stop_service, doc: no process by the service's tether name in the place}
  service.endpoint_recorded: {of: service, type: bool, proof_of: record_service_endpoint, doc: the service record's endpoint equals the endpoint served}
  bolt.services_declared:   {of: bolt, type: bool, proof_of: declare_services, doc: one service object in a state other than gone exists for every declaration in the repository's service data at the place's head}
  host.no_stray_places:     {of: host, type: bool, proof_of: remove_stray_places}
  intent.change_open:       {of: intent, type: bool, proof_of: open_intent}
  intent.signals_dropped:   {of: intent, type: bool, proof_of: drop_signals}
  intent.split_done:        {of: intent, type: bool, proof_of: split_intent}
  intent.material_held:     {of: intent, type: bool, proof_of: propose_elaboration}
  elaboration.type_set:     {of: elaboration, type: bool, proof_of: set_type}
  elaboration.covers_set:   {of: elaboration, type: bool, proof_of: set_covers, doc: the record's covers equal the response's set}
  elaboration.records_fanned_out: {of: elaboration, type: bool, proof_of: record_per_intent, doc: every covered intent beyond the parent has on its line the records the session left for it; true at once when covers names the parent alone}
  curation.gatherings_proposed: {of: curation, type: bool, proof_of: gather_elaborations, doc: every gathering the session delivered exists as one proposed elaboration covering the named intents}
  cell.verdict_recorded:    {of: ledger-cell, type: bool, proof_of: record_verdict, doc: a verdict with this claim version, revision and judged_at exists}
  curation.moves_recorded:  {of: curation, type: bool, proof_of: record_moves}
  curation.intents_proposed: {of: curation, type: bool, proof_of: propose_intents}
  planning.units_proposed:  {of: planning, type: bool, proof_of: propose_units}
  planning.fingerprint_recorded: {of: planning, type: bool, proof_of: record_fingerprint}
  planning.proposal_recorded: {of: planning, type: bool, proof_of: record_proposal, doc: a proposal record in proposed names every unit the session delivered}
  proposal.answer_forwarded: {of: proposal, type: bool, proof_of: forward_answer, doc: the unit the answer names lists the forwarded response as applied}
  unit.bolt_exists:         {of: unit, type: bool, proof_of: create_bolt}
  bolt.named:               {of: bolt, type: bool, proof_of: rename_bolt}
  unit.routed:              {of: unit, type: bool, proof_of: route_unit}
  unit.claim_answer_recorded: {of: unit, type: bool, proof_of: record_claim_answer, doc: an answer for this unit is stored, so the review view never lists it again (317)}
  unit.items_exist:         {of: unit, type: bool, proof_of: create_items}
  citation_choice_recorded: {of: any, type: bool, proof_of: record_citation_choice, doc: the bolt or unit record holds a choice for the moved claim and version}
  rail.numbered:            {of: rail, type: bool, proof_of: number_decisions, doc: every standing decision has a number in the rail's register}
  sink.delivered:           {of: sink, type: bool, proof_of: deliver_rail, doc: the sink's mark is newer than every decision routed to it and its delivery carries the current numbers}
  rail.status_current:      {of: rail, type: bool, proof_of: render_status, doc: the projection carries the read's as-of point}
  report.recorded:          {of: any, type: bool, proof_of: report}
  host.leases_expired:      {of: host, type: bool, proof_of: expire_leases}
  host.repositories_cloned: {of: host, type: bool, proof_of: clone_repositories, doc: the state, the blueprints and every tracked built repository are cloned bare under the root with a checkout of each shared line (205)}
  host.adapters_run:  {of: host, type: bool, proof_of: run_adapters, doc: every due enumerator of this host has run over its source since its cadence fired, and no waiting drop or delivery lacks a capture under its key (111, 215)}
  host.layout_repaired: {of: host, type: bool, proof_of: repair_layout, doc: the doctor reports the root current after the repair the response ordered (222)}
  host.token_issued:  {of: host, type: bool, proof_of: issue_enrolment_token, doc: a one-time enrolment token for this host exists, unexpired and unused (230)}
  host.secrets_placed: {of: host, type: bool, proof_of: place_secrets, doc: the chosen parts' secrets are in the platform's secret store for the new host; the operator's platform credentials are stored nowhere (230)}
  rail.owner_recorded: {of: rail, type: bool, proof_of: assign_owner, doc: the object whose decision the response named carries the owner the response gave (237)}
  pool.host_added:    {of: pool, type: bool, proof_of: provision_pool_host, doc: a host record of this pool exists in enrolment awaiting-join or later for the provisioning the effect id names (240)}
  pool.host_retired:  {of: pool, type: bool, proof_of: retire_pool_host, doc: the idle host the effect named is gone from the platform and its record released (240)}
  instance.retired:        {of: instance, type: bool, proof_of: retire_instance, doc: every session of the instance is ended, every place removed, its state archived, its git repositories still on disk (221)}
  package.installed:  {of: package, type: bool, proof_of: install_package, doc: the package's files are in place at the declared tag — under the blueprints' prefix for an instance package, under the host's root for a per-host one — its content hash is registered (224) and what it runs is running (228)}
  package.configured: {of: package, type: bool, proof_of: configure_package, doc: the package's configuration on disk equals the response's, validated against the package's schema (229)}
  package.stopped:    {of: package, type: bool, proof_of: disable_package, doc: nothing the package runs is running; its files stay (229)}
  package.absent:     {of: package, type: bool, proof_of: remove_package, doc: the package's files are gone and nothing it ran is running; its records and the registration's history stay (229)}
  capture.source:           {of: capture, type: string}

effects:
  # ---- session (the multiplexer and the exit command; faked whole by the stand-in, 93)
  start_session:   {of: session, args: [agent, kind, place, work_order], proof: session.pane, satisfies: [65, 72, 73, 89, 93, 173, 174, 196, 197], doc: start the named agent of the named kind (claude, codex, opencode) in the place, through the one command, in the multiplexer session the manifest gives the session, in the workspace of its bolt or intent and the tab of its unit or elaboration, created when absent; the pane and the agent are named by the session id, so a second start of the same name is refused by the multiplexer; the session's identity token is issued and written into the work order first}
  end_session:     {of: session, args: [], proof: session.pane_absent, satisfies: [26, 69, 74, 196], doc: end the pane; only ever run from a state the operator's response or the type reached; the tab and workspace outlive it until their object leaves every view}
  record_exit:     {of: session, args: [], proof: session.exit_recorded, satisfies: [66, 67, 70, 80], doc: read the exit the session reported through the command, compare expected with delivered, and write both to the session record}
  record_offers:   {of: session, args: [], proof: session.offers_recorded, satisfies: [58, 59, 62], doc: for each offer the session made, one record pointing at its document — a chore becomes a proposed chore unit, a finding on the session's own thread a proposal there, anything else a signal; the record never holds the text}
  record_refusals: {of: session, args: [], proof: session.refusals_recorded, satisfies: [43]}
  deliver_answer:  {of: session, args: [text], proof: session.answer_delivered, satisfies: [68, 70, 197], doc: send the answer to the living session through its thread and the multiplexer, or start a fresh one whose work order opens with it; one of the two ways the machinery speaks to a session}
  tell_moved:      {of: session, args: [], proof: place.line_moved_told, satisfies: [51, 71, 197], doc: tell an idle session what moved under it, through its thread and the multiplexer; the other way the machinery speaks to a session}
  # ---- line and place (git and worktree tool)
  create_line:     {of: line, args: [parent], proof: line.exists, satisfies: [42, 49]}
  take_parent:     {of: line, args: [], proof: line.contains_parent, satisfies: [42, 50, 179], doc: merge the parent line into this line, never a rebase; aborted whole on conflict}
  seed_take_conflict: {of: line, args: [], proof: line.conflict_job_seeded, satisfies: [52, 180], doc: a chore unit in approved on this line, its approval the cadence the operator set or the response that ordered the take; its session resolves the conflict in a place off the line}
  land_line:       {of: line, args: [policy], proof: line.landed, satisfies: [39, 42, 53, 175, 179], doc: the direct policy's landing; a merge commit of the line into the shared line}
  open_request:    {of: line, args: [], proof: line.request_opened, satisfies: [53, 175, 179], doc: the pull-request policy's landing; open the request from the line and let the repository's own merge setting land it}
  write_acceptance: {of: line, args: [], proof: line.acceptance_written, satisfies: [172, 181, 192, 203], doc: one file in the built repository beside the as-built, the claims the bolt's units named with their versions and each claim's scenarios, and per unit its size estimate and its actual — the slot-days its sessions occupied, summed from the session records (172) — committed on the bolt's line before its landing; readable from git by any delivery system, which generates and runs whatever suite it likes from it, and by planning, which calibrates its estimates from the actuals — the machinery writes the file and nothing more}
  seed_request_finding: {of: line, args: [], proof: line.request_review_recorded, satisfies: [176], doc: a review on the open request that asks for a change becomes a finding record on the bolt, pointing at the review; accepted, it is a chore on the bolt line}
  remove_line:     {of: line, args: [], proof: line.absent, satisfies: [42, 54]}
  prepare_place:   {of: place, args: [line, agent_inputs], proof: place.ready, satisfies: [42, 43, 45, 88, 89, 119, 173, 190, 203, 207, 211, 212, 226, 227, 238], doc: worktree at the line's head, the repository's declared environment activated in it through the host's provider and its version recorded on the place (238), hooks that refuse line operations, the closed set of inputs written in from the context enumeration for the session's type (profiles/context.yaml, 226) and from nothing else — for each deliverable the producer skill, schema and review surface in force, resolved through the deliverables binding and the manifest's overrides at the blueprints commit named in the header, and each deliverable the entry says feeds this session type (227); for a session whose place is a built repository the cited chapters and the requirements those chapters include, copied in from the blueprints' standing specifications at that commit; for a construction session the map elements the item builds, their homes and the claims attached there, read from the target map (211), and the surface specification in force when a claim the unit cites is about a surface (212) — ports derived from the place}
  rebase_place:    {of: place, args: [], proof: place.contains_line, satisfies: [42, 51, 179], doc: rebase onto the line while no session works in the place; aborted whole on conflict}
  seed_conflict_job: {of: place, args: [], proof: place.job_seeded, satisfies: [52]}
  archive_change:  {of: work-item, args: [], proof: item.change_archived, satisfies: [37, 38, 42], doc: "the OpenSpec archive step, run by the machinery on the work item between its type's last stage and its merge: `openspec archive` in the item's place, committed there, so the change's specifications enter the standing set with the item's merge and land with the bolt (section 9 givens); nothing for a type whose record says needs_change_directory false; never a stage of a type"}
  merge_place:     {of: place, args: [], proof: place.merged, satisfies: [38, 42, 54, 179, 227], doc: merge the place into its line, one place at a time in the fixed order; an item's merge is a squash to one commit naming the item unless the manifest says otherwise for the repository}
  remove_place:    {of: place, args: [], proof: place.absent, satisfies: [42, 45, 55], doc: remove the worktree; the processes tethered to it end with it; never while the operator holds it}
  record_endpoints: {of: place, args: [], proof: place.endpoints_recorded, satisfies: [46], doc: write the endpoints the place's processes serve into the owner record, so the page shows them beside the bolt}
  # ---- service (the tether and the port router in the bolt's place; start and stop are the one path a dictation and a session's command share, 48)
  declare_services: {of: bolt, args: [], proof: bolt.services_declared, satisfies: [47, 203], doc: one service object in stopped per declaration in the repository's service data at the place's head that has no live object yet; name, command and serves copied from the declaration}
  start_service:    {of: service, args: [], proof: service.process, satisfies: [45, 47, 48, 191], doc: start the declared command in the bolt's place under the tether name, bound to the worktree so it ends with it, with its port derived from the place and the address to bind that the host's router requires; the response that asked is recorded as moved_by}
  stop_service:     {of: service, args: [], proof: service.process_absent, satisfies: [47, 48], doc: end the tethered process by name in the place}
  record_service_endpoint: {of: service, args: [], proof: service.endpoint_recorded, satisfies: [46, 47, 191], doc: write the endpoint the host's router names for this service into its record, so the page shows it beside the bolt as a link}
  # ---- host
  remove_stray_places: {of: host, args: [], proof: host.no_stray_places, satisfies: [55], doc: reconciliation found a place on this host belonging to no live object; remove it and record the removal}
  clone_repositories: {of: host, args: [], proof: host.repositories_cloned, satisfies: [205], doc: clone the state, the blueprints and every tracked built repository bare under the root the manifest names, and check out each shared line once for the machinery's own merges; places are worktrees made later by prepare_place; a repeat adds only what is missing}
  # ---- instance and repository (204–208)
  create_blueprints:    {of: instance, args: [], proof: instance.blueprints_ready, satisfies: [204, 208, 220], doc: create the blueprints repository on the git host from the blueprints template at the set's version, or adopt an existing one by adding what the template requires and is missing; the version is stamped in the instance's record}
  create_state:    {of: instance, args: [], proof: instance.state_ready, satisfies: [204, 220], doc: create the state repository with the profile's layout (C.2), empty of objects, or adopt one that exists by adding what the layout requires and is missing (220)}
  retire_instance: {of: instance, args: [], proof: instance.retired, satisfies: [221], doc: on the operator's response only — end every session of the instance, remove every place, archive the state under the root and at the git host, and leave every git repository on disk; the decision counter is archived with the state so no number is reused (15)}
  register_app:    {of: instance, args: [], proof: instance.app_recorded, satisfies: [204, 207], doc: write the App's id into the manifest and record that its installation is required; the secret is placed by the operator, never by an agent, so this never installs anything; a self-managed instance names its own App, a hosted tenant the service's, whose key never leaves the service (207a, host.yaml app)}
  register_host:   {of: instance, args: [host], proof: instance.host_registered, satisfies: [204, 205], doc: write the first host's record and manifest entry; every later host joins by its own command}
  create_repository: {of: repository, args: [], proof: repository.exists, satisfies: [206, 208], doc: create the repository on the git host under the instance from the built-repository template at the set's version, stamping the version in the record; nothing when adopted}
  register_repository: {of: repository, args: [], proof: repository.registered, satisfies: [104, 199, 202, 203, 206], doc: one blueprints commit writing the manifest entry (git details only), the repository's flywheel/ declarations from the template, and the proposal's map nodes with home = this repository; then put the planning record for the repository, whose first run judges the claims attached to what it homes and proposes the baseline}
  extend_installation: {of: repository, args: [], proof: repository.covered_by_app, satisfies: [149, 207], doc: ask the git host to add the repository to the App's installation where the App may; where it may not, nothing is written and the decision under attention follows}
  remove_stale_layout: {of: host, args: [], proof: host.layout_current, satisfies: [186, 196], doc: reconciliation found a workspace or tab in this host's multiplexer sessions naming an object that has left every view; close it and record the removal}
  repair_layout:   {of: host, args: [], proof: host.layout_repaired, satisfies: [205, 222], doc: the repair the decision showed, run only on the operator's response — re-clone a missing or moved bare repository from the manifest's remote, re-check a shared line out, move a hand-changed checkout aside and re-check it out; a place's worktree is the one thing re-made without asking, from its line by prepare_place; unreadable state is reported and never guessed at}
  run_adapters:    {of: host, args: [], proof: host.adapters_run, satisfies: [106, 111, 114, 115, 215, 231], doc: for each source this host declares whose cadence fired or whose drop or delivery is waiting, run its enumerator — one keyed capture per source event with a pointer to the raw material, pushed to the blueprints' shared line; the same key twice writes nothing, so a run missed while the host was down is caught up on the next tick (231); no judgment here — triage is a session (115)}
  place_secrets:   {of: host, args: [parts], proof: host.secrets_placed, satisfies: [207, 230], doc: on the enrolment decision's yes, hand the chosen parts' secrets to the platform's secret store for the new host; the operator's own platform credentials were used by the add-host call and are stored nowhere}
  issue_enrolment_token: {of: host, args: [], proof: host.token_issued, satisfies: [205, 230], doc: mint a one-time token that expires, shown once on the setup surface; `flywheel host join --token` on the new host, or on a host already running the binary, is admitted by it alone; a reissue replaces the first}
  # ---- pools (239–242)
  build_image:     {of: pool, args: [], proof: pool.image_current, satisfies: [204, 239], doc: build the pool's image from the environment declarations of every repository the pool covers, through the host binding's provider, tag it with the declarations' hash and register it with the platform; repeatable — the same declarations yield the same image and nothing is rebuilt; run from a chore when the image is behind (123)}
  provision_pool_host: {of: pool, args: [], proof: pool.host_added, satisfies: [230, 240, 242], doc: ask the platform for one host from the pool's image, with an enrolment token issued as for any added host (230) and the pool's parts' secrets from the platform's store; the host record is written in enrolment awaiting-join with pool = this pool; one effect per host, recorded with the demand it answered}
  retire_pool_host: {of: pool, args: [], proof: pool.host_retired, satisfies: [240, 242], doc: end the idle host on the platform after its leases are released and its places removed; a place it held is re-made from its line on another host by prepare_place (52); its record is kept as gone}
  # ---- packages (228, 229)
  install_package: {of: package, args: [], proof: package.installed, satisfies: [204, 224, 228, 229], doc: fetch the package's repository at its tag, check its declared set version against the installed one (208) and its content hash, place it — an instance package as files under the blueprints' prefix in one commit on the shared line, a per-host package under the host's root — register the hash (224), and start what it runs; every step proves itself, so a repeat adds only what is missing; also how a disabled package is enabled again}
  configure_package: {of: package, args: [fields], proof: package.configured, satisfies: [229], doc: write the configuration the response gave, validated against the package's schema, and restart what the package runs}
  disable_package: {of: package, args: [], proof: package.stopped, satisfies: [229], doc: stop what the package runs and leave its files}
  remove_package:  {of: package, args: [], proof: package.absent, satisfies: [229], doc: stop what the package runs and remove its files — one commit under the blueprints' prefix for an instance package — keeping its records and the registration's history}
  expire_leases:   {of: host, args: [], proof: host.leases_expired, satisfies: [150]}
  # ---- design objects
  open_intent:     {of: intent, args: [], proof: intent.change_open, satisfies: [23, 49, 203], doc: create the intent's change directory on its line — the one thing the machinery writes in the blueprints outside its prefix}
  drop_signals:    {of: intent, args: [reason], proof: intent.signals_dropped, satisfies: [117], doc: give every cited signal a drop move naming this intent}
  split_intent:    {of: intent, args: [partition], proof: intent.split_done, satisfies: [107]}
  archive_intent:  {of: intent, args: [], proof: intent.archived, satisfies: [23, 49, 54], doc: archive the change directory so its claims stand}
  propose_elaboration: {of: intent, args: [material, type], proof: intent.material_held, satisfies: [21], doc: create the intent's one proposed elaboration, or join the material to it}
  set_type:        {of: elaboration, args: [type], proof: elaboration.type_set, satisfies: [27, 37]}
  set_covers:      {of: elaboration, args: [keep, without], proof: elaboration.covers_set, satisfies: [188], doc: narrow a gathered elaboration's covers to the intents the operator picked, or take one intent out; the parent stays; an intent left out has its material pending again}
  record_per_intent: {of: elaboration, args: [], proof: elaboration.records_fanned_out, satisfies: [187, 188, 189], doc: for each covered intent beyond the parent, commit the records the session left for it in its place into that intent's change directory on that intent's line; the parent's records and the book reach the parent's line by the place's merge}
  # ---- claims and ledger
  record_verdict:  {of: ledger-cell, args: [verdict, claim_version, revision, evidence], proof: cell.verdict_recorded, satisfies: [100, 101, 104, 181, 203, 227], doc: the ledger is a file in the blueprints repository under the machinery's prefix, readable from git by any system}
  attach_claim:    {of: claim, args: [element], proof: claim.attached, satisfies: [97, 105, 193, 195, 198, 200, 211], doc: add a map id — a context, an element, a relationship or a link — to the claim's attachments, which live with the claim in its chapter block (97), without moving the text or the version; scope is computed from the target map through homes, so cells appear on the next read and every affected repository's fingerprint moves; the map view's gesture on an element sends this; the scope tool may offer "all elements of kind K" and send one attach per element}
  detach_claim:    {of: claim, args: [element], proof: claim.detached, satisfies: [105, 193, 200, 211], doc: remove a map id from the claim's attachments in its block; the cells that leave scope read as not-applicable (101)}
  set_home:        {of: any, args: [id, repository], proof: map.home_set, satisfies: [193, 199, 211], doc: set an element's or a context's home in the target map; the map check runs first and refuses a home naming no manifest entry; the affected claims enter or leave that repository's scope on the next read (195)}
  map_edit:        {of: any, args: [type, id, fields], proof: map.edited, satisfies: [120, 193, 198, 211], doc: add or amend a context, element, relationship or link in the target map; refused without a chapter ref (120), refused when the check fails (an unknown kind, a second relationship on a pair, a link crossing separate ways); a session reaches this only inside a writeback that also writes the chapter}
  set_map_status:  {of: any, args: [id, status, question], proof: map.status_set, satisfies: [193, 198, 201, 211], doc: set an id's status — settled, candidate or open — with its question when open; refused for settled or candidate without a ref}
  mark_reviewed:   {of: rail, args: [], proof: rail.review_marked, satisfies: [122, 193, 211], doc: record the operator's review mark at the current blueprints revision; the since-last-review overlay is computed from history between the mark and head}
  # ---- planning and curation
  record_moves:    {of: curation, args: [moves], proof: curation.moves_recorded, satisfies: [107, 116, 203], doc: one move per judged signal — attach, challenge, join, answered, route or drop — with its reason; a route move names the offer record the session's exit produced for the signal (58–60)}
  propose_intents: {of: curation, args: [intents], proof: curation.intents_proposed, satisfies: [109]}
  gather_elaborations: {of: curation, args: [gatherings], proof: curation.gatherings_proposed, satisfies: [188], doc: for each gathering the session delivered — elaborations of one type proposed in this run on several intents — one proposed elaboration on the first intent named, covering all of them, in place of one per intent}
  propose_units:   {of: planning, args: [units], proof: planning.units_proposed, satisfies: [29, 34, 36, 60, 64, 101, 172, 182], doc: one unit in in-proposal per unit the session delivered, each naming its proposal; a signal from operation routed to an open bolt arrives here like any other, and as a chore on the shared line when no bolt is open (60); a unit that answers a stale verdict cites the challenge signal (101)}
  record_proposal: {of: planning, args: [document, units], proof: planning.proposal_recorded, satisfies: [171, 172, 227], doc: one proposal record in proposed for the run, naming the bolts it proposes and the units in each with their size estimates in slot-days (172); the one decision the run raises; the document is carried into the state store beside the record (187, 227)}
  record_fingerprint: {of: planning, args: [], proof: planning.fingerprint_recorded, satisfies: [28]}
  request_replan:  {of: planning, args: [notes], proof: planning.redo_pending, satisfies: [17, 35, 172]}
  forward_answer:  {of: proposal, args: [answer], proof: proposal.answer_forwarded, satisfies: [172], doc: a per-unit answer on the proposal is written as an op-response on the unit it names, so the unit's own guard applies it; rename reaches every unit of the proposal that targets the named new bolt}
  # ---- construction objects
  create_bolt:     {of: unit, args: [name, repository], proof: unit.bolt_exists, satisfies: [16, 29]}
  rename_bolt:     {of: bolt, args: [name], proof: bolt.named, satisfies: [16, 29]}
  route_unit:      {of: unit, args: [bolt], proof: unit.routed, satisfies: [16]}
  record_claim_answer: {of: unit, args: [answer, intent], proof: unit.claim_answer_recorded, satisfies: [34, 317], doc: "the review surface's one answer for a unit that landed citing no claim: store it on the unit, and for captured also attach the unit's change to the named intent — open or proposed — as material, where the claim is written by the normal path (23, 97). The unit is not reopened, nothing waits on the answer, and the answered unit is never listed again"}
  create_items:    {of: unit, args: [], proof: unit.items_exist, satisfies: [13, 36, 57], doc: one work item per task in the approved document, with the type version in force}
  record_citation_choice: {of: [bolt, unit], args: [choice, claim], proof: citation_choice_recorded, satisfies: [35, 103]}
  # ---- rail, sinks, status, reports
  assign_owner:    {of: rail, args: [owner], proof: rail.owner_recorded, satisfies: [237], doc: write the member the response named as the owner of the object whose decision the number names, an owner being one member or nobody and never a role; the rail and the chat filter on it; nothing else about the decision changes}
  number_decisions: {of: rail, args: [], proof: rail.numbered, satisfies: [15, 235], doc: give every standing decision without a number the next number from the instance's counter; a number is given once and never reused}
  deliver_rail:    {of: sink, args: [], proof: sink.delivered, satisfies: [2, 14, 18, 82, 152, 155, 193, 194, 216, 233, 235, 236, 237, 243, 244, 245, 250, 253, 254], doc: deliver the standing decisions and the tail since this sink's mark to the sink (a chat message, the page, a bell on a named surface), then advance the mark; no rendering is stored; every control the delivery carries calls one of the state store's tools, and free text on the page or in chat goes to the host's agent, whose interpreter proposes one call per thing asked, one card each, never to a parser (194); the page carries the one account item — who, how signed in, the instance shown with its switch, its settings, hosts and package store, sign-out — and every response it records carries the signed-in identity (233, surfaces.yaml account); a member's sink delivers the same numbers and count as every other's with its own mark (235, 236), a decision already answered shows by whom and when, and a member's sink may be filtered to the decisions they own, an owner being one member and never a role (237); on a hosted tier the page sink's delivery writes one small page projection per instance under the instance's key, which is the whole of what a page request decrypts (291, host.yaml tier.projection); the page is delivered behind the host's identity kind — GitHub's device flow on a self-managed host, Frontegg's hosted login on a hosted one (243–245, identity.yaml) — the same on the operator's own computer (253), a surface a flag hides withheld on a hosted tier (250), and read-only with one attention line when a hosted host's provider is unreachable (254)}
  render_status:   {of: rail, args: [], proof: rail.status_current, satisfies: [77, 118, 146, 195, 198, 201, 209, 210, 213, 214, 239, 240, 242], doc: write the status projection from list and read, one form per kind of object and never two kinds in one — a decision the only answerable card, a proposal a document with its unit proposals hanging off it, an intent a thread with its elaborations in order, a bolt a ledger with its units in order, a landed bolt a record, a signal a quote — phase shown by placement and never by form (209); each elaboration a surface of its own reached from its intent, with its type and state, its pending decision, its document and the records it wrote into the change directory, its session with last activity, and the gathering it is in (210); and the map view — the target map at rest (context cards with element counts by kind, home chips with a verdict dot each, attachment chips, relationship edges with pattern and end markers, decisions as markers, status marks) and opened in place (elements by kind with home and verdict, links, attachments, language, an open element's question with the capture gesture), with two overlays from one id-keyed difference, current to target and target at the last review to now; tags filter, colour and group and never change structure (201); every object opens the OpenSpec artifacts behind it in a view fit to the artifact, read from the repositories at the shared line and never stored (213, surfaces.yaml artifact_views); and the flywheel instrument — runway, feed, pressure, the unattended streak, the reading sentence and velocity — derived from the same read, compact at rest (214, surfaces.yaml instrument), its drain moving as pool hosts are added and retired (242); and the hosts surface with each pool, its bound, its live hosts and whether its image is behind the declarations (239, 240)}
  report:          {of: any, args: [text], proof: report.recorded, satisfies: [79, 81], doc: a machinery problem or a refusal, to the run record and the attention lines; never work}
  ensure_signal:   {of: capture, args: [], proof: capture.signals_present, satisfies: [19, 112, 201], doc: a one-message capture is its own signal; no judgment is involved; the map view's one-gesture capture of an open element's question is such a capture, its source the element}
