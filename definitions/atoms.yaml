# The domain's atoms: one evidence name per question asked of the world, one
# effect name per act on it (87). Machine definitions may use only these
# names; a profile binds every one of them (B.3). Names are abstract: nothing
# here is a label, column, path, service or interface (I13, 138).
#
# Every effect names its proof: the evidence that shows it has already been
# done. The engine performs an effect only when its proof is absent, so a
# repeat of a completed effect changes nothing (73, 127). Every effect states
# the requirements it satisfies by number; check.py fails when a number does
# not exist or a requirement is cited nowhere.
format: flywheel-atoms/1
satisfies: [87, 138, 139]

evidence:
  # ---- engine-provided for every object (read through the profile's `read`)
  state:            {of: any, type: state, doc: the object's current state path per region}
  entered_at:       {of: any, type: time, doc: when the current state was entered}
  seq:              {of: any, type: int, doc: the object's write sequence; the compare-and-swap base}
  applied_responses: {of: any, type: list, doc: ids of the responses this object has applied}
  now:              {of: any, type: time, doc: the point the read is as of}
  # ---- host and lease (engine machines)
  host.last_seen:   {of: host, type: time}
  host.bound:       {of: host, type: int, doc: sessions this host may run at once}
  host.running:     {of: host, type: int, doc: sessions this host runs now}
  host.stray_places: {of: host, type: bool, doc: a place exists on this host that belongs to no live object and is not held (55)}
  lease.holder:     {of: any, type: host-id, doc: the host recorded as holding the object, or none}
  lease.renewed_at: {of: any, type: time}
  lease.holder_is_me: {of: any, type: bool}
  lease.coverable:  {of: any, type: bool, doc: some host's manifest declaration covers this object's kind, repository and unit type (149)}
  # ---- response, plan and sinks
  response.decision_present: {of: response, type: bool, doc: the decision this response answers still stands; a dictation is always present}
  response.applied: {of: response, type: bool, doc: the object it concerns lists the response as applied}
  response.reported: {of: response, type: bool, doc: a delivery after the failure carried the attention line}
  response.answer:  {of: response, type: string}
  plan.unnumbered:  {of: plan, type: bool, doc: a standing decision has no number in the plan's register}
  sink.due:         {of: sink, type: bool, doc: a decision of a kind routed to this sink was created since the sink's mark, the sink's cadence fired, or the operator asked (82)}
  # ---- session (bound to the multiplexer and the exit command; the one binding a stand-in replaces, 93)
  session.pane:       {of: session, type: enum, values: [absent, present]}
  session.activity:   {of: session, type: enum, values: [working, idle, none]}
  session.idle_since: {of: session, type: time}
  session.exit:       {of: session, type: enum, values: [none, done, blocked, stalled, invalid], doc: the exit the session reported through the machinery's command (67); invalid when the report fails the schema}
  session.exit_recorded: {of: session, type: bool, doc: the session record carries the exit, with expected and delivered compared (80)}
  session.offers_pending: {of: session, type: bool, doc: findings, chores or signals the session offered through the command and no proposal or signal record yet points at (62)}
  session.refusals_pending: {of: session, type: bool, doc: refusals the place's hooks reported and no thread entry yet holds}
  session.answer_delivered: {of: session, type: bool}
  session.message_delivered: {of: session, type: bool, doc: the last message the machinery queued for the session reached it}
  session.operator_present: {of: session, type: bool, doc: a person typed in the pane within the window the profile states (25)}
  session.host_alive: {of: session, type: bool}
  session.expected:   {of: session, type: list, doc: deliverables the work order named}
  session.delivered:  {of: session, type: list}
  # ---- place and line (bound to git and the worktree tool, the same in every profile)
  place.exists:        {of: place, type: bool}
  place.contains_line: {of: place, type: bool, doc: the line's head is an ancestor of the place's head}
  place.ahead_of_line: {of: place, type: bool, doc: the place has commits the line lacks}
  place.conflicted:    {of: place, type: bool}
  place.merge_slot:    {of: place, type: bool, doc: no sibling place earlier in the fixed order is merging}
  place.merged:        {of: place, type: bool, doc: the line's head contains the place's head}
  place.job_seeded:    {of: place, type: bool, doc: the conflict job is in the place and on the session's thread}
  place.conflict_retries: {of: place, type: int, doc: the owner record counter}
  place.line_moved_told: {of: place, type: bool}
  place.held:          {of: place, type: bool, doc: the operator holds this place by dictation; it is not removed while held (55)}
  place.endpoints_served: {of: place, type: list, doc: the endpoints the processes tethered to the place serve now (46)}
  # ---- service (a declared process in a bolt's place; bound to the tether and the port router, the same in every profile)
  service.process:       {of: service, type: enum, values: [absent, present, exited], doc: the process by the service's tether name in the bolt's place — none, running, or ended with its exit recorded (47)}
  service.serving:       {of: service, type: bool, doc: the endpoint answers, or the declaration's readiness command passes}
  service.endpoint:      {of: service, type: string, doc: the URL the place serves for this service, derived from the place so two places on one host never collide (45, 46)}
  service.failure:       {of: service, type: string, doc: the exit status and the last lines of the process's log}
  service.place_present: {of: service, type: bool, doc: the bolt's place the service belongs to exists on the host}
  service.declared:      {of: service, type: bool, doc: the repository's service data at the place's head still names this service (47)}
  line.exists:           {of: line, type: bool}
  line.contains_parent:  {of: line, type: bool, doc: the parent line's head is an ancestor of this line's head}
  line.take_due:         {of: line, type: bool, doc: first place, pre-landing, or the repository's cadence says take now}
  line.take_conflicts:   {of: line, type: bool, doc: a dry take of the parent reports conflicts}
  line.landed:           {of: line, type: bool, doc: the parent line's head contains this line's head}
  line.landing:          {of: line, type: enum, values: [none, pending, passed, failed], doc: the repository's own gates on the landing}
  line.retries:          {of: line, type: int}
  line.conflict_job_done: {of: line, type: bool, doc: the conflict chore unit on this line is merged}
  line.policy:           {of: line, type: enum, values: [direct, pull-request], doc: the repository's landing policy from the manifest (175); the books' lines land direct}
  line.request:          {of: line, type: enum, values: [none, open, merged, closed], doc: the pull request opened from this line, as the git host reports it (175)}
  line.request_review_pending: {of: line, type: bool, doc: a review on the request asks for a change and no finding record yet points at it (176)}
  line.request_links:    {of: line, type: list, doc: links the git host or an integration publishes for the request — check runs, deployments, ephemeral environments — read by an adapter, never made by the machinery (177)}
  # ---- design side
  intent.material_pending: {of: intent, type: bool, doc: attached signals or findings no proposal yet holds}
  intent.close_declined_since_last_final: {of: intent, type: bool}
  intent.archived:   {of: intent, type: bool, doc: the change directory is archived and its claims are on the shared line}
  elaboration.type:  {of: elaboration, type: string}
  elaboration.type_version: {of: elaboration, type: int}
  elaboration.shown_with_parent: {of: elaboration, type: bool, doc: the parent intent is itself proposed; the decision folds into the intent's}
  elaboration.kept_since: {of: elaboration, type: time}
  intent.covered_by: {of: intent, type: enum, values: [none, proposed, active, done], doc: the state of the newest elaboration owned by another intent whose covers name this one — none when there is none, proposed while it awaits approval, active from approved to finishing, done once it finished (188, 189)}
  # ---- claims and ledger (bound to the books repository and the ledger store)
  claim.on_shared_line: {of: claim, type: bool}
  claim.on_intent_line: {of: claim, type: bool}
  claim.version:        {of: claim, type: int}
  claim.scope_repos:    {of: claim, type: list}
  cell.verdict:         {of: ledger-cell, type: enum, values: [none, satisfied, partial, not-satisfied, not-applicable]}
  cell.verdict_claim_version: {of: ledger-cell, type: int}
  cell.claim_version:   {of: ledger-cell, type: int}
  cell.evidence_present: {of: ledger-cell, type: bool, doc: the evidence the verdict cites still exists at the repository's shared head}
  # ---- planning and curation
  planning.fingerprint:  {of: planning, type: hash, doc: hash of the repository's backlog inputs — standing claims in scope with versions, the ledger's cells, the open bolts and their citations, the asks naming it}
  planning.planned_fingerprint: {of: planning, type: hash}
  planning.redo_pending: {of: planning, type: bool, doc: a unit was sent back with notes}
  planning.ledger_empty: {of: planning, type: bool}
  curation.unmoved_count: {of: curation, type: int}
  curation.threshold:     {of: curation, type: int}
  curation.cadence_due:   {of: curation, type: bool}
  capture.signals_present: {of: capture, type: bool}
  signal.move: {of: signal, type: enum, values: [none, attach, challenge, join, answered, drop]}
  # ---- construction side
  bolt.chores_outstanding: {of: bolt, type: bool, doc: accepted chore units not yet merged}
  bolt.citations_moved:    {of: bolt, type: bool, doc: a started unit of this bolt cites a claim whose standing version is newer, and no citation choice is recorded (103)}
  bolt.moved_claim:        {of: bolt, type: string}
  bolt.hold_since_last_merge: {of: bolt, type: bool}
  unit.claim_moved:        {of: unit, type: bool, doc: this unit cites a claim whose standing version is newer than the one cited, and no choice is recorded for it (35)}
  unit.target_is_new_bolt: {of: unit, type: bool}
  unit.deps_merged:        {of: unit, type: bool}
  unit.type:               {of: unit, type: string}
  unit.type_version:       {of: unit, type: int}
  unit.batch:              {of: unit, type: string, doc: baseline id or none; equal values fold into one decision}
  unit.proposal:           {of: unit, type: enum, values: [none, proposed, approved, withdrawn, deferred, superseded], doc: the state of the proposal that names this unit; none when no proposal does (172)}
  proposal.replaced:       {of: proposal, type: bool, doc: planning's next run recorded a newer proposal for the repository (35, 172)}
  item.deps_merged:        {of: work-item, type: bool}
  item.slot_free:          {of: work-item, type: bool, doc: this host has a free slot and no earlier ready item is waiting for it}
  item.send_backs:         {of: work-item, type: int}
  item.retry_max:          {of: work-item, type: int, doc: from the type, for the current stage}
  item.stage_is_last:      {of: work-item, type: bool}
  stage.agents:            {of: stage, type: list, doc: the session set the type's rule resolves against the repository worked}
  stage.join_met:          {of: stage, type: bool}
  stage.verdict:           {of: stage, type: enum, values: [pending, pass, not-done, blocked, stalled]}
  chore.scope:             {of: unit, type: enum, values: [bolt-line, intent-line, shared-line]}

  # ---- proofs: the evidence each effect leaves behind (read like any other evidence)
  session.pane_absent:      {of: session, type: bool, proof_of: end_session}
  session.offers_recorded:  {of: session, type: bool, proof_of: record_offers, doc: every offer the session made has a proposal or signal record pointing at its document}
  session.refusals_recorded: {of: session, type: bool, proof_of: record_refusals}
  line.conflict_job_seeded: {of: line, type: bool, proof_of: seed_take_conflict, doc: a chore unit in approved exists for this line and this take}
  line.absent:              {of: line, type: bool, proof_of: remove_line}
  line.request_opened:      {of: line, type: bool, proof_of: open_request, doc: a request from this line exists at the git host, open, merged or closed}
  line.request_review_recorded: {of: line, type: bool, proof_of: seed_request_finding, doc: every review on the request that asks for a change has a finding record pointing at it}
  place.ready:              {of: place, type: bool, proof_of: prepare_place, doc: exists, contains its line, holds the closed inputs and the refusing hooks}
  place.absent:             {of: place, type: bool, proof_of: remove_place}
  place.endpoints_recorded: {of: place, type: bool, proof_of: record_endpoints, doc: the owner record's endpoints equal the endpoints served}
  service.process_absent:   {of: service, type: bool, proof_of: stop_service, doc: no process by the service's tether name in the place}
  service.endpoint_recorded: {of: service, type: bool, proof_of: record_service_endpoint, doc: the service record's endpoint equals the endpoint served}
  bolt.services_declared:   {of: bolt, type: bool, proof_of: declare_services, doc: one service object in a state other than gone exists for every declaration in the repository's service data at the place's head}
  host.no_stray_places:     {of: host, type: bool, proof_of: remove_stray_places}
  intent.change_open:       {of: intent, type: bool, proof_of: open_intent}
  intent.signals_dropped:   {of: intent, type: bool, proof_of: drop_signals}
  intent.split_done:        {of: intent, type: bool, proof_of: split_intent}
  intent.material_held:     {of: intent, type: bool, proof_of: propose_elaboration}
  elaboration.type_set:     {of: elaboration, type: bool, proof_of: set_type}
  elaboration.covers_set:   {of: elaboration, type: bool, proof_of: set_covers, doc: the record's covers equal the response's set}
  elaboration.records_fanned_out: {of: elaboration, type: bool, proof_of: record_per_intent, doc: every covered intent beyond the parent has on its line the records the session left for it; true at once when covers names the parent alone}
  curation.gatherings_proposed: {of: curation, type: bool, proof_of: gather_elaborations, doc: every gathering the session delivered exists as one proposed elaboration covering the named intents}
  cell.verdict_recorded:    {of: ledger-cell, type: bool, proof_of: record_verdict, doc: a verdict with this claim version, revision and judged_at exists}
  curation.moves_recorded:  {of: curation, type: bool, proof_of: record_moves}
  curation.intents_proposed: {of: curation, type: bool, proof_of: propose_intents}
  planning.units_proposed:  {of: planning, type: bool, proof_of: propose_units}
  planning.fingerprint_recorded: {of: planning, type: bool, proof_of: record_fingerprint}
  planning.proposal_recorded: {of: planning, type: bool, proof_of: record_proposal, doc: a proposal record in proposed names every unit the session delivered}
  proposal.answer_forwarded: {of: proposal, type: bool, proof_of: forward_answer, doc: the unit the answer names lists the forwarded response as applied}
  unit.bolt_exists:         {of: unit, type: bool, proof_of: create_bolt}
  bolt.named:               {of: bolt, type: bool, proof_of: rename_bolt}
  unit.routed:              {of: unit, type: bool, proof_of: route_unit}
  unit.items_exist:         {of: unit, type: bool, proof_of: create_items}
  citation_choice_recorded: {of: any, type: bool, proof_of: record_citation_choice, doc: the bolt or unit record holds a choice for the moved claim and version}
  plan.numbered:            {of: plan, type: bool, proof_of: number_decisions, doc: every standing decision has a number in the plan's register}
  sink.delivered:           {of: sink, type: bool, proof_of: deliver_plan, doc: the sink's mark is newer than every decision routed to it and its delivery carries the current numbers}
  plan.status_current:      {of: plan, type: bool, proof_of: render_status, doc: the projection carries the read's as-of point}
  report.recorded:          {of: any, type: bool, proof_of: report}
  host.leases_expired:      {of: host, type: bool, proof_of: expire_leases}
  capture.source:           {of: capture, type: string}

effects:
  # ---- session (the multiplexer and the exit command; faked whole by the stand-in, 93)
  start_session:   {of: session, args: [agent, kind, place, work_order], proof: session.pane, satisfies: [65, 72, 73, 89, 93, 173, 174], doc: start the named agent of the named kind (claude, codex, opencode) in the place, through the one command, in the multiplexer session the manifest gives the session; the name is the session id, so a second start of the same name is refused by the multiplexer}
  end_session:     {of: session, args: [], proof: session.pane_absent, satisfies: [26, 69, 74], doc: end the pane; only ever run from a state the operator's response or the type reached}
  record_exit:     {of: session, args: [], proof: session.exit_recorded, satisfies: [66, 67, 70, 80], doc: read the exit the session reported through the command, compare expected with delivered, and write both to the session record}
  record_offers:   {of: session, args: [], proof: session.offers_recorded, satisfies: [58, 59, 62], doc: for each offer the session made, one record pointing at its document — a chore becomes a proposed chore unit, a finding on the session's own thread a proposal there, anything else a signal; the record never holds the text}
  record_refusals: {of: session, args: [], proof: session.refusals_recorded, satisfies: [43]}
  deliver_answer:  {of: session, args: [text], proof: session.answer_delivered, satisfies: [68, 70], doc: send the answer to the living session, or start a fresh one whose work order opens with it}
  tell_moved:      {of: session, args: [], proof: place.line_moved_told, satisfies: [51, 71], doc: tell an idle session what moved under it}
  # ---- line and place (git and worktree tool)
  create_line:     {of: line, args: [parent], proof: line.exists, satisfies: [42, 49]}
  take_parent:     {of: line, args: [], proof: line.contains_parent, satisfies: [42, 50, 179], doc: merge the parent line into this line, never a rebase; aborted whole on conflict}
  seed_take_conflict: {of: line, args: [], proof: line.conflict_job_seeded, satisfies: [52, 180], doc: a chore unit in approved on this line, its approval the cadence the operator set or the response that ordered the take; its session resolves the conflict in a place off the line}
  land_line:       {of: line, args: [policy], proof: line.landed, satisfies: [39, 42, 53, 175, 179], doc: the direct policy's landing; a merge commit of the line into the shared line}
  open_request:    {of: line, args: [], proof: line.request_opened, satisfies: [53, 175, 179], doc: the pull-request policy's landing; open the request from the line and let the repository's own merge setting land it}
  seed_request_finding: {of: line, args: [], proof: line.request_review_recorded, satisfies: [176], doc: a review on the open request that asks for a change becomes a finding record on the bolt, pointing at the review; accepted, it is a chore on the bolt line}
  remove_line:     {of: line, args: [], proof: line.absent, satisfies: [42, 54]}
  prepare_place:   {of: place, args: [line, agent_inputs], proof: place.ready, satisfies: [42, 43, 45, 88, 89, 119, 173], doc: worktree at the line's head, hooks that refuse line operations, the closed set of inputs written in, ports derived from the place}
  rebase_place:    {of: place, args: [], proof: place.contains_line, satisfies: [42, 51, 179], doc: rebase onto the line while no session works in the place; aborted whole on conflict}
  seed_conflict_job: {of: place, args: [], proof: place.job_seeded, satisfies: [52]}
  merge_place:     {of: place, args: [], proof: place.merged, satisfies: [38, 42, 54, 179], doc: merge the place into its line, one place at a time in the fixed order; an item's merge is a squash to one commit naming the item unless the manifest says otherwise for the repository}
  remove_place:    {of: place, args: [], proof: place.absent, satisfies: [42, 45, 55], doc: remove the worktree; the processes tethered to it end with it; never while the operator holds it}
  record_endpoints: {of: place, args: [], proof: place.endpoints_recorded, satisfies: [46], doc: write the endpoints the place's processes serve into the owner record, so the page shows them beside the bolt}
  # ---- service (the tether and the port router in the bolt's place; start and stop are the one path a dictation and a session's command share, 48)
  declare_services: {of: bolt, args: [], proof: bolt.services_declared, satisfies: [47], doc: one service object in stopped per declaration in the repository's service data at the place's head that has no live object yet; name, command and serves copied from the declaration}
  start_service:    {of: service, args: [], proof: service.process, satisfies: [45, 47, 48], doc: start the declared command in the bolt's place under the tether name, bound to the worktree so it ends with it, with its port derived from the place; the response that asked is recorded as moved_by}
  stop_service:     {of: service, args: [], proof: service.process_absent, satisfies: [47, 48], doc: end the tethered process by name in the place}
  record_service_endpoint: {of: service, args: [], proof: service.endpoint_recorded, satisfies: [46, 47], doc: write the endpoint the place serves for this service into its record, so the page shows it beside the bolt as a link}
  # ---- host
  remove_stray_places: {of: host, args: [], proof: host.no_stray_places, satisfies: [55], doc: reconciliation found a place on this host belonging to no live object; remove it and record the removal}
  expire_leases:   {of: host, args: [], proof: host.leases_expired, satisfies: [150]}
  # ---- design objects
  open_intent:     {of: intent, args: [], proof: intent.change_open, satisfies: [23, 49], doc: create the intent's change directory on its line}
  drop_signals:    {of: intent, args: [reason], proof: intent.signals_dropped, satisfies: [117], doc: give every cited signal a drop move naming this intent}
  split_intent:    {of: intent, args: [partition], proof: intent.split_done, satisfies: [107]}
  archive_intent:  {of: intent, args: [], proof: intent.archived, satisfies: [23, 49, 54], doc: archive the change directory so its claims stand}
  propose_elaboration: {of: intent, args: [material, type], proof: intent.material_held, satisfies: [21], doc: create the intent's one proposed elaboration, or join the material to it}
  set_type:        {of: elaboration, args: [type], proof: elaboration.type_set, satisfies: [27, 37]}
  set_covers:      {of: elaboration, args: [keep, without], proof: elaboration.covers_set, satisfies: [188], doc: narrow a gathered elaboration's covers to the intents the operator picked, or take one intent out; the parent stays; an intent left out has its material pending again}
  record_per_intent: {of: elaboration, args: [], proof: elaboration.records_fanned_out, satisfies: [187, 188, 189], doc: for each covered intent beyond the parent, commit the records the session left for it in its place into that intent's change directory on that intent's line; the parent's records and the book reach the parent's line by the place's merge}
  # ---- claims and ledger
  record_verdict:  {of: ledger-cell, args: [verdict, claim_version, revision, evidence], proof: cell.verdict_recorded, satisfies: [100, 101, 104, 181], doc: the ledger is a file in the books repository, readable from git by any system}
  # ---- planning and curation
  record_moves:    {of: curation, args: [moves], proof: curation.moves_recorded, satisfies: [107, 116]}
  propose_intents: {of: curation, args: [intents], proof: curation.intents_proposed, satisfies: [109]}
  gather_elaborations: {of: curation, args: [gatherings], proof: curation.gatherings_proposed, satisfies: [188], doc: for each gathering the session delivered — elaborations of one type proposed in this run on several intents — one proposed elaboration on the first intent named, covering all of them, in place of one per intent}
  propose_units:   {of: planning, args: [units], proof: planning.units_proposed, satisfies: [29, 34, 36, 64, 172, 182], doc: one unit in in-proposal per unit the session delivered, each naming its proposal; a signal from operation routed to an open bolt arrives here like any other}
  record_proposal: {of: planning, args: [document, units], proof: planning.proposal_recorded, satisfies: [171, 172], doc: one proposal record in proposed for the run, naming the bolts it proposes and the units in each; the one decision the run raises}
  record_fingerprint: {of: planning, args: [], proof: planning.fingerprint_recorded, satisfies: [28]}
  request_replan:  {of: planning, args: [notes], proof: planning.redo_pending, satisfies: [17, 35, 172]}
  forward_answer:  {of: proposal, args: [answer], proof: proposal.answer_forwarded, satisfies: [172], doc: a per-unit answer on the proposal is written as an op-response on the unit it names, so the unit's own guard applies it; rename reaches every unit of the proposal that targets the named new bolt}
  # ---- construction objects
  create_bolt:     {of: unit, args: [name, repository], proof: unit.bolt_exists, satisfies: [16, 29]}
  rename_bolt:     {of: bolt, args: [name], proof: bolt.named, satisfies: [16, 29]}
  route_unit:      {of: unit, args: [bolt], proof: unit.routed, satisfies: [16]}
  create_items:    {of: unit, args: [], proof: unit.items_exist, satisfies: [13, 36, 57], doc: one work item per task in the approved document, with the type version in force}
  record_citation_choice: {of: [bolt, unit], args: [choice, claim], proof: citation_choice_recorded, satisfies: [35, 103]}
  # ---- plan, sinks, status, reports
  number_decisions: {of: plan, args: [], proof: plan.numbered, satisfies: [15], doc: give every standing decision without a number the next number from the organization's counter; a number is given once and never reused}
  deliver_plan:    {of: sink, args: [], proof: sink.delivered, satisfies: [2, 14, 18, 82, 152, 155], doc: deliver the standing decisions and the tail since this sink's mark to the sink (a chat message, the page, a bell on a named surface), then advance the mark; no rendering is stored}
  render_status:   {of: plan, args: [], proof: plan.status_current, satisfies: [77, 118, 146], doc: write the status projection from list and read}
  report:          {of: any, args: [text], proof: report.recorded, satisfies: [79, 81], doc: a machinery problem or a refusal, to the run record and the attention lines; never work}
  ensure_signal:   {of: capture, args: [], proof: capture.signals_present, satisfies: [19, 112], doc: a one-message capture is its own signal; no judgment is involved}
