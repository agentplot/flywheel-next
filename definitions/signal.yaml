# One raw piece of input (113). Immutable once written; exactly one
# standing move — attach, challenge, join, answered, route or drop —
# replaced only by the operator's response (107). A route move names the
# chore or the ask the curation session, being a session, offered for a
# signal that argues with no claim (58–60, 116).
machine: signal
version: 2
kind: object
tier: core
satisfies: [58, 60, 106, 107, 113, 114, 116, 118]
object: signal
parent: capture
record:
  kind: enum             # constraint | ask | question | commitment | reaction
  asserted_by: string
  subject_tags: list
  assertion: string
  excerpt: string
  position: string
  argues_with: list      # claim names
  move: {target: string, reason: string, at: time}
regions:
  move:
    initial: unmoved
    states:
      unmoved:
        doc: counted and aged by source on the status view; never discarded (118). It stands on the rail as the operator's own decision — what to make of it — until curation or the operator moves it (19a, 107)
        decision: {kind: signal-unmoved, group: decide, answers: [build, intent, drop], satisfies: [19, 107, 116, 311]}
        transitions:
          - when: {response: build}
            to: unmoved
            effects: [{do: build_from_signal, note: "a chore unit on a bolt named from the capture's own words, approved by this response; the move is route, naming the unit (19a, 12, 34)"}]
          - when: {response: intent}
            to: unmoved
            effects: [{do: move_signal, args: {move: join}, note: "the join proposes an intent named from the capture's words, citing this signal, as curation's join does (19a, 109, 116)"}]
          - when: {response: drop}
            to: unmoved
            effects: [{do: move_signal, args: {move: drop}}]
          - {when: {ev: signal.move, is: attach}, to: attached}
          - {when: {ev: signal.move, is: challenge}, to: challenging}
          - {when: {ev: signal.move, is: join}, to: joined}
          - {when: {ev: signal.move, is: answered}, to: answered}
          - {when: {ev: signal.move, is: route}, to: routed}
          - {when: {ev: signal.move, is: drop}, to: dropped}
      attached:
        doc: evidence on an open intent; the intent's material region proposes or grows an elaboration
        transitions:
          - when: {ev: signal.move, is: none}
            to: unmoved
      challenging:
        doc: accumulates against a standing claim; a proposed intent cites it; every ledger cell of that claim falls stale, planning becomes due where one is, and its proposal cites this signal (101, 116)
        transitions:
          - when: {ev: signal.move, is: none}
            to: unmoved
      joined:
        doc: part of a proposed intent; dropping the intent moves it to dropped naming the drop
        transitions:
          - when: {ev: signal.move, is: drop}
            to: dropped
          - when: {ev: signal.move, is: none}
            to: unmoved
      answered:
        doc: names the claim or record that settled it
        transitions:
          - when: {ev: signal.move, is: none}
            to: unmoved
      routed:
        doc: the curation session offered a chore or an ask for it through the command, like any session (58–60), and the move names that offer's record; the chore is a proposed chore unit on the shared line, the ask a record for planning (116)
        transitions:
          - when: {ev: signal.move, is: none}
            to: unmoved
      dropped:
        doc: with a reason; revived only by the operator's dictation, which clears the move (S24)
        transitions:
          - when: {ev: signal.move, is: none}
            to: unmoved
