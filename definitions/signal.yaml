# One raw piece of input (113), or a finding a session offered with no
# intent or bolt above it, asking under the capture the session read or
# under a capture of its own (62). Immutable once written; exactly one
# standing move — attach, challenge, join, answered, route or drop —
# replaced only by the operator's response (107). A route move names the
# chore or the ask the curation session, being a session, offered for a
# signal that argues with no claim (58–60, 116). An unmoved signal is never
# a decision: the operator's hand on it is a control on its capture — build
# now, make an intent, attach to an open intent, drop — each a catalogue
# tool that writes the move record curation would have (19a, 110, 193).
machine: signal
version: 3
kind: object
tier: core
satisfies: [19, 58, 60, 106, 107, 113, 114, 116, 118]
object: signal
parent: capture
record:
  kind: enum             # constraint | ask | question | commitment | reaction
  asserted_by: string
  subject_tags: list
  assertion: string
  excerpt: string
  position: string
  argues_with: list      # claim names
  move: {target: string, reason: string, at: time}
regions:
  move:
    initial: unmoved
    states:
      unmoved:
        doc: counted and aged by source on the status view and listed there with the operator's controls; never discarded (118). Never a decision (19a) — curation moves it on its cadence, its threshold or the operator's run-now dictation (110), or the operator moves it by hand with a control on its capture, `propose-unit` (route, naming the unit), `open-intent` (attach, to the intent the same gesture opened), `attach-signal` or `drop-signal`, each a dictation that writes the move record (12, 107, 193)
        transitions:
          - {when: {ev: signal.move, is: attach}, to: attached}
          - {when: {ev: signal.move, is: challenge}, to: challenging}
          - {when: {ev: signal.move, is: join}, to: joined}
          - {when: {ev: signal.move, is: answered}, to: answered}
          - {when: {ev: signal.move, is: route}, to: routed}
          - {when: {ev: signal.move, is: drop}, to: dropped}
      attached:
        doc: evidence on an open intent; the intent's material region proposes or grows an elaboration
        transitions:
          - when: {ev: signal.move, is: none}
            to: unmoved
      challenging:
        doc: accumulates against a standing claim; a proposed intent cites it; every ledger cell of that claim falls stale, planning becomes due where one is, and its proposal cites this signal (101, 116)
        transitions:
          - when: {ev: signal.move, is: none}
            to: unmoved
      joined:
        doc: part of a proposed intent; dropping the intent moves it to dropped naming the drop
        transitions:
          - when: {ev: signal.move, is: drop}
            to: dropped
          - when: {ev: signal.move, is: none}
            to: unmoved
      answered:
        doc: names the claim or record that settled it
        transitions:
          - when: {ev: signal.move, is: none}
            to: unmoved
      routed:
        doc: the curation session offered a chore or an ask for it through the command, like any session (58–60), and the move names that offer's record; the chore is a proposed chore unit under the repository, on its shared line (60, 62), the ask a record for planning (116)
        transitions:
          - when: {ev: signal.move, is: none}
            to: unmoved
      dropped:
        doc: with a reason; revived only by the operator's dictation, which clears the move (S24)
        transitions:
          - when: {ev: signal.move, is: none}
            to: unmoved
