# The fast type: build then review, one send-back. Needs a change directory.
machine: fast
version: 1
kind: template
satisfies: [37, 41]
doc: unit type
params:
  place: the item's place
record:
  needs_change_directory: "true"
  lands_on: bolt-line
regions:
  stages:
    initial: build
    states:
      build:
        machine: stage
        params: {agents: [builder], join: all, on_fail: build, max_send_backs: 1, deliverables: [commits, as-built-statements-naming-claims]}
        transitions:
          - {when: {final: passed}, to: review}
          - {when: {final: sent-back}, to: build}
          - {when: {final: stopped}, to: stopped}
      review:
        machine: stage
        params: {agents: [reviewer], join: all, on_fail: build, max_send_backs: 1, deliverables: [review-verdict]}
        transitions:
          - {when: {final: passed}, to: passed}
          - {when: {final: sent-back}, to: build}
          - {when: {final: stopped}, to: stopped}
      passed: {final: true}
      stopped: {final: true}
