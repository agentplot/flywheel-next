# The default unit type: spec, build, review; review sends back to build up to
# three times. Needs a change directory. Lands on the bolt's line.
machine: default
version: 4
kind: template
satisfies: [37, 41, 99, 120, 190]
doc: unit type
params:
  place: the item's place
record:
  needs_change_directory: "true"
  lands_on: bolt-line
regions:
  stages:
    initial: spec
    states:
      spec:
        machine: stage
        params: {agents: [spec-writer], join: all, on_fail: spec, max_send_backs: 1, deliverables: [{name: change-directory, producer: by-type, schema: by-type, surface: none}, {name: spec, producer: by-type, schema: by-type, surface: none}]}
        transitions:
          - {when: {final: passed}, to: build}
          - {when: {final: sent-back}, to: spec}
          - {when: {final: stopped}, to: stopped}
      build:
        machine: stage
        params: {agents: [builder], join: all, on_fail: build, max_send_backs: 3, deliverables: [{name: commits, producer: by-type, schema: by-type, surface: none}, {name: as-built-statements-naming-claims, producer: by-type, schema: by-type, surface: none}]}
        transitions:
          - {when: {final: passed}, to: review}
          - {when: {final: sent-back}, to: build}
          - {when: {final: stopped}, to: stopped}
      review:
        machine: stage
        params: {agents: [reviewer], join: all, on_fail: build, max_send_backs: 3, deliverables: [{name: review-verdict, producer: by-type, schema: by-type, surface: none}, {name: verdict, producer: default, schema: default, surface: default}]}
        transitions:
          - {when: {final: passed}, to: passed}
          - {when: {final: sent-back}, to: build}
          - {when: {final: stopped}, to: stopped}
      passed: {final: true}
      stopped: {final: true}
