# The default unit type: spec, build, review; review sends back to build up to
# three times. Needs a change directory. Lands on the bolt's line.
machine: default
version: 3
kind: template
satisfies: [36, 40, 96, 117]
doc: unit type
params:
  place: the item's place
record:
  needs_change_directory: "true"
  lands_on: bolt-line
regions:
  stages:
    initial: spec
    states:
      spec:
        machine: stage
        params: {agents: [spec-writer], join: all, on_fail: spec, max_send_backs: 1, deliverables: [change-directory, spec]}
        transitions:
          - {when: {final: passed}, to: build}
          - {when: {final: sent-back}, to: spec}
          - {when: {final: stopped}, to: stopped}
      build:
        machine: stage
        params: {agents: [builder], join: all, on_fail: build, max_send_backs: 3, deliverables: [commits, as-built-statements-naming-claims]}
        transitions:
          - {when: {final: passed}, to: review}
          - {when: {final: sent-back}, to: build}
          - {when: {final: stopped}, to: stopped}
      review:
        machine: stage
        params: {agents: [reviewer], join: all, on_fail: build, max_send_backs: 3, deliverables: [review-verdict, verdicts-for-named-claims]}
        transitions:
          - {when: {final: passed}, to: passed}
          - {when: {final: sent-back}, to: build}
          - {when: {final: stopped}, to: stopped}
      passed: {final: true}
      stopped: {final: true}
