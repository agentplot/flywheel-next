# The operator-added type of S26: the test stage runs one session per persona
# definition found in the repository being worked and completes when all have
# exited. Composed only of existing atoms: no code changed.
machine: persona-test
version: 1
kind: template
satisfies: [53, 54, 82]
doc: unit type
params:
  place: the item's place
record:
  needs_change_directory: "true"
  lands_on: bolt-line
regions:
  stages:
    initial: build
    states:
      build:
        machine: stage
        params: {agents: [builder], join: all, on_fail: build, max_send_backs: 2, deliverables: [commits, as-built-statements-naming-claims]}
        transitions:
          - {when: {final: passed}, to: test}
          - {when: {final: sent-back}, to: build}
          - {when: {final: stopped}, to: stopped}
      test:
        machine: stage
        params: {agents: {rule: every-persona-definition, pattern: "personas/*.md"}, join: all, on_fail: build, max_send_backs: 2, deliverables: [test-report, findings]}
        transitions:
          - {when: {final: passed}, to: review}
          - {when: {final: sent-back}, to: build}
          - {when: {final: stopped}, to: stopped}
      review:
        machine: stage
        params: {agents: [reviewer], join: all, on_fail: build, max_send_backs: 2, deliverables: [review-verdict, verdicts-for-named-claims]}
        transitions:
          - {when: {final: passed}, to: passed}
          - {when: {final: sent-back}, to: build}
          - {when: {final: stopped}, to: stopped}
      passed: {final: true}
      stopped: {final: true}
