# The operator-added type of S26, layered on default@5: the OpenSpec stages
# spec, build and verify as default has them, then a test stage that runs
# one session per persona definition found in the repository being worked
# and completes when all have exited, then a review stage — the one type
# in the set that adds review. Composed only of existing atoms and the
# stage template: no code changed (57). The archive is the item's
# merge-time effect, not a stage. Addressed as persona-test@3.
machine: persona-test
version: 3
kind: template
tier: extensible
satisfies: [56, 57, 85, 190]
doc: unit type
params:
  place: the item's place
record:
  needs_change_directory: "true"
  lands_on: bolt-line
regions:
  stages:
    initial: spec
    states:
      spec:
        machine: stage
        params: {agents: [spec-writer], join: all, on_fail: spec, max_send_backs: 1, deliverables: [{name: change-directory, step: ff, producer: by-type, schema: by-type, surface: none}, {name: spec, step: ff, producer: by-type, schema: by-type, surface: none}]}
        transitions:
          - {when: {final: passed}, to: build}
          - {when: {final: sent-back}, to: spec}
          - {when: {final: stopped}, to: stopped}
      build:
        machine: stage
        params: {agents: [builder], join: all, on_fail: build, max_send_backs: 2, deliverables: [{name: commits, step: apply, producer: by-type, schema: by-type, surface: none}, {name: as-built-statements-naming-claims, step: apply, producer: by-type, schema: by-type, surface: none}]}
        transitions:
          - {when: {final: passed}, to: verify}
          - {when: {final: sent-back}, to: build}
          - {when: {final: stopped}, to: stopped}
      verify:
        machine: stage
        params: {agents: [verifier], join: all, on_fail: build, max_send_backs: 2, deliverables: [{name: verify-report, step: verify, producer: by-type, schema: by-type, surface: none}, {name: verdict, step: verify, producer: default, schema: default, surface: default}]}
        transitions:
          - {when: {final: passed}, to: test}
          - {when: {final: sent-back}, to: build}
          - {when: {final: stopped}, to: stopped}
      test:
        doc: the session set is resolved against the repository worked, one per persona definition; recorded on the item (S26)
        machine: stage
        params: {agents: {rule: every-persona-definition, pattern: "personas/*.md"}, join: all, on_fail: build, max_send_backs: 2, deliverables: [{name: test-report, producer: by-type, schema: by-type, surface: none}, {name: findings, producer: by-type, schema: by-type, surface: none}]}
        transitions:
          - {when: {final: passed}, to: review}
          - {when: {final: sent-back}, to: build}
          - {when: {final: stopped}, to: stopped}
      review:
        machine: stage
        params: {agents: [reviewer], join: all, on_fail: build, max_send_backs: 2, deliverables: [{name: review-verdict, producer: by-type, schema: by-type, surface: none}, {name: verdict, producer: default, schema: default, surface: default}]}
        transitions:
          - {when: {final: passed}, to: passed}
          - {when: {final: sent-back}, to: build}
          - {when: {final: stopped}, to: stopped}
      passed: {final: true}
      stopped: {final: true}
