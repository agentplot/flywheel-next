# One approved piece of construction work (36, 37). Proposed as one document
# the operator reads whole on the review surface; approval turns it into work
# items under the type version in force. A chore is a unit of the chore type
# (60). A unit planning delivers is named by a proposal and starts in
# in-proposal: it raises no decision of its own, the proposal's decision is
# the one the operator answers, and its per-unit answers reach it as forwarded
# responses (172). A proposed unit whose cited claim moved is replaced by
# planning silently; an approved unstarted one is a decision; a started one
# follows the bolt's claim-moved decision (35).
machine: unit
version: 6
kind: object
tier: core
object: unit
parent: [bolt, intent, repository, instance]   # an intent owns only the chore units that resolve its line's take conflicts (52); a repository owns only the chore units on its shared line — a chore offered off every bolt, as curation's route offers, the offer's scope naming the repository (60, 62, 116); the instance owns only such chores of the blueprints' shared line, their repository field `blueprints` (123)
owns: [work-item]
satisfies: [4, 5, 13, 16, 17, 31, 35, 36, 37, 57, 60, 74, 172]
record:
  type: string
  type_version: int
  document: ref          # the proposal document, kept with the proposal record in the state, not in a change directory (187); presented for review (17); for a finding or a chore offer, the offer's path in the offering session's place (62). The unit's own change lives in its built repository and is written at its first stage
  revision: string       # a finding's or a chore offer's alone: the offering place's revision at the offer, from the offer entry, pinned on the git host by record_offers so every host reads the document there; where the document is read when the unit's work order is rendered, a finding's fast unit as a chore, since the record never holds the text (62)
  target: {bolt: bolt-id, new_name: string}
  depends_on: list       # other units of the same bolt
  claims: list           # claim@version the work serves; empty when no standing claim in scope fits, which is legal and is the common case for a chore (34a, 61). An empty list means no as-built statement, no verdict and no ledger cell; the unit never proposes a claim of its own
  claim_answer: enum     # none, captured or declined: the review surface's one answer for a unit that landed citing no claim, stored once against the unit as a not-applicable verdict is stored once against a claim (101, 317); never a decision on the rail
  estimate: int          # the proposal's size estimate in slot-days, one session slot for one day (172)
  owner: string          # the one member the unit's decisions belong to — from the proposal, the type, or an assign response (237); never a role; none is everyone's
  actual: int            # the slot-days its sessions occupied, summed from the session records at landing and written on the as-built by write_acceptance (172)
  batch: string          # chores share the bolt id, or the repository name for a shared line's, so they fold into one decision
  scope: enum            # a chore's alone: bolt-line or shared-line — where its fix belongs and merges, from the offer's `--scope` (60); a unit under a repository or the instance works off that shared line
  proposal: proposal-id  # the proposal that names it, when planning delivered it (172); none for a finding or a chore offer
  approval: string       # the response or dictation that approved it; a conflict chore names the cadence or the response that ordered the take (I1)
  redo_notes: string
  needs_amend: bool
  citation_choices: list
regions:
  life:
    initial: proposed
    states:
      in-proposal:
        doc: named by a proposal in proposed; no decision here — the proposal's is the one the operator answers, and a per-unit answer arrives as a response forwarded from it (172); nothing is a bolt or a unit's items until the proposal's yes
        transitions:
          - when: {all: [{ev: unit.proposal, is: approved}, {ev: unit.type_defined, is: false}]}
            to: proposed
            note: the proposal's yes does not carry a unit whose type the instance does not know; it stands on a decision of its own that names the missing type and asks for one (85a)
          - when: {all: [{ev: unit.proposal, is: approved}, {ev: unit.type_defined, is: true}]}
            to: approved
            effects:
              - {do: create_bolt, args: {name: target.new_name, repository: parent.repository}, note: "only when the target is a new bolt; several units of one proposal naming the same new bolt make one (I8)"}
              - {do: create_items, note: "the approval recorded is the proposal's response (57)"}
          - when: {ev: unit.proposal, is: withdrawn}
            to: withdrawn
          - when: {ev: unit.proposal, is: superseded}
            to: superseded
          - when: {response: "bolt <name>"}
            to: in-proposal
            effects: [{do: route_unit, args: {bolt: $response}}]
          - when: {response: "new bolt <name>"}
            to: in-proposal
            effects: [{do: route_unit, args: {bolt: $response}}]
          - when: {response: "rename <name>"}
            to: in-proposal
            effects: [{do: rename_bolt, args: {name: $response}}]
          - when: {response: "type <name>"}
            to: in-proposal
            effects: [{do: set_type, args: {type: $response}}]
          - when: {response: drop}
            to: dropped
      proposed:
        doc: a finding routed to a bolt or a chore offer, proposed on its own (58, 60); its document is read at the pinned revision, so the offering place's removal changes nothing here, and a proposed chore of a bolt that is dropped retires with the bolt (62, 74); a chore under a repository is on its shared line and names no bolt, and such chores fold by repository as a bolt's fold by bolt (11, 60); a fold is one card with lettered rows, each row this decision on its own chore — named by the fold's number and its letter in chat, carrying its own drop on the card, so some chores are accepted by dropping the others first or by answering rows by name, and no pick answer exists (S232); the decision names the target bolt and what a yes starts, derived from the type's stages and the item count (13, 16); the document is reviewed on its own surface and an annotation on it is the response (17); a unit whose type the instance does not know stays here, its decision naming the type it lacks and asking the operator to set one with `type <name>` (85a)
        decision: {kind: unit-proposed, group: approve, batch: batch, document: document,
                   answers: ["yes", drop, "redo: <notes>", "bolt <name>", "new bolt <name>", "rename <name>", "type <name>", later],
                   shows: [unit.type, unit.type_defined, target, depends_on, claims, estimate], satisfies: [10, 11, 16, 17, 29, 85, 172]}
        transitions:
          - when: {ev: unit.claim_moved, is: true}
            to: superseded
            note: a proposal is not work; planning's fingerprint moved with the claim, so its next proposal replaces this one silently (35)
          - when: {parent: {in: [dropped]}}
            to: retired
            note: a chore offered under a bolt has nowhere to land once the bolt is dropped; its decision leaves the rail with a tail entry (62, 74)
          - when: {response: "bolt <name>"}
            to: proposed
            effects: [{do: route_unit, args: {bolt: $response}}]
          - when: {response: "new bolt <name>"}
            to: proposed
            effects: [{do: route_unit, args: {bolt: $response}}]
          - when: {response: "rename <name>"}
            to: proposed
            effects: [{do: rename_bolt, args: {name: $response}, note: renames the proposed bolt; a name is never an identity}]
          - when: {response: "type <name>"}
            to: proposed
            effects: [{do: set_type, args: {type: $response}}]
          - when: {all: [{response: "yes"}, {ev: unit.type_defined, is: false}]}
            to: proposed
            note: the yes is refused with the missing type named; nothing moves on with no stages and no session until the operator sets a type (85a)
          - when: {all: [{response: "yes"}, {ev: unit.type_defined, is: true}]}
            to: approved
            effects:
              - {do: create_bolt, args: {name: target.new_name, repository: parent.repository}, note: only when the target is a new bolt; a chore never creates one (I8)}
              - {do: create_items, note: the type version in force is recorded with the unit (57)}
          - when: {response: "redo: <notes>"}
            to: withdrawn
            effects: [{do: request_replan, args: {notes: $response}}]
          - when: {response: drop}
            to: dropped
            note: the operator's response on the proposal; a fold row's drop is this transition on that row's chore, and the card's drop is it on every row still standing (S232)
          - when: {response: later}
            to: deferred
      deferred:
        doc: out of the count for a week, then offered again as a new decision with a new number; nothing was approved
        transitions:
          - when: {ev: unit.claim_moved, is: true}
            to: superseded
          - when: {parent: {in: [dropped]}}
            to: retired
          - when: {ev: entered_at, older: 7d}
            to: proposed
          - when: {response: drop}
            to: dropped
      superseded:
        doc: replaced by planning's next proposal, on its own or with the proposal that named it; no tail entry, since nothing the operator approved changed (35, 172)
        final: true
      approved:
        doc: approval given once is never re-asked (6); the record names the response or dictation that approved it (I1)
        transitions:
          - when: {response: drop}
            to: dropped
            note: dictation undoes work (4); the items retire with it
          - when: {ev: unit.claim_moved, is: true}
            to: claim-moved
          - when: {parent: {in: [dropped]}}
            to: retired
          - when: {ev: unit.deps_merged, is: true}
            to: in-flight
          - when: {always: true}
            to: waiting
      waiting:
        doc: a dependency of the same bolt is not merged yet (31)
        transitions:
          - when: {response: drop}
            to: dropped
          - when: {ev: unit.claim_moved, is: true}
            to: claim-moved
          - when: {parent: {in: [dropped]}}
            to: retired
          - when: {ev: unit.deps_merged, is: true}
            to: in-flight
      claim-moved:
        doc: approved, not started, and a cited claim's version moved; redo sends it back to planning, keep pins the cited version (35)
        decision: {kind: unit-claim-moved, group: decide, answers: [redo, keep], shows: [claims], satisfies: [35, 103]}
        transitions:
          - when: {response: redo}
            to: withdrawn
            effects: [{do: request_replan, args: {notes: claim moved}}]
          - when: {response: keep}
            to: approved
            effects: [{do: record_citation_choice, args: {choice: keep, claim: moved}}]
      in-flight:
        doc: items run the type's stage machine, side by side where their own dependencies allow; a moved claim here is the bolt's decision (103)
        transitions:
          - when: {response: drop}
            to: dropped
            note: dictation (4); the items end their sessions and release their places
          - when: {parent: {in: [dropped]}}
            to: retired
          - when: {children: {kind: work-item, all: [merged]}}
            to: merged
      merged:
        tail: merged
        transitions:
          - when: {parent: {in: [landed, closed]}}
            to: landed
            note: a bolt's unit lands with the bolt; an intent's conflict chore lands with the intent's line, which lands as the intent closes (52)
          - when: {ev: unit.shared_line, is: true}
            to: landed
            note: a chore under a repository or the instance merged straight onto the shared line, and no bolt stands above it to land with, so its merge is its landing — final on the same pass, its pin stale, its cited claim's cell due again (60, 62, 64)
      landed:
        doc: a unit that landed with an empty claims list joins the review surface's batch — the units landed since the operator's mark citing no claim, read in one sitting under one question (317, model.md 8.5). The answer is recorded by record_claim_answer against the unit; the unit is not reopened for it and nothing waits on it. A chore that did cite a claim makes that claim's cell due again at its landing (64). A shared-line chore comes here from merged on the same pass (60)
        final: true
      withdrawn:
        doc: back to planning with the notes; the next proposal is a new unit
        final: true
      retired:
        doc: the bolt was dropped; the unit's items end their sessions and release their places (74); a proposed or deferred chore of the bolt comes here too, its decision gone from the rail (62)
        tail: dropped
        final: true
      dropped:
        doc: by the operator's response on the proposal, or by dictation on approved work (4); never by the machinery
        tail: dropped
        final: true
