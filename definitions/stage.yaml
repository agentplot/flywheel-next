# One stage of a unit type (56). Runs the stage's session set over the
# item's place, collects their exits as one set, and judges pass, not-done,
# blocked or stalled by the join rule. The session set is a fixed list or a
# rule read against the repository worked.
# A stage names the model class it runs, declared by the unit type or the
# elaboration type, so a stage that reviews code may name a different class
# from the stage that writes it; the runner's own model is the default where
# the type names none (285).
machine: stage
version: 4
kind: template
tier: core
satisfies: [4, 41, 56, 70, 173, 190, 285]
params:
  agents: "a fixed list of agent entries — a name, or {name, kind, model} where kind is claude, codex or opencode, default claude (173), and model is the model class this stage runs, declared by the unit type or the elaboration type so a stage that reviews code may name a different class from the stage that writes it (285); the runner's own model is the default where the type names none, and the manifest's per-role model is the fallback under that — or a rule such as every persona definition matching a pattern"

  join: all | any | count:<n>
  on_fail: the stage an item returns to when this stage judges it not done
  max_send_backs: how many times before the item stops and waits on the operator
  deliverables: "what the work order asks for, recorded as expected: entries {name, producer, schema, surface}, where `default` for producer, schema or surface means the deliverables binding in force for that name (profiles/deliverables.yaml, overridable per deliverable in the manifest) and `by-type` means the stage's own type skill and schema instruction with no review surface (190); an entry may carry `step:` naming the OpenSpec step that produces it — ff, apply, verify — so a by-type producer resolves to the type skill for that step"
regions:
  run:
    initial: resolving
    states:
      resolving:
        doc: the session set is found now, against the repository being worked, and recorded with the item
        transitions:
          - when: {ev: stage.agents, exists: true}
            to: sessions
      sessions:
        doc: one session submachine per agent in the set, side by side, each with its own instruction and persona
        machine: session
        params: {agent: $each, kind: $each.kind, place: $place, work_order: rendered, keep_alive: false, deliverables: $deliverables}
        transitions:
          - when: {ev: stage.verdict, is: blocked}
            to: sessions
            note: the blocked session's own decision stands; the other sessions of the set continue
          - when: {response: "send back"}
            to: sent-back
            note: dictation sends the item back to the stage the type names (4); never forward
          - when: {all: [{ev: stage.join_met, is: true}, {ev: stage.verdict, is: pass}]}
            to: passed
          - when: {all: [{ev: stage.join_met, is: true}, {ev: stage.verdict, is: not-done}, {ev: item.send_backs, lt_ev: item.retry_max}]}
            to: sent-back
          - when: {all: [{ev: stage.join_met, is: true}, {ev: stage.verdict, is: not-done}, {ev: item.send_backs, gte_ev: item.retry_max}]}
            to: stopped
          - when: {all: [{ev: stage.join_met, is: true}, {ev: stage.verdict, is: stalled}]}
            to: stopped
      sent-back:
        doc: the item returns to the type's named earlier stage with the count bumped; both send-backs stay in its history (S14)
        final: true
      passed:
        final: true
      stopped:
        final: true
