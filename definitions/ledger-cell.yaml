# One verdict slot: a standing claim × a repository in its scope (A.14). The
# verdict is a session's judgment, recorded by the machinery from a planning
# or test exit. Two of the inputs handed to the judging session are mechanical
# and the machinery reads them for it: whether the repository's standing
# specifications hold a requirement naming this claim, and whether the version
# that requirement names equals the claim's current version (99, 192). A
# naming requirement whose version matches, with its scenarios passing, is
# strong evidence and is not the verdict (100). The machine only says when the
# verdict is fresh and when it is stale:
# the claim's version moved, the cited evidence is gone, or a challenge move
# stands against the claim since the verdict was judged (101, 116). The
# backlog is derived: every cell not in judged.satisfied or
# judged.not-applicable (102). A cell exists for every standing claim and
# repository in its scope, and scope is read through the context map: the
# repositories homing what the claim attaches to (198, 200). A node newly
# homed or an attachment newly reaching a repository makes cells appear
# unjudged and planning due; one removed takes the cell out of scope, where
# its verdict reads as not-applicable (195). A repository joins when a node
# names it as home; its baseline is the claims attached to what it homes
# (202). A cell is a claim and a repository and never a unit, so a unit that
# cites no claim has no cell at all: it produces no as-built statement, the
# backlog never sees it, and the ledger holds nothing for it (34a). The
# question of whether such a unit wanted a claim after the fact is answered on
# the review surface and stored on the unit, never here (317, unit.yaml
# claim_answer).
machine: ledger-cell
version: 4
kind: object
tier: core
satisfies: [100, 101, 102, 104, 116, 195, 198, 200, 202]
object: ledger-cell
parent: null
record:
  claim: string
  repository: string
  verdict: enum
  claim_version: hash    # the version judged: the content hash of the claim's requirement block (97)
  revision: revision
  evidence: list
  judged_at: time
regions:
  freshness:
    initial: unjudged
    states:
      unjudged:
        doc: a repository joining the fleet — a node naming it as home (202) — has every cell here, one per claim attached to what it homes (104)
        transitions:
          - when: {ev: cell.verdict, in: [satisfied, partial, not-satisfied, not-applicable]}
            to: judged
      judged:
        doc: reused until the claim's version moves, the evidence is gone, or a challenge is recorded against the claim; a repository changing does not stale it (101, 116, I10)
        regions:
          value:
            initial: unknown
            states:
              unknown:
                transitions:
                  - {when: {ev: cell.verdict, is: satisfied}, to: satisfied}
                  - {when: {ev: cell.verdict, is: partial}, to: partial}
                  - {when: {ev: cell.verdict, is: not-satisfied}, to: not-satisfied}
                  - {when: {ev: cell.verdict, is: not-applicable}, to: not-applicable}
              satisfied: {doc: out of the backlog}
              partial: {doc: in the backlog}
              not-satisfied: {doc: in the backlog}
              not-applicable: {doc: out of the backlog; the scope judgment was made once}
        transitions:
          - when: {ev: cell.in_scope, is: false}
            to: out-of-scope
          - when: {any: [{ev: cell.verdict_claim_version, ne_ev: cell.claim_version}, {ev: cell.evidence_present, is: false}, {ev: cell.challenged, is: true}]}
            to: stale
      stale:
        doc: back in the backlog; planning's fingerprint moves, so a planning run is due and a decision cannot be missed; for a challenge the proposal cites the signal (101)
        transitions:
          - when: {ev: cell.in_scope, is: false}
            to: out-of-scope
          - when: {all: [{ev: cell.verdict_claim_version, eq_ev: cell.claim_version}, {not: {ev: cell.challenged, is: true}}]}
            to: judged
            note: a new verdict was recorded against the current version, and after any challenge that stands
      out-of-scope:
        doc: the node moved home or was removed, or the claim was re-attached away from what the repository homes; the recorded verdict reads as not-applicable and the cell is out of the backlog (101, 195, 200); the record is kept, and if scope returns the verdict is judged again by the freshness rules
        transitions:
          - when: {ev: cell.in_scope, is: true}
            to: judged
