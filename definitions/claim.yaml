# One statement in the design book of what is true at the destination (A.14).
# The claim's state is where its text is: on an intent's line it is proposed,
# on the books' shared line it is standing. The machine writes nothing but a
# re-attachment; it is the index planning, curation and the ledger read. A
# claim attaches to map elements — a context, a node or a relation — and its
# scope is the set of repositories homing what it attaches to, derived and
# never chosen; a claim attached to nothing is not planned against (105,
# 198, 200).
machine: claim
version: 3
kind: object
satisfies: [23, 97, 98, 105, 121, 195, 198, 200]
object: claim
parent: null
record:
  name: string
  version: int           # moves only when the text moves; a lock hash proves it
  attachments: list      # the map elements it attaches to — context, node or relation ids — in the target map; the block's scope line is rendered from them; re-attached by the attach tool, which does not move the version (105, 195, 200)
  scenarios: list
regions:
  standing:
    initial: proposed
    states:
      proposed:
        doc: visible, never built (98)
        transitions:
          - when: {ev: claim.on_shared_line, is: true}
            to: standing
      standing:
        doc: planned against where it attaches; every ledger cell in scope compares its verdict's version with this one; the page shows the attachments with a control to re-attach it (195, 200)
        transitions:
          - when: {not: {ev: claim.on_shared_line, is: true}}
            to: retired
          - when: {response: "attach <element>"}
            to: standing
            effects: [{do: attach_claim, args: {element: $response}, note: "the attach tool (193); the attachment and the rendered scope line move, the text and the version do not (105, 200)"}]
      retired:
        final: true
