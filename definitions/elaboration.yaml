# One unit of design work on an intent: one session, one conversation, one
# place (A.4). Its type is a machine the operator can add; the type decides how
# it ends. Its records — research notes, session records, prototype notes, an
# interactive page — go into its intent's change directory; what it concludes
# goes to the book and its claims (187). It may cover several intents (188):
# `covers` names them, the parent first, and its finish fans the records out
# to every covered intent's change directory while the book is written once.
# The `explore` tool, arguments {intents, type}, creates one directly in
# approved covering the selected intents, as a with-operator or standing
# session (189, 193); the operator selects the intents and invokes it, and
# no typed word is parsed. Its work order carries the covered intents'
# chapters, claims and the records of their earlier elaborations, which it
# leaves unchanged (89, 189). Every elaboration is a surface of its own on
# the status view, reached from its intent: type and state, the pending
# decision, the document and the records in the change directory, the
# session with its last activity, and the gathering it is in (210).
machine: elaboration
version: 2
kind: object
tier: core
satisfies: [4, 5, 24, 27, 54, 89, 187, 188, 189, 193, 210]
object: elaboration
parent: intent
record:
  type: string
  type_version: int
  sources: list          # the findings, signals or dictation that proposed it
  document: ref          # the proposal the operator reads
  covers: list           # the intent ids this elaboration covers, the parent first; more than one when gathered (188) or dictated over several (189)
  owner: string          # the member or role its decisions belong to — from the type or an assign response (237); none is everyone's
regions:
  life:
    initial: proposed
    states:
      proposed:
        doc: a decision of its own when the intent is open; folded into the intent's decision when the intent is itself proposed; a gathering shows every intent it covers, and the operator may pick which stay or answer per intent (188)
        decision: {kind: elaboration-proposed, group: approve, document: document, answers: ["yes", drop, "type <name>", "pick <intents>", "<intent>: drop"], shows: [elaboration.type, sources, covers], satisfies: [10, 27, 58, 188]}
        transitions:
          - when: {ev: elaboration.shown_with_parent, is: true}
            to: proposed
            note: no decision of its own; the intent's response carries it
          - when: {response: "type <name>"}
            to: proposed
            effects: [{do: set_type, args: {type: $response}}]
          - when: {response: "pick <intents>"}
            to: proposed
            effects: [{do: set_covers, args: {keep: $response}, note: "the intents left out are uncovered; their material is pending again on each and proposed there on its own (188)"}]
          - when: {response: "<intent>: drop"}
            to: proposed
            effects: [{do: set_covers, args: {without: $response}, note: "one intent answered on its own leaves the gathering (188)"}]
          - when: {response: "yes"}
            to: approved
          - when: {response: drop}
            to: dropped
      approved:
        doc: approval given once is never re-asked (6); the record holds the type version in force; also the state the `explore` tool ({intents, type}) creates an elaboration in, covering the selected intents (189, 193)
        transitions:
          - when: {response: drop}
            to: dropped
            note: dictation (4)
          - when: {parent: {in: [open]}}
            to: placing
      placing:
        doc: the intent's line takes the shared line first if due; then the place region beside this one makes the place and proves it current
        transitions:
          - when: {region: {name: place.place.life, in: [ready]}}
            to: working
      working:
        doc: the type machine runs here with the session inside it
        machine: $type
        params: {place: own-place, agent: by-type}
        transitions:
          - when: {response: drop}
            to: dropped
            enter: {session: ended, place: removing}
            note: dictation undoes the work (4); the session is retired and the place released unless held
          - when: {final: done}
            to: writing-back
      writing-back:
        doc: the writeback is per covered intent (188, 189); the records the session left in its place for each covered intent beyond the parent are committed onto that intent's line, before the place itself moves; nothing to do when covers names the parent alone
        entry: [{do: record_per_intent}]
        transitions:
          - when: {ev: elaboration.records_fanned_out, is: true}
            to: finishing
      finishing:
        doc: a self-closing place merges into the parent intent's line, carrying the parent's records and the book, and is removed; a standing place is kept until the operator finishes it, then merged the same way (54)
        enter: {place: merging}
        transitions:
          - when: {region: {name: place.place.life, in: [removed]}}
            to: done
      done:
        tail: done
        final: true
      dropped:
        tail: dropped
        final: true
  place:
    doc: the object's own place, a region beside its life so the owner can command it (merging, removing) after leaving placing; a region inside placing would be gone by then
    initial: none
    states:
      none:
        transitions:
          - when: {region: {name: life, in: [placing]}}
            to: place
      place:
        machine: place
        params: {line: parent-line, inputs: work-order, keep: by-type}
