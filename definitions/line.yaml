# A branch the machinery owns (49). Template run inside a bolt (off the
# built repository's shared line) and inside an intent (off the books' shared
# line). Every operation here is an effect the machinery performs; a session
# never touches a line (I12). A take that conflicts becomes a chore on the
# line whose approval is the cadence the operator set or the response that
# ordered the take (52). The landing is the repository's policy (175): direct
# is one merge commit; pull-request opens the request and waits in
# request-open while its reviews and checks are evidence on the bolt (176).
# History on a line is never rewritten: every take is a merge (179). A bolt's
# line, before its landing, gets one commit the machinery writes: the
# acceptance file beside the as-built, naming the claims the bolt's units
# named with their scenarios, for any delivery system to read from git (192);
# an intent's line has none.
machine: line
version: 4
kind: template
satisfies: [42, 49, 50, 52, 53, 54, 183, 185, 175, 176, 177, 179, 180, 192]
params:
  parent: the shared line this line is off
  landing_policy: pull-request or direct, from the manifest
record:
  head: revision
  merge_base: revision
  retries: int
  last_take: time
regions:
  life:
    initial: absent
    states:
      absent:
        transitions:
          - when: {always: true}
            to: current
            effects: [{do: create_line, args: {parent: $parent}}]
      current:
        doc: contains its parent as of the last take
        transitions:
          - when: {all: [{ev: line.take_due, is: true}, {not: {ev: line.contains_parent, is: true}}]}
            to: taking
      taking:
        doc: the take is a merge by the machinery; a conflicting take is aborted whole (52)
        transitions:
          - when: {ev: line.contains_parent, is: true}
            to: current
          - when: {ev: line.take_conflicts, is: true}
            to: conflict
            effects: [{do: seed_take_conflict, note: "a chore unit in approved on this line; its approval is the cadence or the response that ordered the take; its session works a place off the line with the take applied and conflicted"}]
          - when: {always: true}
            to: taking
            effects: [{do: take_parent}]
      conflict:
        doc: the chore's session resolves it in its place; the take is retried when the chore merges
        transitions:
          - when: {ev: line.contains_parent, is: true}
            to: current
          - when: {all: [{ev: line.conflict_job_done, is: true}, {ev: line.retries, lt: 3}]}
            to: taking
            bump: retries
          - when: {ev: line.retries, gte: 3}
            to: conflict-stalled
      conflict-stalled:
        decision: {kind: stalled, group: decide, answers: [retry, hold], shows: [line.retries], satisfies: [52, 180]}
        transitions:
          - when: {response: retry}
            to: taking
          - when: {response: hold}
            to: conflict-stalled
      landing:
        doc: entered by the owner's response (bolt close, intent archive); one final take, then the policy's landing (175)
        transitions:
          - when: {ev: line.landed, is: true}
            to: landed
          - when: {ev: line.landing, is: failed}
            to: land-failed
          - when: {not: {ev: line.contains_parent, is: true}}
            to: landing
            effects: [{do: take_parent, note: the take before landing (50)}]
          - when: {not: {ev: line.acceptance_written, is: true}}
            to: landing
            effects: [{do: write_acceptance, note: "one commit on the line after the final take and before the policy's landing, so the file lands with the work; nothing on an intent's line (192)"}]
          - when: {ev: line.policy, is: pull-request}
            to: request-open
            effects: [{do: open_request, note: "the request is opened from the line; the repository's own merge setting lands it (175, 179)"}]
          - when: {ev: line.landing, in: [none]}
            to: landing
            effects: [{do: land_line, args: {policy: $landing_policy}, note: "direct: one merge commit into the shared line (175)"}]
      request-open:
        doc: the bolt stays open, landing, while the request is open (175); a review that asks for a change is seeded as a finding on the bolt, and the chore it becomes merges into this line and so updates the request (176); the request's links are evidence shown on the bolt (177)
        transitions:
          - when: {ev: line.request, is: merged}
            to: landed
          - when: {ev: line.request, is: closed}
            to: land-failed
          - when: {ev: line.request_review_pending, is: true}
            to: request-open
            effects: [{do: seed_request_finding}]
          - when: {ev: line.request, is: none}
            to: request-open
            effects: [{do: open_request, note: "the request vanished without merging or closing; opened again by the same name"}]
      land-failed:
        doc: the gates failed or the request was closed; the line stays; nothing is asked of any session until the operator's response (40, 175, S33)
        final: true
      landed:
        transitions:
          - when: {always: true}
            to: removing
      removing:
        doc: entered from landed, or by the owner when the bolt is dropped; nothing of the work lives on a branch afterwards (54)
        transitions:
          - when: {ev: line.absent, is: true}
            to: removed
          - when: {always: true}
            to: removing
            effects: [{do: remove_line}]
      removed:
        final: true
