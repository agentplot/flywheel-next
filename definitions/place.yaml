# A worktree the machinery prepares for one session off one line (49).
# Template run inside a work item, an elaboration, a bolt (the operator's own
# place), an operator session, curation and planning. Rebased only while its
# session is idle and no operator is typing in it (I16). Removed by the
# machinery when the work it served is merged, dropped or retired, unless the
# operator holds it; every removal is a recorded effect (55).
machine: place
version: 2
kind: template
satisfies: [4, 42, 45, 46, 51, 52, 55]
params:
  line: the line it is off
  inputs: the closed set of session inputs to write into it
  keep: kept as long as its session (standing) or merged and removed on done
record:
  head: revision
  conflict_retries: int
  endpoints: list          # what the processes tethered to the place serve; shown on the page beside the bolt (46)
  held_at: time            # set by the operator's dictation; the place is not removed while held (55)
regions:
  life:
    initial: absent
    states:
      absent:
        transitions:
          - when: {always: true}
            to: preparing
            effects: [{do: prepare_place, args: {line: $line, agent_inputs: $inputs}}]
      preparing:
        transitions:
          - when: {all: [{ev: place.exists, is: true}, {ev: place.contains_line, is: true}]}
            to: ready
            note: a place is proven current before any session starts in it
          - when: {always: true}
            to: preparing
            effects: [{do: prepare_place, args: {line: $line, agent_inputs: $inputs}}]
      ready:
        doc: current with its line and holding no working session; the endpoints its processes serve are recorded with it (46)
        transitions:
          - when: {not: {ev: place.contains_line, is: true}}
            to: behind
          - when: {not: {ev: place.endpoints_recorded, is: true}}
            to: ready
            effects: [{do: record_endpoints, note: the page shows them beside the bolt; publishing beyond the private network is never the machinery's}]
      behind:
        doc: a sibling merged; this place is rebased when its session is idle and no one is typing in it
        transitions:
          - when: {any: [{ev: session.activity, is: working}, {ev: session.operator_present, is: true}]}
            to: behind
          - when: {ev: place.contains_line, is: true}
            to: ready
            effects: [{do: tell_moved, note: the session is told what moved under it before it continues}]
          - when: {ev: place.conflicted, is: true}
            to: conflict
            effects: [{do: seed_conflict_job}]
          - when: {always: true}
            to: behind
            effects: [{do: rebase_place}]
      conflict:
        doc: the place's own session resolves the conflict as part of its job; the rebase retries when it exits done
        transitions:
          - when: {ev: place.contains_line, is: true}
            to: ready
            effects: [{do: tell_moved}]
          - when: {all: [{ev: session.exit, is: done}, {ev: place.conflict_retries, lt: 3}]}
            to: behind
            bump: conflict_retries
          - when: {ev: place.conflict_retries, gte: 3}
            to: conflict-stalled
      conflict-stalled:
        decision: {kind: stalled, group: decide, answers: [retry, hold], shows: [place.conflict_retries], satisfies: [52]}
        transitions:
          - when: {response: retry}
            to: behind
      merging:
        doc: entered by the owner when its work is done; one place merges at a time in the fixed order (38)
        transitions:
          - when: {ev: place.merged, is: true}
            to: merged
          - when: {not: {ev: place.contains_line, is: true}}
            to: behind
            note: a sibling landed first; take the line, then merge
          - when: {ev: place.merge_slot, is: true}
            to: merging
            effects: [{do: merge_place}]
      merged:
        transitions:
          - when: {always: true}
            to: removing
      removing:
        doc: entered from merged, or by the owner when the work the place served was dropped or retired, or when the bolt landed; the removal is an effect recorded like any other (55)
        transitions:
          - when: {ev: place.held, is: true}
            to: held
          - when: {ev: place.absent, is: true}
            to: removed
          - when: {always: true}
            to: removing
            effects: [{do: remove_place, note: tethered processes end with the place}]
      held:
        doc: the operator holds the place by dictation; nothing removes it while held; released by dictation (55)
        transitions:
          - when: {not: {ev: place.held, is: true}}
            to: removing
      removed:
        final: true
