# One sink the operator reads: the chat, the page, or the multiplexer's bell
# on a named surface. Engine machine, one instance per sink the manifest
# names, per organization — no sink serves two organizations (218) — and per
# member: each member's page is a sink of their own, and each chat address
# on their operators entry a chat sink of their own — one per member per
# address, none without an address — each with its own mark, a shared
# channel a sink with one mark (236, 236a); a member is an entry in the
# operators list, or on a hosted tier a user assigned to the organization's
# account (247). The page sink signs its reader in through the host's identity
# kind — GitHub's device flow on a self-managed host, Frontegg's hosted login
# on a hosted one — on a localhost port of its own when served on the
# operator's computer (243–245, 253), and a hosted page reads on when the
# provider is unreachable (254). Its
# presenter is the holder of its lease, or the host the manifest pins (148);
# the dispatcher, a host that takes no work and presents the chat, is that
# presenter for the chat sink (216, 217).
# The delivery mark is the one recorded piece of state behind the tail (14).
# On a hosted tier the page sink's delivery writes one small page projection
# per organization — the status view and the rail as data, with each member's
# page sink and its mark — to an object under the organization's key; a page
# request decrypts that one object and never the warm cache (291).
# Notifications are deliveries: the manifest routes decision kinds to sinks,
# and a construction host is no sink unless the manifest names it (82).
# On the hosted tiers the chat sink's identity may be the service's own Slack
# or Discord application, scoped to the organization's channel, carrying plan
# text and the interactions it receives and nothing else; the record still
# names who responded (277). On an installed control plane those applications
# are the installer's own, with their ids, tokens and signing secrets, and the
# two shared components are still exactly two (303, 290).
# The page sink is read on a phone as readily as on a desktop: the same
# served bundle under 760px, two tabs with a full-screen dock, every
# decision answerable and every control and form present there, nothing
# reachable only by hover or keyboard and every answer one tap or one
# short reply (306, 307, 311, S38, S39, S61). The status view it renders
# comes from one request and holds no client state a reload loses, so a
# reload after an answer shows the answer recorded (310, 154). Every
# rendering, notification and plan line this sink delivers carries a link
# to the object on the page at the host's address with the organization in
# the path, which opens that object in the dock with its answer controls
# in reach and says so when the host is away (308, 205a, 150a). A decision
# raised reaches the phone through the chat sink's own notification with
# the platform's answer controls; the page pushes nothing of its own and
# the short reply grammar always works beside them (309).
machine: sink
version: 1
kind: engine
tier: core
object: sink
parent: null
satisfies: [2, 8, 14, 18, 68, 82, 148, 152, 153, 154, 155, 216, 217, 218, 233, 236, 243, 244, 245, 247, 253, 254, 277, 303, 306, 307, 308, 309, 310, 311]
record:
  kind: enum                    # chat | page | bell
  member: string                # the member this sink belongs to, or none for a shared channel or surface (236)
  filter: string                # own | all: whether the member's delivery is filtered to the decisions they own, an owner being one member and never a role (237)
  surface: string               # the chat channel, the page route, or the named multiplexer surface
  routes: list                  # the decision kinds delivered here, from the manifest
  cadence: string
  delivered_at: time            # the mark; the tail is everything that entered a tail state after it
  pinned_to: host-id            # from the manifest, or none: then the lease decides the presenter
regions:
  delivery:
    initial: idle
    states:
      idle:
        transitions:
          - when: {ev: sink.due, is: true}
            to: delivering
      delivering:
        entry:
          - {do: deliver_plan, note: "the numbered decisions routed to this sink and the tail since its mark; the mark advances in the same write; the chat carries one line per decision and a link to the page (18)"}
        transitions:
          - when: {always: true}
            to: idle
