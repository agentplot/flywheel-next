# The plan as an object: one per organization (148). Engine machine. Its
# decisions are derived every tick from every object's state (7) and are never
# stored; this machine keeps only the decision register — a short number per
# decision, unique in the organization, given once and never reused (15) —
# and writes the status projection. Delivery to a sink is the sink machine's.
machine: plan
version: 2
kind: engine
tier: core
object: plan
singleton: organization
satisfies: [7, 8, 9, 11, 15, 83, 86, 148]
record:
  next_number: int              # the counter; it only grows
  register: list                # {decision id, number, since}; a decision id is <object>/<kind>/<entered_at>
  status_as_of: time
regions:
  register:
    initial: current
    states:
      current:
        doc: every standing decision carries a number; the page and the chat read the same register
        transitions:
          - when: {ev: plan.unnumbered, is: true}
            to: numbering
      numbering:
        entry:
          - {do: number_decisions, note: "each decision standing without a number takes the next number; one atomic write of the register and the counter; a re-entered decision state is a new decision and takes a new number"}
        transitions:
          - when: {always: true}
            to: current
  status:
    initial: current
    states:
      current:
        doc: the status projection is rewritten whenever the state it projects moved; reading twice with nothing changed writes nothing (78)
        transitions:
          - when: {not: {ev: plan.status_current, is: true}}
            to: current
            effects: [{do: render_status, note: "the status view from list and read, stating the as-of point (145)"}]
