# The rail as an object: one per instance (148). Engine machine. Its
# decisions are derived every tick from every object's state (7) and are never
# stored; this machine keeps only the decision register — a short number per
# decision, unique in the instance, given once and never reused (15) —
# and writes the status projection. Delivery to a sink is the sink machine's.
# One board per instance (235): every member reads this one register, so
# the numbers and the count are the same for all; a retracted entry keeps the
# response that answered it, so a second response is refused as already
# answered and every member sees by whom and when. A decision may carry an
# owner — one member, never a role — on its object's record (237): planning's
# proposal or the type sets it, or the assign response here; it filters a
# member's rail and chat and changes nothing else. A role is one the token
# carries on a hosted tier (248); a flag hides a surface and never a decision
# (250).
# A rail on a hosted tier hides and meters and never authorizes: permissions
# come from roles and are checked on every tool call, and exceeding a limit is
# one attention line and a refused add, never a stopped loop (280).
machine: rail
version: 3
kind: engine
tier: core
object: rail
singleton: instance
satisfies: [7, 8, 9, 11, 15, 83, 86, 148, 213, 214, 235, 237, 248, 250, 280]
record:
  next_number: int              # the counter; it only grows
  register: list                # {decision id, number, since, answered_by, answered_at}; a decision id is <object>/<kind>/<entered_at>; answered fields from the response that retracted it (235)
  status_as_of: time
regions:
  register:
    initial: current
    states:
      current:
        doc: every standing decision carries a number; the page and the chat read the same register
        transitions:
          - when: {ev: rail.unnumbered, is: true}
            to: numbering
          - when: {response: "assign <owner>"}
            to: current
            effects: [{do: assign_owner, args: {owner: $response}, note: "a member's response naming a decision number and one member of the instance (237); the owner lands on the object's record, and a role is never an owner"}]
      numbering:
        entry:
          - {do: number_decisions, note: "each decision standing without a number takes the next number; one atomic write of the register and the counter; a re-entered decision state is a new decision and takes a new number"}
        transitions:
          - when: {always: true}
            to: current
  status:
    initial: current
    states:
      current:
        doc: the status projection is rewritten whenever the state it projects moved; reading twice with nothing changed writes nothing (78)
        transitions:
          - when: {not: {ev: rail.status_current, is: true}}
            to: current
            effects: [{do: render_status, note: "the status view from list and read, stating the as-of point (145); with it the artifact views behind every object (213) and the flywheel instrument (214), both projections of the same read"}]
