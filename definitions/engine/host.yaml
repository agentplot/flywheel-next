# A host that runs the machinery. Engine machine: it names no domain object.
# The manifest says what the host takes — kinds, repositories, unit types,
# whether it presents — and it takes leases only within that (149). Its
# reconciliation finds stray places on its own disk and removes them (55), and
# closes multiplexer tabs and workspaces whose object has left every view (196).
# A host joins by one command (205): it clones the state, the books and every
# tracked built repository under the root the manifest names, with the
# profile's layout on disk; a hand-made layout is refused with what differs.
machine: host
version: 4
kind: engine
tier: core
object: host
parent: null
satisfies: [4, 32, 55, 96, 147, 149, 150, 151, 186, 196, 205]
record:
  bound: int            # sessions this host may run at once (a setting of the host)
  last_seen: time       # its heartbeat
  declares: string      # the manifest declaration: kinds, repositories, unit types, sinks it presents
regions:
  disk:
    doc: the host's root on disk, beside its life; `flywheel host join` writes the record and this region clones and checks before the host takes any lease (205); lease.coverable reads it
    initial: unchecked
    states:
      unchecked:
        doc: the root is read on the first tick; a host already laid out goes straight to ready
        transitions:
          - when: {ev: host.disk_layout, is: differs}
            to: refused
          - when: {all: [{ev: host.repositories_cloned, is: true}, {ev: host.disk_layout, is: current}]}
            to: ready
          - when: {ev: host.disk_layout, is: absent}
            to: cloning
            effects: [{do: clone_repositories}]
      cloning:
        doc: the state, the books and every tracked built repository cloned bare under the root, one shared-line checkout each; a repeat adds only what is missing
        transitions:
          - when: {ev: host.disk_layout, is: differs}
            to: refused
          - when: {all: [{ev: host.repositories_cloned, is: true}, {ev: host.disk_layout, is: current}]}
            to: ready
          - when: {not: {ev: host.repositories_cloned, is: true}}
            to: cloning
            effects: [{do: clone_repositories}]
      ready:
        doc: the profile's layout holds; the host takes leases and makes places (43, 44)
        transitions:
          - when: {ev: host.disk_layout, is: differs}
            to: refused
      refused:
        doc: a hand-made or drifted layout under the root; the host takes nothing, and the report says what differs (205)
        decision: {kind: host-refused, group: attention, answers: [retry], shows: [host.layout_difference], satisfies: [82, 205]}
        entry: [{do: report, args: {text: the host's disk layout differs from the profile's}}]
        transitions:
          - when: {response: retry}
            to: unchecked
  life:
    initial: alive
    states:
      alive:
        doc: heartbeat within the stale window; every tick also reconciles the host's own disk against the live objects
        transitions:
          - when: {ev: host.stray_places, is: true}
            to: alive
            effects: [{do: remove_stray_places, note: "a place that belongs to no live object and is not held is removed; every removal is recorded (55)"}]
          - when: {ev: host.layout_current, is: false}
            to: alive
            effects: [{do: remove_stale_layout, note: "a tab or workspace naming an object that has left every view is closed; recorded like any removal (186, 196)"}]
          - when: {ev: host.last_seen, older: 5m}
            to: stale
      stale:
        doc: visible as stale on the status view; its objects are untouched (150)
        transitions:
          - when: {not: {ev: host.last_seen, older: 5m}}
            to: alive
          - when: {ev: host.last_seen, older: 30m}
            to: gone
          - when: {response: takeover}
            to: released
            effects: [{do: expire_leases, note: "dictation takes over a stale host before the 30m bound (4)"}]
      gone:
        doc: an attention line offers takeover; the leases expire only by the operator's response or the long bound
        decision: {kind: host-gone, group: attention, answers: [takeover, wait], shows: [host.last_seen], satisfies: [82, 150]}
        transitions:
          - when: {not: {ev: host.last_seen, older: 5m}}
            to: alive
            note: the host came back; its leases were never expired, its work resumes on it
          - when: {any: [{response: takeover}, {ev: host.last_seen, older: 24h}]}
            to: released
            effects: [{do: expire_leases, note: "operator's response or the 24h bound; other hosts may now take over"}]
      released:
        transitions:
          - when: {not: {ev: host.last_seen, older: 5m}}
            to: alive
