# A host that runs the machinery. Engine machine: it names no domain object.
# The manifest says what the host takes — kinds, repositories, unit types,
# whether it presents — and it takes leases only within that (149). Its
# reconciliation finds stray places on its own disk and removes them (55), and
# closes multiplexer tabs and workspaces whose object has left every view (196).
# A host joins by one command (205): it clones the state, the blueprints and every
# tracked built repository under the root the manifest names, with the
# profile's layout on disk; a hand-made layout is refused with what differs.
# Every tick reconciles the disk against the state (222): a bare repository or
# a checkout missing, moved or changed by hand is a decision under attention
# with the difference and the proposed repair, and nothing is repaired without
# the response; the host covers nothing meanwhile (lease.coverable reads the
# disk region). The tick is the scheduler (231): every timed behaviour of the
# host is a guard here, the adapters it declares included (215) — each an
# enumerator writing one keyed capture per source event. The dispatcher is a
# host of this machine whose declaration takes nothing and presents the chat
# (217). A host is added from a host that exists (230): the add-host tool
# provisions with the operator's own platform credentials, stored nowhere, and
# writes the record in `proposed`; the enrolment decision's yes places the
# chosen parts' secrets and issues a one-time expiring token that admits the
# host, a host already running the binary being adopted by the token alone.
# An intermittent host — a laptop by default — past its stale window is away,
# not gone (150a): shown with since-when and no attention line, its leases
# standing and its sessions' clocks paused; the takeover decision is raised
# only when a numbered decision or approved work waits on it or the long
# bound passes, and its next heartbeat makes it alive with nothing to answer.
# Several hosts run on one computer as separate processes, each with its own
# id, root, multiplexer session, port range, heartbeat and leases, sharing
# nothing but the git host (232); the scenario tool starts, stops and
# disconnects them by name, so every host scenario runs on a laptop.
# A host carries a tier, 0 to 3, named by what exists on the service side
# (268): your computer, the cloud agent, pools, your account. On the hosted
# tiers the host is a function per tier, one invocation per organization's
# tick under the tier's role with a session tag naming that organization
# (259, 269), retaining nothing between invocations, its warm cache one
# encrypted object holding a bundle of two sparse shallow clones downloaded
# per tick and evicted when idle (256, 258, 262, 272). The tick is invoked
# and not looped: a clock, a notification, an arriving capture, a chat event
# and a page request are all invokers of the same tick (270); every invoker
# enqueues on the organization's queue, which admits one tick of an
# organization at a time, and a page request is a read under the caller's
# identity and no invoker at all (291). Each tick
# upserts one named one-shot scheduler entry for the organization with the
# due time the machines computed, a daily sweep the backstop (273). An
# invoked host is alive while that entry stands or its queue holds items, so
# its stale window is the due time it wrote plus the grace and not five
# minutes from a heartbeat (292, record-derived.yaml host.last_seen). The
# page and the tool server are served at the tier's name by the same
# function on request, under the caller's token (291), the page's bundle
# from an object store behind a content distribution and the tool paths
# from the function. The tool server is a remote server of the model
# context protocol at the host's address, its clients the page, the chat
# application, the interpreter, the machinery's sessions and a member's
# own client, each checked by membership and the tool's permission and
# each shown the catalogue its permissions allow (293). Notify is
# primary and the poll is the backstop (274). The organization's key is
# unwrapped only for the tick (257), and a key it cannot reach fails closed
# with one attention line and never a fallback (260). Adding a cloud agent
# asks nothing about routers or runners: the tier fixes both (283). What
# `+ host` offers at all is the identity kind and the plan together (295):
# a self-managed host offers only hosts the operator controls, with one
# line to move the organization to the hosted service in place of the
# managed options; a hosted host offers the managed ones beside them,
# each gated by its plan flag (247a, 279–282, host.yaml tier.add_offers).
machine: host
version: 5
kind: engine
tier: core
object: host
parent: null
satisfies: [4, 32, 55, 96, 147, 149, 150, 151, 186, 196, 205, 215, 217, 222, 230, 231, 232, 238, 240, 256, 257, 258, 259, 260, 262, 268, 269, 270, 272, 273, 274, 283, 291, 292, 293, 295]
record:
  bound: int            # sessions this host may run at once (a setting of the host)
  last_seen: time       # its heartbeat
  declares: string      # the manifest declaration: kinds, repositories, unit types, sinks it presents, sources it triages, callers of its endpoint, runners (217)
  platform: string      # the platform picked when the host was added, or none for the first host (230)
  parts: list           # the packages chosen for it at enrolment (229, 230)
  pool: string          # the pool that provisioned it, or none (240); a pool host is ephemeral and holds no place past its life
  intermittent: bool    # a laptop by default, a cloud or pool host not (150a); past the stale window it is away rather than gone
  provider: string      # the environment provider bound on this host — devenv, devcontainer, nix, image (238)
regions:
  enrolment:
    doc: how the host came to exist (230); an existing host — the first, registered by init — starts enrolled; the add-host tool writes a new host's record in proposed, after provisioning it with the operator's own credentials
    initial: enrolled
    states:
      proposed:
        doc: provisioned, not yet admitted; the decision shows the platform and the parts, and its yes places the parts' secrets and issues the token (230)
        decision: {kind: host-enrol, group: approve, answers: ["yes", drop], shows: [host.platform], satisfies: [10, 205, 230]}
        transitions:
          - when: {response: "yes"}
            to: admitting
          - when: {response: drop}
            to: dropped
      admitting:
        doc: the chosen parts' secrets go to the platform's secret store, then a one-time expiring token is issued; both are effects with proofs
        entry:
          - {do: place_secrets, args: {parts: parts}, note: "only the chosen parts' secrets, only on confirmation (230)"}
          - {do: issue_enrolment_token, note: "shown once on the setup surface; `flywheel host join --token` admits the host, adopted or freshly provisioned (205, 230)"}
        transitions:
          - when: {all: [{ev: host.secrets_placed, is: true}, {ev: host.token_issued, is: true}]}
            to: awaiting-join
      awaiting-join:
        doc: the token is out; the host's first heartbeat with it is the proof it joined
        transitions:
          - when: {ev: host.last_seen, exists: true}
            to: enrolled
          - when: {ev: entered_at, older: 24h}
            to: lapsed
      lapsed:
        doc: the token expired unused; a decision under attention offers a reissue
        decision: {kind: host-enrol-lapsed, group: attention, answers: [reissue, drop], shows: [host.platform], satisfies: [82, 230]}
        transitions:
          - when: {response: reissue}
            to: admitting
          - when: {response: drop}
            to: dropped
      enrolled:
        doc: joined; the disk region takes it from here (205)
      dropped:
        final: true
  environment:
    doc: whether the host's provider satisfies the environment every repository it declares needs (238); while it does not, the host covers none of that work (lease.coverable reads it) and says so under attention
    initial: satisfied
    states:
      satisfied:
        transitions:
          - when: {ev: host.environment_satisfied, is: false}
            to: unsatisfied
      unsatisfied:
        decision: {kind: host-environment, group: attention, answers: [retry], shows: [host.environment_difference], satisfies: [82, 149, 238]}
        entry: [{do: report, args: {text: the host cannot satisfy a repository's environment}}]
        transitions:
          - when: {any: [{ev: host.environment_satisfied, is: true}, {response: retry}]}
            to: satisfied
  disk:
    doc: the host's root on disk, beside its life; `flywheel host join` writes the record and this region clones and checks before the host takes any lease (205); lease.coverable reads it; every tick re-reads the root, so a repository or checkout that goes missing, moves or is changed by hand is found and offered its repair (222)
    initial: unchecked
    states:
      unchecked:
        doc: the root is read on the first tick; a host already laid out goes straight to ready
        transitions:
          - when: {ev: host.disk_layout, is: differs}
            to: refused
          - when: {all: [{ev: host.repositories_cloned, is: true}, {ev: host.disk_layout, is: current}]}
            to: ready
          - when: {ev: host.disk_layout, is: absent}
            to: cloning
            effects: [{do: clone_repositories}]
      cloning:
        doc: the state, the blueprints and every tracked built repository cloned bare under the root, one shared-line checkout each; a repeat adds only what is missing
        transitions:
          - when: {ev: host.disk_layout, is: differs}
            to: refused
          - when: {all: [{ev: host.repositories_cloned, is: true}, {ev: host.disk_layout, is: current}]}
            to: ready
          - when: {not: {ev: host.repositories_cloned, is: true}}
            to: cloning
            effects: [{do: clone_repositories}]
      ready:
        doc: the profile's layout holds; the host takes leases and makes places (43, 44)
        transitions:
          - when: {ev: host.disk_layout, is: differs}
            to: refused
      refused:
        doc: a hand-made, drifted, moved or missing part of the layout under the root; the host takes nothing, and the decision says the first path that differs, what was expected, and the repair it would run (205, 222)
        decision: {kind: host-refused, group: attention, answers: [repair, retry], shows: [host.layout_difference, host.layout_repair], satisfies: [82, 205, 222]}
        entry: [{do: report, args: {text: the host's disk layout differs from the profile's}}]
        transitions:
          - when: {response: repair}
            to: repairing
          - when: {response: retry}
            to: unchecked
      repairing:
        doc: the repair the decision showed, and only that; a place's worktree needs no response, prepare_place re-makes it from its line (222)
        transitions:
          - when: {ev: host.layout_repaired, is: true}
            to: unchecked
          - when: {always: true}
            to: repairing
            effects: [{do: repair_layout}]
  life:
    initial: alive
    states:
      alive:
        doc: heartbeat within the stale window; every tick also reconciles the host's own disk against the live objects and runs the enumerators whose sources it declares (215, 231)
        transitions:
          - when: {ev: host.stray_places, is: true}
            to: alive
            effects: [{do: remove_stray_places, note: "a place that belongs to no live object and is not held is removed; every removal is recorded (55)"}]
          - when: {ev: host.layout_current, is: false}
            to: alive
            effects: [{do: remove_stale_layout, note: "a tab or workspace naming an object that has left every view is closed; recorded like any removal (186, 196)"}]
          - when: {ev: host.adapters_due, is: true}
            to: alive
            effects: [{do: run_adapters, note: "the enumerators of the sources this host declares, on their cadence or on a waiting drop or delivery; one keyed capture per source event, twice is once (111, 215, 231)"}]
          - when: {ev: host.last_seen, older: 5m}
            to: stale
      stale:
        doc: visible as stale on the status view; its objects are untouched (150)
        transitions:
          - when: {not: {ev: host.last_seen, older: 5m}}
            to: alive
          - when: {all: [{ev: host.last_seen, older: 30m}, {ev: host.intermittent, is: true}]}
            to: away
          - when: {ev: host.last_seen, older: 30m}
            to: gone
          - when: {response: takeover}
            to: released
            effects: [{do: expire_leases, note: "dictation takes over a stale host before the 30m bound (4)"}]
      away:
        doc: an intermittent host past its stale window (150a); shown as away with since-when and no attention line; its leases stand, its sessions are neither stalled nor lost and their clocks pause; it becomes the takeover decision only when a decision or approved work waits on it, or at the long bound
        transitions:
          - when: {not: {ev: host.last_seen, older: 5m}}
            to: alive
            note: back, with nothing to answer
          - when: {any: [{ev: host.work_waiting, is: true}, {ev: host.last_seen, older: 24h}]}
            to: gone
          - when: {response: takeover}
            to: released
            effects: [{do: expire_leases, note: "dictation takes over an away host (4)"}]
      gone:
        doc: an attention line offers takeover; the leases expire only by the operator's response or the long bound
        decision: {kind: host-gone, group: attention, answers: [takeover, wait], shows: [host.last_seen], satisfies: [82, 150]}
        transitions:
          - when: {not: {ev: host.last_seen, older: 5m}}
            to: alive
            note: the host came back; its leases were never expired, its work resumes on it
          - when: {any: [{response: takeover}, {ev: host.last_seen, older: 24h}]}
            to: released
            effects: [{do: expire_leases, note: "operator's response or the 24h bound; other hosts may now take over"}]
      released:
        transitions:
          - when: {not: {ev: host.last_seen, older: 5m}}
            to: alive
