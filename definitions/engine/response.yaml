# One operator response, recorded as op-response (153). Engine machine: a
# response answers a numbered decision, or is a dictation naming an object;
# the engine knows no more than that (12). Applied exactly once (1, 137).
# Every response is one tool call: the tool's name and its arguments by
# object id, whoever called it — a page control, a chat reply, the dispatch
# agent, the machinery (193). Free text never reaches this record: an
# host's agent's interpreter proposes one tool call per thing asked, the operator confirms each, and the
# confirmation is what is recorded (194).
machine: response
version: 3
kind: engine
tier: core
object: response
parent: null
satisfies: [1, 3, 4, 6, 12, 137, 153, 154, 193, 194, 233, 234, 235, 246, 249, 251]
record:
  kind: enum             # answer | dictation; a dictation may name only a transition that undoes or defers work — drop, hold, release, send back, retire, takeover, finish, close, end — never one that asserts work was done (4); one that does is unapplicable
  tool: string           # the tool invoked (193): answer for an answer; for a dictation the operation's name — drop, later, hold, release, rename, start, stop, finish, end, close, send-back, retire, takeover, revive, explore, open-session, propose-unit, propose-chore, ask, capture, mark-intent
  proposed_by: string    # the host's agent that proposed the call — dispatch, page, or none when a control was used (194)
  decision: number       # for an answer: the decision's number; resolved through the rail's register
  object: object-id      # the object the response concerns
  answer: string
  args: string
  given_by: string       # the member: the identity the host's kind vouches for — the GitHub username on a self-managed host, the Frontegg user on a hosted tier — the same on the operator's own computer as anywhere (233, 234, 246); authorship is the GitHub username in both. Always a member of the organization holding the tool's permission — the authored operators list, or the account's assignment and the token's permission on a hosted tier (247, 249) — a call without it is refused by the tool server before a response exists and the refusal is recorded in the run record (surfaces.yaml tools.identity). A session's call carries the identity the machinery issued it, never a user credential (251)
  given_at: time
  delivery: string       # chat message id, page submission id, review annotation id, or the operator's own direct write
regions:
  life:
    initial: given
    states:
      given:
        doc: recorded before any work follows (153); the object's own transition applies it and lists the id in applied_responses; a session ended by hand is read as a session gone, never as a response (4)
        transitions:
          - when: {ev: response.applied, is: true}
            to: applied
          - when: {ev: response.decision_present, is: false}
            to: unapplicable
      applied:
        final: true
      unapplicable:
        doc: the decision was gone before the response arrived — answered by another member, whose name and time the register keeps (235), or retracted — reported once under attention, never dropped (6, 129); the tool server refuses at once a response to a number the register already shows answered, so this state is reached only by a race
        decision: {kind: response-unapplicable, group: attention, answers: [ok], shows: [response.answer], satisfies: [6, 129]}
        transitions:
          - when: {any: [{ev: response.reported, is: true}, {response: ok}]}
            to: reported
      reported:
        final: true
