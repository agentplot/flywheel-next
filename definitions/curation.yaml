# Curation: one machine per organization (A.15). It never opens an intent. It
# runs a session over the signals with no move when the count crosses the
# threshold or the cadence says so; the session's exit delivers one move per
# signal and the proposed intents the joins produce. A person writing the same
# records by hand is curation too, and this machine then finds nothing to do.
# When one run proposes elaborations of one type on several intents, it may
# propose them gathered: one elaboration covering those intents (188). The
# session is a session like any other (58–60): for a signal that argues with
# no claim it may offer a chore or an ask through the command, and the
# signal's move is then route, naming that offer (116).
machine: curation
version: 3
kind: object
satisfies: [4, 20, 58, 60, 108, 110, 116, 118, 171, 182, 188]
object: curation
singleton: organization
record:
  threshold: int
  cadence: string
regions:
  run:
    initial: idle
    states:
      idle:
        transitions:
          - when: {any: [{ev: curation.unmoved_count, gte_ev: curation.threshold},
                         {all: [{ev: curation.unmoved_count, gte: 1}, {ev: curation.cadence_due, is: true}]}]}
            to: running
      running:
        doc: one session, bounded job, fixed exits; it reads the unmoved signals against the claims index and the open intents
        regions:
          place:
            initial: place
            states:
              place:
                machine: place
                params: {line: books-shared-line, inputs: work-order, keep: false}
          session:
            initial: session
            states:
              session:
                machine: session
                params: {agent: curator, place: own-place, work_order: rendered, keep_alive: false}
        transitions:
          - when: {all: [{final: exited}, {ev: session.exit, is: done}]}
            to: applying
          - when: {all: [{final: exited}, {ev: session.exit, in: [stalled, invalid]}]}
            to: failed
          - when: {final: lost}
            to: failed
          - when: {response: retire}
            to: failed
            enter: {session: ended, place: removing}
            note: dictation retires the session (4); the run is due again on the next tick
      applying:
        doc: every judged signal gets its one standing move; each join becomes or grows a proposed intent with its elaborations; a challenge stales the claim's verdicts wherever they stand (101, 116); a route names the chore or ask the session offered, which record_offers on the session already turned into a proposed chore unit on the shared line or an ask record (58–60)
        entry:
          - {do: record_moves, args: {moves: delivered}}
          - {do: propose_intents, args: {intents: delivered}}
          - {do: gather_elaborations, args: {gatherings: delivered}, note: "each gathering the session delivered: one proposed elaboration covering the named intents, in place of one per intent (188)"}
        transitions:
          - when: {always: true}
            to: idle
      failed:
        entry: [{do: report, args: {text: curation session did not deliver}}]
        transitions:
          - when: {always: true}
            to: idle
