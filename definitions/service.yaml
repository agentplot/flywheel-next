# One declared service in a bolt's place: a dev server, a worker, anything
# the repository says listens (47). The repository declares its services as
# data (`.flywheel/services.yaml` in the host binding); the bolt's `services`
# region makes one service object per declaration when the operator's place
# is first ready (`declare_services`), and the object goes when the place is
# removed or its declaration leaves the file. The record is the intended
# state — stopped means nothing declared runs unless started through the
# command; running means the process is expected and its absence is a
# failure — and the tethered process is evidence. Starting and stopping are
# effects the machinery performs in the place, bound to the worktree so they
# end with it (45, 55). The operator moves it by dictation (`start`, `stop`,
# the two dictations that are neither undo nor defer, allowed by 47) and a
# session moves it only through `flywheel service start|stop <name>`, which
# writes the same op-response record, so the state is one record however it
# was moved (48).
machine: service
version: 1
kind: object
object: service
parent: bolt
satisfies: [4, 12, 45, 46, 47, 48, 55]
record:
  name: string           # from the declaration; the id is <bolt>/<name>
  command: string        # how it starts in a place, from the declaration
  serves: string         # what it serves, from the declaration
  endpoint: string       # the URL the place serves for it, shown beside the bolt (46)
  failure: string        # the exit status and the last lines of the log, on failed
  moved_by: string       # the response that last started or stopped it: the operator's dictation id or a session's command entry id (48)
regions:
  life:
    initial: stopped
    states:
      stopped:
        doc: nothing declared under this name runs in the place; a process found by the tether name is stopped, never adopted
        transitions:
          - when: {any: [{ev: service.place_present, is: false}, {ev: service.declared, is: false}]}
            to: gone
          - when: {response: start}
            to: starting
            effects: [{do: start_service, note: the operator's dictation or a session's command; recorded as moved_by}]
          - when: {response: stop}
            to: stopped
            note: already stopped; the response is consumed and nothing is written
          - when: {ev: service.process, is: present}
            to: stopped
            effects: [{do: stop_service, note: a process by the service's tether name that no start through the command asked for}]
      starting:
        doc: the process is started in the place, bound to the worktree; running once it is present and serves; failed when it exits or never comes up
        transitions:
          - when: {any: [{ev: service.place_present, is: false}, {ev: service.declared, is: false}]}
            to: gone
          - when: {response: stop}
            to: stopped
            effects: [{do: stop_service}]
          - when: {response: start}
            to: starting
            note: already starting; consumed
          - when: {all: [{ev: service.process, is: present}, {ev: service.serving, is: true}]}
            to: running
          - when: {ev: service.process, is: exited}
            to: failed
          - when: {ev: entered_at, older: 5m}
            to: failed
            note: present but never serving within the window; the page shows why
          - when: {always: true}
            to: starting
            effects: [{do: start_service}]
      running:
        doc: the process is present and serves; its endpoint is recorded with the service and shown beside the bolt as a link (46)
        transitions:
          - when: {any: [{ev: service.place_present, is: false}, {ev: service.declared, is: false}]}
            to: gone
          - when: {response: stop}
            to: stopped
            effects: [{do: stop_service}]
          - when: {response: start}
            to: running
            note: already running; consumed
          - when: {ev: service.process, in: [absent, exited]}
            to: failed
            note: the process ended on its own
          - when: {not: {ev: service.endpoint_recorded, is: true}}
            to: running
            effects: [{do: record_service_endpoint, note: publishing beyond the private network is never the machinery's}]
      failed:
        doc: the process exited or never served; the operator or a session starts it again, or stops it to clear the failure
        decision: {kind: service-failed, group: attention, answers: [start, stop], shows: [service.failure, service.endpoint], satisfies: [47]}
        transitions:
          - when: {any: [{ev: service.place_present, is: false}, {ev: service.declared, is: false}]}
            to: gone
          - when: {response: start}
            to: starting
            effects: [{do: start_service}]
          - when: {response: stop}
            to: stopped
            effects: [{do: stop_service}]
      gone:
        doc: the place was removed, and the tethered process with it (55), or the declaration left the file; the record stays as history
        final: true
