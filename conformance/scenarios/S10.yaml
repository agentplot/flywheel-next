scenario: S10
title: a repository joins two months in; first planning judges every claim once and offers one proposal; not-applicable is stored and never judged again
profiles: [all]
satisfies: [64, 101, 104]
invariants: [I10]
given:
  objects:
    - {id: planning/new-repo, machine: planning, state: {run: current}}
    - {id: claim/c1, machine: claim, state: {standing: standing}, record: {version: 1, scope: all}}
    - {id: claim/c2, machine: claim, state: {standing: standing}, record: {version: 2, scope: all}}
    - {id: claim/c3, machine: claim, state: {standing: standing}, record: {version: 1, scope: all}}
  evidence: {planning.ledger_empty: {planning/new-repo: true}, planning.fingerprint: {planning/new-repo: f1}, cell.verdict: {"*": none}}
when:
  - tick: {}
  - evidence: {place.ready: {"*": true}, session.pane: {"*": present}}
  - tick: {}
  - tick: {}
  - script: {"planning/new-repo/planner/1": [{after: "0", exit: done, deliverables: [verdicts, units], commits: ["verdicts: c1@1 not-satisfied, c2@2 not-applicable, c3@1 partial; units: 3 with batch baseline-1 (one a chore); target new: new-repo-baseline"]}]}
  - tick: {}
  - tick: {}
  - evidence: {cell.verdict: {ledger-cell/new-repo/c1: not-satisfied, ledger-cell/new-repo/c2: not-applicable, ledger-cell/new-repo/c3: partial}, cell.verdict_claim_version: {ledger-cell/new-repo/c1: 1, ledger-cell/new-repo/c2: 2, ledger-cell/new-repo/c3: 1}, cell.claim_version: {ledger-cell/new-repo/c1: 1, ledger-cell/new-repo/c2: 2, ledger-cell/new-repo/c3: 1}, cell.evidence_present: {"*": true}}
  - tick: {}
  - files: {"repo new-repo": "forty unrelated commits"}
  - tick: {}
then:
  effects: [{do: record_verdict, count: 3}, {do: propose_units, count: 1}, {do: record_fingerprint, count: 1}]
  decisions: [{after_step: 8, present: [unit-proposed], count: 1}]
  states: {ledger-cell/new-repo/c2: {freshness: judged, judged.value: not-applicable}, ledger-cell/new-repo/c1: {freshness: judged, judged.value: not-satisfied}, planning/new-repo: {run: current}}
  state_store: {backlog_after: [c1, c3], verdicts_recomputed_after_commits: 0}
