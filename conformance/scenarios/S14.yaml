    - {id: unit/atlas/status-writer, machine: unit, parent: bolt/atlas/plan-rows, state: {life: in-flight}, record: {type: default, type_version: 5}}
    - {id: work-item/atlas/wi-418, machine: work-item, parent: unit/atlas/status-writer, state: {life: in-type, in-type.stages: verify, verify.run: sessions}, record: {send_backs: 0}}
  evidence: {item.retry_max: {"*": 3}, stage.agents: {"*": [verifier]}, session.pane: {"*": present}, line.contains_parent: {"*": true}, place.contains_line: {"*": true}}
when:
  - evidence: {stage.join_met: {"*": true}, stage.verdict: {"*": not-done}}
  - tick: {}
  - tick: {}
  - evidence: {stage.verdict: {"*": pass}}
  - tick: {}
  - tick: {}
  - evidence: {stage.verdict: {"*": not-done}}
  - tick: {}
  - tick: {}
  - evidence: {stage.verdict: {"*": pass}}
  - tick: {}
  - tick: {}
  - evidence: {stage.verdict: {"*": pass}}
  - tick: {}
  - tick: {}
  - evidence: {item.change_archived: {"*": true}}
  - tick: {}
  - evidence: {place.merge_slot: {"*": true}, place.merged: {"*": true}, place.absent: {"*": true}}
  - tick: {}
  - tick: {}
  - tick: {}
  - response: {decision: bolt/atlas/plan-rows/bolt-close, answer: "yes", id: discord/7001}
  - tick: {}
  - evidence: {line.landed: {"*": true}, line.absent: {"*": true}}
  - tick: {}
  - tick: {}
