scenario: X2
title: a cited claim moves; the proposed unit is replaced silently by planning's next proposal; the approved unstarted unit is a decision, redo or keep; the started unit is the bolt's claim-moved decision
profiles: [all]
satisfies: [5, 35, 103]
given:
  objects:
    - {id: bolt/atlas/plan-rows, machine: bolt, state: {life: open, line: current, place: ready, open.citations: current, open.close: not-offered}, record: {repository: atlas}}
    - {id: unit/atlas/p, machine: unit, parent: bolt/atlas/plan-rows, state: {life: proposed}, record: {type: fast, claims: ["providers/one-writer@sha256:4b2d…e1"]}}
    - {id: unit/atlas/a, machine: unit, parent: bolt/atlas/plan-rows, state: {life: waiting}, record: {type: fast, claims: ["providers/one-writer@sha256:4b2d…e1"], depends_on: [unit/atlas/s]}}
    - {id: unit/atlas/s, machine: unit, parent: bolt/atlas/plan-rows, state: {life: in-flight}, record: {type: fast, claims: ["providers/one-writer@sha256:4b2d…e1"]}}
    - {id: planning/atlas, machine: planning, state: {run: current}, record: {planned_fingerprint: f0}}
  evidence: {planning.fingerprint: {planning/atlas: f0}, unit.claim_moved: {"*": false}, bolt.citations_moved: {"*": false}}
when:
  - tick: {}
  - files: {"blueprints openspec/specs/providers/spec.md": "the requirement one-writer amended on the shared line; its content hash is now sha256:9f07…c3"}
  - evidence: {unit.claim_moved: {unit/atlas/p: true, unit/atlas/a: true}, bolt.citations_moved: {bolt/atlas/plan-rows: true}, planning.fingerprint: {planning/atlas: f1}}
  - tick: {}
  - tick: {}
  - response: {decision: unit/atlas/a/unit-claim-moved, answer: keep, id: discord/14001}
  - tick: {}
  - evidence: {unit.claim_moved: {unit/atlas/a: false}}
  - tick: {}
then:
  transitions:
    - {object: unit/atlas/p, from: proposed, to: superseded}
    - {object: unit/atlas/a, from: waiting, to: claim-moved}
    - {object: bolt/atlas/plan-rows, from: current, to: moved}
    - {object: planning/atlas, from: current, to: due}
    - {object: unit/atlas/a, from: claim-moved, to: approved, response: discord/14001}
  decisions:
    - {after_step: 4, present: [unit-claim-moved, claim-moved], absent: [unit-proposed], count: 2}
    - {after_step: 9, present: [claim-moved], absent: [unit-claim-moved]}
  effects: [{do: record_citation_choice, count: 1}, {do: create_items, count: 0}]
  states: {unit/atlas/s: {life: in-flight}}
  state_store: {superseded_in_tail: false, proposal_replaced_without_response: true}
