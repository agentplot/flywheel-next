scenario: B.2.135-atomic
title: a write is wholly applied or not applied; no reader sees half of one
profiles: [all]
satisfies: [135]
machines: ./contract/lamp
hooks: [interrupt_write]     # cut host a's write off midway
given:
  objects: [{id: lamp/1, machine: lamp, state: {power: "off"}, record: {flips: 0}}]
  evidence: {lamp.switch: {"*": down}}
  hosts: [{name: a, bound: 1}, {name: b, bound: 1}]
when:
  - tick: {}
  - response: {decision: lamp/1/lamp-off, answer: "on", id: chat/1}
  - host: {name: a}
  - tick: {}
  - host: {name: b}
  - tick: {}
then:
  state_store:
    reader_saw_one_of: [{state: {power: "off"}, flips: 0, applied_responses: []}, {state: {power: "on"}, flips: 1, applied_responses: [chat/1]}]
    reader_never_saw_mixed: true
