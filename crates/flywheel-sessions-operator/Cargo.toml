[package]
name = "flywheel-sessions-operator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flywheel-engine = { path = "../flywheel-engine" }
flywheel-atoms = { path = "../flywheel-atoms" }
flywheel-domain = { path = "../flywheel-domain" }
anyhow.workspace = true
chrono.workspace = true
serde_json.workspace = true

[dev-dependencies]
flywheel-domain = { path = "../flywheel-domain" }
flywheel-atoms = { path = "../flywheel-atoms", features = ["testing"] }

# No doctests: `cargo test` would otherwise pay a rustdoc compile per crate
# for zero tests (AGENTS.md, Gates).
[lib]
doctest = false
