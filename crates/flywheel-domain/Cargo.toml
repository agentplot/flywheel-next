[package]
name = "flywheel-domain"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flywheel-engine = { path = "../flywheel-engine" }
flywheel-atoms = { path = "../flywheel-atoms" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
chrono.workspace = true
include_dir.workspace = true

[dev-dependencies]
flywheel-atoms = { path = "../flywheel-atoms", features = ["testing"] }

# No doctests: `cargo test` would otherwise pay a rustdoc compile per crate
# for zero tests (AGENTS.md, Gates).
[lib]
doctest = false
