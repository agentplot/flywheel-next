[package]
name = "flywheel-scenario"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flywheel-engine = { path = "../flywheel-engine" }
flywheel-atoms = { path = "../flywheel-atoms" }
flywheel-domain = { path = "../flywheel-domain" }
flywheel-store-git = { path = "../flywheel-store-git" }
flywheel-world-host = { path = "../flywheel-world-host" }
flywheel-sessions-operator = { path = "../flywheel-sessions-operator" }
