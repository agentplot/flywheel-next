[package]
name = "flywheel-world-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flywheel-engine = { path = "../flywheel-engine" }
flywheel-atoms = { path = "../flywheel-atoms" }
flywheel-domain = { path = "../flywheel-domain" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
chrono.workspace = true
# The blueprints are read in process, as `host.yaml`'s Tools header says:
# "libgit2 through the `gix` crate for reads". A tick that reads N signals
# spawns nothing (audit 9).
gix = { version = "0.87", default-features = false, features = ["max-performance-safe", "sha1", "basic", "revision"] }

# No doctests: `cargo test` would otherwise pay a rustdoc compile per crate
# for zero tests (AGENTS.md, Gates).
[lib]
doctest = false
