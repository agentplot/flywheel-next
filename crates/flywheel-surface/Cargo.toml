[package]
name = "flywheel-surface"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
flywheel-engine = { path = "../flywheel-engine" }
flywheel-atoms = { path = "../flywheel-atoms" }
flywheel-domain = { path = "../flywheel-domain" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
axum.workspace = true
futures-util.workspace = true
# Every response compressed with the best encoding the request accepts, br
# then gzip, the fonts excepted (310a, S235).
tower-http.workspace = true
tokio.workspace = true
chrono.workspace = true
# The chat's wire: Discord, through `serenity` (D9, D16). The REST client and
# the gateway, the model and its builders, over rustls; no cache and no
# command framework, because the sink reads two shapes of message and nothing
# else (194).
serenity = { version = "0.12.5", default-features = false, features = ["builder", "chrono", "client", "gateway", "http", "model", "rustls_backend", "utils"] }

[features]
# The fakes the tests bind, for D17's first tier. Off in a shipped build.
testing = ["flywheel-atoms/testing"]

[dev-dependencies]
# This crate's own fakes, for its integration tests: a dev-dependency on itself
# turns the feature on for the test build and leaves the shipped build alone.
flywheel-surface = { path = ".", features = ["testing"] }
flywheel-store-git = { path = "../flywheel-store-git" }
flywheel-atoms = { path = "../flywheel-atoms", features = ["testing"] }
serde_yaml.workspace = true
# A compressed response read back as the browser reads it (310a).
brotli = "8"
flate2 = "1"

# No doctests: `cargo test` would otherwise pay a rustdoc compile per crate
# for zero tests (AGENTS.md, Gates).
[lib]
doctest = false
