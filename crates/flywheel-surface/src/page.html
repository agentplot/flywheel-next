<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flywheel plan</title>
<style>
  :root { --bg:#f7f6f2; --card:#fff; --ink:#1e1e1c; --mute:#6b6a66; --line:#e3e1da; --approve:#2e9e5b; --decide:#c9962e; --answer:#4a7fb5; --attn:#c05b5b; --run:#2b8a8a; --chip:#eef3f9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161715; --card:#1f201d; --ink:#ececе6; --ink:#ecece6; --mute:#9a9a94; --line:#33342f; --chip:#26302c; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system,'Helvetica Neue',Arial,sans-serif; }
  header { display:flex; gap:14px; align-items:baseline; padding:14px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; flex-wrap:wrap }
  header h1 { font-size:16px; margin:0; letter-spacing:.02em }
  header .meta { color:var(--mute); font-size:12px }
  header button { margin-left:auto }
  main { display:grid; grid-template-columns: minmax(320px, 1.2fr) minmax(300px, 1fr); gap:18px; padding:18px; max-width:1400px; margin:0 auto }
  @media (max-width: 820px) { main { grid-template-columns: 1fr } }
  section h2 { font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--mute); margin:18px 0 8px; display:flex; gap:8px; align-items:center }
  section h2 .n { background:var(--chip); color:var(--ink); border-radius:9px; padding:0 8px; font-size:11px }
  section h2 .hint { font-weight:400; text-transform:none; letter-spacing:0; }
  .card { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; display:grid; grid-template-columns: 44px 1fr; gap:6px 10px; }
  .card.approve { border-left-color:var(--approve) } .card.decide { border-left-color:var(--decide) } .card.answer { border-left-color:var(--answer) } .card.attention { border-left-color:var(--attn) }
  .num { font:600 13px ui-monospace,Menlo,monospace; color:var(--mute); padding-top:2px }
  .title { font-weight:600 } .title .kind { color:var(--mute); font-weight:400; margin-right:6px; font-size:12px }
  .tail { color:var(--mute); font-size:12px; grid-column:2 } .tail code { font:12px ui-monospace,Menlo,monospace }
  .acts { grid-column:2; display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; align-items:center }
  button { font:inherit; font-size:12.5px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:14px; padding:4px 11px; cursor:pointer }
  button:hover { border-color:var(--ink) }
  button.yes { background:var(--approve); color:#fff; border-color:var(--approve) }
  button.drop { color:var(--attn) }
  input[type=text] { font:inherit; font-size:12.5px; border:1px solid var(--line); border-radius:6px; padding:4px 8px; background:var(--bg); color:var(--ink); min-width:220px; flex:1 }
  .pick { display:flex; gap:8px; align-items:center; font-size:12.5px } .pick label { display:flex; gap:4px; align-items:center }
  .lane { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin-bottom:8px }
  .lane h3 { margin:0 0 6px; font-size:13px; display:flex; gap:8px; align-items:baseline } .lane h3 small { color:var(--mute); font-weight:400 }
  .tok { display:inline-flex; align-items:center; gap:6px; border-radius:12px; padding:2px 9px; font-size:12px; margin:2px 4px 2px 0; background:var(--chip) }
  .tok i { width:8px; height:8px; border-radius:50%; display:inline-block; background:var(--mute) }
  .tok.working i { background:var(--run) } .tok.idle i { background:var(--decide) } .tok.blocked i { background:var(--attn) } .tok.merged i, .tok.done i, .tok.landed i { background:var(--approve) } .tok.proposed i { background:transparent; border:1.5px solid var(--mute) } .tok.waiting i, .tok.approved i { background:var(--answer) }
  .since li, .log li { list-style:none; font-size:12.5px; padding:3px 0; border-bottom:1px dashed var(--line) } .since ul, .log ul { padding:0; margin:0 }
  .since .k { display:inline-block; width:64px; color:var(--mute) } .log { font:11.5px ui-monospace,Menlo,monospace; max-height:280px; overflow:auto }
  .log .t { color:var(--mute); margin-right:6px }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:16px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none }
  #toast.on { opacity:1 }
  .empty { color:var(--mute); font-size:12.5px; padding:6px 0 }
  .capture { display:flex; gap:8px; align-items:center; padding:10px 18px; border-bottom:1px solid var(--line); background:var(--card) }
  .capture input[type=text] { flex:1; min-width:200px; font-size:13.5px; padding:6px 10px }
  .capture .hint { color:var(--mute); font-size:12px; white-space:nowrap } .capture .hint code { font:11.5px ui-monospace,Menlo,monospace }
  .svc { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; padding-top:6px; border-top:1px dashed var(--line); align-items:center }
  .svc .lbl { color:var(--mute); font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin-right:2px }
  .svc .tok { padding-right:4px } .svc .tok a { color:var(--answer); text-decoration:none; font:12px ui-monospace,Menlo,monospace } .svc .tok a:hover { text-decoration:underline }
  .svc .tok button { padding:1px 8px; font-size:11.5px; border-radius:10px; margin-left:2px }
  .tok.stopped i { background:var(--mute) } .tok.starting i { background:var(--decide) } .tok.running i { background:var(--approve) } .tok.failed i { background:var(--attn) } .tok.gone i { background:transparent; border:1.5px solid var(--line) }
  .cap li { list-style:none; font-size:12.5px; padding:3px 0; border-bottom:1px dashed var(--line) } .cap ul { padding:0; margin:0 }
  .cap .k { display:inline-block; min-width:64px; color:var(--mute) } .cap .st { color:var(--mute); font-size:11.5px; margin-left:6px }
</style>
</head>
<body>
<header>
  <h1>PLAN · <span id="org">willdan</span></h1>
  <span class="meta" id="meta"></span>
  <button id="tickbtn" title="let scripted sessions work: one tick = one minute">tick ×5</button>
</header>
<form class="capture" id="capture" title="typed text is a capture with one ask signal · the toggle marks it as an intent · nothing in the text is parsed">
  <input type="text" id="captext" placeholder="capture: type a thought" autocomplete="off">
  <label class="hint" for="capintent"><input type="checkbox" id="capintent"> mark as intent</label>
  <button type="submit">capture</button>
  <span class="hint" id="capwill">will send: capture</span>
</form>
<main>
  <div id="left"></div>
  <div id="right"></div>
</main>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
let data = null;
function fmtAgo(iso, now) { const d = (new Date(now) - new Date(iso)) / 60000; if (d < 60) return Math.round(d) + 'm'; if (d < 60*48) return Math.round(d/60) + 'h'; return Math.round(d/1440) + 'd'; }
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 1800); }
async function api(path, body) { const r = await fetch(path, {method: body ? 'POST' : 'GET', headers: {'content-type':'application/json'}, body: body ? JSON.stringify(body) : undefined}); return r.json(); }
async function refresh() { data = await api('/api/plan'); render(); }
async function respond(number, answer) { data = await api('/api/respond', {number, answer}); toast(`${number} → ${answer} · recorded · ${data.applied.fired} transitions`); render(); }
async function dictate(object, answer) { data = await api('/api/dictate', {object, answer}); toast(`${object} → ${answer} · ${data.applied.fired} transitions`); render(); }
async function capture(text, intent) { data = await api('/api/capture', {text, intent}); toast(`${data.applied.kind} ${short(data.applied.made)} · recorded · ${data.applied.fired} transitions`); render(); }
function willSend() { $('#capwill').textContent = 'will send: capture' + ($('#capintent').checked ? ' · intent' : ''); }
$('#capintent').onchange = willSend;
$('#capture').onsubmit = async (ev) => { ev.preventDefault(); const t = $('#captext').value.trim(); if (!t) return; const intent = $('#capintent').checked; $('#captext').value = ''; $('#capintent').checked = false; willSend(); await capture(t, intent); };
$('#tickbtn').onclick = async () => { data = await api('/api/tick', {n: 5}); toast(`5 ticks · ${data.applied.fired} transitions`); render(); };

function short(id) { return id.replace(/^(unit|bolt|intent|elaboration|work-item|response|host|service|capture|signal)\//, ''); }
function serviceRow(bolt) {
  const svcs = (data.services || []).filter(s => s.bolt === bolt && s.state !== 'gone');
  if (!svcs.length) return null;
  const row = document.createElement('div'); row.className = 'svc';
  const l = document.createElement('span'); l.className = 'lbl'; l.textContent = 'services'; row.append(l);
  for (const s of svcs) {
    const t = document.createElement('span'); t.className = 'tok ' + s.state; t.title = (s.command || '') + (s.failure ? '\n' + s.failure : '');
    t.innerHTML = `<i></i>${s.name} <small style="color:var(--mute)">${s.state}</small>`;
    if (s.endpoint) { const a = document.createElement('a'); a.href = s.endpoint; a.target = '_blank'; a.textContent = s.endpoint.replace(/^https?:\/\//, ''); t.append(' ', a); }
    if (s.state === 'failed' && s.failure) { const f = document.createElement('small'); f.style.color = 'var(--attn)'; f.textContent = ' ' + s.failure.split('\n')[0]; t.append(f); }
    const b = document.createElement('button');
    if (s.state === 'stopped' || s.state === 'failed') { b.textContent = 'start'; b.onclick = () => dictate(s.id, 'start'); }
    else { b.textContent = 'stop'; b.className = 'drop'; b.onclick = () => dictate(s.id, 'stop'); }
    t.append(b); row.append(t);
  }
  return row;
}
function tailFor(d) {
  const r = d.record || {}; const bits = [];
  if (d.kind === 'intent-proposed') { bits.push(`curation · ${(r.signals||[]).length} signals · ${r.sources||''} sources`); if (r.challenges) bits.push('challenges ' + r.challenges.join(', '));
    const el = data.decisions.filter(x => x.folded && x.parent === d.object); if (el.length) bits.push('elaborations: ' + el.map(x => short(x.object).split('/').pop() + ' (' + ((x.record||{}).type||'') + ')').join(' · ')); }
  if (d.kind === 'unit-proposed') { const t = r.target || {}; bits.push(t.bolt ? `→ bolt ${short(t.bolt)} (open)` : `→ new bolt ${t.new_name||''}`); if (r.covers) bits.push('covers ' + r.covers); if (r.source) bits.push(r.source); if (r.summary) bits.push(r.summary); bits.push('type ' + (r.type||'default')); if (r.chores) bits.push(Object.entries(r.chores).map(([k,v]) => k + ' ' + v).join(' · ')); }
  if (d.kind === 'bolt-close') { const units = data.objects.filter(o => o.parent === d.object && o.machine === 'unit'); bits.push(`${units.filter(u => u.state==='merged').length} units merged · gates ${r.gates||'green'}`); }
  if (d.kind === 'intent-close') { const el = data.objects.filter(o => o.parent === d.object); bits.push(`all ${el.length} elaborations done`); }
  if (d.kind === 'idle') { bits.push(`standing · idle ${fmtAgo(d.since, data.now)} · intent ${short(d.parent||'')}`); }
  if (d.kind === 'claim-moved') { bits.push('claim moved · bolt cites the old version'); }
  if (d.kind === 'question') { bits.push('"' + (r.question || (data.running.find(s => s.object === d.object)||{}).question || '…') + '"'); bits.push('session alive · other items of the bolt running'); }
  if (d.kind === 'response-unapplicable') { bits.push(`response "${r.answer}" to ${r.decision} could not apply · ${r.note||''}`); }
  if (d.kind === 'host-gone') { bits.push(`last seen ${fmtAgo(r.last_seen, data.now)}`); }
  if (d.kind === 'stalled') { bits.push('retry bound reached'); }
  if (d.kind === 'land-failed') { bits.push(r.landing_failure || 'gates failed'); }
  return bits.join(' · ');
}
function actions(d) {
  const wrap = document.createElement('div'); wrap.className = 'acts';
  const chores = (d.record||{}).chores;
  for (const a of d.answers) {
    if (a.includes('<text>') || a.includes('<notes>')) {
      const inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = a.replace(/[<>]/g,''); 
      const b = document.createElement('button'); b.textContent = a.startsWith('redo') ? 'redo' : 'reply';
      b.onclick = () => respond(d.number, a.startsWith('redo') ? 'redo: ' + inp.value : inp.value);
      wrap.append(inp, b); continue;
    }
    if (a.includes('<name>')) {
      const inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = a.split(' ')[0] === 'type' ? 'type' : 'bolt name'; inp.style.minWidth = '120px';
      const b = document.createElement('button'); b.textContent = a.replace(' <name>', '');
      b.onclick = () => respond(d.number, a.replace('<name>', inp.value)); wrap.append(b, inp); continue;
    }
    if (a.startsWith('pick')) {
      if (!chores) continue;
      const p = document.createElement('div'); p.className = 'pick';
      const boxes = Object.keys(chores).map(k => { const l = document.createElement('label'); const c = document.createElement('input'); c.type = 'checkbox'; c.value = k; c.checked = true; l.append(c, k); p.append(l); return c; });
      const b = document.createElement('button'); b.textContent = 'pick'; b.onclick = () => respond(d.number, 'pick ' + boxes.filter(c => c.checked).map(c => c.value).join(' '));
      p.append(b); wrap.append(p); continue;
    }
    const b = document.createElement('button'); b.textContent = a; if (a === 'yes') b.className = 'yes'; if (a === 'drop') b.className = 'drop';
    b.onclick = () => respond(d.number, a); wrap.append(b);
  }
  if (d.kind === 'unit-proposed' && (d.record||{}).document) { const s = document.createElement('span'); s.className = 'tail'; s.style.gridColumn = 'auto'; s.innerHTML = `<code>${d.record.document}</code>`; wrap.append(s); }
  return wrap;
}
function card(d) {
  const c = document.createElement('div'); c.className = 'card ' + d.group;
  const n = document.createElement('div'); n.className = 'num'; n.textContent = d.number;
  const t = document.createElement('div'); t.className = 'title'; t.innerHTML = `<span class="kind">${d.kind.replace('-proposed','').replace('-close',' close')}</span>${short(d.object)}`;
  const tail = document.createElement('div'); tail.className = 'tail'; tail.textContent = tailFor(d);
  c.append(n, t, tail, actions(d));
  return c;
}
function group(name, hint, rows, cls) {
  const s = document.createElement('section'); s.className = cls || '';
  s.innerHTML = `<h2>${name} <span class="n">${rows.length}</span> <span class="hint">${hint}</span></h2>`;
  if (!rows.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'nothing'; s.append(e); }
  for (const r of rows) s.append(card(r));
  return s;
}
function render() {
  if (!data) return;
  const dec = data.decisions.filter(d => !d.folded);
  const count = dec.filter(d => d.group !== 'attention').length;
  $('#meta').textContent = `${new Date(data.now).toISOString().slice(0,16).replace('T',' ')} · tick ${data.tick} · ${count} decisions · scenario ${data.scenario||''}`;
  const L = $('#left'); L.innerHTML = '';
  const approve = dec.filter(d => d.group === 'approve');
  const ap = group('Approve', 'yes is safe · nothing starts without it', approve);
  if (approve.length > 1) { const b = document.createElement('button'); b.className = 'yes'; b.textContent = 'yes all'; b.style.margin = '0 0 8px'; b.onclick = async () => { for (const d of approve) { if (d.answers.includes('yes')) await respond(d.number, 'yes'); } }; ap.insertBefore(b, ap.children[1]); }
  L.append(ap);
  L.append(group('Decide', 'a choice · no default', dec.filter(d => d.group === 'decide')));
  L.append(group('Answer', 'needs text', dec.filter(d => d.group === 'answer')));
  L.append(group('Attention', 'read · outside the count', dec.filter(d => d.group === 'attention')));
  const R = $('#right'); R.innerHTML = '';
  // running: lanes per bolt / intent
  const run = document.createElement('section'); run.innerHTML = `<h2>Running <span class="n">${data.running.length}</span> <span class="hint">sessions · host bound ${data.host_bound}</span></h2>`;
  const lanes = {};
  for (const o of data.objects.filter(o => (o.machine === 'bolt' || o.machine === 'intent') && !['landed','dropped','closed'].includes(o.state))) lanes[o.id] = {o, items: []};
  for (const o of data.objects.filter(o => o.machine === 'unit' || o.machine === 'elaboration')) { const laneId = o.parent || (o.record.target && (o.record.target.bolt)) || (o.record.type === 'chore' && o.record.repository ? 'shared line · ' + o.record.repository : '·unrouted'); (lanes[laneId] = lanes[laneId] || {o: {id: laneId, machine:'?', record:{}}, items: []}).items.push(o); }
  for (const [id, lane] of Object.entries(lanes)) {
    const el = document.createElement('div'); el.className = 'lane';
    const r = lane.o.record || {};
    el.innerHTML = `<h3>${lane.o.machine === 'bolt' ? 'bolt' : lane.o.machine === 'intent' ? 'intent' : ''} ${short(id)} <small>${lane.o.machine === 'bolt' ? (r.repository||'') : (r.subject||'')} · ${lane.o.state||''}</small></h3>`;
    for (const u of lane.items) {
      const sessions = data.running.filter(s => s.unit === u.id || s.object === u.id);
      const items = data.objects.filter(w => w.parent === u.id);
      const cls = sessions.some(s => s.exit === 'blocked') ? 'blocked' : sessions.some(s => s.activity === 'idle') ? 'idle' : sessions.length ? 'working' : (u.state||'');
      const t = document.createElement('span'); t.className = 'tok ' + cls;
      t.innerHTML = `<i></i>${short(u.id).split('/').pop()} <small style="color:var(--mute)">${u.state}${items.length ? ' · ' + items.filter(w => w.state==='merged').length + '/' + items.length : ''}${sessions.length ? ' · ' + sessions.map(s => s.stage + (s.exit === 'blocked' ? ' ✋' : '')).join(',') : ''}</small>`;
      t.title = u.id; el.append(t);
    }
    if (!lane.items.length) { const e = document.createElement('span'); e.className = 'empty'; e.textContent = 'no units'; el.append(e); }
    if (lane.o.machine === 'bolt') { const sr = serviceRow(id); if (sr) el.append(sr); }
    run.append(el);
  }
  R.append(run);
  const since = document.createElement('section'); since.className = 'since';
  since.innerHTML = `<h2>Since <span class="n">${data.tail.length}</span> <span class="hint">what finished · outside the count</span></h2>`;
  const ul = document.createElement('ul');
  for (const t of [...data.tail].reverse().slice(0, 12)) { const li = document.createElement('li'); li.innerHTML = `<span class="k">${t.kind}</span>${short(t.object)} <small style="color:var(--mute)">${fmtAgo(t.at, data.now)} ago${t.by ? ' · by your response' : ''}</small>`; ul.append(li); }
  since.append(ul); R.append(since);
  const cap = document.createElement('section'); cap.className = 'cap';
  cap.innerHTML = `<h2>Captured <span class="n">${(data.captured||[]).length}</span> <span class="hint">from the box above · read into signals · curation sees them</span></h2>`;
  if (!(data.captured||[]).length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'nothing captured yet'; cap.append(e); }
  const ulc = document.createElement('ul');
  for (const c of (data.captured||[]).slice(0, 12)) { const li = document.createElement('li'); li.innerHTML = `<span class="k">${short(c.id)}</span>${c.raw||''}<span class="st">${c.intent ? 'intent · ' : ''}${c.state}${c.signals.length ? ' · ' + c.signals.map(s => s.kind + ' ' + s.state).join(', ') : ''}${c.at ? ' · ' + fmtAgo(c.at, data.now) + ' ago' : ''}</span>`; ulc.append(li); }
  cap.append(ulc); R.append(cap);
  const log = document.createElement('section'); log.className = 'log';
  log.innerHTML = `<h2>Responses sent <span class="n">${data.responses.length}</span></h2>`;
  const ul2 = document.createElement('ul');
  for (const r of data.responses) { const li = document.createElement('li'); li.innerHTML = `<span class="t">${r.id}</span>${r.decision ?? short(r.object||'')} → ${r.answer}`; ul2.append(li); }
  log.append(ul2);
  const l2 = document.createElement('h2'); l2.textContent = 'Machinery log'; log.append(l2);
  const ul3 = document.createElement('ul');
  for (const l of data.log) { const li = document.createElement('li'); li.innerHTML = `<span class="t">t${l.tick} ${l.kind}</span>${short(l.object)} · ${l.text}`; ul3.append(li); }
  log.append(ul3); R.append(log);
}
refresh(); setInterval(refresh, 4000);
</script>
</body>
</html>
