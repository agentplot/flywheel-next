[package]
name = "flywheel"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "flywheel"
path = "src/lib.rs"

[[bin]]
name = "flywheel"
path = "src/main.rs"

[dependencies]
flywheel-engine = { path = "../flywheel-engine" }
flywheel-atoms = { path = "../flywheel-atoms" }
flywheel-domain = { path = "../flywheel-domain" }
flywheel-world-host = { path = "../flywheel-world-host" }
flywheel-workspace-recorded = { path = "../flywheel-workspace-recorded" }
flywheel-sessions-operator = { path = "../flywheel-sessions-operator" }
flywheel-store-git = { path = "../flywheel-store-git" }
flywheel-scenario = { path = "../flywheel-scenario" }
flywheel-surface = { path = "../flywheel-surface" }
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
tokio.workspace = true

[dev-dependencies]
flywheel-sessions-operator = { path = "../flywheel-sessions-operator" }
flywheel-atoms = { path = "../flywheel-atoms", features = ["testing"] }

[features]
# D17's third tier: the real binary. A feature and not an `#[ignore]`, so the
# everyday run does not even compile them.
system-tests = []

[[test]]
name = "system"
path = "tests/system/main.rs"
required-features = ["system-tests"]
